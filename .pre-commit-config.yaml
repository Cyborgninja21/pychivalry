# Pre-commit hooks configuration
# See https://pre-commit.com for more information
# Run `pre-commit install` to set up the git hook scripts

repos:
  # General file fixes
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
        exclude: ^(\.github/|examples/|plan docs/)
      - id: end-of-file-fixer
        exclude: ^(\.github/|examples/|plan docs/)
      - id: check-yaml
        exclude: ^(examples/|plan docs/)
      - id: check-added-large-files
        args: [--maxkb=1000]
      - id: check-json
        exclude: ^(vscode-extension/syntaxes/|examples/|plan docs/)
      - id: check-merge-conflict
      - id: mixed-line-ending
        args: [--fix=lf]
        exclude: ^(examples/|plan docs/)

  # TypeScript/JavaScript formatting with Prettier (for VS Code extension)
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v4.0.0-alpha.8
    hooks:
      - id: prettier
        files: ^vscode-extension/src/.*\.(ts|js|json)$
        exclude: ^vscode-extension/(dist/|out/|node_modules/)
        additional_dependencies:
          - prettier@3.2.5
          - typescript@5.3.3

  # TypeScript linting with ESLint (for VS Code extension)
  - repo: https://github.com/pre-commit/mirrors-eslint
    rev: v9.0.0-beta.2
    hooks:
      - id: eslint
        files: ^vscode-extension/src/.*\.ts$
        types: [file]
        args: [--fix, --max-warnings=0]
        additional_dependencies:
          - eslint@8.57.0
          - '@typescript-eslint/eslint-plugin@6.21.0'
          - '@typescript-eslint/parser@6.21.0'
          - typescript@5.3.3
