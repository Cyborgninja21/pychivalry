# Pre-commit hooks configuration
# See https://pre-commit.com for more information
# Run `pre-commit install` to set up the git hook scripts

repos:
  # General file fixes
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
        exclude: ^(\.github/|examples/|plan docs/)
      - id: end-of-file-fixer
        exclude: ^(\.github/|examples/|plan docs/)
      - id: check-yaml
        exclude: ^(examples/|plan docs/)
      - id: check-added-large-files
        args: [--maxkb=1000]
      - id: check-json
        # .vscode/*.json are JSON with comments (VS Code's format), not JSON.
        exclude: ^(vscode-extension/syntaxes/|examples/|plan docs/|\.vscode/)
      - id: check-merge-conflict
      - id: mixed-line-ending
        args: [--fix=lf]
        exclude: ^(examples/|plan docs/)

  # Prettier and ESLint run from the npm workspace (run `npm ci` at the root first), so the
  # hooks use exactly the versions CI and `task ci` use. The former mirrors-prettier hook
  # pinned prettier 3.2.5, which formats some expressions differently from the workspace's
  # prettier 3.x and made the hook and `npm run format-check` disagree.
  - repo: local
    hooks:
      - id: prettier
        name: prettier (workspace)
        entry: node_modules/.bin/prettier --write
        language: system
        files: ^(vscode-extension/src|packages/engine/(src|test))/.*\.(ts|js|json)$
        exclude: ^(vscode-extension/(dist|out|node_modules)/|packages/engine/(dist|out|node_modules)/)
      - id: eslint
        name: eslint (workspace)
        entry: node_modules/.bin/eslint --fix --max-warnings=0
        language: system
        files: ^(vscode-extension/src|packages/engine/(src|test))/.*\.ts$
