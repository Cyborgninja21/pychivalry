name: PR Validation Pipeline

on:
  pull_request:
    branches:
      - main
      - develop

jobs:
  # Stage 1: Syntax Validation
  syntax-validation:
    name: Syntax Validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install validation tools
        run: |
          pip install ansible yamllint ansible-lint
          sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Run syntax validation
        run: ./scripts/ci/validate-syntax.sh

  # Stage 2: Security Scanning
  security-scanning:
    name: Security Scanning
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: syntax-validation
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install security tools
        run: |
          pip install checkov detect-secrets ansible-lint

      - name: Install Trivy
        run: |
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | sudo apt-key add -
          echo "deb https://aquasecurity.github.io/trivy-repo/deb $(lsb_release -sc) main" | sudo tee -a /etc/apt/sources.list.d/trivy.list
          sudo apt-get update && sudo apt-get install -y trivy

      - name: Run security scanning
        run: ./scripts/ci/security-scan.sh

      - name: Upload security scan results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-scan-results
          path: |
            **/checkov-report.json
            **/trivy-report.json
          retention-days: 30

  # Stage 3: Unit Tests
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: syntax-validation
    permissions:
      contents: read
    strategy:
      matrix:
        test-suite:
          - ansible
          - secrets
          - linting
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: |
          pip install ansible pytest molecule molecule-docker

      - name: Run unit tests
        run: |
          if [ -d "tests/${{ matrix.test-suite }}" ]; then
            find tests/${{ matrix.test-suite }} -name "*.sh" -type f -executable -exec {} \;
          else
            echo "No tests found for ${{ matrix.test-suite }}"
          fi

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results-${{ matrix.test-suite }}
          path: tests/**/test-*.xml
          retention-days: 30

  # Summary Job
  pr-validation-summary:
    name: PR Validation Summary
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      [
        syntax-validation,
        security-scanning,
        unit-tests,
      ]
    if: always()
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Check job results
        run: |
          echo "Syntax Validation: ${{ needs.syntax-validation.result }}"
          echo "Security Scanning: ${{ needs.security-scanning.result }}"
          echo "Unit Tests: ${{ needs.unit-tests.result }}"

          if [ "${{ needs.syntax-validation.result }}" != "success" ] || \
             [ "${{ needs.security-scanning.result }}" != "success" ] || \
             [ "${{ needs.unit-tests.result }}" != "success" ]; then
            echo "PR validation failed!"
            exit 1
          fi

          echo "PR validation passed!"

      - name: Post status comment
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const allSuccess = ['${{ needs.syntax-validation.result }}', '${{ needs.security-scanning.result }}', '${{ needs.unit-tests.result }}'].every(r => r === 'success');
            const status = allSuccess ? '✅' : '❌';
            const body = `${status} **PR Validation ${status === '✅' ? 'Passed' : 'Failed'}**

            | Stage | Result |
            |-------|--------|
            | Syntax Validation | ${{ needs.syntax-validation.result }} |
            | Security Scanning | ${{ needs.security-scanning.result }} |
            | Unit Tests | ${{ needs.unit-tests.result }} |
            `;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });
