# Public CI: `task ci` on Linux and Windows, on every push and pull request. It needs no
# display, game files, model, key or network beyond installing the pinned tools. The suites
# that need game files run locally (AGENTS.md) and are checked here through their records.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  task-ci:
    name: task ci (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.5
          cache: npm

      - name: Set up Task
        uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: 3.54.0

      - name: task ci
        run: task ci

  # The extension's editor tests (task vscode:test): a real VS Code, the pinned release, which
  # the job downloads once and keeps in the Actions cache, keyed by the runner's system and the
  # release (packages/vscode/src/editor/version.ts; a unit test holds the key to it). It packages the extension (task vscode:package) and
  # installs the .vsix into a clean VS Code for the smoke test and the same-answers test. On
  # Linux under xvfb-run on a virtual display; Windows runners have a desktop session of their
  # own. Not part of task ci, which needs no display and no download.
  vscode-test:
    name: task vscode:test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.5
          cache: npm

      - name: Set up Task
        uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: 3.54.0

      - name: Restore the pinned VS Code
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .vscode-test
          key: vscode-test-${{ runner.os }}-1.147.0

      - name: Check for xvfb-run
        if: runner.os == 'Linux'
        run: command -v xvfb-run || (sudo apt-get update && sudo apt-get install -y xvfb)

      - name: task vscode:test
        run: |
          task install
          task vscode:test
