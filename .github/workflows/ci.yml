# =============================================================================
# pychivalry CI
# =============================================================================
# Builds the engine package (packages/engine) and the VS Code extension
# (vscode-extension) from the npm workspace at the repository root, then runs
# lint and format checks, the engine's unit, golden, corpus and CLI tests, the
# extension's unit tests, and the extension's integration tests in a VS Code
# Extension Development Host. `task ci` runs the same steps locally.
# =============================================================================

name: CI

on:
  push:
    branches: [main, develop, 'agents/**']
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # The root lock file is the live one (npm workspaces: packages/*, vscode-extension).
      - name: Install workspace dependencies
        run: npm ci

      - name: Build engine package
        working-directory: packages/engine
        run: npm run build

      - name: Lint engine
        working-directory: packages/engine
        run: npm run lint

      - name: Format check engine
        working-directory: packages/engine
        run: npm run format:check

      - name: Engine tests (unit, golden, corpus, CLI)
        working-directory: packages/engine
        run: npm test

      - name: Lint extension
        working-directory: vscode-extension
        run: npm run lint

      - name: Format check extension
        working-directory: vscode-extension
        run: npm run format-check

      - name: Compile extension (webpack)
        working-directory: vscode-extension
        run: npm run compile

      - name: Compile extension tests
        working-directory: vscode-extension
        run: npm run compile-tests

      - name: Extension unit tests
        working-directory: vscode-extension
        run: npm run test:unit

      - name: Extension integration tests (Linux)
        if: runner.os == 'Linux'
        working-directory: vscode-extension
        run: xvfb-run -a npm test

      - name: Extension integration tests (macOS/Windows)
        if: runner.os != 'Linux'
        working-directory: vscode-extension
        run: npm test
