# =============================================================================
# CK3 Language Server CI Workflow
# =============================================================================
# Runs automated tests and quality checks for the VS Code extension.
# =============================================================================

name: CI

# -----------------------------------------------------------------------------
# Triggers: When does this workflow run?
# -----------------------------------------------------------------------------
on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

# -----------------------------------------------------------------------------
# Permissions: Minimal permissions for security
# -----------------------------------------------------------------------------
permissions:
  contents: read

# =============================================================================
# Jobs
# =============================================================================
jobs:
  # ---------------------------------------------------------------------------
  # VS Code Extension Tests
  # ---------------------------------------------------------------------------
  # Tests the VS Code extension on all major operating systems.
  # ---------------------------------------------------------------------------
  extension:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Install extension dependencies
      working-directory: vscode-extension
      run: npm ci

    - name: Lint extension
      working-directory: vscode-extension
      run: npm run lint

    - name: Format check
      working-directory: vscode-extension
      run: npm run format-check

    - name: Compile extension
      working-directory: vscode-extension
      run: npm run compile

    - name: Compile tests
      working-directory: vscode-extension
      run: npm run compile-tests

    - name: Run extension tests (Linux)
      if: runner.os == 'Linux'
      working-directory: vscode-extension
      run: xvfb-run -a npm test
      env:
        DISPLAY: ':99.0'

    - name: Run extension tests (macOS/Windows)
      if: runner.os != 'Linux'
      working-directory: vscode-extension
      run: npm test
