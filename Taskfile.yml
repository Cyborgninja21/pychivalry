# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: '3'

vars:
  EXT_DIR: vscode-extension

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list
    silent: true

  # ─── Install & Build ────────────────────────────────────────────

  install:
    desc: Install the npm workspace (packages/engine + vscode-extension) from the root lock file
    cmds:
      - npm ci
    status:
      - test -f node_modules/.package-lock.json

  compile:
    desc: Compile the extension (webpack; bundles the built engine and its spec package)
    dir: "{{.EXT_DIR}}"
    cmds:
      - task: install
      - task: engine:build
      - npm run compile

  compile:tests:
    desc: Compile test files (tsc); the extension imports the built engine package
    dir: "{{.EXT_DIR}}"
    deps: [engine:build]
    cmds:
      - npm run compile-tests

  build:
    desc: Full build (install + compile extension + compile tests)
    cmds:
      - task: compile
      - task: compile:tests

  package:
    desc: Build the installable VSIX (production webpack bundle + vsce) into vscode-extension/
    dir: "{{.EXT_DIR}}"
    deps: [engine:build]
    cmds:
      - npm run package

  # ─── Dev Mode (#36) ─────────────────────────────────────────────
  # `task dev` keeps everything current while developing: the engine (tsc --watch, after
  # copying the spec package into dist/data) and the extension bundle (webpack --watch,
  # which rebuilds when the engine's dist/ changes). `task dev:tests` adds the unit tests
  # in watch mode. In VS Code the same is the "Dev Mode" task and launch configuration.

  dev:
    desc: "Dev Mode: engine tsc --watch + extension webpack --watch, in parallel (Ctrl+C stops both)"
    deps: [install]
    cmds:
      # One engine build first: the extension's ts-loader does not recover when it starts
      # before the engine's type declarations exist (a fresh clone).
      - task: engine:build
      - task: dev:watchers

  dev:watchers:
    internal: true
    deps: [engine:watch, watch]

  dev:tests:
    desc: "Dev Mode plus the extension's unit tests in watch mode (tsc --watch on the tests, mocha --watch)"
    deps: [install]
    cmds:
      - task: compile:tests
      - task: dev:watchers:tests

  dev:watchers:tests:
    internal: true
    deps: [engine:watch, watch, test:watch:compile, test:watch]

  watch:
    desc: Watch mode for the extension bundle only (webpack --watch; picks up a rebuilt engine dist/)
    dir: "{{.EXT_DIR}}"
    cmds:
      - npm run watch

  engine:watch:
    desc: Watch mode for the engine only (copies the spec package, then tsc --watch)
    dir: packages/engine
    cmds:
      - npm run watch

  # ─── The development build in the main VS Code instance (#35) ───

  dev:link:
    desc: "Link the development build into your VS Code extensions folders (stable, Insiders, remote server under WSL/SSH; DIR=<folder> for one); refuses when the Marketplace/VSIX version is installed there. Then: Developer: Reload Window"
    deps: [compile]
    cmds:
      - node tools/dev-link.js link {{if .DIR}}--dir "{{.DIR}}"{{end}}

  dev:unlink:
    desc: "Remove the dev:link link (and only it) from your VS Code extensions folders (DIR=<folder> for one)"
    cmds:
      - node tools/dev-link.js unlink {{if .DIR}}--dir "{{.DIR}}"{{end}}

  dev:link:status:
    desc: "Show, per VS Code extensions folder, whether the development build is linked and which other copies are installed"
    cmds:
      - node tools/dev-link.js status {{if .DIR}}--dir "{{.DIR}}"{{end}}

  # ─── Engine core (packages/engine) ──────────────────────────────

  engine:build:
    desc: Build pychivalry-engine (packages/engine) and bundle its CK3 spec package
    dir: packages/engine
    cmds:
      - npm run build

  engine:test:
    desc: Build and run the engine's unit, golden, corpus and CLI tests
    dir: packages/engine
    cmds:
      - npm test

  engine:check:
    desc: Lint and format-check the engine package
    dir: packages/engine
    cmds:
      - npm run lint
      - npm run format:check

  # ─── Documentation ─────────────────────────────────────────────

  docs:diagnostics:
    desc: Regenerate Documentation/user-guide/diagnostics/ from the engine catalogue and data/diagnostics.yaml
    deps: [engine:build]
    cmds:
      - npm run docs:diagnostics

  docs:diagnostics:check:
    desc: Fail when the diagnostics reference is stale or data/diagnostics.yaml disagrees with the plug-ins
    deps: [engine:build]
    cmds:
      - npm run docs:diagnostics:check

  # ─── Testing ────────────────────────────────────────────────────

  test:
    desc: Run all tests (pretest + full test suite)
    dir: "{{.EXT_DIR}}"
    cmds:
      - npm test

  test:unit:
    desc: Run unit tests only (fast, no VS Code instance)
    dir: "{{.EXT_DIR}}"
    deps: [compile:tests]
    cmds:
      - npm run test:unit

  test:integration:
    desc: Run integration tests (launches VS Code)
    dir: "{{.EXT_DIR}}"
    cmds:
      - npm run test:integration

  test:vsix:
    desc: "VSIX smoke suite (#39): package, install the VSIX into a clean VS Code with --install-extension, open example mod/, assert activation, a diagnostic, a hover and the CK3 Explorer (xvfb-run -a on headless Linux)"
    dir: "{{.EXT_DIR}}"
    deps: [engine:build]
    cmds:
      - npm run package
      - npm run compile-tests
      - npm run test:vsix

  test:dev-link:
    desc: "The same smoke suite against the development build linked by dev:link into a clean extensions folder (#35)"
    dir: "{{.EXT_DIR}}"
    cmds:
      - task: compile
      - npm run compile-tests
      - npm run test:dev-link

  test:examples:
    desc: Run example mod validation tests only
    dir: "{{.EXT_DIR}}"
    deps: [compile:tests]
    cmds:
      - npm run test:examples

  test:quick:
    desc: Run tests without linting (compile + test)
    dir: "{{.EXT_DIR}}"
    cmds:
      - npm run test:quick

  test:watch:
    desc: "Re-run the extension's unit tests when out/ or the engine's dist/ changes (mocha --watch; needs compiled tests: task compile:tests, or use task dev:tests)"
    dir: "{{.EXT_DIR}}"
    cmds:
      - npm run test:watch

  test:watch:compile:
    internal: true
    dir: "{{.EXT_DIR}}"
    cmds:
      - npm run watch-tests

  # ─── Test Groups (run related test files together) ─────────────

  test:core:
    desc: "Core tests: the engine's parser, incremental parser, parse cache and indexer tests (packages/engine)"
    cmds:
      - task: engine:test

  test:lsp:
    desc: "LSP feature tests: providers on the engine, completions, hover, selection range, call hierarchy, fuzzy match"
    dir: "{{.EXT_DIR}}"
    deps: [compile:tests]
    cmds:
      - npx mocha ./out/test/unit/engine-providers.test.js ./out/test/unit/completions.test.js ./out/test/unit/hover.test.js ./out/test/unit/selection-range.test.js ./out/test/unit/call-hierarchy.test.js ./out/test/unit/fuzzy-match.test.js --timeout 15000

  test:validation:
    desc: "Validation plug-in tests: example mod (engine + plug-ins), style, script values, params, loc"
    dir: "{{.EXT_DIR}}"
    deps: [compile:tests]
    cmds:
      - npx mocha ./out/test/unit/example-mod-validation.test.js ./out/test/unit/style-checks.test.js ./out/test/unit/script-values.test.js ./out/test/unit/scripted-params.test.js ./out/test/unit/localization-validator.test.js --timeout 15000

  test:ck3:
    desc: "CK3 event plug-in tests"
    dir: "{{.EXT_DIR}}"
    deps: [compile:tests]
    cmds:
      - npx mocha ./out/test/unit/events.test.js --timeout 15000

  test:log:
    desc: "Log analysis tests: log analyzer, log diagnostics, the error.log oracle"
    dir: "{{.EXT_DIR}}"
    deps: [compile:tests]
    cmds:
      - npx mocha ./out/test/unit/log-analyzer.test.js ./out/test/unit/log-diagnostics.test.js ./out/test/unit/log-oracle.test.js --timeout 15000

  # ─── Individual Test Domains ───────────────────────────────────

  test:completions:
    desc: Run completions tests
    dir: "{{.EXT_DIR}}"
    deps: [compile:tests]
    cmds:
      - npx mocha ./out/test/unit/completions.test.js --timeout 15000

  test:hover:
    desc: Run hover tests
    dir: "{{.EXT_DIR}}"
    deps: [compile:tests]
    cmds:
      - npx mocha ./out/test/unit/hover.test.js --timeout 15000

  test:selection-range:
    desc: Run selection range tests
    dir: "{{.EXT_DIR}}"
    deps: [compile:tests]
    cmds:
      - npx mocha ./out/test/unit/selection-range.test.js --timeout 15000

  test:call-hierarchy:
    desc: Run call hierarchy tests
    dir: "{{.EXT_DIR}}"
    deps: [compile:tests]
    cmds:
      - npx mocha ./out/test/unit/call-hierarchy.test.js --timeout 15000

  test:fuzzy-match:
    desc: Run fuzzy match tests
    dir: "{{.EXT_DIR}}"
    deps: [compile:tests]
    cmds:
      - npx mocha ./out/test/unit/fuzzy-match.test.js --timeout 15000

  test:style-checks:
    desc: Run style checks tests
    dir: "{{.EXT_DIR}}"
    deps: [compile:tests]
    cmds:
      - npx mocha ./out/test/unit/style-checks.test.js --timeout 15000

  test:script-values:
    desc: Run script values tests
    dir: "{{.EXT_DIR}}"
    deps: [compile:tests]
    cmds:
      - npx mocha ./out/test/unit/script-values.test.js --timeout 15000

  test:scripted-params:
    desc: Run scripted params tests
    dir: "{{.EXT_DIR}}"
    deps: [compile:tests]
    cmds:
      - npx mocha ./out/test/unit/scripted-params.test.js --timeout 15000

  test:localization:
    desc: Run localization validator tests
    dir: "{{.EXT_DIR}}"
    deps: [compile:tests]
    cmds:
      - npx mocha ./out/test/unit/localization-validator.test.js --timeout 15000

  test:events:
    desc: Run events tests
    dir: "{{.EXT_DIR}}"
    deps: [compile:tests]
    cmds:
      - npx mocha ./out/test/unit/events.test.js --timeout 15000

  test:log-analyzer:
    desc: Run log analyzer tests
    dir: "{{.EXT_DIR}}"
    deps: [compile:tests]
    cmds:
      - npx mocha ./out/test/unit/log-analyzer.test.js --timeout 15000

  test:log-diagnostics:
    desc: Run log diagnostics tests
    dir: "{{.EXT_DIR}}"
    deps: [compile:tests]
    cmds:
      - npx mocha ./out/test/unit/log-diagnostics.test.js --timeout 15000

  # ─── Code Quality ──────────────────────────────────────────────

  lint:
    desc: Lint TypeScript source files
    dir: "{{.EXT_DIR}}"
    cmds:
      - npm run lint

  format:
    desc: Format source files with Prettier
    dir: "{{.EXT_DIR}}"
    cmds:
      - npm run format

  format:check:
    desc: Check formatting without modifying files
    dir: "{{.EXT_DIR}}"
    cmds:
      - npm run format-check

  check:
    desc: Run lint + format check (CI-friendly)
    cmds:
      - task: lint
      - task: format:check

  # ─── Combined Workflows ────────────────────────────────────────

  ci:
    desc: "Full CI pipeline as in .github/workflows/ci.yml, minus the integration run (task test:integration, needs a display)"
    cmds:
      - task: build
      - task: engine:check
      - task: engine:test
      - task: docs:diagnostics:check
      - task: lint
      - task: format:check
      - task: test:unit

  precommit:
    desc: Pre-commit checks (lint + format check + unit tests)
    cmds:
      - task: lint
      - task: format:check
      - task: test:unit
