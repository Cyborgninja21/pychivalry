# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: '3'

vars:
  EXT_DIR: vscode-extension

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list
    silent: true

  # ─── Install & Build ────────────────────────────────────────────

  install:
    desc: Install extension dependencies
    dir: "{{.EXT_DIR}}"
    cmds:
      - npm install

  compile:
    desc: Compile the extension (webpack)
    dir: "{{.EXT_DIR}}"
    deps: [install]
    cmds:
      - npm run compile

  compile:tests:
    desc: Compile test files (tsc)
    dir: "{{.EXT_DIR}}"
    cmds:
      - npm run compile-tests

  build:
    desc: Full build (install + compile extension + compile tests)
    cmds:
      - task: compile
      - task: compile:tests

  watch:
    desc: Watch mode for extension rebuild
    dir: "{{.EXT_DIR}}"
    cmds:
      - npm run watch

  # ─── Testing ────────────────────────────────────────────────────

  test:
    desc: Run all tests (pretest + full test suite)
    dir: "{{.EXT_DIR}}"
    cmds:
      - npm test

  test:unit:
    desc: Run unit tests only (fast, no VS Code instance)
    dir: "{{.EXT_DIR}}"
    deps: [compile:tests]
    cmds:
      - npm run test:unit

  test:integration:
    desc: Run integration tests (launches VS Code)
    dir: "{{.EXT_DIR}}"
    cmds:
      - npm run test:integration

  test:examples:
    desc: Run example mod validation tests only
    dir: "{{.EXT_DIR}}"
    deps: [compile:tests]
    cmds:
      - npm run test:examples

  test:quick:
    desc: Run tests without linting (compile + test)
    dir: "{{.EXT_DIR}}"
    cmds:
      - npm run test:quick

  test:watch:
    desc: Watch and re-run tests on changes
    dir: "{{.EXT_DIR}}"
    cmds:
      - npm run test:watch

  # ─── Test Groups (run related test files together) ─────────────

  test:core:
    desc: "Core tests: parser, incremental parser, parse cache, indexer"
    dir: "{{.EXT_DIR}}"
    deps: [compile:tests]
    cmds:
      - npx mocha ./out/test/unit/parser.test.js ./out/test/unit/incremental-parser.test.js ./out/test/unit/parse-cache.test.js ./out/test/unit/indexer.test.js --timeout 15000

  test:lsp:
    desc: "LSP feature tests: completions, hover, selection range, call hierarchy/graph, fuzzy match"
    dir: "{{.EXT_DIR}}"
    deps: [compile:tests]
    cmds:
      - npx mocha ./out/test/unit/completions.test.js ./out/test/unit/hover.test.js ./out/test/unit/selection-range.test.js ./out/test/unit/call-hierarchy.test.js ./out/test/unit/call-graph.test.js ./out/test/unit/fuzzy-match.test.js --timeout 15000

  test:validation:
    desc: "Validation tests: diagnostics engine, style, scopes, script values, params, modifiers, schema, loc"
    dir: "{{.EXT_DIR}}"
    deps: [compile:tests]
    cmds:
      - npx mocha ./out/test/unit/diagnostics-engine.test.js ./out/test/unit/style-checks.test.js ./out/test/unit/scopes.test.js ./out/test/unit/script-values.test.js ./out/test/unit/scripted-params.test.js ./out/test/unit/modifiers.test.js ./out/test/unit/schema-conditions.test.js ./out/test/unit/localization-validator.test.js --timeout 15000

  test:ck3:
    desc: "CK3 game logic tests: events, on-actions, schemes, casus belli, court positions, language"
    dir: "{{.EXT_DIR}}"
    deps: [compile:tests]
    cmds:
      - npx mocha ./out/test/unit/events.test.js ./out/test/unit/on-actions.test.js ./out/test/unit/schemes.test.js ./out/test/unit/casus-belli.test.js ./out/test/unit/court-positions.test.js ./out/test/unit/language.test.js --timeout 15000

  test:log:
    desc: "Log analysis tests: log analyzer, log diagnostics"
    dir: "{{.EXT_DIR}}"
    deps: [compile:tests]
    cmds:
      - npx mocha ./out/test/unit/log-analyzer.test.js ./out/test/unit/log-diagnostics.test.js --timeout 15000

  # ─── Individual Test Domains ───────────────────────────────────

  test:parser:
    desc: Run parser tests
    dir: "{{.EXT_DIR}}"
    deps: [compile:tests]
    cmds:
      - npx mocha ./out/test/unit/parser.test.js --timeout 15000

  test:incremental-parser:
    desc: Run incremental parser tests
    dir: "{{.EXT_DIR}}"
    deps: [compile:tests]
