# yaml-language-server: $schema=https://taskfile.dev/schema.json
#
# The one entry point for people and agents. `task ci` is what public CI runs and needs no
# display, game files, model, key or network once `task install` has run. The game:* tasks
# need the game and the mod corpus and run only on a machine that has them (AGENTS.md).

version: '3'

tasks:
  default:
    desc: List the tasks
    cmds:
      - task --list
    silent: true

  # ─── Build and test ─────────────────────────────────────────────

  install:
    desc: Install the npm workspace from the root lock file (npm ci)
    cmds:
      - npm ci
    sources:
      - package.json
      - package-lock.json
      - packages/*/package.json
      - tools/package.json
    generates:
      - node_modules/.package-lock.json

  build:
    desc: Compile every package and the tools (tsc -b, strict)
    deps: [install]
    cmds:
      - npm run build

  test:
    desc: "Run every package's unit tests: Node's test runner on the compiled output (the extension's bundle first, whose server a test starts); no display, no editor"
    deps: [build]
    cmds:
      - task: vscode:bundle
      - npm test

  lint:
    desc: Lint every TypeScript file, type-aware, warnings as errors (ESLint)
    deps: [build]
    cmds:
      - npm run lint

  format:
    desc: Format the sources and configuration (Prettier)
    deps: [install]
    cmds:
      - npm run format

  format:check:
    desc: Check the formatting without changing anything (Prettier)
    deps: [install]
    cmds:
      - npm run format:check

  spec:check:
    desc: "Verify the committed spec package: the checksums of the package file and its companions (uncompressed), format 9, the companions the package lists, the JSON Schema, the format 4 copy for 2.3.0, and the package's override rules (part D1) read with the core's reader"
    deps: [build]
    cmds:
      - node tools/dist/cli.js spec check

  records:check:
    desc: 'Check every committed record: valid against records/record.schema.json, made on the committed spec (a 2.3.0 baseline: on the format 4 copy) and corpus, no local paths'
    deps: [build]
    cmds:
      - node tools/dist/cli.js records check

  wiki:check:
    desc: 'Check that the wiki builds from docs/: every published document exists and every link in it resolves'
    deps: [build]
    cmds:
      - node tools/dist/cli.js wiki check

  ci:
    desc: 'Everything public CI runs: install, build, lint, format check, tests, the spec, record and wiki checks'
    cmds:
      - task: install
      - task: build
      - task: lint
      - task: format:check
      - task: test
      - task: spec:check
      - task: records:check
      - task: wiki:check

  # ─── The VS Code extension (packages/vscode) ───

  vscode:bundle:
    desc: 'Bundle the extension with esbuild into packages/vscode/dist/bundle/: the extension with its language client, the language server (lsp/), and the agent server and the command line with the spec package beside them (server/); and its editor tests into dist/test-bundle/'
    deps: [build]
    cmds:
      - node packages/vscode/dist/bundle.js

  vscode:package:
    desc: 'Package the extension into one installable file, packages/vscode/dist/pychivalry-<version>.vsix, with the pinned vsce (no token, nothing published): the manifest, README, licence, the three bundles and the spec; prints its size and contents and refuses anything that must not ship'
    deps: [vscode:bundle]
    cmds:
      - node packages/vscode/dist/package.js

  vscode:test:
    desc: "The extension's editor tests in a real VS Code, the pinned release, downloaded into .vscode-test/ the first time (network): the extension from its folder, the packaged .vsix installed into a clean VS Code (the smoke test and the same-answers test), and an update; on Linux only on a virtual display, under xvfb-run, never on a desktop; throwaway user-data, extensions, home and Claude Code configuration folders. PYCHIVALRY_EDITOR_SUITES=main,smoke,update picks suites; PYCHIVALRY_TEST_CLAUDE=<claude> uses a real Claude Code's own configuration commands; PYCHIVALRY_VSCODE_VERSION another VS Code. Not part of task ci"
    deps: [vscode:package]
    cmds:
      - cmd: env -u WAYLAND_DISPLAY -u DBUS_SESSION_BUS_ADDRESS -u ELECTRON_RUN_AS_NODE xvfb-run -a node packages/vscode/dist/editor/run.js
        platforms: [linux]
      - cmd: node packages/vscode/dist/editor/run.js
        platforms: [windows, darwin]

  vscode:corpus:
    desc: 'Local only (CK3_GAME_PATH, CK3_CORPUS, CK3_CORPUS_SLUGS; Linux, under xvfb-run): the packaged extension opened on each real mod PYCHIVALRY_CORPUS_RUNS times (default 6), timing the first full result and the language server peak memory as the 2.3.0 editor baseline did, and the same-answers test (editor, command line, agent server) on each mod; prints the medians, and writes them to PYCHIVALRY_CORPUS_REPORT when set. Heavy: run it alone'
    deps: [vscode:package]
    cmds:
      - cmd: env -u WAYLAND_DISPLAY -u DBUS_SESSION_BUS_ADDRESS -u ELECTRON_RUN_AS_NODE PYCHIVALRY_EDITOR_MODE=corpus xvfb-run -a node packages/vscode/dist/editor/run.js
        platforms: [linux]

  # ─── Game-file suites (local only; docs/PLAN.md, "Environment for the game-file suites") ───

  game:parse:
    desc: "Base-game parse suite (CK3_GAME_PATH, CK3_CORPUS, CK3_CORPUS_SLUGS): every script file of the base game parsed and formatted twice, the localization files formatted, and every GUI file of the install parsed, with each corpus mod's GUI files (build step 10); writes records/game/parse.json"
    deps: [build]
    cmds:
      - node tools/dist/cli.js game parse

  game:index:
    desc: 'Base-game index suite (CK3_GAME_PATH, CK3_CORPUS, CK3_CORPUS_SLUGS): the whole base game indexed, cached and reloaded, each mod indexed over it; writes records/game/index.json. Heavy: run it alone'
    deps: [build]
    cmds:
      - node tools/dist/cli.js game index

  game:check:
    desc: 'Base-game check suite (CK3_GAME_PATH); writes records/game/check.json. Step 1: a stub'
    deps: [build]
    cmds:
      - node tools/dist/cli.js game check

  game:mods:
    desc: 'Real-mod suite (CK3_GAME_PATH, CK3_CORPUS, CK3_CORPUS_SLUGS); writes records/game/mods.json. Step 1: a stub'
    deps: [build]
    cmds:
      - node tools/dist/cli.js game mods

  game:bench:
    desc: 'Benchmarks (CK3_GAME_PATH, CK3_CORPUS, CK3_CORPUS_SLUGS); writes records/game/bench.json. Step 1: a stub'
    deps: [build]
    cmds:
      - node tools/dist/cli.js game bench

  corpus:manifest:
    desc: 'Measure the mod corpus in CK3_CORPUS into records/corpus/MANIFEST.tsv (a deliberate refresh: records/corpus/README.md)'
    deps: [build]
    cmds:
      - node tools/dist/cli.js corpus manifest

  # ─── Release 2.3.0 baselines (docs/PLAN.md, item 1.11; Linux) ───

  baseline:prepare:
    desc: 'Export legacy/ (release 2.3.0) into LEGACY_BUILD, a folder outside the repository, point it at the committed format 4 copy spec/legacy/, and build it with its own Taskfile'
    deps: [build]
    preconditions:
      - sh: test -n "$LEGACY_BUILD"
        msg: 'LEGACY_BUILD must name a folder outside the repository'
      - sh: 'case "$(realpath -m "$LEGACY_BUILD")/" in "$(pwd)"/*) exit 1 ;; esac'
        msg: "LEGACY_BUILD must be outside the repository: 2.3.0's scripts write into their own tree"
    cmds:
      - mkdir -p "$LEGACY_BUILD"
      - git archive --format=tar HEAD:legacy | tar -x -C "$LEGACY_BUILD"
      - node tools/dist/cli.js baseline spec
      - cd "$LEGACY_BUILD" && task install && task build

  baseline:speed:
    desc: 'Time release 2.3.0 (LEGACY_BUILD, CK3_GAME_PATH, CK3_CORPUS; BASELINE_PARTS, BASELINE_RUNS, BASELINE_NODE_HEAP); writes records/baseline-2.3.0/speed-*.json'
    deps: [build]
    cmds:
      - node tools/dist/cli.js baseline speed

  baseline:results:
    desc: 'Run release 2.3.0 once on the base game and on each mod and record what it finds (LEGACY_BUILD, CK3_GAME_PATH, CK3_CORPUS; BASELINE_PARTS=base-game,mods; BASELINE_NODE_HEAP); writes records/baseline-2.3.0/results-*.json'
    deps: [build]
    cmds:
      - node tools/dist/cli.js baseline results

  # ─── Scored tests: test sessions of the developer's own Claude Code, never part of task ci (docs/MVP.md, "AI tests") ───

  scored:agent-use:
    desc: "The scored agent-use test (tools/scored-run/README.md), a developer's test script: starts the Claude Code already installed on this machine as SCORED_TRIALS separate test sessions (default 5) with the agent server attached, each asked to fix the planted-defect mod, with SCORED_SESSION_LIMIT (required, no default) as each session's limit and SCORED_MODEL (default pinned); grades them in code and writes records/scored/agent-use.json. pychivalry holds no key and makes no model call; each test session counts against the developer's own Claude plan. Only on the owner's word, never in task ci"
    deps: [build]
    cmds:
      - node tools/dist/cli.js scored agent-use

  scored:authoring:
    desc: "The scored authoring test (tools/scored-run/README.md), a developer's test script: for each content request of fixtures/requests (SCORED_REQUESTS, default all) and each of SCORED_TRIALS trials (default 5), starts the Claude Code already installed on this machine as one authoring test session in a fresh copy of the request's base mod, with the agent server over CK3_GAME_PATH and the skills, then one judge test session on what it left; SCORED_SESSION_LIMIT (required, no default) is each session's limit. Grades each result with the checker, its expectations and the judge's answers, and writes records/scored/authoring.json or the record SCORED_RECORD names; a trial whose harness did not hold is recorded and never counted as a success, and the run stops after it only when the trials after it would say as little (a session not set up as asked, a broken first trial, three in a row); SCORED_CONTINUE=true tops each request up. pychivalry holds no key and makes no model call; each test session counts against the developer's own Claude plan. Only on the owner's word, never in task ci"
    deps: [build]
    cmds:
      - node tools/dist/cli.js scored authoring

  scored:calibrate:
    desc: "The judge's calibration (tools/scored-run/README.md), a developer's test script: one judge test session of the Claude Code already installed on this machine for each result graded by hand in SCORED_GRADES, with SCORED_SESSION_LIMIT (required, no default) as each session's limit, each judge given what a run's judge is given (the checker's report over CK3_GAME_PATH, required, and the game's own description of each keyword); records the judge's agreement with the hand grades per dimension and over all, with the cannot-tell rates, in records/scored/calibration.json. pychivalry holds no key and makes no model call; each test session counts against the developer's own Claude plan. Only on the owner's word, never in task ci"
    deps: [build]
    cmds:
      - node tools/dist/cli.js scored calibrate

  scored:rejudge:
    desc: "The judge run again over an authoring record's kept results (tools/scored-run/README.md), a developer's test script: for the record SCORED_FROM names (a file of records/scored/) and the folders its run kept its trials in (SCORED_KEPT), checks before any session that every kept result is the record's and grades it again as the record did, then starts the Claude Code already installed on this machine as one judge test session per trial it judges, with the committed judge's prompt and SCORED_SESSION_LIMIT (required, no default) as each session's limit, over CK3_GAME_PATH; starts no authoring session; writes the record beside the one read (SCORED_RECORD, or <record>-judge-<version>.json), never over it. pychivalry holds no key and makes no model call; each test session counts against the developer's own Claude plan. Only on the owner's word, never in task ci"
    deps: [build]
    cmds:
      - node tools/dist/cli.js scored rejudge

  scored:targets:
    desc: "An authoring record read against the owner's targets for the scored authoring test (docs/decisions.md, decision 127; tools/scored-run/README.md): the committed records/scored/authoring.json, or the record SCORED_RECORD names; prints each target met or not, and exits 1 when one is not. Reads the record only: starts no test session"
    deps: [build]
    cmds:
      - node tools/dist/cli.js scored targets

  # ─── Game launches (build step 11; docs/game-log-capture.md): only on the analysis machine, only on the owner's word ───

  game:capture-log:
    desc: "One capture of the game's logs on the analysis machine (docs/game-log-capture.md, item 11.1): refused unless PYCHIVALRY_OWNERS_WORD names the decision of docs/decisions.md that records the owner's word for a launch of the game on the analysis machine, checked before anything else; then with CK3_INSTALL_PATH, CK3_USER_PATH and CAPTURE_OUT (required, no defaults), CAPTURE_MODS and CAPTURE_OPTIONS: the mod list set through dlc_load.json, the game started directly, the logs awaited until quiet, the game stopped, the logs copied out, the mod list put back byte for byte and compared, a record written. Never in task ci; never run without the owner's word"
    deps: [build]
    cmds:
      - node tools/dist/cli.js game capture-log

  scored:in-game-load:
    desc: "One result of the scored authoring test through the in-game load, its third grade (docs/game-log-capture.md, item 11.8): the same guard as game:capture-log, then two captures, SCORED_BASE (the result's base mod) and SCORED_RESULT, and the grade: the result's log may add no line naming one of its files. Never in task ci; never run without the owner's word"
    deps: [build]
    cmds:
      - node tools/dist/cli.js scored in-game-load

  # ─── Documents written from the code ───

  docs:checks:
    desc: "Write the user guide's check reference, docs/guide/checks.md, from the core's check inventory (a test holds the committed page to it)"
    deps: [build]
    cmds:
      - node tools/dist/cli.js docs checks

  # ─── The repository wiki, generated from docs/ (docs/wiki/README.md) ───

  wiki:build:
    desc: 'Build the wiki pages from docs/ into .wiki-build/ to look at; publishes nothing'
    deps: [build]
    cmds:
      - node tools/dist/cli.js wiki build

  wiki:publish:
    desc: 'PUBLISH the wiki pages built from docs/ to the public GitHub wiki (WIKI_DRY_RUN=true shows the changes only; WIKI_PRUNE=all also removes pages it did not write)'
    deps: [build]
    cmds:
      - node tools/dist/cli.js wiki publish
