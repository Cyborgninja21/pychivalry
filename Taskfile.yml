      - npx mocha ./out/test/unit/log-diagnostics.test.js --timeout 15000

  # ─── Code Quality ──────────────────────────────────────────────

  lint:
    desc: Lint TypeScript source files
    dir: "{{.EXT_DIR}}"
    cmds:
      - npm run lint

  format:
    desc: Format source files with Prettier
    dir: "{{.EXT_DIR}}"
    cmds:
      - npm run format

  format:check:
    desc: Check formatting without modifying files
    dir: "{{.EXT_DIR}}"
    cmds:
      - npm run format-check

  check:
    desc: Run lint + format check (CI-friendly)
    cmds:
      - task: lint
      - task: format:check

  # ─── Combined Workflows ────────────────────────────────────────

  ci:
    desc: Full CI pipeline (build + lint + format check + tests)
    cmds:
      - task: build
      - task: lint
      - task: format:check
      - task: test:unit

  precommit:
    desc: Pre-commit checks (lint + format check + unit tests)
    cmds:
      - task: lint
      - task: format:check
      - task: test:unit
