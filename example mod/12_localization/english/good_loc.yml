l_english:
 # Good Localization Examples
 # Demonstrates proper localization syntax and features

 # Simple localization keys
 loc_good.0001.t:0 "A Simple Title"
 loc_good.0001.desc:0 "This is a properly formatted description with no special features."
 loc_good.0001.a:0 "Accept"
 loc_good.0001.b:0 "Decline"

 # Character functions
 loc_good.0002.t:0 "[ROOT.Char.GetName] Makes a Choice"
 loc_good.0002.desc:0 "[ROOT.Char.GetTitledFirstName] must decide. [ROOT.Char.GetSheHe|U] is facing a difficult situation."
 loc_good.0002.a:0 "[ROOT.Char.GetHerHis|U] wisdom prevails"

 # Scope chains in localization
 loc_good.0003.t:0 "Meeting with [ROOT.Char.GetLiege.GetName]"
 loc_good.0003.desc:0 "[ROOT.Char.GetName] has been summoned by [ROOT.Char.GetLiege.GetTitledFirstName]."

 # Text formatting codes
 loc_good.0004.t:0 "#bold Important Decision#!"
 loc_good.0004.desc:0 "This text has #italic formatting codes#! and #underline underlines#!."
 loc_good.0004.a:0 "#P Positive outcome#!"
 loc_good.0004.b:0 "#N Negative outcome#!"

 # Icons
 loc_good.0005.t:0 "Gain £gold£ Gold"
 loc_good.0005.desc:0 "You receive £gold£100 and £prestige£50."
 loc_good.0005.a:0 "£gold£ Wealth!"

 # Variable substitution
 loc_good.0006.t:0 "The $AMOUNT$ Problem"
 loc_good.0006.desc:0 "You have $VALUE|0$ gold remaining."

 # Concept references
 loc_good.0007.t:0 "Understanding [faith|E]"
 loc_good.0007.desc:0 "Learn about your [faith|E] and [culture|E]."

 # Newlines
 loc_good.0008.desc:0 "This is line one.#nThis is line two.#nThis is line three."

 # Color codes
 loc_good.0009.t:0 "#F Faith Color#! and #T Title Color#!"
 loc_good.0009.desc:0 "#D Dynasty Color#! and #color_green Green#!"

 # Complex character functions
 loc_good.0010.t:0 "[ROOT.Char.GetFaith.GetName] vs [ROOT.Char.GetCulture.GetName]"
 loc_good.0010.desc:0 "[ROOT.Char.GetName] of [ROOT.Char.GetPrimaryTitle.GetName] considers [ROOT.Char.GetSheHe] position."

 # Multiple scopes
 loc_good.0011.desc:0 "[ROOT.Char.GetName] and [liege.GetName] discuss [liege.GetPrimaryTitle.GetName]."

 # ScriptValue references
 loc_good.0012.desc:0 "Current value: [ROOT.Char.ScriptValue('my_custom_value')|0]"

 # MakeScope
 loc_good.0013.desc:0 "[ROOT.Char.MakeScope.Var('my_variable').GetName]"

 # Conditional text with Custom
 loc_good.0014.desc:0 "[ROOT.Char.Custom('my_custom_text')]"

 # GetDefine for game constants
 loc_good.0015.desc:0 "Maximum: [ROOT.Char.GetDefine('NCharacter', 'MAX_COMMANDERS')]"
