    - faith
    - dynasty
    - house
    - num_of_traits
    - fertility
    - can_have_children
    - is_imprisoned_by
    - is_at_war
    - is_at_war_with
    - primary_title
    - capital_county
    - location
    - has_character_flag
    - has_variable
    - exists

  # Valid effects in character scope
