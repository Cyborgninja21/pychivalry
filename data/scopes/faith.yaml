# Faith scope definition for CK3

faith:
  description: "A religious faith"

  links:
    religion_head: character
    religious_head_title: title

  lists:
    holy_site: title
    faith_county: title
    faith_character: character

  triggers:
    - has_doctrine
    - religion
    - fervor
    - exists

  effects:
    - change_fervor
    - add_doctrine
    - save_scope_as
