# Diagnostic codes of the extension's plug-ins (pychivalry 2.2.0)
#
# The engine core (packages/engine) reports its own diagnostics with the ids and texts of the
# spec package's error catalogue (plus a few package-local PYCH- ids); those are documented
# from the package itself, not from this file. This file lists every code the extension's
# plug-ins emit: the validators registered in vscode-extension/src/server/plugins.ts, which
# run after the engine's parse, registry, schema and scope checks, and the localization
# validator for .yml files.
#
# tools/gen-diagnostics-docs.ts renders Documentation/user-guide/diagnostics/ from the
# engine catalogue and this file; `npm run docs:diagnostics:check` fails when a plug-in
# source emits a code that is missing here, when this file lists a code no plug-in emits,
# or when the generated pages are out of date.
#
# Per code: plugin (a plugins key), severity (error | warning | information | hint), message
# (what the diagnostic means), evidence (why the severity: the engine evidence that allows an
# error or a warning, or "Convention" and the reason there is none; the evidence rule and the
# 2.2 audit of every code are in Documentation/developer-guide/diagnostics-evidence.md) and,
# for a code that replaced another, renamed_from. Until 2.1, LOC-001 and LOC-002 meant
# different things in script files and in localization files; since 2.2 the script-file
# checks are CK4101 and CK4102 and LOC-001/LOC-002 are the localization-file checks only.
version: "2.2"

plugins:
    scope-timing:
        source: vscode-extension/src/server/ck3/validation/scope-timing.ts
        description: >-
            The event evaluation order: trigger, then immediate, then the window (title, desc
            and its triggered_desc triggers, portraits, options), then the chosen option, then
            after. Scopes saved in immediate are available to the window; scopes saved in an
            option or in after are not. All codes are conventions (information).
    style-checks:
        source: vscode-extension/src/server/ck3/validation/style-checks.ts
        description: >-
            Formatting and brace style, as hints (the game prints nothing for style). Where the
            engine reports an unbalanced brace on a line, this plug-in's own brace codes
            (CK3330, CK3331) on that line are dropped; elsewhere they point at the probable line
            of a brace the engine's parse error reports.
    conventions:
        source: vscode-extension/src/server/ck3/validation/conventions.ts
        description: >-
            if/else ordering (COND), as information. (The event conventions CONV-001 to CONV-004
            were retired or merged into paradox-checks in 2.2.)
    localization-references:
        source: vscode-extension/src/server/ck3/validation/conventions.ts
        description: >-
            Localization keys referenced from script (an event's title, desc and opening, an
            option's name, a decision's title, desc, selection_tooltip and confirm_text, any
            custom_tooltip): literal text where a key belongs, and keys defined neither in the
            workspace's localization files nor in the base game's (only while the base game is
            known, ck3LanguageServer.gamePath).
    events:
        source: vscode-extension/src/server/ck3/validation/events.ts
        description: >-
            Event records of events/ files: type, letter sender, namespace declaration, against
            the game's own events documentation (game/events/_events.info); information.
    paradox-checks:
        source: vscode-extension/src/server/ck3/validation/paradox-checks.ts
        description: >-
            Paradox conventions and common pitfalls that parse and resolve but misbehave in
            game: event structure (on every event of an events/ file), ai_chance, trigger_else,
            after blocks, portraits, iterators without limit; and the event theme, checked
            against the workspace's and the base game's common/event_themes.
    variables:
        source: vscode-extension/src/server/ck3/validation/variables.ts
        description: >-
            Variables read but set nowhere, set but read nowhere, read in another namespace than
            they are set in, or used as a list and as a value. Ordinary and global variables
            are judged across the workspace index and the base game's indexed script (only while
            the base game is known); local variables in their file.
    traits:
        source: vscode-extension/src/server/ck3/validation/traits.ts
        description: >-
            Trait names in has_trait, add_trait, remove_trait and the trait field of
            history/characters and create_character, against the base game's common/traits
            (trait keys, group and group_equivalence names), the workspace's traits and the
            optional extracted data. Runs only while the base game's traits are known.
    scripted-blocks:
        source: vscode-extension/src/server/ck3/validation/scripted-blocks.ts
        description: >-
            Recursion: a scripted effect or trigger that calls itself. (Undefined scripted
            effects and triggers are the engine registry's unknown_effect_X / unknown_trigger_X.)
    script-values:
        source: vscode-extension/src/server/ck3/validation/script-values.ts
        description: >-
            Script value ranges, conditionals and rounding, inside a `script_values = { … }`
            block.
    iterators:
        source: vscode-extension/src/server/ck3/validation/iterators.ts
        description: ordered_ iterator parameters.
    switch:
        source: vscode-extension/src/server/ck3/validation/switch-validation.ts
        description: switch blocks.
    graphics:
        source: vscode-extension/src/server/ck3/validation/graphics.ts
        description: >-
            Graphics files that do not exist. The values of icon, texture, sprite, background,
            portrait_texture, reference, activity_window_background, background_texture and
            icon_texture that are paths (with a '/') to a .dds, .png or .tga file are looked up,
            case-insensitively, in the workspace mods, then the base game's game/ and every
            game/dlc/<dlc>/ folder; one warning per missing path and file, on its first
            reference. Bare names, bare file names and $VARIABLE$ paths are not checked, and
            nothing is reported while no base game is known (ck3LanguageServer.gamePath).
            Switched off with ck3LanguageServer.graphics.enabled.
    localization:
        source: vscode-extension/src/server/ck3/localization/validator.ts
        description: >-
            Localization files (.yml): key format, character functions, formatting codes,
            icons, concepts, brackets and $VARIABLE$ substitutions. Not an engine plug-in:
            localization is not CK3 script.


diagnostics:
    # scope-timing (conventions: the evaluation order has no error-catalogue message, schema
    # field or oracle entry, and a scope can also arrive from the calling event)
    CK3550:
        plugin: scope-timing
        severity: information
        message: >-
            A scope read in the trigger block is saved in immediate (which runs after the
            trigger is evaluated) and not earlier in the trigger itself; it exists only if the
            calling event passes it.
        evidence: Convention. Not reported when the trigger saves the scope before reading it (issue #96).
    CK3551:
        plugin: scope-timing
        severity: information
        message: A scope read in desc is saved by the event only in an option or in after, which run after the window is shown.
        evidence: >-
            Convention. Before 2.2 it reported scopes saved in immediate, which the window can
            read (issue #95).
    CK3552:
        plugin: scope-timing
        severity: information
        message: A scope read in a triggered_desc trigger is saved by the event only in an option or in after.
        evidence: >-
            Convention. Before 2.2 an error for scopes saved in immediate: the window is
            evaluated after immediate, and 864 vanilla events read an immediate-saved scope in a
            triggered_desc trigger (issue #95).
    CK3553:
        plugin: scope-timing
        severity: information
        message: A local variable checked in the trigger block is set in immediate; local variables do not outlive the effect that sets them.
        evidence: >-
            Convention. Before 2.2 an error for any variable: ordinary and global variables
            persist, and checking one an earlier firing set is the intended pattern (issue #97).
    CK3554:
        plugin: scope-timing
        severity: information
        message: A temporary scope (save_temporary_scope_as) is passed to a triggered event; it does not persist across events.
        evidence: Convention.
    CK3560:
        plugin: scope-timing
        severity: information
        message: >-
            The desc localization text reads a saved scope ([name.GetFirstName],
            [SCOPE.sC('name')]) that the event saves only in an option or in after, after the
            window is shown.
        evidence: >-
            Convention (issue #60, the localization half, on the corrected evaluation order of
            #95: a scope saved in immediate is available to the text and is not reported).
            Needs the localization index; keys without an entry are not judged.
    CK3561:
        plugin: scope-timing
        severity: information
        message: The title localization text reads a saved scope that the event saves only in an option or in after.
        evidence: Convention (issue #60; as CK3560).
    CK3563:
        plugin: scope-timing
        severity: information
        message: >-
            Trigger guard: immediate saves a scope from a random_ iterator, an option uses it,
            and the trigger has no any_ iterator over the same list, so the scope can be unset
            when nothing matches.
        evidence: Convention (issue #60, the secondary check; the list base comes from the spec package's iterators).

    # style-checks (style: the game prints nothing)
    CK3301:
        plugin: style-checks
        severity: hint
        message: Indentation mixes tabs and spaces.
        evidence: Convention (style).
    CK3303:
        plugin: style-checks
        severity: hint
        message: Indentation uses spaces instead of tabs.
        evidence: Convention (style; Paradox's own files indent with tabs).
    CK3304:
        plugin: style-checks
        severity: hint
        message: Trailing whitespace.
        evidence: Convention (style).
    CK3306:
        plugin: style-checks
        severity: hint
        message: No spaces around an operator.
        evidence: Convention (style).
    CK3314:
        plugin: style-checks
        severity: hint
        message: Empty block.
        evidence: Convention (style; the base game writes empty blocks on purpose).
    CK3316:
        plugin: style-checks
        severity: hint
        message: Line longer than the recommended length (120 characters).
        evidence: Convention (style).
    CK3317:
        plugin: style-checks
        severity: hint
        message: Blocks nested deeper than the recommended depth (6).
        evidence: Convention (style).
    CK3330:
        plugin: style-checks
        severity: information
        message: Probable line of an unclosed brace (dropped where the engine reports the brace on the same line).
        evidence: >-
            The engine's parse error, with the game's message, is the evidence and is reported
            by the engine; this code only points at the probable line, from a per-top-level-block
            heuristic.
    CK3331:
        plugin: style-checks
        severity: information
        message: Probable line of an extra closing brace (dropped where the engine reports the brace on the same line).
        evidence: As CK3330.

    # conventions
    COND-001:
        plugin: conventions
        severity: information
        message: if, else_if, trigger_if or trigger_else_if without a limit.
        evidence: Convention.
    COND-002:
        plugin: conventions
        severity: information
        message: else or trigger_else with a limit.
        evidence: Convention.
    COND-003:
        plugin: conventions
        severity: information
        message: else or trigger_else without a preceding if.
        evidence: Convention.

    # localization-references (script files)
    CK4101:
        plugin: localization-references
        severity: warning
        renamed_from: LOC-001
        message: >-
            A localization field of a script file (an event's title, desc or opening, an
            option's name, a decision's title or desc) holds literal text with spaces.
        evidence: >-
            The game reads the text as a key and logs it missing (catalogue unknown_loc_key_X,
            "Unknown loc key %s"; game/events/_events.info: "Missing localization keys are
            logged as errors"); a key with spaces cannot be defined. LOC-001 until 2.1, renamed
            because LOC-001 means an unreadable key in localization files.
    CK4102:
        plugin: localization-references
        severity: warning
        renamed_from: LOC-002
        message: A custom_tooltip of a script file holds literal text with spaces.
        evidence: As CK4101. LOC-002 until 2.1, renamed because LOC-002 means an unknown character function in localization files.
    CK4100:
        plugin: localization-references
        severity: warning
        message: >-
            A localization key referenced from script is defined neither in the workspace's
            localization files nor in the base game's (reported only while the base game is
            known).
        evidence: >-
            The game logs the missing key: catalogue unknown_loc_key_X ("Unknown loc key %s")
            and game/events/_events.info ("Missing localization keys are logged as errors").

    # events (game/events/_events.info; conventions: no catalogue message, no required field)
    EVENT-001:
        plugin: events
        severity: information
        message: An event type the game's events documentation does not list (character_event, letter_event, court_event, activity_event).
        evidence: Convention (the four types of game/events/_events.info, the only ones the 1.20.0.2 base game uses).
    EVENT-002:
        plugin: events
        severity: information
        message: A letter_event without sender.
        evidence: Convention (game/events/_events.info "sender = X # required for letter events"; no catalogue message).
    EVENT-010:
        plugin: events
        severity: information
        message: An events/ file with events and no namespace declaration.
        evidence: As EVENT-016.
    EVENT-016:
        plugin: events
        severity: information
        message: An event uses a namespace that is not declared in its file.
        evidence: >-
            Convention under the evidence rule: the game prints "Namespace '{}' used in event
            '{}' (file: {}) is not defined in this file - it might not load properly.", a string
            of the 1.20.0.2 executable that the spec package's error catalogue does not hold.

    # paradox-checks
    CK3005:
        plugin: paradox-checks
        severity: information
        message: A logical operator (AND, OR, NOT, NOR, NAND) with a scalar value instead of a block.
        evidence: Convention (no catalogue message; the engine does not report it).
    CK3421:
        plugin: paradox-checks
        severity: information
        message: A portrait block has no character field.
        evidence: Convention.
    CK3422:
        plugin: paradox-checks
        severity: information
        message: A portrait animation that is not in the optional extracted animation data.
        evidence: Convention (the extracted data is not the game's complete animation list).
    CK3423:
        plugin: paradox-checks
        severity: information
        message: A triggered_animation of an event portrait has no trigger.
        evidence: Convention (issue #27; game/events/_events.info; the events schema marks no portrait field required).
    CK3424:
        plugin: paradox-checks
        severity: information
        message: A triggered_animation of an event portrait has neither animation nor scripted_animation.
        evidence: Convention (issue #27; as CK3423).
    CK3425:
        plugin: paradox-checks
        severity: information
        message: A triggered_outfit of an event portrait has no trigger.
        evidence: Convention (issue #27; as CK3423).
    CK3426:
        plugin: paradox-checks
        severity: information
        message: A portrait position is given more than once in one event.
        evidence: Convention (issue #27).
    CK3430:
        plugin: paradox-checks
        severity: warning
        message: >-
            An event theme defined neither in the workspace's nor in the base game's
            common/event_themes (reported only while the base game is known).
        evidence: >-
            The theme is a key of the event_themes database; the game cannot read an unknown
            key (catalogue failed_to_read_key_reference_X_from_database_X, "Failed to read key
            reference %s from database %s"). EVENT-003 (the same check against 32 hard-coded
            names) is merged into it.
    CK3431:
        plugin: paradox-checks
        severity: warning
        message: >-
            An override_background reference defined neither in the workspace's nor in the base
            game's common/event_backgrounds (reported only while the base game is known).
        evidence: >-
            Issue #28. The reference is a key of the event_backgrounds database; the game cannot
            read an unknown key (catalogue failed_to_read_key_reference_X_from_database_X).
            The issue's CK3432 (override_environment) is no event field, reported by the
            engine's schema check (unknown_X_in_X); CK3434 (override_icon) is GFX001's check of
            reference paths; CK3435 (override_sound) has nothing to check against
            (game/sound/GUIDs.txt lists events under other paths than the event:/SFX/…
            references the game's events use).
    CK3433:
        plugin: paradox-checks
        severity: information
        message: An untriggered override_background equal to the background the event's theme always shows first.
        evidence: Convention (issue #28; redundant, not wrong).
    CK3450:
        plugin: paradox-checks
        severity: information
        message: An event option has no name field for its localization.
        evidence: Convention. CONV-004 and EVENT-007 (the same check) are merged into it.
    CK3510:
        plugin: paradox-checks
        severity: information
        message: trigger_else without a preceding trigger_if.
        evidence: Convention.
    CK3511:
        plugin: paradox-checks
        severity: information
        message: Several trigger_else blocks; only the first applies.
        evidence: Convention.
    CK3520:
        plugin: paradox-checks
        severity: information
        message: An after block in a hidden event (a hidden event shows no options; its effects belong in immediate).
        evidence: >-
            Convention (issue #19; the evaluation order of scope-timing: after runs once the
            chosen option has run). EVENT-012 (the same check) is merged into it.
    CK3521:
        plugin: paradox-checks
        severity: information
        message: An after block in an event without options.
        evidence: Convention (issue #19; after runs once the chosen option has run).
    CK3522:
        plugin: paradox-checks
        severity: hint
        message: An after block that only cleans up (every entry a remove_ or clear_ effect of the spec package).
        evidence: >-
            Convention (issue #19). The issue's CK3523 (a trigger in an after block) is not a
            plug-in code: after is effect context in the events schema, and the engine's
            registry reports a trigger there with the game's message (unknown_effect_X).
    CK3610:
        plugin: paradox-checks
        severity: information
        message: Negative base in ai_chance.
        evidence: Convention.
    CK3611:
        plugin: paradox-checks
        severity: information
        message: >-
            The ai_chance total is zero whatever applies (base 0 and no modifier that can add
            weight, or an unconditional factor = 0): the AI never picks the option.
        evidence: >-
            Convention (issue #21). Until 2.1 CK3611 meant "ai_chance base above 100 is clamped
            to 100", removed in 2.2 as false: ai_chance is a relative weight (the 1.20.0.2
            events and common directories hold 640 bases above 100 among 16,865 ai_chance
            blocks). The 2.1 CK3612 (base = 0) is merged into this code: a base of 0 is never
            picked only when no modifier adds weight (333 of the base game's 1,288 base = 0
            blocks have one).
    CK3612:
        plugin: paradox-checks
        severity: information
        message: The ai_chance total can be negative (base plus every negative add is below zero).
        evidence: >-
            Convention (issue #22). Until 2.1 CK3612 meant "ai_chance base = 0", merged into
            CK3611.
    CK3613:
        plugin: paradox-checks
        severity: hint
        message: An option of a non-hidden event with several options has neither ai_chance nor ai_will_select.
        evidence: Convention (issue #23; both fields are optional, the AI then weighs the option by default).
    CK3614:
        plugin: paradox-checks
        severity: information
        message: An ai_chance modifier without a trigger applies unconditionally.
        evidence: Convention.
    CK3656:
        plugin: paradox-checks
        severity: information
        message: An inline opinion value in add_opinion or reverse_add_opinion; define an opinion modifier in common/opinion_modifiers and reference it by name.
        evidence: Convention.
    CK3762:
        plugin: paradox-checks
        severity: information
        message: A hidden event has options.
        evidence: Convention. EVENT-011 (the same check) is merged into it.
    CK3763:
        plugin: paradox-checks
        severity: information
        message: A non-hidden event has no options.
        evidence: Convention. EVENT-013 (the same check) is merged into it.
    CK3764:
        plugin: paradox-checks
        severity: information
        message: A non-hidden event has no desc.
        evidence: Convention (desc is an optional field of the events schema). CONV-003 (the same check) is merged into it.
    CK3765:
        plugin: paradox-checks
        severity: information
        renamed_from: CONV-002
        message: A non-hidden event has no title.
        evidence: >-
            Convention (issue #25; title is an optional field of the events schema). CONV-002
            (an event with options and no title) is merged into it.
    CK3766:
        plugin: paradox-checks
        severity: information
        message: Several after blocks in one event.
        evidence: Convention.
    CK3767:
        plugin: paradox-checks
        severity: information
        message: An empty event.
        evidence: Convention.
    CK3768:
        plugin: paradox-checks
        severity: information
        message: Several immediate blocks in one event.
        evidence: Convention.
    CK3769:
        plugin: paradox-checks
        severity: information
        message: A non-hidden event has no portraits.
        evidence: Convention.
    CK3872:
        plugin: paradox-checks
        severity: information
        message: Redundant always = yes.
        evidence: Convention.
    CK3873:
        plugin: paradox-checks
        severity: hint
        message: always = no; the block is switched off (the usual way to disable content on purpose).
        evidence: >-
            Convention. Before 2.2 an error; the base game writes trigger = { always = no } 167
            times and the game reports nothing (issue #92).
    CK3875:
        plugin: paradox-checks
        severity: information
        message: A random_ iterator without a limit.
        evidence: Convention.
    CK3977:
        plugin: paradox-checks
        severity: information
        message: An every_ iterator without a limit affects every matching element.
        evidence: Convention.
    CK5137:
        plugin: paradox-checks
        severity: information
        message: is_alive on a scope without an exists check first.
        evidence: Convention.

    # variables
    CK3701:
        plugin: variables
        severity: information
        message: >-
            A variable is read but set nowhere in the workspace or the base game's indexed script
            (ordinary and global variables; reported only while the base game is known), or a
            local variable is read but not set in its file.
        evidence: >-
            Convention: the base game's events, GUI and localization can also set variables and
            are not indexed, so the absence cannot be proved.
    CK3702:
        plugin: variables
        severity: hint
        message: A variable is set but read nowhere in the workspace's or the base game's script (local variables in their file).
        evidence: Convention (GUI and localization may read it).
    CK3703:
        plugin: variables
        severity: information
        message: A variable read in one namespace (var, local_var, global_var) and set only in another.
        evidence: Convention.
    CK3705:
        plugin: variables
        severity: information
        message: A variable used both as a list and as a value in one file.
        evidence: Convention.

    # traits
    CK3800:
        plugin: traits
        severity: warning
        message: >-
            A trait defined neither in the base game's nor in the workspace's common/traits (nor
            the extracted data); reported only while the base game's traits are known.
        evidence: >-
            The game logs an unknown trait (catalogue unknown_trait_X_in_event_at_X, "Unknown
            trait {}, in event at {}", and invalid_trait_name).

    # scripted-blocks
    CK3956:
        plugin: scripted-blocks
        severity: information
        message: A scripted effect or trigger calls itself.
        evidence: Convention (no catalogue message for recursion).

    # script-values
    VALUE-002:
        plugin: script-values
        severity: error
        message: Invalid range (min greater than max).
        evidence: >-
            The game prints "min value in range directive is larger than the max value"
            (catalogue min_value_in_range_directive_is_larger_than_the_max_value_un).
    VALUE-004:
        plugin: script-values
        severity: information
        message: Conditional structure out of order (else_if after else, else_if without if, several else).
        evidence: Convention.
    VALUE-005:
        plugin: script-values
        severity: information
        message: An arithmetic operation without a value.
        evidence: Convention.
    VALUE-006:
        plugin: script-values
        severity: information
        message: round_to is not positive.
        evidence: Convention.

    # iterators
    ITER-003:
        plugin: iterators
        severity: information
        message: An ordered_ iterator without order_by.
        evidence: Convention (every vanilla ordered_ iterator has one; no catalogue message).
    ITER-004:
        plugin: iterators
        severity: information
        message: An ordered_ iterator without position or max.
        evidence: Convention.

    # switch
    SWITCH-001:
        plugin: switch
        severity: information
        message: A switch block has no trigger field.
        evidence: Convention.
    SWITCH-002:
        plugin: switch
        severity: information
        message: A switch block has no branch values.
        evidence: Convention.
    SWITCH-003:
        plugin: switch
        severity: warning
        message: >-
            The switch trigger names no trigger of the spec package and no scripted trigger of
            the workspace or the base game (reported only while the base game is known).
        evidence: The game logs an unknown trigger (catalogue unknown_trigger_X, "Unknown trigger '%s'").

    # graphics
    GFX001:
        plugin: graphics
        severity: warning
        message: >-
            Graphics file not found: a .dds, .png or .tga path that exists in no workspace mod,
            not in the base game's game/ and not in any game/dlc/<dlc>/ folder.
        evidence: >-
            The game logs it (catalogue failed_to_load_texture_X_file_not_found, "Failed to load
            texture %s - file not found").

    # localization (.yml files)
    LOC-001:
        plugin: localization
        severity: information
        message: >-
            An entry key the localization index cannot read (it starts with a digit, or contains
            spaces, dashes or other punctuation).
        evidence: Convention (the game's own reading of such a key is not in the error catalogue). Localization files only since 2.2; the script-file check is CK4101.
    LOC-002:
        plugin: localization
        severity: information
        message: A character function outside the hand-made function list, such as [ROOT.Char.GetNam].
        evidence: Convention (the function list is not the game's own data). Localization files only since 2.2; the script-file check is CK4102.
    LOC-003:
        plugin: localization
        severity: information
        message: Unknown text formatting code (#bold, #P, #color_red, ...).
        evidence: Convention (the formatting-code list is not the game's own data).
    LOC-004:
        plugin: localization
        severity: information
        message: An icon reference (@name! or £name£) outside the optional extracted icon data.
        evidence: Convention (the extracted icon data is not complete).
    LOC-005:
        plugin: localization
        severity: warning
        message: Unbalanced brackets in localization text.
        evidence: >-
            The game prints "Loc key `{}`: Unexpected extra `[` at position {} - file `{}`"
            (catalogue loc_key_X_unexpected_extra_at_position_X_file_X, and _2 for `]`).
    LOC-006:
