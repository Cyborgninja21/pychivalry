# Centralized Diagnostic Codes for PyChivalry
# All diagnostic codes used throughout the validation system
version: "1.0"

categories:
  syntax:
    prefix: "CK30"
    description: "Syntax and parsing errors"
  scope:
    prefix: "CK31"
    description: "Scope chain and type validation"
  style:
    prefix: "CK33"
    description: "Code style and formatting"
  event_structure:
    prefix: "CK37"
    description: "Event structure validation"
  context:
    prefix: "CK38"
    description: "Effect/trigger context violations"
  iterators:
    prefix: "CK39"
    description: "List iterator validation"
  gotchas:
    prefix: "CK51"
    description: "Common CK3 gotchas"
  story_cycles:
    prefix: "STORY"
    description: "Story cycle validation"
  decisions:
    prefix: "DECISION"
    description: "Decision validation"
  events:
    prefix: "EVENT"
    description: "Event-specific validation"
  interactions:
    prefix: "INTERACTION"
    description: "Character interaction validation"
  schemes:
    prefix: "SCHEME"
    description: "Scheme validation"
  on_actions:
    prefix: "ON_ACTION"
    description: "On-action validation"
  schema:
    prefix: "SCHEMA"
    description: "Schema-driven validation (patterns, types, order)"

diagnostics:
  # ============== Syntax (CK30xx) ==============
  CK3001:
    severity: error
    category: syntax
    message: "Unmatched closing bracket - no corresponding opening bracket found"

  CK3002:
    severity: error
    category: syntax
    message: "Unclosed bracket - opened at line {line}, expected closing '}}'"

  # ============== Event Structure (CK37xx) ==============
  CK3760:
    severity: error
    category: event_structure
    message: "Event '{id}' missing 'type' declaration (e.g., type = character_event)"
    fix: "Add 'type = character_event' or appropriate event type"

  CK3761:
    severity: error
    category: event_structure
    message: "Invalid event type '{value}'. Valid types: {valid_values}"

  CK3762:
    severity: warning
    category: event_structure
    message: "Hidden event '{id}' has option blocks, but options are ignored in hidden events"

  CK3763:
    severity: warning
    category: event_structure
    message: "Event '{id}' has no option blocks - player cannot interact"

  CK3764:
    severity: warning
    category: event_structure
    message: "Event '{id}' is missing 'desc' field"

  CK3766:
    severity: error
    category: event_structure
    message: "Event '{id}' has {count} after blocks - only the first will execute"

  CK3767:
    severity: warning
    category: event_structure
    message: "Event '{id}' is empty - it has no fields or content"

  CK3768:
    severity: error
    category: event_structure
    message: "Event '{id}' has {count} immediate blocks - only the first will execute"

  CK3769:
    severity: information
    category: event_structure
    message: "Character event '{id}' has no portrait positions defined"

  # ============== Options (CK345x) ==============
  CK3450:
    severity: error
    category: event_structure
    message: "Option block is missing required 'name' field for localization"
    fix: "Add 'name = your_event.option_a'"

  CK3452:
    severity: error
    category: event_structure
    message: "Invalid skill '{value}' for option. Valid skills: diplomacy, martial, stewardship, intrigue, learning, prowess"
    fix: "Use one of: diplomacy, martial, stewardship, intrigue, learning, prowess"

  CK3453:
    severity: error
    category: event_structure
    message: "Invalid internal flag '{value}' for add_internal_flag. Valid flags: special, dangerous"
    fix: "Use one of: special, dangerous"

  CK3454:
    severity: warning
    category: event_structure
    message: "Redundant fallback option - use 'exclusive = yes' instead of duplicate trigger logic"
    fix: "Remove fallback trigger and add 'exclusive = yes' to the exclusive option"

  CK3455:
    severity: error
    category: event_structure
    message: "Multiple options have 'exclusive = yes' - only one option can be exclusive per event"
    fix: "Remove 'exclusive = yes' from all but one option"

  CK3456:
    severity: warning
    category: event_structure
    message: "'show_as_unavailable = yes' without trigger block - option will always show but never be selectable"
    fix: "Add a trigger block or remove show_as_unavailable"

  CK3457:
    severity: warning
    category: event_structure
    message: "highlight_portrait references non-existent portrait position '{value}'"
    fix: "Use a portrait position defined in the event (left_portrait, right_portrait, etc.)"

  CK3458:
    severity: information
    category: event_structure
    message: "Option uses literal 'name = \"text\"' instead of localization key"
    fix: "Use a localization key: name = my_event.option_a"

  CK3459:
    severity: warning
    category: event_structure
    message: "All options have triggers - event may be impossible to select an option if all triggers fail. Consider a fallback option."
    fix: "Add an option without a trigger, or use 'fallback = yes' on one option"

  CK3460:
    severity: warning
    category: event_structure
    message: "Option has {count} 'name' fields - only the first will be used"

  CK3461:
    severity: warning
    category: event_structure
    message: "Empty option block - options need at least a 'name' field"

  # ============== Portraits (CK342x) ==============
  CK3420:
    severity: error
    category: event_structure
    message: "Invalid portrait position '{value}'. Valid: {valid_values}"

  CK3421:
    severity: warning
    category: event_structure
    message: "Portrait '{position}' is missing required 'character' field"

  CK3422:
    severity: warning
    category: event_structure
    message: "Invalid animation '{value}'. Valid: {valid_values}"

  CK3430:
    severity: warning
    category: event_structure
    message: "Invalid theme '{value}'. Valid: {valid_values}"

  # ============== triggered_desc (CK344x) ==============
  CK3440:
    severity: error
    category: event_structure
    message: "triggered_desc block is missing required 'trigger' field"

  CK3441:
    severity: error
    category: event_structure
    message: "triggered_desc block is missing required 'desc' field"

  CK3442:
    severity: warning
    category: event_structure
    message: "'first_valid' has no fallback - may show nothing if no triggers match"

  CK3443:
    severity: warning
    category: event_structure
    message: "Empty desc block - event needs a description"

  CK3444:
    severity: information
    category: event_structure
    message: "Consider using a localization key instead of a literal string in 'desc'"

  CK3445:
    severity: error
    category: event_structure
    message: "Invalid desc structure: mixing 'first_valid' and 'random_valid' at the same level"

  CK3446:
    severity: warning
    category: event_structure
    message: "Description has excessive nesting (>3 levels) - consider simplifying"

  # ============== trigger_if/else (CK351x) ==============
  CK3510:
    severity: error
    category: event_structure
    message: "trigger_else without preceding trigger_if - this block will never execute"

  CK3511:
    severity: error
    category: event_structure
    message: "Multiple trigger_else blocks - only the first will execute"

  CK3512:
    severity: error
    category: event_structure
    message: "trigger_if block is missing required 'limit' field"

  CK3513:
    severity: warning
    category: event_structure
    message: "trigger_if limit is empty - condition always passes"

  # ============== After blocks (CK352x) ==============
  CK3520:
    severity: warning
    category: event_structure
    message: "Hidden event has 'after' block - after blocks only run after player chooses an option"

  CK3521:
    severity: warning
    category: event_structure
    message: "Event has 'after' block but no options - after block won't execute"

  # ============== AI Chance (CK361x) ==============
  CK3610:
    severity: warning
    category: event_structure
    message: "ai_chance has negative base ({value}) - AI will never select unless modifiers bring it positive"

  CK3611:
    severity: information
    category: event_structure
    message: "ai_chance has high base ({value}) - heavily weights this option"

  CK3612:
    severity: warning
    category: event_structure
    message: "ai_chance has base = 0 with no modifiers - AI will never select this option"

  CK3614:
    severity: information
    category: event_structure
    message: "ai_chance modifier has no trigger - applies unconditionally"

  # ============== Opinion (CK365x) ==============
  CK3656:
    severity: error
    category: context
    message: "Inline opinion value in {effect}. Define opinion modifier in common/opinion_modifiers/"

  # ============== Context (CK387x) ==============
  CK3872:
    severity: information
    category: context
    message: "'trigger = {{ always = yes }}' is redundant - remove the trigger block"

  CK3873:
    severity: warning
    category: context
    message: "'trigger = {{ always = no }}' makes this event impossible to fire"

  CK3875:
    severity: warning
    category: iterators
    message: "'{iterator}' without limit - selection is completely random"

  # ============== Iterators (CK397x) ==============
  CK3977:
    severity: information
    category: iterators
    message: "'{iterator}' without limit - affects ALL entries. Add limit or comment if intentional."

  # ============== Gotchas (CK51xx) ==============
  CK5137:
    severity: warning
    category: gotchas
    message: "is_alive without exists check - may crash if target doesn't exist"

  CK5142:
    severity: error
    category: gotchas
    message: "Character comparison '{expr}' may not work. Use '{scope} = {{ this = {target} }}'"

  # ============== Scope Timing - Golden Rule (CK355x-356x) ==============
  # These diagnostics enforce CK3's "Golden Rule": scopes created in immediate
  # are NOT available in trigger, desc, or title blocks because those blocks
  # evaluate BEFORE immediate runs. This is the #1 source of bugs for new modders.

  # CK3550-3555 are already defined in scope_timing.py module header
  # Adding new codes for enhanced localization-aware scope timing checks

  CK3560:
    severity: error
    category: scope
    message: "Scope 'scope:{scope_name}' created in immediate but used in desc localization. Desc evaluates BEFORE immediate runs."
    fix: "Pass scope from calling event, use variable check (var:), or move scope creation to parent event"

  CK3561:
    severity: error
    category: scope
    message: "Scope 'scope:{scope_name}' created in immediate but used in title localization. Title evaluates BEFORE immediate runs."
    fix: "Pass scope from calling event, use variable check (var:), or move scope creation to parent event"

  CK3562:
    severity: warning
    category: scope
    message: "Scope 'scope:{scope_name}' created in immediate but may be used in desc block. Consider using triggered_desc with variable checks."
    fix: "Use triggered_desc with var: checks, or pass scope from calling event"

  # ============== Events (EVENT-xxx) ==============
  EVENT-003:
    severity: error
    category: events
    message: "Letter event missing required 'sender' field"
    fix: "Add 'sender = scope:actor' or appropriate scope reference"
