# Diagnostic codes of the extension's plug-ins (pychivalry 2.0.0)
#
# The engine core (packages/engine) reports its own diagnostics with the ids and texts of the
# spec package's error catalogue (plus a few package-local PYCH- ids); those are documented
# from the package itself, not from this file. This file lists every code the extension's
# plug-ins emit: the validators registered in vscode-extension/src/server/plugins.ts, which
# run after the engine's parse, registry, schema and scope checks, and the localization
# validator for .yml files.
#
# tools/gen-diagnostics-docs.ts renders Documentation/user-guide/diagnostics/ from the
# engine catalogue and this file; `npm run docs:diagnostics:check` fails when a plug-in
# source emits a code that is missing here, when this file lists a code no plug-in emits,
# or when the generated pages are out of date.
#
# Per code: plugin (a plugins key), severity (error | warning | information | hint), message
# (what the diagnostic means). LOC-001 and LOC-002 mean different things in script files
# (localization-references) and in localization files (localization); both are listed.
version: "2.0"

plugins:
    scope-timing:
        source: vscode-extension/src/server/ck3/validation/scope-timing.ts
        description: >-
            The event evaluation order: trigger and desc are evaluated before immediate runs,
            so scopes and variables created in immediate are not available there.
    style-checks:
        source: vscode-extension/src/server/ck3/validation/style-checks.ts
        description: >-
            Formatting and brace style. Where the engine reports an unbalanced brace on a line,
            this plug-in's own brace codes (CK3330, CK3331) on that line are dropped.
    conventions:
        source: vscode-extension/src/server/ck3/validation/conventions.ts
        description: Event conventions (CONV) and if/else ordering (COND).
    localization-references:
        source: vscode-extension/src/server/ck3/validation/conventions.ts
        description: >-
            Localization keys referenced from script: literal text where a key belongs, and
            keys missing from the workspace's localization files.
    events:
        source: vscode-extension/src/server/ck3/validation/events.ts
        description: >-
            Event records: type, theme, portraits, options, namespaces. Reported as warnings.
    paradox-checks:
        source: vscode-extension/src/server/ck3/validation/paradox-checks.ts
        description: >-
            Paradox conventions and common pitfalls that parse and resolve but misbehave in
            game: event structure, ai_chance, trigger_else, after blocks, portraits, iterators
            without limit.
    variables:
        source: vscode-extension/src/server/ck3/validation/variables.ts
        description: Variables declared, used, scoped and typed consistently within a file.
    traits:
        source: vscode-extension/src/server/ck3/validation/traits.ts
        description: >-
            Trait names in has_trait, add_trait and remove_trait. Runs only when the optional
            extracted trait data (data/traits/) is present; workspace traits count as known.
    scripted-blocks:
        source: vscode-extension/src/server/ck3/validation/scripted-blocks.ts
        description: Calls to scripted effects and triggers, and recursion between them.
    script-values:
        source: vscode-extension/src/server/ck3/validation/script-values.ts
        description: Script value formulas in common/script_values.
    iterators:
        source: vscode-extension/src/server/ck3/validation/iterators.ts
        description: ordered_ iterator parameters.
    switch:
        source: vscode-extension/src/server/ck3/validation/switch-validation.ts
        description: switch blocks.
    graphics:
        source: vscode-extension/src/server/ck3/validation/graphics.ts
        description: >-
            Graphics files that do not exist. The values of icon, texture, sprite, background,
            portrait_texture, reference, activity_window_background, background_texture and
            icon_texture that are paths (with a '/') to a .dds, .png or .tga file are looked up,
            case-insensitively, in the workspace mods, then the base game's game/ and every
            game/dlc/<dlc>/ folder; one warning per missing path and file, on its first
            reference. Bare names, bare file names and $VARIABLE$ paths are not checked, and
            nothing is reported while no base game is known (ck3LanguageServer.gamePath).
            Switched off with ck3LanguageServer.graphics.enabled.
    localization:
        source: vscode-extension/src/server/ck3/localization/validator.ts
        description: >-
            Localization files (.yml): key format, character functions, formatting codes,
            icons, concepts, brackets and $VARIABLE$ substitutions. Not an engine plug-in:
            localization is not CK3 script.

diagnostics:
    # scope-timing
    CK3550:
        plugin: scope-timing
        severity: error
        message: A scope used in the trigger block is saved in immediate, which runs after the trigger is evaluated.
    CK3551:
        plugin: scope-timing
        severity: warning
        message: A scope used in the desc block is saved in immediate; desc may be evaluated before immediate runs.
    CK3552:
        plugin: scope-timing
        severity: error
        message: A scope used in a triggered_desc trigger is saved in immediate, which runs after those triggers.
    CK3553:
        plugin: scope-timing
        severity: error
        message: A variable checked in the trigger block is set in immediate, which runs after the trigger is evaluated.
    CK3554:
        plugin: scope-timing
        severity: warning
        message: A temporary scope (save_temporary_scope_as) is passed to a triggered event; it does not persist across events.

    # style-checks
    CK3301:
        plugin: style-checks
        severity: warning
        message: Inconsistent indentation within a block.
    CK3303:
        plugin: style-checks
        severity: warning
        message: Indentation uses spaces instead of tabs.
    CK3304:
        plugin: style-checks
        severity: information
        message: Trailing whitespace.
    CK3306:
        plugin: style-checks
        severity: information
        message: Inconsistent spacing around an operator.
    CK3314:
        plugin: style-checks
        severity: warning
        message: Empty block.
    CK3316:
        plugin: style-checks
        severity: information
        message: Line longer than the recommended length (120 characters).
    CK3317:
        plugin: style-checks
        severity: information
        message: Blocks nested deeper than the recommended depth (6).
    CK3330:
        plugin: style-checks
        severity: error
        message: Unclosed brace (dropped where the engine reports the brace on the same line).
    CK3331:
        plugin: style-checks
        severity: error
        message: Extra closing brace (dropped where the engine reports the brace on the same line).
    CK3340:
        plugin: style-checks
        severity: warning
        message: Unknown or suspicious scope reference (possible typo).
    CK3341:
        plugin: style-checks
        severity: warning
        message: Scope reference appears truncated.

    # conventions
    CONV-001:
        plugin: conventions
        severity: warning
        message: An event with options has no type.
    CONV-002:
        plugin: conventions
        severity: warning
        message: An event with options has no title.
    CONV-003:
        plugin: conventions
        severity: information
        message: An event with options has no desc.
    CONV-004:
        plugin: conventions
        severity: warning
        message: An option block has no name.
    COND-001:
        plugin: conventions
        severity: warning
        message: if, else_if, trigger_if or trigger_else_if without a limit.
    COND-002:
        plugin: conventions
        severity: warning
        message: else or trigger_else with a limit (it is ignored).
    COND-003:
        plugin: conventions
        severity: warning
        message: else or trigger_else without a preceding if.

    # localization-references (script files) and localization (.yml files)
    LOC-001:
        plugin: localization-references, localization
        severity: warning
        message: >-
            In script files, a title, desc or name value contains spaces (literal text where a
            localization key belongs). In localization files, an entry key the localization
            index cannot read (it starts with a digit, or contains spaces, dashes or other
            punctuation).
    LOC-002:
        plugin: localization-references, localization
        severity: warning
        message: >-
            In script files, a tooltip value contains spaces (literal text where a localization
            key belongs). In localization files, an unknown character function such as
            [ROOT.Char.GetNam].
    CK4100:
        plugin: localization-references
        severity: warning
        message: A localization key referenced from script is not defined in the workspace's localization files.

    # events
    EVENT-001:
        plugin: events
        severity: warning
        message: Invalid event type.
    EVENT-002:
        plugin: events
        severity: warning
        message: An event is missing a required field.
    EVENT-003:
        plugin: events
        severity: warning
        message: Invalid event theme.
    EVENT-004:
        plugin: events
        severity: warning
        message: Invalid portrait position or animation.
    EVENT-005:
        plugin: events
        severity: warning
        message: Malformed event id (expected namespace.number).
    EVENT-006:
        plugin: events
        severity: warning
        message: Invalid dynamic description (first_valid, random_valid, triggered_desc).
    EVENT-007:
        plugin: events
        severity: warning
        message: Invalid option configuration.
    EVENT-009:
        plugin: events
        severity: warning
        message: An event id does not match the file's namespace declaration.
    EVENT-010:
        plugin: events
        severity: warning
        message: An event file has no namespace declaration.
    EVENT-011:
        plugin: events
        severity: warning
        message: A hidden event has options.
    EVENT-012:
        plugin: events
        severity: warning
        message: A hidden event has an after block.
    EVENT-013:
        plugin: events
        severity: warning
        message: A non-hidden event has no options.
    EVENT-016:
        plugin: events
        severity: warning
        message: An event uses a namespace that is not declared in its file (the game's own warning).

    # paradox-checks
    CK3005:
        plugin: paradox-checks
        severity: error
        message: A logical operator (AND, OR, NOT, NOR, NAND) with a scalar value instead of a block.
    CK3420:
        plugin: paradox-checks
        severity: error
        message: Invalid portrait position.
    CK3421:
        plugin: paradox-checks
        severity: warning
        message: A portrait block has no character field.
    CK3422:
        plugin: paradox-checks
        severity: warning
        message: Unknown portrait animation.
    CK3430:
        plugin: paradox-checks
        severity: warning
        message: Unknown event theme.
    CK3450:
        plugin: paradox-checks
        severity: warning
        message: An option has no name field for its localization.
    CK3510:
        plugin: paradox-checks
        severity: error
        message: trigger_else without a preceding trigger_if has no effect.
    CK3511:
        plugin: paradox-checks
        severity: warning
        message: Several trigger_else blocks; only the first one executes.
    CK3520:
        plugin: paradox-checks
        severity: warning
        message: An after block in a hidden event has no effect.
    CK3521:
        plugin: paradox-checks
        severity: information
        message: An after block in an event without options is unnecessary.
    CK3610:
        plugin: paradox-checks
        severity: warning
        message: Negative base in ai_chance; the AI never selects the option.
    CK3611:
        plugin: paradox-checks
        severity: information
        message: ai_chance base above 100 is clamped to 100.
    CK3612:
        plugin: paradox-checks
        severity: information
        message: ai_chance base = 0; the AI never selects the option (ai_accept = no may be meant).
    CK3614:
        plugin: paradox-checks
        severity: warning
        message: An ai_chance modifier without a trigger applies unconditionally.
    CK3656:
        plugin: paradox-checks
        severity: information
        message: An inline opinion value in add_opinion or reverse_add_opinion; define an opinion modifier in common/opinion_modifiers and reference it by name.
    CK3760:
        plugin: paradox-checks
        severity: error
        message: An event has no type declaration.
    CK3761:
        plugin: paradox-checks
        severity: error
        message: Invalid event type.
    CK3762:
        plugin: paradox-checks
        severity: warning
        message: A hidden event has options.
    CK3763:
        plugin: paradox-checks
        severity: warning
        message: An event has no options.
    CK3764:
        plugin: paradox-checks
        severity: error
        message: A non-hidden event has no desc.
    CK3766:
        plugin: paradox-checks
        severity: warning
        message: Several after blocks in one event.
    CK3767:
        plugin: paradox-checks
        severity: error
        message: An empty event.
    CK3768:
        plugin: paradox-checks
        severity: error
        message: Several immediate blocks in one event.
    CK3769:
        plugin: paradox-checks
        severity: information
        message: A non-hidden event has no portraits.
    CK3872:
        plugin: paradox-checks
        severity: information
        message: Redundant trigger = { always = yes }.
    CK3873:
        plugin: paradox-checks
        severity: error
        message: Impossible trigger = { always = no }.
    CK3875:
        plugin: paradox-checks
        severity: information
        message: A random_ iterator without a limit.
    CK3977:
        plugin: paradox-checks
        severity: information
        message: An every_ iterator without a limit affects every matching element.
    CK5137:
        plugin: paradox-checks
        severity: information
        message: is_alive on a scope without an exists check first.
    CK5142:
        plugin: paradox-checks
        severity: error
        message: A character comparison written as `link = root` (or prev, this, scope:x); compare with `link = { this = root }`.

    # variables
    CK3701:
        plugin: variables
        severity: warning
        message: A variable is used but never set in the file.
    CK3702:
        plugin: variables
        severity: hint
        message: A variable is set but never used in the file.
    CK3703:
        plugin: variables
        severity: error
        message: A local variable accessed as global, or a global variable accessed as local.
    CK3705:
        plugin: variables
        severity: warning
        message: A variable used both as a list and as a value.

    # traits
    CK3800:
        plugin: traits
        severity: warning
        message: Unknown trait (not in the extracted trait data or the workspace's traits).

    # scripted-blocks
    CK3950:
        plugin: scripted-blocks
        severity: error
        message: Call to an undefined scripted effect.
    CK3951:
        plugin: scripted-blocks
        severity: error
        message: Call to an undefined scripted trigger.
    CK3956:
        plugin: scripted-blocks
        severity: warning
        message: Recursive scripted effect or trigger call.

    # script-values
    VALUE-001:
        plugin: script-values
        severity: warning
        message: Invalid script value type.
    VALUE-002:
        plugin: script-values
        severity: error
        message: Invalid range (min greater than max).
    VALUE-003:
        plugin: script-values
        severity: warning
        message: Unknown formula operation.
    VALUE-004:
        plugin: script-values
        severity: error
        message: Invalid conditional structure (else_if after else).
    VALUE-005:
        plugin: script-values
        severity: information
        message: An arithmetic operation without a value.
    VALUE-006:
        plugin: script-values
        severity: error
        message: Invalid round_to parameter (it must be positive).

    # iterators
    ITER-003:
        plugin: iterators
        severity: warning
        message: An ordered_ iterator without order_by.
    ITER-004:
        plugin: iterators
        severity: information
        message: An ordered_ iterator without position or max.

    # switch
    SWITCH-001:
        plugin: switch
        severity: error
        message: A switch block has no trigger field.
    SWITCH-002:
        plugin: switch
        severity: warning
        message: A switch block has no branch values.
    SWITCH-003:
        plugin: switch
        severity: warning
        message: The switch trigger names no trigger of the spec package and no workspace scripted trigger.

    # graphics
    GFX001:
        plugin: graphics
        severity: warning
        message: >-
            Graphics file not found: a .dds, .png or .tga path that exists in no workspace mod,
            not in the base game's game/ and not in any game/dlc/<dlc>/ folder.

    # localization (.yml files)
    LOC-003:
        plugin: localization
        severity: information
        message: Unknown text formatting code (#bold, #P, #color_red, ...).
    LOC-004:
        plugin: localization
        severity: warning
        message: Unknown icon reference (@name! or £name£).
    LOC-005:
        plugin: localization
        severity: warning
        message: Unbalanced brackets in localization text.
    LOC-006:
        plugin: localization
        severity: warning
        message: Unknown concept in a [concept|E] link.
    LOC-007:
        plugin: localization
        severity: warning
        message: Invalid $VARIABLE$ substitution (name or format specifier).
