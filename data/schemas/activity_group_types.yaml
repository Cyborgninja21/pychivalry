# Activity Group Types Schema
# Defines activity grouping and display configuration for the activity UI
version: "1.0"
file_type: activity_group_type

identification:
  path_patterns:
  - "*/common/activities/activity_group_types/*.txt"
  - "common/activities/activity_group_types/*.txt"

# Original meta block preserved for reference
meta:
  name: activity_group_types
  display_name: "Activity Group Types"
  file_pattern: "common/activities/activity_group_types/*.txt"
  description: "Activity grouping and display configuration for the activity UI"
  game_version: "1.0+"
  dlc_required: null

root:
  type: file
  children:
    group_type:
      type: named_block
      name_source: key
      cardinality: "0..inf"
      key_validation:
        pattern: "^[a-z_][a-z0-9_]*$"
        description: "Group type identifier (lowercase with underscores)"
      description: |
        Defines an activity group type for organizing activities in the UI.
        Activity types reference these via their activity_group_type field.

      children:
        sort_order:
          type: integer
          required: false
          default: 0
          cardinality: "0..1"
          description: |
            Display order in the activity view.
            Higher number = sorted first (appears higher in list).
            Activities with same sort_order are ordered by definition order.
          validation:
            range: "-2147483648..2147483647" # int32 range

        gui_tags:
          type: clause
          required: false
          cardinality: "0..1"
          description: "List of GUI tags for styling the activity group"
          children:
            tag:
              type: value
              value_type: identifier
              cardinality: "0..inf"
              known_values:
              - big_button
              description: "GUI styling tag"

# Code-referenced groups that must exist
code_references:
  required_groups:
  - key: joinable
    description: "Open activities players can join"
    vanilla_sort_order: 220
  - key: invitations
    description: "Activities with pending invitations"
    vanilla_sort_order: 210
  - key: grand
    description: "Grand/major activities"
    vanilla_sort_order: 200
  - key: activities
    description: "Standard activities (default group)"
    vanilla_sort_order: 10
  - key: unavailable
    description: "Activities not currently available"
    vanilla_sort_order: 5
  - key: debug
    description: "Debug-only activities"
    vanilla_sort_order: -1

# Localization keys
localization:
  patterns:
  - key: "activity_group_type_{group_key}"
    description: "Display name of the activity group"
    example: "activity_group_type_joinable"

# Sort order conventions
conventions:
  sort_order_ranges:
    top_priority:
      range: "201-300"
      description: "Top-priority activities (joinable, invitations, grand)"
    mid_tier:
      range: "101-200"
      description: "Mid-tier activities (reserved for expansion)"
    standard:
      range: "1-100"
      description: "Standard activities"
    bottom:
      range: "≤0"
      description: "Low-priority activities (unavailable, debug)"

# Validation diagnostics
diagnostics:
  AGT001:
    severity: error
    message: "Activity group type '{key}' is referenced in code and cannot be removed"
    applies_to:
    - joinable
    - invitations
    - grand
    - activities
    - unavailable
    - debug

  AGT002:
    severity: warning
    message: "Activity group type '{key}' should have a sort_order defined for predictable UI ordering"
    check: sort_order_recommended

  AGT003:
    severity: info
    message: "Unknown gui_tag '{tag}' in activity group type '{key}'"
    check: known_gui_tags

# Integration documentation
integration:
  activity_types:
    field: activity_group_type
    default: activities
    example: |
      activity_feast = {
        activity_group_type = activities  # Which group this activity belongs to
        sort_order = 10                   # Order within the group
      }
