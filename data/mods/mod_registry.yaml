# =============================================================================
# DISCOVERY SETTINGS
# =============================================================================

discovery:
  # Where to look for installed mods
  search_paths:
  # These use environment variable expansion
  - "${USERPROFILE}/Documents/Paradox Interactive/Crusader Kings III/mod"
  - "${USERPROFILE}/.local/share/Paradox Interactive/Crusader Kings III/mod"
  - "~/.paradoxlauncher/Crusader Kings III/mod"
  # Steam workshop (Windows)
  - "${PROGRAMFILES(X86)}/Steam/steamapps/workshop/content/1158310"
  # Steam workshop (Linux)
  - "~/.steam/steam/steamapps/workshop/content/1158310"

  # File patterns for mod descriptors
  descriptor_patterns:
  - "*.mod"
  - "descriptor.mod"

  # Cache settings
  cache:
    # Where to store extracted mod data cache
    location: "${PYCHIVALRY_CACHE}/mods"
    # Re-scan mod if older than this (seconds), 0 = always check file hash
    max_age: 3600
    # Use file hash to detect changes
    use_hash: true

# =============================================================================
# EXTRACTION PATTERNS (Shared)
# =============================================================================

patterns:
  # Common regex patterns for CK3 script parsing
  trait_definition: "^([a-z_][a-z0-9_]*)\\s*=\\s*\\{[^}]*\\}"
  trigger_definition: "^([a-z_][a-z0-9_]*(?:_trigger)?)\\s*=\\s*\\{"
  effect_definition: "^([a-z_][a-z0-9_]*(?:_effect)?)\\s*=\\s*\\{"
  modifier_definition: "^([a-z_][a-z0-9_]*)\\s*=\\s*\\{[^}]*opinion\\s*="

  # Block extraction (for getting full definitions)
  block_content: "\\{([^{}]*(?:\\{[^{}]*\\}[^{}]*)*)\\}"
