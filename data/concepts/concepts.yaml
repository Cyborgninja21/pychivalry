  source: game_concepts_l_english.yml
  text: $game_concept_board_game_type_desc_guts$\n\nIn $game_concept_board_game_type_hnefatafl$:\n$EFFECT_LIST_BULLET$
    [intrigue|E] $game_concept_board_game_type_counters$ [martial|E]\n$EFFECT_LIST_BULLET$
    [martial|E] $game_concept_board_game_type_counters$ [prowess|E]\n$EFFECT_LIST_BULLET$
    [prowess|E] $game_concept_board_game_type_counters$ [intrigue|E]
board_game_type_pachisi:
  source: game_concepts_l_english.yml
  text: Pachisi
board_game_type_pachisi_desc:
  source: game_concepts_l_english.yml
  text: $game_concept_board_game_type_desc_guts$\n\nIn $game_concept_board_game_type_pachisi$:\n$EFFECT_LIST_BULLET$
    [diplomacy|E] $game_concept_board_game_type_counters$ [intrigue|E]\n$EFFECT_LIST_BULLET$
    [intrigue|E] $game_concept_board_game_type_counters$ [stewardship|E]\n$EFFECT_LIST_BULLET$
    [stewardship|E] $game_concept_board_game_type_counters$ [diplomacy|E]
board_game_type_tabula:
  source: game_concepts_l_english.yml
  text: Tabula
board_game_type_tabula_desc:
  source: game_concepts_l_english.yml
  text: $game_concept_board_game_type_desc_guts$\n\nIn $game_concept_board_game_type_tabula$:\n$EFFECT_LIST_BULLET$
    [intrigue|E] $game_concept_board_game_type_counters$ [learning|E]\n$EFFECT_LIST_BULLET$
    [learning|E] $game_concept_board_game_type_counters$ [stewardship|E]\n$EFFECT_LIST_BULLET$
    [stewardship|E] $game_concept_board_game_type_counters$ [intrigue|E]
board_game_types:
  source: game_concepts_l_english.yml
  text: Board Game Types
board_game_win:
  source: game_concepts_l_english.yml
  text: Win
board_game_winning:
  source: game_concepts_l_english.yml
  text: Winning
board_game_winning_desc:
  source: game_concepts_l_english.yml
  text: Winning at a $game_concept_board_game$ is accomplished in one of two ways:\n$EFFECT_LIST_BULLET$
    Obtaining a dramatic lead in score over your opponent.\n$EFFECT_LIST_BULLET$ Being
    the defending player if there's no clear winner after round [EmptyScope.ScriptValue('bg_round_cap_value')|0].
board_game_winning_sudden_death:
  source: game_concepts_l_english.yml
  text: Sudden Death
board_games:
  source: game_concepts_l_english.yml
  text: Board Games
bred:
  source: game_concepts_l_english.yml
  text: Bred
breed:
  source: game_concepts_l_english.yml
  text: Breed
breeding:
  source: game_concepts_l_english.yml
  text: Breeding
breeding_desc:
  source: game_concepts_l_english.yml
  text: By arranging [marriages|E] between characters with good [congenital|E] [traits|E],
    it is possible to breed children with the same Traits. Lucky offspring might even
    get a reinforced version of such Traits.\n\nHowever, the same is true of bad Congenital
    Traits like [GetTrait('beauty_bad_2').GetName( GetNullCharacter )].\n\nIt might
    be tempting to arrange marriages between closely related characters in order to
    produce better Traits in your children, but this also carries the risk of [inbreeding|E]
    defects.
builder_i:
  source: game_concepts_l_english.yml
  text: '@builder_icon!'
bullies:
  source: game_concepts_l_english.yml
  text: Bullies
bullies_possessive:
  source: game_concepts_l_english.yml
  text: Bullies'
bully:
  source: game_concepts_l_english.yml
  text: Bully
bully_desc:
  source: game_concepts_l_english.yml
  text: A $game_concept_bully$ is a cruel [child|E] who picks on another $game_concept_child$
    (their [victim|E]), for fun, profit, or just boredom. Upon reaching [adulthood|E],
    a $game_concept_bully$ may become a [rival|E], or they may grow out of their childish
    hate.
bully_possessive:
  source: game_concepts_l_english.yml
  text: Bully's
buy_artifact_claim:
  source: game_concepts_l_english.yml
  text: $buy_artifact_claim_interaction$
buy_artifact_claim_desc:
  source: game_concepts_l_english.yml
  text: An Interaction that allows a character to buy [personal_artifact_claims|E]
    in exchange for [piety|E] or [prestige|E].
buy_artifact_claim_interaction:
  source: game_concepts_l_english.yml
  text: $buy_artifact_claim_interaction$ Interaction
buy_claim:
  source: game_concepts_l_english.yml
  text: $buy_claim_interaction$
buy_claim_desc:
  source: game_concepts_l_english.yml
  text: An Interaction that allows a character to buy [unpressed_claims|E] in exchange
    for [piety|E].\n\n$EFFECT_LIST_BULLET$A [vassal|E] may not buy a claim on any
    [liege|E]'s [title|E], and a Liege may not buy a claim on any Vassal's Title\n$EFFECT_LIST_BULLET$A
    [king|E] or [emperor|E] may not buy claims on Kingdom Titles, and Emperors may
    not buy claims on other Empires\n$EFFECT_LIST_BULLET$No one may buy a claim on
    their [head_of_faith|E]
buy_claim_interaction:
  source: game_concepts_l_english.yml
  text: $buy_claim_interaction$ Interaction
cadet_branch:
  source: game_concepts_l_english.yml
  text: Cadet Branch
cadet_branches:
  source: game_concepts_l_english.yml
  text: Cadet Branches
cadet_branching:
  source: game_concepts_l_english.yml
  text: Cadet Branching
cadet_branching_desc:
  source: game_concepts_l_english.yml
  text: '[dynasties|E] always have a founding [house|E], but in order to become [house_heads|E]
    themselves, [house|E] members can choose to create their own new House — a Cadet
    Branch.\n\nMembers of such offshoot Houses are free to do the same, eventually
    leading to a tree of Houses within the larger Dynasty.'
camel_cavalry:
  source: game_concepts_l_english.yml
  text: Camel Cavalry
camel_cavalry_desc:
  source: game_concepts_l_english.yml
  text: $game_concept_camel_cavalry$ are mounted [men_at_arms|E] that, similar to
    [light_cavalry|E], excel at scouting and pursuing the enemy.\n\nThey generally
    [counter|E] $game_concept_light_cavalry$ and are in turn Countered by [spearmen|E].\n\n$game_concept_camel_cavalry$
    are often strong in Desert and Dryland [terrain|E].
capital:
  source: game_concepts_l_english.yml
  text: Capital
capital_duchy:
  source: game_concepts_l_english.yml
  text: Capital Duchy
capital_duchy_desc:
  source: game_concepts_l_english.yml
  text: The $game_concept_capital_duchy$ Modifier increases the amount of [levies|E]
    you get out of all [holdings|E] you hold within the same [de_jure|E] [duchy|E]
    as your [capital|E]. It also gives a bonus to all [stationed|E] [men_at_arms|E].
    For this modifier to be active, you need to personally hold the associated Duchy.\n\nThis
    modifier does not stack with Realm Capital bonus.
castle:
  source: game_concepts_l_english.yml
  text: Castle
castle_holding:
  source: game_concepts_l_english.yml
  text: Castle Holding
castle_holding_desc:
  source: game_concepts_l_english.yml
  text: Castles are the most heavily fortified [holding_type|E] and the standard type
    for [feudal|E], [clan|E] and [tribal|E] [rulers|E], as well as [holy_orders|E].
    They tend to provide more [levies|E] than [taxes|E].
castle_holdings:
  source: game_concepts_l_english.yml
  text: Castle Holdings
castles:
  source: game_concepts_l_english.yml
  text: Castles
casualties:
  source: game_concepts_l_english.yml
  text: Casualties
casualty:
  source: game_concepts_l_english.yml
  text: Casualty
casualty_desc:
  source: game_concepts_l_english.yml
  text: '[armies|E] will sustain a certain amount of $game_concept_casualties$ during
    a [battle|E] dependent on the amount of [damage|E] taken.\n\nWhen [soldiers|E]
    are removed from a $game_concept_battle$, they will be considered to be either
    [routed_soldiers|E] or [dead_soldiers|E].'
casus_belli:
  source: game_concepts_l_english.yml
  text: Casus Belli
casus_belli_desc:
  source: game_concepts_l_english.yml
  text: A $game_concept_casus_belli$ ('Cause for War') required to declare [war|E]
    on another [ruler|E].\n\nThe $game_concept_casus_belli$ specifies what the War
    is about, usually a specific territory — the [war_target|E]. It is not possible
    to gain anything more than the $game_concept_casus_belli$ allows, regardless of
    how soundly the enemy is defeated.\n\nOne of the most important Casus Bellis are
    [claims|E], whether they come from [succession|E] or the [fabricate_claim|E] Task.
casus_bellis:
  source: game_concepts_l_english.yml
  text: Casus Bellis
cautious_i:
  source: game_concepts_l_english.yml
  text: '@cautious_icon!'
chancellor:
  source: game_concepts_l_english.yml
  text: Chancellor
chancellor_desc:
  source: game_concepts_l_english.yml
  text: The $game_concept_chancellor$ is the [councillor|E] in charge of diplomatic
    efforts, both inside and outside the [realm|E].
chancellors:
  source: game_concepts_l_english.yml
  text: Chancellors
character:
  source: game_concepts_l_english.yml
  text: Character
character_death:
  source: game_concepts_l_english.yml
  text: Character Death
character_death_death:
  source: game_concepts_l_english.yml
  text: Death
character_death_desc:
  source: game_concepts_l_english.yml
  text: Death triggers [succession|E], which is important for [rulers|E].\n\nIf a
    Player Character dies, the player will continue playing as their [player_heir|E]
    — or be faced with a Game Over, if they have no valid heir.
character_death_die:
  source: game_concepts_l_english.yml
  text: Die
character_death_dies:
  source: game_concepts_l_english.yml
  text: Dies
character_death_dying:
  source: game_concepts_l_english.yml
  text: Dying
character_desc:
  source: game_concepts_l_english.yml
  text: Characters are either [noble|E] or [lowborn|E], [landed|E] or [unlanded|E],
    each with their own set of [skills|E] and [traits|E], goals and aspirations. They
    come in the form of [rulers|E], [courtiers|E] and [guests|E]. As long as they
    are within [diplomatic_range|E], they can be interacted with.
character_interaction:
  source: game_concepts_l_english.yml
  text: Character Interaction
character_modifier:
  source: game_concepts_l_english.yml
  text: Character Modifier
character_modifier_desc:
  source: game_concepts_l_english.yml
  text: '[modifiers|E] held by a Character, affecting their personality, [skills|E],
    and even [income|E]. Unlike [traits|E], $game_concept_character_modifiers$ tend
    to represent temporary effects.'
character_modifiers:
  source: game_concepts_l_english.yml
  text: Character Modifiers
character_personality:
  source: game_concepts_l_english.yml
  text: Character Personality
character_possessive:
  source: game_concepts_l_english.yml
  text: Character's
characters:
  source: game_concepts_l_english.yml
  text: Characters
characters_possessive:
  source: game_concepts_l_english.yml
  text: Characters'
child:
  source: game_concepts_l_english.yml
  text: Child
child_desc:
  source: game_concepts_l_english.yml
  text: 'A $game_concept_child$ is a character younger than #V 16#!.'
childhood_trait:
  source: game_concepts_l_english.yml
  text: Childhood Trait
childhood_trait_desc:
  source: game_concepts_l_english.yml
  text: Every child gains a Childhood Trait as they are growing up, such as [GetTrait('rowdy').GetName(
    GetNullCharacter )] or [GetTrait('charming').GetName( GetNullCharacter )].\n\nThe
    gained trait is indicative of which [education_focus|E] would suit them best.
children:
  source: game_concepts_l_english.yml
  text: Children
church_holding:
  source: game_concepts_l_english.yml
  text: Church Holding
church_holdings:
  source: game_concepts_l_english.yml
  text: Church Holdings
church_property:
  source: game_concepts_l_english.yml
  text: Church Holdings
church_property_desc:
  source: game_concepts_l_english.yml
  text: Church Holdings are [temples|E] under the control of a [realm_priest|E].\n\nIn
    [faiths|E] with the [GetFaithDoctrine('doctrine_theocracy_lay_clergy').GetBaseName]
    [doctrine|E], there are no Church Holdings and [temples|E] can be directly held
    by secular [rulers|E] without penalty.
cities:
  source: game_concepts_l_english.yml
  text: Cities
city:
  source: game_concepts_l_english.yml
  text: City
city_holding:
  source: game_concepts_l_english.yml
  text: City Holding
city_holding_desc:
  source: game_concepts_l_english.yml
  text: Cities are the wealthiest [holding_type|E], favoring [taxes|E] over [levies|E].
    They are associated with [republics|E], and holding them as any of the playable
    [government_forms|E] will always incur a penalty.
city_holdings:
  source: game_concepts_l_english.yml
  text: City Holdings
civil_war:
  source: game_concepts_l_english.yml
  text: Civil War
civil_war_desc:
  source: game_concepts_l_english.yml
  text: A [war|E] where one or more [vassals|E] and/or [counties|E] rise in revolt
    against their [liege|E]. They are most commonly the result of a [faction|E] whose
    demands have not been met.\n\nLosing a $game_concept_civil_war$ often has consequences
    that are more severe than the original demands of the rebelling faction.
civil_wars:
  source: game_concepts_l_english.yml
  text: Civil Wars
claim:
  source: game_concepts_l_english.yml
  text: Claim
claim_i:
  source: game_concepts_l_english.yml
  text: '@pressed_claim!'
claimant:
  source: game_concepts_l_english.yml
  text: Claimant
claimant_desc:
  source: game_concepts_l_english.yml
  text: A $game_concept_claimant$ is a person with one or more [claims|E] to [titles|E].
    [ruler|E] Claimants can press these by using the Claim [casus_belli|E] to declare
    [wars|E].\n\nThis Casus Belli can also be used to press the Claims of [vassals|E]
    and even [unlanded|E] characters in your [realm|E].\n\nClaimants can also lead
    [factions|E] — even if they do not reside in your Realm.
claimant_faction:
  source: game_concepts_l_english.yml
  text: $claimant_faction$
claimant_faction_desc:
  source: game_concepts_l_english.yml
  text: The $game_concept_claimant_faction$ seeks to install a particular [claimant|E]
    on the throne of a [title|E] held by their [liege|E]. If successful, the Liege
    will have to relinquish the Title to the Claimant and the [vassal|E] structure
    will be updated accordingly. All [faction|E] members will gain a [hook|E] on the
    Claimant.
claimant_factions:
  source: game_concepts_l_english.yml
  text: Claimant Factions
claimants:
  source: game_concepts_l_english.yml
  text: Claimants
claimed:
  source: game_concepts_l_english.yml
  text: Claimed
claims:
  source: game_concepts_l_english.yml
  text: Claims
clan:
  source: game_concepts_l_english.yml
  text: Clan
clan_desc:
  source: game_concepts_l_english.yml
  text: Clans are a [government_form|E] in which the amount of [levies|E] and [taxes|E]
    given to a [liege|E] by their [vassals|E] is determined by the [aptitude|E] of
    said Liege's [tax_collector|E]. Clans also make use of [house_unity|E].
clan_government:
  source: game_concepts_l_english.yml
  text: Clan Government
clergy:
  source: game_concepts_l_english.yml
  text: Clergy
clergy_desc:
  source: game_concepts_l_english.yml
  text: '[court_chaplains|E], [realm_priests|E], [theocratic|E] Rulers, and anyone
    with the [GetTrait(''devoted'').GetName( GetNullCharacter )] trait are considered
    members of the Clergy.\n\nThe [doctrines|E] of the [faith|E] determine who can
    be a member of the Clergy, and whether members of the Clergy can marry, inherit
    land, etc.'
clergy_opinion:
  source: game_concepts_l_english.yml
  text: Clergy Opinion
clergy_opinion_desc:
  source: game_concepts_l_english.yml
  text: This type of [opinion|E] only affects [clergy|E] of your own [faith|E].
close_family:
  source: game_concepts_l_english.yml
  text: Close Family
close_family_desc:
  source: game_concepts_l_english.yml
  text: The Close Family of a character includes:\n$BULLET_WITH_TAB$Parents\n$BULLET_WITH_TAB$Grandparents\n$BULLET_WITH_TAB$Children\n$BULLET_WITH_TAB$Grandchildren\n$BULLET_WITH_TAB$Siblings
close_family_member:
  source: game_concepts_l_english.yml
  text: Close Family Member
close_family_members:
  source: game_concepts_l_english.yml
  text: Close Family Members
cognomen:
  source: game_concepts_l_english.yml
  text: Cognomen
cognomens:
  source: game_concepts_l_english.yml
  text: Cognomens
collect_taxes:
  source: game_concepts_l_english.yml
  text: $task_collect_taxes$
collect_taxes_desc:
  source: game_concepts_l_english.yml
  text: $game_concept_collect_taxes$ is a [councillor_task|E] performed by the [steward|E].\n\nIt
    increases all taxes in a character's personal [domain|E].
combat_phase:
  source: game_concepts_l_english.yml
  text: Battle Phase
combat_phase_desc:
  source: game_concepts_l_english.yml
  text: A $game_concept_combat_phase$ is one part of a [battle|E]. Battles have three
    distinct phases; [maneuver|E], [main_phase|E], and [aftermath|E].
combat_roll:
  source: game_concepts_l_english.yml
  text: Battle Roll
combat_roll_desc:
  source: game_concepts_l_english.yml
  text: '[advantage|E] Rolls are made by each [commander|E] during [battle|E]. These
    are done on a scale from 0-10 and are completely random, but can have a decisive
    effect on the outcome of the $game_concept_battle$.'
combat_width:
  source: game_concepts_l_english.yml
  text: Combat Width
combat_width_desc:
  source: game_concepts_l_english.yml
  text: $game_concept_combat_width$ indicates how many [soldiers|E] from each side
    may fight each other concurrently in [battle|E], and may be affected by factors
    such as [terrain|E].\n\nThis prevents one side from completely overwhelming the
    other and is determined at the start of the Battle.
command_modifier:
  source: game_concepts_l_english.yml
  text: Command Modifier
command_modifier_desc:
  source: game_concepts_l_english.yml
  text: This [modifier|E] is only active for [commanders|E].\n\nIf a character with
    a Command Modifier commands an [army|E], it will get this effect.
command_modifier_i:
  source: game_concepts_l_english.yml
  text: '@command_modifier_icon!'
commander:
  source: game_concepts_l_english.yml
  text: Commander
commander_trait:
  source: game_concepts_l_english.yml
  text: Commander Trait
commander_trait_desc:
  source: game_concepts_l_english.yml
  text: $game_concept_commander_traits$ are special [traits|E] that confer useful
    perks to characters when acting as [army|E] [commanders|E].\n\nCommander Traits
    are typically acquired by children raised with the Martial [education_focus|E],
    but can also be gained through the [martial_lifestyle|E] and other means.
commander_traits:
  source: game_concepts_l_english.yml
  text: Commander Traits
commanders:
  source: game_concepts_l_english.yml
  text: Commanders
commanding:
  source: game_concepts_l_english.yml
  text: Commanding
commission_epic:
  source: game_concepts_l_english.yml
  text: $commission_epic_decision$
commission_epic_decision:
  source: game_concepts_l_english.yml
  text: $commission_epic_decision$ Decision
commission_epic_desc:
  source: game_concepts_l_english.yml
  text: A [decision|E] that lets a character trade [gold|E] for an [artifact|E], by
    commissioning a family epic.\nThe epic will give [dynasty_prestige|E] and can
    give also give other bonuses depending on your choices.
commoner:
  source: game_concepts_l_english.yml
  text: Commoner
commoner_desc:
  source: game_concepts_l_english.yml
  text: A $game_concept_commoner$ or $game_concept_lowborn$ Character is not a member
    of a [noble|E] [dynasty|E]. They can, however, still be powerful [rulers|E] of
    [theocracies|E] and [republics|E].\n\nIf a Commoner becomes [landed|E], they immediately
    become Nobles and found their own [dynasties|E] (except in [republics|E] and [theocracies|E],
    which are largely run by Commoners).
commoners:
  source: game_concepts_l_english.yml
  text: Commoners
complete_control:
  source: game_concepts_l_english.yml
  text: Complete Control
complete_control_desc:
  source: game_concepts_l_english.yml
  text: This condition is fulfilled when all [de_jure|E] vassal [titles|E] of the
    targeted title are held by either the [ruler|E] or by their [vassals|E] and none
    of its Counties are [occupied|E] by hostile [armies|E].
complete_control_region:
  source: game_concepts_l_english.yml
  text: Complete Control
complete_control_region_desc:
  source: game_concepts_l_english.yml
  text: This condition is fulfilled when all [counties|E] in the targeted [region|E]
    are held by either the ruler or by their [vassals|E] and none of its Counties
    are occupied by hostile armies.
completely_control:
  source: game_concepts_l_english.yml
  text: Completely Control
completely_control_region:
  source: game_concepts_l_english.yml
  text: Completely Control
completely_controlled:
  source: game_concepts_l_english.yml
  text: Completely Controlled
completely_controls:
  source: game_concepts_l_english.yml
  text: Completely Controls
completely_controls_region:
  source: game_concepts_l_english.yml
  text: Completely Controls
concubinage:
  source: game_concepts_l_english.yml
  text: Concubinage
concubinage_desc:
  source: game_concepts_l_english.yml
  text: A Concubine is of lesser status than a [spouse|E], allowed in [faiths|E] with
    the [GetFaithDoctrine('doctrine_concubines').GetBaseName] [doctrine|E].\n\nUnlike
    [marriage|E], Concubinage does not yield [alliances|E]. Concubines can also be
    set aside at will, without the complications of a [divorce|E]. The children of
    Concubines are considered [legitimate|E].\n\nConcubinage is mutually exclusive
    with [GetFaithDoctrine('doctrine_polygamy').GetBaseName].
concubine:
  source: game_concepts_l_english.yml
  text: Concubine
concubine_female:
  source: game_concepts_l_english.yml
  text: Concubine
concubine_male:
  source: game_concepts_l_english.yml
  text: Concubine
concubines:
  source: game_concepts_l_english.yml
  text: Concubines
congenital:
  source: game_concepts_l_english.yml
  text: Congenital
congenital_desc:
  source: game_concepts_l_english.yml
  text: Certain [traits|E] are Congenital and can be inherited by offspring. Through
    proper [breeding|E], it is even possible to reinforce some such Traits.\n\nFor
    example, if both parents are [GetTrait('intellect_good_1').GetName( GetNullCharacter
    )], there is a chance that their children will get the even better [GetTrait('intellect_good_2').GetName(
    GetNullCharacter )] Trait.\n\nBase [skills|E] are not congenital.
congenital_trait:
  source: game_concepts_l_english.yml
  text: Congenital Trait
congenital_traits:
  source: game_concepts_l_english.yml
  text: Congenital Traits
contest:
  source: game_concepts_l_english.yml
  text: Contest
contest_aptitude:
  source: game_concepts_l_english.yml
  text: Contest Aptitude
contest_aptitude_desc:
  source: game_concepts_l_english.yml
  text: 'Different [contests|E] require different talents: Foot, Horse, Bow, Wit,
    or a combination.\n\nYour aptitude is derived from your [skills|E], [health|E],
    [traits|E], and [GetTrait(''tourney_participant'').GetName( GetNullCharacter )]
    [trait_level_track_xp|E].\n\nFor example, a [GetTrait(''giant'').GetName( GetNullCharacter
    )] with high [prowess|E] has a natural advantage in a Wrestling contest.'
contest_category_race:
  source: game_concepts_l_english.yml
  text: Race
contest_category_race_desc:
  source: game_concepts_l_english.yml
  text: The winner of $game_concept_contest_category_race$ [contests|E] is the [contest_qualifying|E]
    [contestant|E] whose entered horse has taken first place at the end of the race.\n\n$game_concept_contest_category_race$
    Contests:\n$EFFECT_LIST_BULLET$Horse Race
contest_category_team:
  source: game_concepts_l_english.yml
  text: Teams
contest_category_team_desc:
  source: game_concepts_l_english.yml
  text: In $game_concept_contest_category_team$ [contests|E], all [contest_qualifying|E]
    [contestants|E] on the team with the most combined points at the end of the contest
    receive rewards.\n\n$game_concept_contest_category_team$ Contests:\n$EFFECT_LIST_BULLET$Melee
contest_category_turn:
  source: game_concepts_l_english.yml
  text: Turns
contest_category_turn_desc:
  source: game_concepts_l_english.yml
  text: The winner of a $game_concept_contest_category_turn$ [contests|E] is the [contest_qualifying|E]
    [contestant|E] with the most points at the end of the competition.\n\n$game_concept_contest_category_turn$
    Contests:\n$EFFECT_LIST_BULLET$Archery\n$EFFECT_LIST_BULLET$Recital
contest_category_versus:
  source: game_concepts_l_english.yml
  text: Knock-Out
contest_category_versus_desc:
  source: game_concepts_l_english.yml
  text: The winner of a $game_concept_contest_category_versus$ [contest|E] is the
    last one remaining after three [contest_rounds|E] between [contest_qualifying|E]
    [contestants|E].\n\n$game_concept_contest_category_versus$ Contests:\n$EFFECT_LIST_BULLET$Wrestling\n$EFFECT_LIST_BULLET$Duel\n$EFFECT_LIST_BULLET$Joust\n$EFFECT_LIST_BULLET$Board
    Games
contest_desc:
  source: game_concepts_l_english.yml
  text: 'A [GetActivityType( ''activity_tournament'' ).GetName] is comprised of a
    series of $game_concept_contests$, selected by the [activity_host|E], where [contest_qualifying|E]
    [contestants|E] can compete to win [prizes|E] and other rewards.\n\nEach $game_concept_contest$
    uses one of four different ways to determine a winner: [contest_category_versus|E],
    [contest_category_turn|E], [contest_category_team|E], and [contest_category_race|E].\n\nYour
    chance of winning a $game_concept_contest$ is determined by your [skills|E], [traits|E],
    preparation, and other factors. Eligibility to enter physical $game_concept_contests$
    is determined by health and sex, based on the [culture|E] and [faith|E] of the
    [activity_host|E].'
contest_qualification:
  source: game_concepts_l_english.yml
  text: Qualification
contest_qualification_desc:
  source: game_concepts_l_english.yml
  text: While a [GetActivityType( 'activity_tournament' ).GetName] will attract many
    eligible [contestants|E], only a small number will Qualify for each [contest|E],
    with a chance of winning glory and its [prize|E].\n\nTo guarantee Qualification,
    your [progress_to_victory|E] must be above the threshold when the Contest begins.
contest_qualifier:
  source: game_concepts_l_english.yml
  text: Qualifier
contest_qualifiers:
  source: game_concepts_l_english.yml
  text: Qualifiers
contest_qualifies:
  source: game_concepts_l_english.yml
  text: Qualifies
contest_qualify:
  source: game_concepts_l_english.yml
  text: Qualify
contest_qualifying:
  source: game_concepts_l_english.yml
  text: Qualifying
contest_round:
  source: game_concepts_l_english.yml
  text: Contest Round
contest_round_desc:
  source: game_concepts_l_english.yml
  text: '[contest_category_versus|E] [contests|E] determine a winner by pairing all
    [contest_qualifying|E] [contestants|E] against each other in knock-out bouts until
    only one remains.\n\nThere are three rounds: quarter-finals, semi-finals, and
    the final.'
contest_rounds:
  source: game_concepts_l_english.yml
  text: Contest Rounds
contestant:
  source: game_concepts_l_english.yml
  text: Contestant
contestant_desc:
  source: game_concepts_l_english.yml
  text: In order to compete in [GetActivityType( 'activity_tournament' ).GetName]
    [contests|E], you must fulfill its requirements. Board Games allow all characters
    to compete, while others, like Wrestling, depend on Martial rules.\n\nNon-competing
    characters will be [spectators|E], and potential [contestants|E] may opt-out of
    participating if they wish to spectate.\n\nEligibility to enter Contests is determined
    by gender and health, based on the host's [culture|E] and [religion|E].
contestants:
  source: game_concepts_l_english.yml
  text: Contestants
contests:
  source: game_concepts_l_english.yml
  text: Contests
contract:
  source: game_concepts_l_english.yml
  text: Contract
contribute:
  source: game_concepts_l_english.yml
  text: Contribute
contribution:
  source: game_concepts_l_english.yml
  text: Contribution
control:
  source: game_concepts_l_english.yml
  text: Control
control_i:
  source: game_concepts_l_english.yml
  text: '@control_icon!'
convert_county:
  source: game_concepts_l_english.yml
  text: $task_conversion$
convert_county_desc:
  source: game_concepts_l_english.yml
  text: A [councillor_task|E] performed by the [court_chaplain|E] which targets a
    [county|E] of a different faith than the [liege|E].\nProgress increases each month,
    and at 100%, the majority of the Target County has changed from their previous
    Faith to the Liege's Faith.\n\nConversion speed is affected by many factors, including
    the [councillor|E]'s [learning_skill|E] and the [fervor|E] of the two Faiths.
convince_dejure:
  source: game_concepts_l_english.yml
  text: $task_convince_dejure$
convince_dejure_desc:
  source: game_concepts_l_english.yml
  text: A [councillor_task|E] performed by the [steward|E]. It targets a [de_jure|E]
    [county|E] of the councillor's [liege|E] that is owned by an [independent|E] [ruler|E].
    When the county is persuaded, they will ask their [ruler|E] to release them to
    their [de_jure|E] [liege|E].
core_tenet:
  source: game_concepts_l_english.yml
  text: Tenet
core_tenet_desc:
  source: game_concepts_l_english.yml
  text: While [doctrines|E] represent issues a [faith|E] must take a stance on, $game_concept_core_tenets$
    represent the Faith's unique quirks and rites.
core_tenets:
  source: game_concepts_l_english.yml
  text: Tenets
council:
  source: game_concepts_l_english.yml
  text: Council
council_desc:
  source: game_concepts_l_english.yml
  text: The $game_concept_council$ consists of six [councillors|E] who assist their
    [ruler|E] in the administration of the [realm|E]. As the heads of their respective
    departments, they can be assigned various important [councillor_tasks|E].
councillor:
  source: game_concepts_l_english.yml
  text: Councillor
councillor_desc:
  source: game_concepts_l_english.yml
  text: 'Councillors are the primary assistants of any [ruler|E], and make up the
    [council|E]. There are six positions on the council: [chancellor|E], [marshal|E],
    [steward|E], [spymaster|E], [court_chaplain|E] (or [realm_priest|E]), and finally
    your [spouse|E].\n\nEach is in charge of a department that can be given different
    [councillor_tasks|E] to perform.\n\n[powerful_vassals|E] will be upset if not
    appointed to one of these positions, meaning you often have to make a choice between
    placating a powerful vassal or appointing someone who is actually competent.\n\nServing
    as a Councillor to your [liege|E] gives you a bonus, which increases with the
    [rank|E] of the Liege.'
councillor_task:
  source: game_concepts_l_english.yml
  text: Councillor Task
councillor_task_desc:
  source: game_concepts_l_english.yml
  text: $game_concept_councillor_tasks$ are important jobs that can be given to your
    [councillors|E]. These tasks can either be general or specifically target a [county|E]
    or [court|E].\n\nIf you have a [relation|E] with a Councillor, Tasks with a completion
    time may take more or less time.\n\n#weak Note that councillors are not physically
    present to perform these tasks, but merely lead the efforts.#!
councillor_task_possible_side_effects:
  source: game_concepts_l_english.yml
  text: Possible Side Effects
councillor_task_possible_side_effects_desc:
  source: game_concepts_l_english.yml
  text: A [councillor_task|E] may have unexpected consequences over time. These may
    be good or bad, with positive effects being more likely the higher the Councillor's
    relevant [skill|E], and negative effects being more likely the lower the relevant
    Skill is.
councillor_tasks:
  source: game_concepts_l_english.yml
  text: Councillor Tasks
councillors:
  source: game_concepts_l_english.yml
  text: Councillors
counter:
  source: game_concepts_l_english.yml
  text: Counter
counters:
  source: game_concepts_l_english.yml
  text: Counters
county_capital:
  source: game_concepts_l_english.yml
  text: County Capital
county_capital_desc:
  source: game_concepts_l_english.yml
  text: The $game_concept_county_capital$ is the main [holding|E] of a [county|E].
    This Holding can never be destroyed or [leased|E] out and is always owned by the
    [ruler|E] who holds the County [title|E].\n\nCounty Capitals allows the construction
    of an additional [building|E] compared to a lesser Holding.
county_capitals:
  source: game_concepts_l_english.yml
  text: County Capitals
county_control:
  source: game_concepts_l_english.yml
  text: County Control
county_control_desc:
  source: game_concepts_l_english.yml
  text: $game_concept_county_control$ measures the grip that the government has on
    the population of a [county|E]. It is crucial especially for collecting [taxes|E]
    from the [holdings|E].\n\nWhen a County changes hands through [war|E], Control
    goes down drastically, which is a good reason to vassalize the current [holder|E]
    instead (if the [casus_belli|E] allows). County Control can also be damaged by
    [sieges|E] and [Concept( 'peasant_faction', 'Peasant Uprisings' )|E].\n\nLow Control
    may lead to [county_corruption|E], and the primary way of increasing Control is
    a [councillor_task|E] available to your [marshal|E].
county_corruption:
  source: game_concepts_l_english.yml
  text: County Corruption
county_corruption_desc:
  source: game_concepts_l_english.yml
  text: While a [county|E] has low [control|E] or its [holder|E] is in [debt|E], the
    County might acquire $game_concept_county_corruption$. These are various kinds
    of negative [county_modifiers|E].\n\n$game_concept_county_corruption$ will fade
    over time, but if the root cause persists ([debt|E] or low [control|E]), it may
    reappear.\n\nThe $councillor_marshal$'s $task_increase_control$ $game_concept_councillor_task$
    can clear out $game_concept_county_corruption$ faster.
county_development:
  source: game_concepts_l_english.yml
  text: Development
county_development_desc:
  source: game_concepts_l_english.yml
  text: $game_concept_county_development$ is a measure of the local infrastructure
    and technological advancement in a [county|E]. \n\nHigher $game_concept_county_development$
    increases the [levies|E], [taxes|E], and [supply_limit|E] gained from a $game_concept_county$.
county_development_growth:
  source: game_concepts_l_english.yml
  text: Development Growth
county_development_growth_desc:
  source: game_concepts_l_english.yml
  text: $game_concept_county_development_growth$ measures how far along the [county|E]
    is towards increasing its [development|E].\n\nAt 100 $game_concept_county_development_growth$,
    the $game_concept_county_development$ increases by 1.
county_modifier:
  source: game_concepts_l_english.yml
  text: County Modifier
county_modifier_desc:
  source: game_concepts_l_english.yml
  text: $game_concept_county_modifiers$ are modifiers that affect a [county|E]'s various
    values.\n\n[baronies|E] can have modifiers of their own, and they can be viewed
    in the [holdings|E] of the $game_concept_county$.
county_modifiers:
  source: game_concepts_l_english.yml
  text: County Modifiers
county_opinion:
  source: game_concepts_l_english.yml
  text: Popular Opinion
county_opinion_desc:
  source: game_concepts_l_english.yml
  text: The general populace of each [county|E] has an [opinion|E] of the [character|E]
    who holds their $game_concept_county$. If the population is unhappy, they might
    start or join a [peasant_faction|E] or [popular_faction|E], either of which can
    soon spread throughout an entire [realm|E].\n\nThe easiest way of controlling
    $game_concept_county_opinion$ is to ensure that the $game_concept_county$ [holder|E]
    is of the same [culture|E] and [faith|E] as the population.\n\n$game_concept_county_opinion$
    from having a different [faith|E] is modified by both the county's [faith_hostility|E]
    and its [fervor|E], scaling linearly between 0 and 100 $game_concept_fervor$.
court:
  source: game_concepts_l_english.yml
  text: Court
court_chaplain:
  source: game_concepts_l_english.yml
  text: Court Chaplain
court_chaplain_desc:
  source: game_concepts_l_english.yml
  text: The $game_concept_court_chaplain$ is the [councillor|E] in charge of religious
    and spiritual affairs in [faiths|E] with the [GetFaithDoctrine('doctrine_theocracy_lay_clergy').GetBaseName]
    [doctrine|E].\n\nFaiths with the [GetFaithDoctrine('doctrine_theocracy_temporal').GetBaseName]
    Doctrine have the far more powerful (and troublesome) [realm_priest|E] instead
    of a $game_concept_court_chaplain$.
court_chaplains:
  source: game_concepts_l_english.yml
  text: Court Chaplains
court_guest:
  source: game_concepts_l_english.yml
  text: Court Guest
court_guest_desc:
  source: game_concepts_l_english.yml
  text: '[wanderers|E] sometimes show up in [court|E] as Guests. They will only stay
    for a limited time, but can be recruited as permanent [courtiers|E] by the [ruler|E].'
court_host:
  source: game_concepts_l_english.yml
  text: Court Host
court_host_desc:
  source: game_concepts_l_english.yml
  text: A $game_concept_court_host$ is a [ruler|E] who is not the liege of a character,
    yet still has them in their [court].\n\nThere are several possible reasons this
    can occur, such as [wanderers|E] visiting a Ruler or [wards|E] staying in the
    same Court as their [guardian|E].
courtier:
  source: game_concepts_l_english.yml
  text: Courtier
courtier_desc:
  source: game_concepts_l_english.yml
  text: A $game_concept_courtier$ is an [unlanded|E] character who serves a [ruler|E]
    in their [court|E].\n\nCourtiers can:\n$BULLET_WITH_TAB$Serve as [councillors|E]\n$BULLET_WITH_TAB$Serve
    in [court_positions|E]\n$BULLET_WITH_TAB$Serve in [armies|E] as [commanders|E]
    or [knights|E]\n$BULLET_WITH_TAB$Become their Ruler's [vassal|E] if granted a
    [title|E]\n$BULLET_WITH_TAB$Let their Ruler press their [claims|E] in [war|E]\n\n#WEAK
    [adventurers|E] have [followers|E] instead of $game_concept_courtiers$ — they
    serve the same role, albeit generally smellier and with more mud.#!
courtiers:
  source: game_concepts_l_english.yml
  text: Courtiers
courts:
  source: game_concepts_l_english.yml
  text: Courts
cowed:
  source: game_concepts_l_english.yml
  text: Terrified
cowed_desc:
  source: game_concepts_l_english.yml
  text: Terrified Characters are paralyzed by fear of another character and will rarely
    take any hostile actions against that character, including starting [factions|E].\n\nCharacters
    are Terrified or [intimidated|E] by [dread|E] and/or a cowardly personality.
create:
  source: game_concepts_l_english.yml
  text: Create
create_title:
  source: game_concepts_l_english.yml
  text: Create Title
created:
  source: game_concepts_l_english.yml
  text: Created
created_title:
  source: game_concepts_l_english.yml
  text: Created Title
crime:
  source: game_concepts_l_english.yml
  text: Crime
crime_desc:
  source: game_concepts_l_english.yml
  text: $game_concept_crimes$ are actions that society views as objectionable enough
    to be worthy of punishment.\n\nCrimes may be secular (such as a [vassal|E] [revolting|E]
    against their [liege|E]) or religious (any kind of [shunned|E] behavior that is
    made illegal by [doctrine|E]). Secular crimes can only be punished by the character(s)
    who were harmed by the offense, but any [ruler|E] can punish their subjects for
    religious Crimes.\n\nAll crimes give Rulers a valid reason to [imprison|E] $game_concept_criminals$,
    and, depending on the severity of the Crime, to [revoke|E] their [titles|E], [banish|E],
    [torture|E], or [execute|E] them. Each Crime can only be punished by a Ruler once,
    though some Crimes will give the Criminal a negative [fame_trait|E] that they
    will carry to their grave.\n\nSometimes characters get away with Crimes, which
    are then [secrets|E] that can be uncovered by other characters and used for [blackmail|E].
crime_i:
  source: game_concepts_l_english.yml
  text: '@crime_icon!'
crimes:
  source: game_concepts_l_english.yml
  text: Crimes
criminal:
  source: game_concepts_l_english.yml
  text: Criminal
criminals:
  source: game_concepts_l_english.yml
  text: Criminals
critical_failure:
  source: game_concepts_l_english.yml
  text: Critical Failure
critical_failure_desc:
  source: game_concepts_l_english.yml
  text: Some [schemes|E] have the possibility of $game_concept_critical_failure$ during
    execution.\n\nExact outcomes vary, but include the $game_concept_scheme$ backfiring
    on the [scheme_owner_owner|E], or preventing them from attempting the same $game_concept_scheme$
    against the same [scheme_target_target|E] for some time.
critically_fail:
  source: game_concepts_l_english.yml
  text: Critically Fail
crown_authority:
  source: game_concepts_l_english.yml
  text: Crown Authority
crown_authority_desc:
  source: game_concepts_l_english.yml
  text: $game_concept_crown_authority$ represents the general power that a [ruler|E]
    wields over their [vassals|E].\n\nThere are four levels of $game_concept_crown_authority$;
    [autonomous_vassals|E], [limited|E], [high|E], and [absolute|E]. Increasing $game_concept_crown_authority$
    costs an amount of [prestige|E] depending on the level and the ruler's [learning_skill|E].\n\n#weak
    Vassals dislike higher levels of $game_concept_crown_authority$, and lowering
    it is the primary goal of [Concept( 'liberty_faction', 'Liberty Factions' )|E].#!
crusade:
  source: game_concepts_l_english.yml
  text: Crusade
crusades:
  source: game_concepts_l_english.yml
  text: Crusades
crush:
  source: game_concepts_l_english.yml
  text: Crush
crush_desc:
  source: game_concepts_l_english.yml
  text: A $game_concept_crush$ is another [child|E] that this $game_concept_child$
    is developing their first (rather painfully-awkward) feelings for. Upon reaching
    [adulthood|E], if the $game_concept_crush$ is mutual, it may blossom into becoming
    [lovers|E], or the [character|E] may move on with their life.
crush_possessive:
  source: game_concepts_l_english.yml
  text: Crush's
crushes:
  source: game_concepts_l_english.yml
  text: Crushes
crushes_possessive:
  source: game_concepts_l_english.yml
  text: Crushes'
cultural:
  source: game_concepts_l_english.yml
  text: Cultural
cultural_acceptance:
  source: game_concepts_l_english.yml
  text: Cultural Acceptance
cultural_acceptance_baseline:
  source: game_concepts_l_english.yml
  text: Cultural Acceptance Baseline
cultural_acceptance_baseline_desc:
  source: game_concepts_l_english.yml
  text: '[cultural_acceptance|E] has a baseline which it will decay towards if exceeded.
    The baseline depends on:\n$EFFECT_LIST_BULLET$Shared [heritage|E]\n$EFFECT_LIST_BULLET$Shared
    [language|E]\n$EFFECT_LIST_BULLET$Shared [faith|E] and [religion|E], especially
    if [GetFaithDoctrine(''doctrine_pluralism_pluralistic'').GetBaseName] or [GetReligionFamily(''rf_eastern'').GetName]\n$EFFECT_LIST_BULLET$Shared
    [ethos|E] within the same [region|E]'
cultural_acceptance_desc:
  source: game_concepts_l_english.yml
  text: Cultural Acceptance measures how accepting two [cultures|E] are of each other.\n\nPrimarily,
    it affects how much [opinion|E] is reduced between Characters of different Cultures.
    It also affects [county_opinion|E], and the cost of forming a [hybrid_culture|E].\n\nCultural
    Acceptance can change from many actions, most notably [wars|E], granting and revoking
    [titles|E], and the [accept_culture|E] [councillor_task|E].\n\nOver time, Acceptance
    will return to the [cultural_acceptance_baseline|E] if exceeded.
cultural_acceptance_i:
  source: game_concepts_l_english.yml
  text: '@cultural_acceptance_icon!'
cultural_fascination:
  source: game_concepts_l_english.yml
  text: Cultural Fascination
cultural_fascination_desc:
  source: game_concepts_l_english.yml
  text: Each Culture is always Fascinated by a specific [innovation|E], which greatly
    increases the speed of discovery at a rate depending on the [skills|E] of the
    current [culture_head|E]. Each Innovation benefits from a specific Skill.\n\nThe
    Cultural Head can change the Cultural Fascination freely.
cultural_festival:
  source: game_concepts_l_english.yml
  text: Cultural Festival
cultural_festival_desc:
  source: game_concepts_l_english.yml
  text: An [activity_phase|E] during a [royal_tour|E] in which a [vassal|E] is expected
    to entertain their [liege|E], which often results in an increase in [county_opinion|E]
    and [cultural_acceptance|E].
cultural_festivals:
  source: game_concepts_l_english.yml
  text: Cultural Festivals
cultural_head:
  source: game_concepts_l_english.yml
  text: Cultural Head
culture:
  source: game_concepts_l_english.yml
  text: Culture
culture_desc:
  source: game_concepts_l_english.yml
  text: $game_concept_culture$ represents the language and customs of a Character
    or [county|E].\n\nCharacters of different Cultures will have lower [opinions|E]
    of each other. This penalty can be reduced by increasing [cultural_acceptance|E].
culture_festival:
  source: game_concepts_l_english.yml
  text: Culture Festival
culture_festivals:
  source: game_concepts_l_english.yml
  text: Culture Festivals
culture_head:
  source: game_concepts_l_english.yml
  text: Culture Head
culture_head_desc:
  source: game_concepts_l_english.yml
  text: A '$game_concept_culture_head$' is the [ruler|E] who has the most influence
    over their own [culture|E].\n\nSpecifically, the ruler with largest total number
    of same-culture [counties|E] within their [realm|E] will become the $game_concept_cultural_head$,
    regardless of where their [domain|E] is or what other-culture Counties they may
    possess.[AddLocalizationIf( HasDlcFeature( 'khans_of_the_steppe' ), 'game_concept_culture_head_desc_NOMAD_DLC',
    )]\n\nThe $game_concept_cultural_head$ can influence which [innovation|E] should
    be prioritized for discovery by setting the [cultural_fascination|E].\n\n[SelectLocalization(
    HasDlcFeature( 'reform_culture' ), 'game_concept_culture_head_desc_REFORM_DLC',
    'game_concept_culture_head_desc_NO_REFORM_DLC' )]
culture_intermingling:
  source: game_concepts_l_english.yml
  text: Culture Intermingling
culture_intermingling_desc:
  source: game_concepts_l_english.yml
  text: The more of two [cultures|E] that coexist in the same [realm|E], the more
    intermingling will happen and the Cultures will increase their [cultural_acceptance|E].
culture_pillar:
  source: game_concepts_l_english.yml
  text: Cultural Pillar
culture_pillar_desc:
  source: game_concepts_l_english.yml
  text: '[SelectLocalization( HasDlcFeature( ''reform_culture'' ), ''game_concept_culture_pillar_desc_REFORM_DLC'',
    ''game_concept_culture_pillar_desc_NO_REFORM_DLC'' )]'
culture_pillars:
  source: game_concepts_l_english.yml
  text: Cultural Pillars
culture_tradition:
  source: game_concepts_l_english.yml
  text: Cultural Tradition
culture_tradition_desc:
  source: game_concepts_l_english.yml
  text: Traditions represent the practices, habits, values, and ethics of individual
    [cultures|E].\n\nEach Tradition grants some type of bonus or special ability to
    [characters|E] or [counties|E] of that Culture.\n\n[SelectLocalization( HasDlcFeature(
    'reform_culture' ), 'game_concept_culture_tradition_desc_REFORM_DLC', 'game_concept_culture_tradition_desc_NO_REFORM_DLC'
    )]\n\n$game_concept_cultures$ can have up to 6 Traditions, but most have fewer.
culture_traditions:
  source: game_concepts_l_english.yml
  text: Cultural Traditions
cultures:
  source: game_concepts_l_english.yml
  text: Cultures
damage:
  source: game_concepts_l_english.yml
  text: Damage
damage_desc:
  source: game_concepts_l_english.yml
  text: A [soldier|E]'s Damage determines how many [casualties|E] they can inflict
    upon the enemy during a [battle|E].\n\nA [levy|E] Soldier does [GetDefine('NCombat',
    'LEVY_ATTACK')|0] Damage.
de_jure:
  source: game_concepts_l_english.yml
  text: De Jure
de_jure_capital:
  source: game_concepts_l_english.yml
  text: De Jure Capital
de_jure_capital_desc:
  source: game_concepts_l_english.yml
  text: The $game_concept_de_jure_capital$ of a [title|E] is the [county|E] that was
    its historical capital. You can always choose to move your [realm_capital|E] to
    your [primary_title|E]'s $game_concept_de_jure_capital$, even if it has already
    been moved.
de_jure_desc:
  source: game_concepts_l_english.yml
  text: Most [titles|E] of are considered part of a higher-Tier Title $game_concept_de_jure$
    ('by law').\n\nFor example, a [ruler|E] may be [king|E] of England, but their
    [realm|E] does not yet contain all the lands that are legally considered to be
    part of England.\n\nThe [holder|E] of a [duchy|E], [kingdom|E], or [empire|E]
    always has a [casus_belli|E] to seize control of its $game_concept_de_jure$ constituent
    titles.\n\n[vassals|E] will also decide who their [rightful_liege|E] is based
    on what Title their [primary_title|E] is De Jure a part of.
de_jure_drift:
  source: game_concepts_l_english.yml
  text: De Jure Drift
de_jure_drift_desc:
  source: game_concepts_l_english.yml
  text: $game_concept_de_jure_drift_desc_part_1$\n\n$game_concept_de_jure_drift_desc_part_2$
de_jure_drift_desc_part_1:
  source: game_concepts_l_english.yml
  text: 'A slow process by which a [title|E]''s [de_jure|E] [liege|E] can change.
    It occurs naturally when a [duchy|E] or [kingdom|E] is completely controlled by
    a [ruler|E] who does not hold the territory''s de jure liege title.\n\nThis process
    can be sped up by assigning your [chancellor|E] to the appropriate [councillor_task|E]
    #weak ($task_integrate_title$)#!. Duchies can only $game_concept_de_jure_drift$
    into Kingdoms, and Kingdoms can only Drift into [empires|E].\n\nLetting titles
    De Jure Drift into your [primary_title|E] is a good way to get rid of the [rightful_liege|E]
    penalty.'
de_jure_drift_desc_part_2:
  source: game_concepts_l_english.yml
  text: '#weak Example: The Duchy of $d_northumberland$ is de jure part of $k_england$,
    but the territory of the duchy is entirely within $k_scotland$. Since the King
    of $k_scotland$ does not also hold $k_england$, the duchy will start to $game_concept_de_jure_drift$
    toward becoming a part of $k_scotland$.#!'
de_jure_drift_drift:
  source: game_concepts_l_english.yml
  text: Drift
de_jure_drift_drifted:
  source: game_concepts_l_english.yml
  text: Drifted
de_jure_partition:
  source: game_concepts_l_english.yml
  text: De Jure Partition
de_jure_partition_desc:
  source: game_concepts_l_english.yml
  text: '[realms|E] that have been $game_concept_de_jure_partitioned$ have been split
    into two same-[title_tier|E] [titles|E], but can still be reunited easily.\n\nEither
    $game_concept_title$ can [de_jure_drift_drift|E] [completely_controlled|E] [duchies|E]
    from the other $game_concept_title$ into its [de_jure|E] instantly via [decision|E].\n\nIf
    either $game_concept_title$ is ever destroyed or loses the last of its $game_concept_de_jure$
    [counties|E], then the remaining $game_concept_title$ absorbs all of its $game_concept_de_jure$.'
de_jure_partitioned:
  source: game_concepts_l_english.yml
  text: De Jure Partitioned
dead_soldiers:
  source: game_concepts_l_english.yml
  text: Fatal Casualties
dead_soldiers_desc:
  source: game_concepts_l_english.yml
  text: During [battle|E], many (but usually not most) [soldiers|E] are killed or
    too badly wounded to ever fight again. These are permanent [casualties|E] as opposed
    to merely [routed_soldiers|E].
deceitful_progress_hostile_schemes_decision:
  source: game_concepts_l_english.yml
  text: $deceitful_progress_hostile_schemes_decision$ Decision
deceitful_progress_hostile_schemes_decision_desc:
  source: game_concepts_l_english.yml
  text: A [decision|E] allowing you to improve your [hostile_schemes|E]. Grants [success_chance|E]
    and [scheme_speed|E] in exchange for [stress|E].
decide:
  source: game_concepts_l_english.yml
  text: Decide
decision:
  source: game_concepts_l_english.yml
  text: Decision
decision_desc:
  source: game_concepts_l_english.yml
  text: A $game_concept_decision$ is a special action that a [character|E] can take
    at their leisure.\n\nEach decision has its own set effects, which can range from
    minor Character changes to [empire|e]-shaking impacts.\n\nDecisions that move
    a Character to a specific location for a period of time are called [activities|E].
decisions:
  source: game_concepts_l_english.yml
  text: Decisions
defeat:
  source: game_concepts_l_english.yml
  text: Defeat
defeat_desc:
  source: game_concepts_l_english.yml
  text: $game_concept_defeat$ is one of three possible [peace_offers|E]. The exact
    outcome of Defeat in a [war|E] depends on the [casus_belli|E], but defeated Defenders
    typically lose [titles|E] within the [war_target|E] region, whereas defeated Attackers
    instead lose things like [gold|E], [prestige|E] and [piety|E].
demand_conversion:
  source: game_concepts_l_english.yml
  text: Demand Conversion
demand_conversion_desc:
  source: game_concepts_l_english.yml
  text: '[rulers|E] who have a subject of another [faith|E] may Demand Conversion
    to change their subject''s Faith to their own. The Ruler''s [learning|E] skill
    and the subject''s [opinion|E] of their liege are major factors in determining
    if the subject accepts the demand, or [Concept(''refuse_conversion_crime'',''refuses'')|E]
    it.'
demand_payment:
  source: game_concepts_l_english.yml
  text: Demand Payment
demand_payment_decision:
  source: game_concepts_l_english.yml
  text: Demand Payment Interaction
demand_payment_desc:
  source: game_concepts_l_english.yml
  text: A Diplomatic Interaction that allows a character to demand payment of [gold|E]
    in exchange for any [hooks|E] they have.
demanding_conversion:
  source: game_concepts_l_english.yml
  text: Demanding Conversion
denounce:
  source: game_concepts_l_english.yml
  text: Denounce
denounce_desc:
  source: game_concepts_l_english.yml
  text: A [dynast|E] may denounce a member of their [dynasty|E] for a cost of [dynasty_prestige|E].\n\nAny
    member of the same dynasty (including the Dynasty Head themselves) will gain an
    [imprisonment_reason|E] against the denounced member.
denouncement:
  source: game_concepts_l_english.yml
  text: Denouncement
depose:
  source: game_concepts_l_english.yml
  text: Depose
depose_desc:
  source: game_concepts_l_english.yml
  text: '[rulers|E] can be Deposed as a result of [faction|E] demands or special events.
    Their [heirs|E] will inherit their [titles|E] even though the old ruler is still
    alive.'
deposed:
  source: game_concepts_l_english.yml
  text: Deposed
designated_heir:
  source: game_concepts_l_english.yml
  text: Designated Heir
designated_heir_desc:
  source: game_concepts_l_english.yml
  text: The $game_concept_designated_heir$ takes priority when deciding who becomes
    the [realm_heir|E].
detail_zoom:
  source: game_concepts_l_english.yml
  text: $ZOOM_LEVEL_DETAILS$
detail_zoom_desc:
  source: game_concepts_l_english.yml
  text: $ZOOM_LEVEL_DETAILS_TOOLTIP$
develop_county:
  source: game_concepts_l_english.yml
  text: $task_develop_county$
develop_county_desc:
  source: game_concepts_l_english.yml
  text: A [councillor_task|E] performed by the [steward|E]. It targets a [county|E],
    where it speeds up [development_growth|E] and reduces the construction time for
    [buildings|E].
development:
  source: game_concepts_l_english.yml
  text: Development
development_growth:
  source: game_concepts_l_english.yml
  text: Development Growth
development_i:
  source: game_concepts_l_english.yml
  text: '@development_icon!'
diarch:
  source: game_concepts_l_english.yml
  text: Diarch
diarch_affected_actions:
  source: game_concepts_l_english.yml
  text: Mundane Actions
diarch_affected_actions_desc:
  source: game_concepts_l_english.yml
  text: 'When the [scales_of_power|E] favor the [diarch|E] during [power_sharing|E],
    some [interactions|E] the [liege|E] takes may begin to cost [prestige|E].\n\nThe
    affected actions are:\n$EFFECT_LIST_BULLET$ [revoking|E] a [title|E]\n$EFFECT_LIST_BULLET$
    [retracting|E] a [vassal|E]\n$EFFECT_LIST_BULLET$ [imprisoning|E] [characters|E]\n$EFFECT_LIST_BULLET$
    [executing|E] $game_concept_characters$ #weak (unless the $game_concept_liege$''s
    [faith|E] practices some form of human sacrifice)#!'
diarch_aptitude:
  source: game_concepts_l_english.yml
  text: Diarch Aptitude
diarch_aptitude_desc:
  source: game_concepts_l_english.yml
  text: $game_concept_diarch_aptitude$ governs how well a [diarch|E] achieves each
    [mandate|E] set by their [liege|E].\n\nBoth [skills|E] and [personality_traits|E]
    play a role. For instance, a [GetTrait('greedy').GetName(GetNullCharacter)] $game_concept_diarch$
    tasked with the '$fill_coffers_mandate$' Mandate may not send as much [gold|E]
    to their Liege.\n\n#WEAK [diarchs|E] are well-suited to a $game_concept_mandate$
    when they have around 40+ $game_concept_aptitude$ for it.#!
diarch_desc:
  source: game_concepts_l_english.yml
  text: The junior partner during [diarchy|E], a $game_concept_diarch$ helps their
    [liege|E] run the [realm|E].\n\nThe $game_concept_diarch$ has access to [diarch_powers|E],
    and gain more of these as the [scales_of_power|E] tip in their favor.
diarch_loyal:
  source: game_concepts_l_english.yml
  text: Loyal
diarch_loyalty:
  source: game_concepts_l_english.yml
  text: Loyalty
diarch_loyalty_desc:
  source: game_concepts_l_english.yml
  text: A [diarch|E]'s $game_concept_diarch_loyalty$ decides how likely it is they
    will abuse their powers, at their [liege|E]'s or the [realm|E]'s expense.\n\n$DIARCHY_WINDOW_VISIBLY_LOYAL$
    $game_concept_diarchs$ refrain from using [diarch_powers|E], try to fulfil the
    [mandate|E] set for them dutifully, and give up their power willingly when asked.\n\n$DIARCHY_WINDOW_VISIBLY_DISLOYAL$
    $game_concept_diarchs$ use $game_concept_diarch_powers$ liberally, try to fulfil
    their $game_concept_mandate$ in order to swing the [scales_of_power|E] in their
    direction, and may refuse to give up power if the $game_concept_scales_of_power_scales$
    are swung heavily enough towards them.\n\n$DIARCHY_WINDOW_UNKNOWN_LOYALTY$ $game_concept_diarchs$
    might use $game_concept_diarch_powers$, will generally either split $game_concept_mandate$
    benefits with their $game_concept_liege$ or ignore their $game_concept_mandate$
    entirely, and might need bribing to give up their office if the $game_concept_scales_of_power$
    suit them.
diarch_loyalty_explicit:
  source: game_concepts_l_english.yml
  text: Diarch Loyalty
diarch_possessive:
  source: game_concepts_l_english.yml
  text: Diarch's
diarch_power:
  source: game_concepts_l_english.yml
  text: Borrowed Power
diarch_power_desc:
  source: game_concepts_l_english.yml
  text: A [diarch|E] in an active [power_sharing|E] has access to special $game_concept_diarch_powers$.\n\nThese
    are special [character_interaction|E]s that mimic those their [liege|E] have,
    or are other abuses of power. Examples include [revoking|E] [titles|E] from fellow
    [vassals|E], or siphoning away [gold|E] from their Liege.\n\nMany $game_concept_diarch_powers$
    give the Liege an opportunity to [veto|E] them.
diarch_power_possessive:
  source: game_concepts_l_english.yml
  text: Borrowed Power's
diarch_power_power:
  source: game_concepts_l_english.yml
  text: Power
diarch_power_power_possessive:
  source: game_concepts_l_english.yml
  text: Power's
diarch_power_powers:
  source: game_concepts_l_english.yml
  text: Powers
diarch_power_powers_possessive:
  source: game_concepts_l_english.yml
  text: Powers'
diarch_powers:
  source: game_concepts_l_english.yml
  text: Borrowed Powers
diarch_powers_possessive:
  source: game_concepts_l_english.yml
  text: Borrowed Powers'
diarch_succession:
  source: game_concepts_l_english.yml
  text: Succession
diarch_succession_desc:
  source: game_concepts_l_english.yml
  text: $game_concept_diarch_succession_explicit$ governs which of a [liege|E]'s direct
    [vassals|E] or [courtiers|E] is automatically made [diarch|E] when one is needed.\n\nThis
    happens either because a $game_concept_liege$ begins [diarchy|E] or because the
    current $game_concept_diarch$ dies or is removed from office.\n\n#weak Different
    types of $game_concept_power_sharing$ may calculate succession order differently
    — in a [regency|E], landless [characters|E] with strong personal connections to
    their $game_concept_liege$ tend to dominate.\n\nSpeaking the $game_concept_liege$'s
    [language|E] (and [court_language|E], if they have one) is almost always crucial.#!
diarch_succession_explicit:
  source: game_concepts_l_english.yml
  text: Diarch Succession
diarchies:
  source: game_concepts_l_english.yml
  text: Power Sharing
diarchs:
  source: game_concepts_l_english.yml
  text: Diarchs
diarchs_possessive:
  source: game_concepts_l_english.yml
  text: Diarchs'
diarchy:
  source: game_concepts_l_english.yml
  text: Power Sharing
diarchy_desc:
  source: game_concepts_l_english.yml
  text: Power Sharing occurs when a [ruler|E] shares some authority with one of their
    [vassals|E] or [courtiers|E], who becomes their [diarch|E].\n\nThe Ruler who shares
    their power may set [mandates|E] for their $game_concept_diarch$, while the $game_concept_diarch$
    may use special [diarch_powers|E].\n\nThe [scales_of_power|E] measure whether
    the Ruler or the $game_concept_diarch$ has the most authority.
diligent_development_focus_decision:
  source: game_concepts_l_english.yml
  text: $diligent_development_focus_decision$ Decision
diligent_development_focus_decision_desc:
  source: game_concepts_l_english.yml
  text: A [decision|E] allowing you to improve your [capital|E]. Grants [development|E]
    in exchange for [stress|E].
diplomacy:
  source: game_concepts_l_english.yml
  text: Diplomacy
diplomacy_i:
  source: game_concepts_l_english.yml
  text: '@skill_diplomacy_icon!'
diplomacy_lifestyle:
  source: game_concepts_l_english.yml
  text: Diplomacy Lifestyle
diplomacy_lifestyle_desc:
  source: game_concepts_l_english.yml
  text: The $game_concept_diplomacy_lifestyle$ is suitable for Characters who want
    to gain [claims|E] and [casus_bellis|E], increase their [prestige|E], or gain
    boons from Family and Friends.
diplomacy_skill:
  source: game_concepts_l_english.yml
  text: Diplomacy Skill
diplomacy_skill_desc:
  source: game_concepts_l_english.yml
  text: $game_concept_diplomacy$ is a [skill|E] representing a Character's ability
    to charm, negotiate and persuade.\n\nDiplomacy directly affects the [opinions|E]
    other characters have of you. It is also used to further Diplomatic [schemes|E].\n\nThe
    corresponding [lifestyle|E] is the [diplomacy_lifestyle|E].
diplomatic_range:
  source: game_concepts_l_english.yml
  text: Diplomatic Range
diplomatic_range_desc:
  source: game_concepts_l_english.yml
  text: You can only interact with characters who are within Diplomatic Range. However,
    neighboring [realms|E] are always in range.
direct_vassal:
  source: game_concepts_l_english.yml
  text: Direct Vassal
direct_vassal_desc:
  source: game_concepts_l_english.yml
  text: 'Your $game_concept_direct_vassals$ are the [vassals|E] that serve under you
    personally. Vassals-of-vassals are #emphasis not#! included.'
direct_vassals:
  source: game_concepts_l_english.yml
  text: Direct Vassals
directed_great_holy_war:
  source: game_concepts_l_english.yml
  text: Directed Great Holy War
directed_great_holy_war_desc:
  source: game_concepts_l_english.yml
  text: A $game_concept_directed_great_holy_war$ is declared by a $doctrine_temporal_head_name$
    [head_of_faith|E] with the intention of bringing a [kingdom|E] under their own
    rule.\n\n[rulers|E] of their [faith|E] might choose to assist the Head of Faith,
    and may get rewards from doing so. Rewards include [piety|E] and potentially having
    their [dynasty|E] become [landed|E] within the conquered Kingdom.\n\nRulers of
    the targeted [religion|E] may choose to defend against this war without the need
    for an [alliance|E].
directed_great_holy_wars:
  source: game_concepts_l_english.yml
  text: Directed Great Holy Wars
discontent:
  source: game_concepts_l_english.yml
  text: Discontent
diseases:
  source: game_concepts_l_english.yml
  text: Diseases
disinherit:
  source: game_concepts_l_english.yml
  text: Disinherit
disinherit_desc:
  source: game_concepts_l_english.yml
  text: A [dynast|E] may disinherit a member of their [dynasty|E] at the cost of [dynasty_prestige|E].\n\nThis
    will remove the dynasty member from any regular [line_of_succession|E] of any
    titles that are currently held by other dynasty members.
disinherited:
  source: game_concepts_l_english.yml
  text: Disinherited
disinheriting:
  source: game_concepts_l_english.yml
  text: Disinheriting
disinherits:
  source: game_concepts_l_english.yml
  text: Disinherits
dismiss_strong_hook_interaction:
  source: game_concepts_l_english.yml
  text: $dismiss_strong_hook_interaction$ Interaction
dismiss_strong_hook_interaction_desc:
  source: game_concepts_l_english.yml
  text: An [interaction|E] allowing you to dismiss a [hook|E] targeting you in exchange
    for [prestige|E].
disparate_tribes:
  source: game_concepts_l_english.yml
  text: Disparate Tribes
disparate_tribes_tribal_authority:
  source: game_concepts_l_english.yml
  text: Disparate Tribes Tribal Authority
disparate_tribes_tribal_authority_desc:
  source: game_concepts_l_english.yml
  text: $game_concept_disparate_tribes$ is the lowest level of [tribal_authority|E].
    At this level, [vassals|E] have no [opinion|E] penalty towards their [liege|E],
    and the liege lacks any power over them other than the ability to demand [levies|E]
    and [taxes|E].
disrupt_schemes:
  source: game_concepts_l_english.yml
  text: $task_disrupt_schemes$
disrupt_schemes_desc:
  source: game_concepts_l_english.yml
  text: $game_concept_disrupt_schemes$ is a [councillor_task|E] performed by the [spymaster|E].\n\nIt
    increases a [ruler|E]'s [scheme_discovery_chance|E] and slows down the hostile
    $game_concept_spymaster$ actions of other $game_concept_ruler$s, such as [espionage|E].
diverge:
  source: game_concepts_l_english.yml
  text: Diverge
divergent_culture:
  source: game_concepts_l_english.yml
  text: Divergent Culture
divergent_culture_desc:
  source: game_concepts_l_english.yml
  text: '[SelectLocalization( HasDlcFeature( ''diverge_culture'' ), ''game_concept_divergent_culture_desc_DLC'',
    ''game_concept_divergent_culture_desc_NO_DLC'' )]'
divergent_cultures:
  source: game_concepts_l_english.yml
  text: Divergent Cultures
diverges:
  source: game_concepts_l_english.yml
  text: Diverges
divorce:
  source: game_concepts_l_english.yml
  text: Divorce
divorce_desc:
  source: game_concepts_l_english.yml
  text: '[married|E] [spouses|E] can arrange a $game_concept_divorce$, although the
    rules, requirements and consequences depend on the [doctrines|E] of their [faiths|E].\n\n[concubines|E]
    can simply be set aside at will.'
divorced:
  source: game_concepts_l_english.yml
  text: Divorced
divorces:
  source: game_concepts_l_english.yml
  text: Divorces
divorcing:
  source: game_concepts_l_english.yml
  text: Divorcing
doctrine:
  source: game_concepts_l_english.yml
  text: Doctrine
doctrines:
  source: game_concepts_l_english.yml
  text: Doctrines
doctrines_desc:
  source: game_concepts_l_english.yml
  text: Doctrines could be considered religious laws that determine what is acceptable
    behavior within a [faith|E].
domain:
  source: game_concepts_l_english.yml
  text: Domain
domain_desc:
  source: game_concepts_l_english.yml
  text: A [ruler|E]'s $game_concept_domain$ is the collection of all [holdings|E]
    that they personally own.\n\nThe fairly static [domain_limit|E] means that Rulers
    have to rely on [vassals|E] to increase the size of their [realm|E] beyond a certain
    point.
domain_income:
  source: game_concepts_l_english.yml
  text: Domain Income
domain_income_desc:
  source: game_concepts_l_english.yml
  text: Your $game_concept_domain_income$ consists of the [taxes|E] that you collect
    from your own [domain|E]. The amount collected depends on the local [control|E]
    and [development|E] levels.
domain_limit:
  source: game_concepts_l_english.yml
  text: Domain Limit
domain_limit_desc:
  source: game_concepts_l_english.yml
  text: The $game_concept_domain_limit$ determines how many [holdings|E] you can legally
    have in your [domain|E]. The $game_concept_domain_limit$ is affected by many things,
    such as your [stewardship_skill|E], [succession_law|E] and the tier of your [primary_title|E].\n\nAlthough
    you can go above your $game_concept_domain_limit$, doing so will lower your [income|E]
    and [vassal|E] [opinions|E].
domain_size:
  source: game_concepts_l_english.yml
  text: Domain Size
domain_size_desc:
  source: game_concepts_l_english.yml
  text: A character's $game_concept_domain_size$ reflects how many [barony|E] and
    [county|E] [titles|E] they personally hold.
domain_taxes:
  source: game_concepts_l_english.yml
  text: Domain Taxes
domains:
  source: game_concepts_l_english.yml
  text: Domains
domestic_affairs:
  source: game_concepts_l_english.yml
  text: $task_domestic_affairs$
domestic_affairs_desc:
  source: game_concepts_l_english.yml
  text: A [councillor_task|E] performed by the [chancellor|E], which increases the
    opinion [vassals|E] in the [realm|E] have towards the [liege|E].
draw_up_new_charts:
  source: game_concepts_l_english.yml
  text: $draw_up_new_charts_decision$
draw_up_new_charts_decision:
  source: game_concepts_l_english.yml
  text: $draw_up_new_charts_decision$ Decision
draw_up_new_charts_desc:
  source: game_concepts_l_english.yml
  text: A [decision|E] that lets a character trade [gold|E] for an [artifact|E], by
    commissioning a travel itinerary describing places they have visited.\nThe itinerary
    [artifact|E] will give different effects depending on where you have been and
    what choices you make.
dread:
  source: game_concepts_l_english.yml
  text: Dread
dread_desc:
  source: game_concepts_l_english.yml
  text: '$game_concept_dread$ is a measure of how feared a [ruler|E] is.\n\nRulers
    increase $game_concept_dread$ by performing cruel and heinous acts such as torturing
    and executing [prisoners|E].\n\nDread makes it viable to play as a [tyrant|E],
    because unruly [vassals|E] can become [intimidated|E] or [cowed|E], making them
    too scared to oppose you.\n\nA character''s Dread can range from 0 to 100, except
    for [nomads|E], who can achieve 150. Over time, their Dread will tend towards
    their Natural Dread, which is defined by their [personality_traits|E].\n\n#high
    A Dreadful [ruler] reaps the following benefits:#!\n$BULLET_WITH_TAB$[vassals]
    are discouraged from joining [factions|E]\n$BULLET_WITH_TAB$[vassals] are discouraged
    from [scheming|E]\n$BULLET_WITH_TAB$Increases [vassal] acceptance #weak (E.g.
    Title Revocation)#!\n$BULLET_WITH_TAB$Increases [offer_vassalization|E] acceptance\n$BULLET_WITH_TAB$Makes
    [electors|E] more likely to vote as you do\n$BULLET_WITH_TAB$Makes vassals unlikely
    to oppose [law|E] changes\n\n#weak Note that brave and bold [vassals] are less
    affected by Dread!#!'
dreaded:
  source: game_concepts_l_english.yml
  text: Dreaded
dreadful:
  source: game_concepts_l_english.yml
  text: Dreadful
ducal_conquest:
  source: game_concepts_l_english.yml
  text: Ducal Conquest
ducal_conquest_casus_belli:
  source: game_concepts_l_english.yml
  text: Ducal Conquest Casus Belli
ducal_conquest_casus_belli_desc:
  source: game_concepts_l_english.yml
  text: A [casus_belli|E] that allows the seizure of [counties|E] required to create
    an [uncreated_title|E] of [duchy|E] rank.
dynast:
  source: game_concepts_l_english.yml
  text: Dynasty Head
dynast_interaction:
  source: game_concepts_l_english.yml
  text: Dynasty Head Interaction
dynast_interaction_desc:
  source: game_concepts_l_english.yml
  text: Interactions that are uniquely available to the [dynast|E] of a [dynasty|E],
    against other members of that dynasty.\n\nThey cost [dynasty_prestige|E] to use.
dynast_interactions:
  source: game_concepts_l_english.yml
  text: Dynasty Head Interactions
dynastic:
  source: game_concepts_l_english.yml
  text: Dynastic
dynasties:
  source: game_concepts_l_english.yml
  text: Dynasties
dynasty:
  source: game_concepts_l_english.yml
  text: Dynasty
dynasty_desc:
  source: game_concepts_l_english.yml
  text: A $game_concept_dynasty$ is a group of [noble|E] descendants of a [landed|E]
    ancestor; the founder of the Dynasty. The original [house|E] can split into new
    ones ([cadet_branches|E]), all still members of the wider Dynasty.\n\nWhen your
    Character dies, you must have a [player_heir|E], or the game will end (though
    you can pick another ruler and continue playing in the same world).\n\nMuch like
    [prestige|E] for characters, dynasties have [dynasty_prestige|E].
dynasty_members:
  source: game_concepts_l_english.yml
  text: Dynasty Members
dynasty_perk:
  source: game_concepts_l_english.yml
  text: Dynasty Legacy
dynasty_perk_desc:
  source: game_concepts_l_english.yml
  text: $game_concept_dynasty_perks$ are unlockable boons that provide powerful effects
    to all members of a [dynasty|E].\n\nThe [dynast|E] unlocks $game_concept_dynasty_perks$
    by spending [dynasty_prestige|E], with each Legacy in the same track being progressively
    more expensive and powerful.\n\n$game_concept_dynasty_perks$ are slow to get,
    but stay with the Dynasty forever.
dynasty_perks:
  source: game_concepts_l_english.yml
  text: Dynasty Legacies
dynasty_prestige:
  source: game_concepts_l_english.yml
  text: Renown
dynasty_prestige_desc:
  source: game_concepts_l_english.yml
  text: $game_concept_dynasty_prestige$ is much like [prestige|E], but shared by an
    entire [dynasty|E].\n\nA Dynasty gains $game_concept_dynasty_prestige$ for the
    following:\n$BULLET_WITH_TAB$ The number of currently living members\n$BULLET_WITH_TAB$
    The number of [rulers|E]\n$BULLET_WITH_TAB$ The number of [spouses|E] to other
    Rulers\nNote that a Ruler will not generate $game_concept_dynasty_prestige$ should
    they have any [liege|E] of the same Dynasty.\n\nAs with Prestige, $game_concept_dynasty_prestige$
    also counts towards increasing your [dynasty_prestige_level|E].\n\n$game_concept_dynasty_prestige$
    can be spent by the [dynast|E] in order to unlock [dynasty_perks|E] and influence
    the members of the Dynasty in various ways.\n\n#weak A Dynasty spread far and
    wide between several different [realms|E] will generate more $game_concept_dynasty_prestige$
    than a Dynasty concentrated within a single Realm.#!
dynasty_prestige_i:
  source: game_concepts_l_english.yml
  text: '@dynasty_prestige_icon!'
dynasty_prestige_level:
  source: game_concepts_l_english.yml
  text: Level of Splendor
dynasty_prestige_level_0:
  source: game_concepts_l_english.yml
  text: Base Origins
dynasty_prestige_level_0_desc:
  source: game_concepts_l_english.yml
  text: '#T $game_concept_dynasty_prestige_level_0$#!\n[GetDynastyPrestigeLevelEffect(''(int32)0'')][GetDynastyPrestigeLevelNext(''(int32)0'')]'
dynasty_prestige_level_1:
  source: game_concepts_l_english.yml
  text: Obscure
dynasty_prestige_level_10:
  source: game_concepts_l_english.yml
  text: Legendary
dynasty_prestige_level_10_desc:
  source: game_concepts_l_english.yml
  text: '#T $game_concept_dynasty_prestige_level_10$#!\n[GetDynastyPrestigeLevelEffect(''(int32)10'')]\n\nThis
    is the highest Level of Splendor.'
dynasty_prestige_level_1_desc:
  source: game_concepts_l_english.yml
  text: '#T $game_concept_dynasty_prestige_level_1$#!\n[GetDynastyPrestigeLevelEffect(''(int32)1'')][GetDynastyPrestigeLevelNext(''(int32)1'')]'
dynasty_prestige_level_2:
  source: game_concepts_l_english.yml
  text: Insignificant
dynasty_prestige_level_2_desc:
  source: game_concepts_l_english.yml
  text: '#T $game_concept_dynasty_prestige_level_2$#!\n[GetDynastyPrestigeLevelEffect(''(int32)2'')][GetDynastyPrestigeLevelNext(''(int32)2'')]'
dynasty_prestige_level_3:
  source: game_concepts_l_english.yml
  text: Noteworthy
dynasty_prestige_level_3_desc:
  source: game_concepts_l_english.yml
  text: '#T $game_concept_dynasty_prestige_level_3$#!\n[GetDynastyPrestigeLevelEffect(''(int32)3'')][GetDynastyPrestigeLevelNext(''(int32)3'')]'
dynasty_prestige_level_4:
  source: game_concepts_l_english.yml
  text: Reputable
dynasty_prestige_level_4_desc:
  source: game_concepts_l_english.yml
  text: '#T $game_concept_dynasty_prestige_level_4$#!\n[GetDynastyPrestigeLevelEffect(''(int32)4'')][GetDynastyPrestigeLevelNext(''(int32)4'')]'
dynasty_prestige_level_5:
  source: game_concepts_l_english.yml
  text: Well-known
dynasty_prestige_level_5_desc:
  source: game_concepts_l_english.yml
  text: '#T $game_concept_dynasty_prestige_level_5$#!\n[GetDynastyPrestigeLevelEffect(''(int32)5'')][GetDynastyPrestigeLevelNext(''(int32)5'')]'
dynasty_prestige_level_6:
  source: game_concepts_l_english.yml
  text: Significant
dynasty_prestige_level_6_desc:
  source: game_concepts_l_english.yml
  text: '#T $game_concept_dynasty_prestige_level_6$#!\n[GetDynastyPrestigeLevelEffect(''(int32)6'')][GetDynastyPrestigeLevelNext(''(int32)6'')]'
dynasty_prestige_level_7:
  source: game_concepts_l_english.yml
  text: Famous
dynasty_prestige_level_7_desc:
  source: game_concepts_l_english.yml
  text: '#T $game_concept_dynasty_prestige_level_7$#!\n[GetDynastyPrestigeLevelEffect(''(int32)7'')][GetDynastyPrestigeLevelNext(''(int32)7'')]'
dynasty_prestige_level_8:
  source: game_concepts_l_english.yml
  text: Glorious
dynasty_prestige_level_8_desc:
  source: game_concepts_l_english.yml
  text: '#T $game_concept_dynasty_prestige_level_8$#!\n[GetDynastyPrestigeLevelEffect(''(int32)8'')][GetDynastyPrestigeLevelNext(''(int32)8'')]'
dynasty_prestige_level_9:
  source: game_concepts_l_english.yml
  text: Fabled
dynasty_prestige_level_9_desc:
  source: game_concepts_l_english.yml
  text: '#T $game_concept_dynasty_prestige_level_9$#!\n[GetDynastyPrestigeLevelEffect(''(int32)9'')][GetDynastyPrestigeLevelNext(''(int32)9'')]'
dynasty_prestige_level_desc:
  source: game_concepts_l_english.yml
  text: $game_concept_dynasty_prestige_level$ is a measure of how famous a [dynasty|E]
    is. Level progress is made whenever your Dynasty gains [dynasty_prestige|E]. Characters
    get an amount of initial [prestige|E] when they are born depending on their $game_concept_dynasty_prestige_level$.
    Similarly, [spouses|E] gain some Prestige from each other's Dynasty when they
    [marry|E].\n\nThe levels are:\n$EFFECT_LIST_BULLET$[dynasty_prestige_level_0|E]\n$EFFECT_LIST_BULLET$[dynasty_prestige_level_1|E]\n$EFFECT_LIST_BULLET$[dynasty_prestige_level_2|E]\n$EFFECT_LIST_BULLET$[dynasty_prestige_level_3|E]\n$EFFECT_LIST_BULLET$[dynasty_prestige_level_4|E]\n$EFFECT_LIST_BULLET$[dynasty_prestige_level_5|E]\n$EFFECT_LIST_BULLET$[dynasty_prestige_level_6|E]\n$EFFECT_LIST_BULLET$[dynasty_prestige_level_7|E]\n$EFFECT_LIST_BULLET$[dynasty_prestige_level_8|E]\n$EFFECT_LIST_BULLET$[dynasty_prestige_level_9|E]\n$EFFECT_LIST_BULLET$[dynasty_prestige_level_10|E]
economical_archetype:
  source: game_concepts_l_english.yml
  text: Economical Archetype
economical_archetype_desc:
  source: game_concepts_l_english.yml
  text: A [rulerpossessive|E] Economical Archetype affects how they decide to spend
    their [gold_i][gold|E]. It is in large part based on their [traits|E].\n\n#low
    The Economical Archetypes are:#!\n$EFFECT_LIST_BULLET$[ai_warlike_personality|E]\n$EFFECT_LIST_BULLET$[ai_cautious_personality|E]\n$EFFECT_LIST_BULLET$[ai_economical_boom_personality|E]\n$EFFECT_LIST_BULLET$[ai_economical_unpredictable_personality|E]\n$EFFECT_LIST_BULLET$[ai_conqueror_personality|E]
educate:
  source: game_concepts_l_english.yml
  text: Educate
educated:
  source: game_concepts_l_english.yml
  text: Educated
education:
  source: game_concepts_l_english.yml
  text: Education
education_focus:
  source: game_concepts_l_english.yml
  text: Education Focus
education_focus_desc:
  source: game_concepts_l_english.yml
  text: 'All [children|E] between age #V 6#! and #V 9#! can be given an $game_concept_education_focus$
    geared towards one of the five [skills|E].\n\nThe Education ends with an [education_trait|E]
    upon reaching [adulthood|E].\n\nThe quality of the $game_concept_education_trait$
    they receive will depend on how well their [childhood_trait|E] matched their Education
    Focus as well as the relevant Skill of their [guardian|E].\n\nWhen setting the
    Education Focus, you can also specify whether or not the child should be raised
    in the [guardian|E]''s [faith|E] and/or [culture|E].'
education_focus_short:
  source: game_concepts_l_english.yml
  text: Focus
education_trait:
  source: game_concepts_l_english.yml
  text: Education Trait
education_trait_desc:
  source: game_concepts_l_english.yml
  text: Upon reaching [adulthood|E], every character receives an $game_concept_education_trait$.\n\nThere
    are five types of Education Traits, each of which directly corresponds a specific
    [skill|E].\n\nThe quality of the [trait|E] a character receives will depend how
    well their [childhood_trait|E] matched the [education_focus|E] as well as the
    relevant Skill of their [guardian|E].\n\nA characters $game_concept_education_trait$
    improves how fast they will progress in the corresponding [lifestyle|E].
education_traits:
  source: game_concepts_l_english.yml
  text: Education Traits
educations:
  source: game_concepts_l_english.yml
  text: Educations
elector:
  source: game_concepts_l_english.yml
  text: Elector
elector_desc:
  source: game_concepts_l_english.yml
  text: Electors are the characters who get to vote on their preferred [title_heir|E]
    under Elective [succession_laws|E]. The specific Law determines who is considered
    an Elector.
electors:
  source: game_concepts_l_english.yml
  text: Electors
elephant_cavalry:
  source: game_concepts_l_english.yml
  text: Elephant Cavalry
elephant_cavalry_desc:
  source: game_concepts_l_english.yml
  text: $game_concept_elephant_cavalry$ are mounted, often armored [men_at_arms|E].\n\nWhile
    each kind of $game_concept_elephant_cavalry$ is unique, they are generally a strong
    [counter|E] to infantry units, and are in turn Countered by [spearmen|E].\n\n$game_concept_elephant_cavalry$
    are also often strong in Jungle [terrain|E].
eligible_child:
  source: game_concepts_l_english.yml
  text: Eligible Child
eligible_child_desc:
  source: game_concepts_l_english.yml
  text: $game_concept_eligible_children$ are, by law, allowed to inherit their parent's
    [titles|E].\n\n[bastards|E] are not considered eligible, as well as children of
    certain genders under specific [gender_laws|E].
eligible_children:
  source: game_concepts_l_english.yml
  text: Eligible Children
embark:
  source: game_concepts_l_english.yml
  text: Embark
embarkation:
  source: game_concepts_l_english.yml
  text: Embarkation
embarked:
  source: game_concepts_l_english.yml
  text: Embarked
embarked_i:
  source: game_concepts_l_english.yml
  text: '@embarked_icon!'
embarking:
  source: game_concepts_l_english.yml
  text: Embarking
embarking_desc:
  source: game_concepts_l_english.yml
  text: 'An [army|E] will automatically $game_concept_embark$ onto a [fleet|E] when
    given a move order into a Sea Zone, or when there is no land path to the targeted
    [barony|E].\n\n$game_concept_embarking$ costs a sum of [gold|E], symbolizing the
    procurement and construction of ships. For every #V 100#! men Embarking, a cost
    of #V [GetDefine(''NFleet'', ''EMBARK_GOLD_COST_PER_HUNDRED'')|0]#! [gold_i] is
    paid.'
embrace_celibacy:
  source: game_concepts_l_english.yml
  text: Embrace Celibacy
embrace_celibacy_decision:
  source: game_concepts_l_english.yml
  text: Embrace Celibacy Decision
embrace_celibacy_desc:
  source: game_concepts_l_english.yml
  text: A [decision|E] that allows a character to gain the [GetTrait('celibate').GetName(
    GetNullCharacter )] [trait|E] at will.
end_date:
  source: game_concepts_l_english.yml
  text: End Date
end_date_desc:
  source: game_concepts_l_english.yml
  text: 1453 AD is the End Date, and upon reaching it the game will end.
entourage:
  source: game_concepts_l_english.yml
  text: Entourage
entourage_desc:
  source: game_concepts_l_english.yml
  text: It's dangerous to go alone, so you should bring along some companions in your
    Entourage. Everyone who [travels|E] with you is part of your Entourage and share
    in the challenges you may face on your journey.\n\nYour [GetCourtPositionType('travel_leader_court_position').GetName()]
    is the leader of the Entourage and manages your travel plans.\n\nSome [characters|E]
    are added to your Entourage by default when planning to travel. [travel_options|E]
    and [activity_options|E] offer additional ways to add characters.
entrenched_regencies:
  source: game_concepts_l_english.yml
  text: Entrenched Regencies
entrenched_regency:
  source: game_concepts_l_english.yml
  text: Entrenched Regency
entrenched_regency_desc:
  source: game_concepts_l_english.yml
  text: If a [regency|E] lasts too long, it may become Entrenched, and the [regent|E]
    becomes even more powerful compared to their [liege|E].\n\nThe benefits the [regent|E]
    gets from the [scales_of_power|E] become much more powerful.\n\nTo end an $game_concept_entrenched_regency$,
    the Regent must accept a gift from their Liege, or the Liege must tip the Scales
    in their favor.
entrenched_regency_entrench:
  source: game_concepts_l_english.yml
  text: Entrench
entrenched_regency_entrenched:
  source: game_concepts_l_english.yml
  text: Entrenched
entrenched_regency_regency:
  source: game_concepts_l_english.yml
  text: Regency
entrenched_regent:
  source: game_concepts_l_english.yml
  text: Entrenched Regent
entrenched_regents:
  source: game_concepts_l_english.yml
  text: Entrenched Regents
epithet:
  source: game_concepts_l_english.yml
  text: Epithet
epithets:
  source: game_concepts_l_english.yml
  text: Epithets
era:
  source: game_concepts_l_english.yml
  text: Era
era_desc:
  source: game_concepts_l_english.yml
  text: '[innovations|E] can only be discovered if the [culture|E] has reached the
    requisite Era. The next Era can only start past a certain year, and if at least
    #V 50%#! of the Innovations of the previous Era have been discovered.\n\nRulers
    with [tribal_government|E] and [nomadic_government|E] can only make use of Tribal
    Era Innovations.'
eras:
  source: game_concepts_l_english.yml
  text: Eras
espionage:
  source: game_concepts_l_english.yml
  text: $task_find_secrets$
espionage_desc:
  source: game_concepts_l_english.yml
  text: $game_concept_espionage$ is a [councillor_task|E] performed by the [spymaster|E].\n\nIt
    targets a [ruler|E]'s [court|E], and tries to uncover [secrets|E] about the characters
    there.
ethos:
  source: game_concepts_l_english.yml
  text: Ethos
ethos_desc:
  source: game_concepts_l_english.yml
  text: The Ethos of a [culture|E] defines its core values, guiding principles, and
    general attitude of its members towards life in general.\n\nIn addition, the Ethos
    greatly affects the cost for a [culture_head|E] establishing new [traditions|E].[SelectLocalization(
    HasDlcFeature( 'reform_culture' ), 'game_concept_ethos_desc_REFORM_DLC', '' )]
exceptional_epic:
  source: game_concepts_l_english.yml
  text: Exceptional Epic
exceptional_epic_desc:
  source: game_concepts_l_english.yml
  text: A Family Epic written through the $commission_epic_decision$ Decision has
    a chance of being an Exceptional Epic, which confers greater bonuses than a normal
    epic.\n\nThe chance of the Epic being Exceptional can be affected by event choices.
excommunicate:
  source: game_concepts_l_english.yml
  text: Excommunicate
excommunicated:
  source: game_concepts_l_english.yml
  text: Excommunicated
excommunicated_ruler:
  source: game_concepts_l_english.yml
  text: Excommunicated Ruler
excommunicated_ruler_desc:
  source: game_concepts_l_english.yml
  text: In an Excommunication War, the attackers are fighting to remove an [excommunicated|E]
    ruler from power.\n\nIf victorious, the attackers will gain a large amount of
    [piety|E] and the approval of their [head_of_faith|E], while the Excommunicated
    ruler is forced to abdicate to their [heir|E].\n\nHowever, if the Excommunicated
    ruler wins, their [head_of_faith|E] is forced to revoke their Excommunication,
    as they have proven their righteousness on the battlefield.
excommunication:
  source: game_concepts_l_english.yml
  text: Excommunication
excommunication_desc:
  source: game_concepts_l_english.yml
  text: Characters who are [GetTrait('excommunicated').GetName( GetNullCharacter )]
    by their [head_of_faith|E] are seen as [criminals|E] by other characters of their
    [faith|E].\n\n[independent|E] [rulers|E] who have been [GetTrait('excommunicated').GetName(
    GetNullCharacter )] may have an [excommunication_war|E] declared on them.\n\nExcommunication
    can be removed either by asking the [head_of_faith|E] for forgiveness or by switching
    to a different [faith|E].
excommunication_war:
  source: game_concepts_l_english.yml
  text: Excommunication War
execute:
  source: game_concepts_l_english.yml
  text: Execute
execute_desc:
  source: game_concepts_l_english.yml
  text: '[imprisoned|E] Characters can be $game_concept_executed$. This is considered
    [tyrannical|E] unless their imprisoner has an [execute_reason|E].\n\nExecutions
    increase your [dread|E] and are never well received by the [close_family|E] of
    the unfortunate target.'
execute_reason:
  source: game_concepts_l_english.yml
  text: Execution Reason
execute_reason_desc:
  source: game_concepts_l_english.yml
  text: A $game_concept_execute_reason$ gives a [liege|E] the opportunity to freely
    [execute|E] a subject they have in their [dungeon|E]. They are most often gained
    from the subject being a [criminal|E].
execute_reasons:
  source: game_concepts_l_english.yml
  text: Execution Reasons
executed:
  source: game_concepts_l_english.yml
  text: Executed
executing:
  source: game_concepts_l_english.yml
  text: Executing
execution:
  source: game_concepts_l_english.yml
  text: Execution
executions:
  source: game_concepts_l_english.yml
  text: Executions
existing_development:
  source: game_concepts_l_english.yml
  text: Existing Development
existing_development_desc:
  source: game_concepts_l_english.yml
  text: The [develop_county|E] steward task suffers from diminishing returns. The
    more [development|E] a [county] already has, the more [development_growth|E] is
    penalized.\n\nBy default, [counties] reach the maximum [existing_development]
    penalty at 10 [development|E]. Each [era|E] has an [innovation|E] which significantly
    increases this limit, going all the way up to 90 [development|E] in the $culture_era_late_medieval$
    [era].\n\nInnovations that affect the $game_concept_existing_development$ modifier:\n$EFFECT_LIST_BULLET$
    $innovation_development_01$\n$EFFECT_LIST_BULLET$ $innovation_development_02$\n$EFFECT_LIST_BULLET$
    $innovation_development_03$\n$EFFECT_LIST_BULLET$ $innovation_development_04$
experience:
  source: game_concepts_l_english.yml
  text: Experience
extended_family:
  source: game_concepts_l_english.yml
  text: Extended Family
extended_family_desc:
  source: game_concepts_l_english.yml
  text: The Extended Family of a character includes:\n$BULLET_WITH_TAB$Cousins\n$BULLET_WITH_TAB$Uncles\n$BULLET_WITH_TAB$Aunts\n$BULLET_WITH_TAB$Nephews\n$BULLET_WITH_TAB$Nieces
extended_family_members:
  source: game_concepts_l_english.yml
  text: Extended Family Members
extort_subjects:
  source: game_concepts_l_english.yml
  text: Extort Subjects
extort_subjects_decision:
  source: game_concepts_l_english.yml
  text: Extort Subjects Decision
extort_subjects_decision_desc:
  source: game_concepts_l_english.yml
  text: A [decision|E] offering different opportunities to demand extra [gold|E] from
    subjects, at a different cost...
extramarital_sex:
  source: game_concepts_l_english.yml
  text: Extramarital Sex
extramarital_sex_desc:
  source: game_concepts_l_english.yml
  text: If they are discovered, two characters engaged in extramarital sex will suffer
    consequences depending on their [faithpossessive|E] [doctrines|E].\n\n$EFFECT_LIST_BULLET$Each
    character will become known as either a [GetTrait('fornicator').GetName( GetNullCharacter
    )] or an [GetTrait('adulterer').GetName( GetNullCharacter )], depending on their
    own marital status\n$EFFECT_LIST_BULLET$If a man and a woman sleep together, it
    may result in a [bastard|E] pregnancy\n$EFFECT_LIST_BULLET$If the characters are
    of the same gender, consequences are determined by their [faithpossessive|E] $doctrine_homosexuality_name$
    [doctrine|E]\n$EFFECT_LIST_BULLET$Any sexually transmitted [diseases|E] held by
    one character may infect the other
extramarital_sex_sleeping_with:
  source: game_concepts_l_english.yml
  text: sleeping with
fabricate_claim:
  source: game_concepts_l_english.yml
  text: $task_fabricate_claim$
fabricate_claim_desc:
  source: game_concepts_l_english.yml
  text: A [councillor_task|E] performed by the [court_chaplain|E].\nTargets a [county|E],
    and builds progress over time. At 100% Progress, a [claim|E] can be fabricated
    for a cost of [gold|E].
fabricate_claim_short:
  source: game_concepts_l_english.yml
  text: Fabricate Claim
fabricated_claims_short:
  source: game_concepts_l_english.yml
  text: Fabricated Claims
fabricating_claims:
  source: game_concepts_l_english.yml
  text: Fabricating Claims
faction:
  source: game_concepts_l_english.yml
  text: Faction
faction_desc:
  source: game_concepts_l_english.yml
  text: A $game_concept_faction$ is a group of [vassals|E] with common political interests.
    The local population of [counties|E] can also join certain types of Factions,
    such as the Peasant Faction.\n\nFactions become dangerous once their [faction_discontent|E]
    reaches a certain point, at which time they will issue an ultimatum.\n\nIf the
    [liege|E] does not comply, the Faction will rise up in revolt, sparking a [civil_war|E].
faction_discontent:
  source: game_concepts_l_english.yml
  text: Discontent
faction_discontent_desc:
  source: game_concepts_l_english.yml
  text: $game_concept_faction_discontent$ is a measure of how close a [faction|E]
    is to issuing an ultimatum.\n\nIf a Faction's [military_power|E] is at the threshold,
    Discontent will increase every month. If Military Power is below the threshold,
    Discontent will decrease. Very powerful Factions will have their Discontent rise
    quickly.
faction_independence:
  source: game_concepts_l_english.yml
  text: Independence
faction_liberty:
  source: game_concepts_l_english.yml
  text: Liberty
faction_military_power:
  source: game_concepts_l_english.yml
  text: Faction Military Power
faction_military_power_desc:
  source: game_concepts_l_english.yml
  text: $game_concept_faction_military_power$ is a measure of the total military strength
    of a [faction|E] relative to their target.\n\nEach individual faction member adds
    their full strength to the Faction as long as they remain in the Faction. If the
    faction target is the [liege|E] of a member, the strength of the member is also
    subtracted from the relative power of the liege.
factions:
  source: game_concepts_l_english.yml
  text: Factions
faith:
  source: game_concepts_l_english.yml
  text: Faith
faith_astray:
  source: game_concepts_l_english.yml
  text: Astray
faith_astray_desc:
  source: game_concepts_l_english.yml
  text: This [faith|E] differs in a way that is not particularly significant.\nIntermarriage
    may still happen.\n\n#S Effects:\n#![GetHostilityDescription( '(int32)1' )]
faith_desc:
  source: game_concepts_l_english.yml
  text: A Faith is a specific denomination of a larger [religion|E]. All characters
    and [counties|E] have a Faith just as they have a [culture|E].\n\nEach Faith is
    defined by a set of [doctrines|E] with far-reaching consequences for its adherents.\n\nEach
    Faith also has a [fervor|E] value which controls how vulnerable it is to [heresy|E]
    ([rulers|E] and Counties converting to other Faiths within the same Religion).
faith_evil:
  source: game_concepts_l_english.yml
  text: Evil
faith_evil_desc:
  source: game_concepts_l_english.yml
  text: This [faith|E] is considered anathema.\nIntermarriage rarely happens, [holy_wars|E]
    can be waged.\n\n#S Effects:\n#![GetHostilityDescription( '(int32)3' )]
faith_hostile:
  source: game_concepts_l_english.yml
  text: Hostile
faith_hostile_desc:
  source: game_concepts_l_english.yml
  text: This [faith|E] deviates significantly.\nIntermarriage may still happen, [holy_wars|E]
    can be waged.\n\n#S Effects:\n#![GetHostilityDescription( '(int32)2' )]
faith_hostility:
  source: game_concepts_l_english.yml
  text: Faith Hostility
faith_hostility_desc:
  source: game_concepts_l_english.yml
  text: 'All [faiths|E] have a relation towards each other $game_concept_faith$ that
    is determined by how closely related they are.\n\nCloseness is decided by several
    factors, such as if they share [religion|E], [religious_family|E], or if the Faith
    has special [doctrines|E].\n\nIf two Faiths are far apart, they are often able
    to [holy_war|E] each other.\n\nThe following relations exist: [faith_righteous|L],
    [faith_astray|L], [faith_hostile|L], and [faith_evil|L].'
faith_righteous:
  source: game_concepts_l_english.yml
  text: Righteous
faith_righteous_desc:
  source: game_concepts_l_english.yml
  text: This [faith|E] is considered legitimate.\nIntermarriage is common.\n\n#S Effects:\n#![GetHostilityDescription(
    '(int32)0' )]
faithpossessive:
  source: game_concepts_l_english.yml
  text: Faith's
faiths:
  source: game_concepts_l_english.yml
  text: Faiths
fame_trait:
  source: game_concepts_l_english.yml
  text: Fame Trait
fame_trait_desc:
  source: game_concepts_l_english.yml
  text: A $game_concept_fame_trait$ is a special [trait|E] gained from specific circumstances
    and affects others' [opinion|E] of them. One can gain these traits as the results
    of accomplishing a positive deed, or when one's dark [secrets|E] are exposed.
    Others are the result of one's circumstances at birth.
family:
  source: game_concepts_l_english.yml
  text: Family
family_desc:
  source: game_concepts_l_english.yml
  text: A character's family consists of their [close_family_members|E] and [extended_family_members|E].
family_member:
  source: game_concepts_l_english.yml
  text: Family Member
family_members:
  source: game_concepts_l_english.yml
  text: Family Members
fascination:
  source: game_concepts_l_english.yml
  text: Fascination
favor:
  source: game_concepts_l_english.yml
  text: Favor
favor_desc:
  source: game_concepts_l_english.yml
  text: Characters can owe each other $game_concept_favors$, which is considered a
    type of [hook|E].\n\nFavors can be gained in many ways, but often through various
    scripted events. Every child born to a [noble|E] [house|E] also owes the [house_head|E]
    an initial Favor.
favors:
  source: game_concepts_l_english.yml
  text: Favors
feast:
  source: game_concepts_l_english.yml
  text: $activity_feast$
feast_desc:
  source: game_concepts_l_english.yml
  text: An [activity|E] where rulers and courtiers in a realm gather to celebrate...
    one thing or another.\n\nParticipants will lose [stress|E] and increase their
    [opinion|E] of the host. There may also be any number of other consequences from
    bringing that many people together.\n\nA [ruler|E] will invite their [liege|E]
    and their [vassals|E] (along with various [courtiers|E]) to a $activity_feast$.
fertility:
  source: game_concepts_l_english.yml
  text: Fertility
fertility_desc:
  source: game_concepts_l_english.yml
  text: $game_concept_fertility$ measures how able a Character is to produce children.
fervor:
  source: game_concepts_l_english.yml
  text: Fervor
fervor_desc:
  source: game_concepts_l_english.yml
  text: 'The $game_concept_fervor$ of a [faith|E] ranges from #V 0#! to #V 100%#!.
    Low $game_concept_fervor$ makes it easier for [rulers|E] to create new faiths
    of their own and increases the likelihood of [counties|E] and characters converting
    to other faiths, including [heresies|E]. High $game_concept_fervor$ increases
    County conversion speed.\n\n$game_concept_fervor$ changes naturally with time.
    Smaller Faiths tend to have higher Fervor. Larger Faiths tend to have low $game_concept_fervor$.\n\nWaging
    Great Holy Wars and successful Holy Wars will decrease $game_concept_fervor$.
    Being the target will increase $game_concept_fervor$. Outbreaks of [heresy|E]
    will increase $game_concept_fervor$ significantly.'
feudal:
  source: game_concepts_l_english.yml
  text: Feudal
feudal_desc:
  source: game_concepts_l_english.yml
  text: Under the Feudal [government_form|E], a [liege|E] gives their [vassals|E]
    [land|E] to govern in exchange for [levies|E] and [taxes|E], regulated by individual
    [vassal_contract|E] between Vassal and Liege.
feudal_government:
  source: game_concepts_l_english.yml
  text: Feudal Government
feudalism:
  source: game_concepts_l_english.yml
  text: Feudalism
fleet:
  source: game_concepts_l_english.yml
  text: Fleet
fleet_desc:
  source: game_concepts_l_english.yml
  text: '[armies|E] who move into a Sea Zone will automatically [embark|E] onto a
    $game_concept_fleet$. [embarking] costs a sum of [gold|E], symbolizing the procurement
    and construction of ships.\n\nWhile on a $game_concept_fleet$, [armies] will be
    able to traverse water at a rapid pace, though they will cost #V 25%#! more maintenance
    and will start losing [supplies|E] after #V [GetDefine(''NFleet'', ''ATTRITION_AFTER_DAYS'')|0]#!
    days at sea.\n\n$game_concept_fleets$ do not engage each other in [battles|E].\n\nWhen
    an $game_concept_army$ disembarks, the $game_concept_fleet$ will disappear and
    the $game_concept_army$ will become [recently_disembarked|E].'
fleets:
  source: game_concepts_l_english.yml
  text: Fleets
flowery_war:
  source: game_concepts_l_english.yml
  text: Raid for Captives
flowery_war_desc:
  source: game_concepts_l_english.yml
  text: This is a special type of [war|E], started by a [ruler|E] whose [faith|E]
    practices human sacrifice. The primary goal of $game_concept_flowery_warring$
    is to do battle and capture [prisoners|E] for sacrifice, with either side able
    to get enough [war_score|E] through combat to win without ever having to [siege|E].\n\nAt
    the end of the $game_concept_war$, if the victor (including the defender) follows
    a $game_concept_faith$ practicing human sacrifice, then they will take several
    $game_concept_prisoners$ from the [court|E] of the loser. If both main combatants
    in a $game_concept_flowery_war$ follow the same faith, then the war is considered
    sacred, meaning that the loser still receives (reduced) [piety|E] even in defeat.\n\nYou
    cannot conduct or continue a $game_concept_flowery_war$ if you have any $game_concept_prisoners$
    obtained through winning a $game_concept_flowery_war$ in your [dungeon|E].
flowery_warring:
  source: game_concepts_l_english.yml
  text: Raiding for Captives
flowery_wars:
  source: game_concepts_l_english.yml
  text: Raids for Captives
focus:
  source: game_concepts_l_english.yml
  text: Focus
focus_desc:
  source: game_concepts_l_english.yml
  text: 'Each [lifestyle|E] contains a number $game_concept_focuses$, one of which
    must be chosen upon selecting the $game_concept_lifestyle$.\n\n$game_concept_focuses$
    provide passive bonuses and influence the types of events that appear. #weak (E.g.,
    having the $intrigue_temptation_focus$ will boost [fertility|E] and increase the
    chances of Seduction-themed events appearing.)#!\n\nCharacters can switch between
    $game_concept_focuses$ within the same $game_concept_lifestyle$ without losing
    the ability to gain experience in that $game_concept_lifestyle$.'
focuses:
  source: game_concepts_l_english.yml
  text: Focuses
force_duel_anyone_interaction:
  source: game_concepts_l_english.yml
  text: $force_duel_anyone_interaction$ Interaction
force_duel_anyone_interaction_desc:
  source: game_concepts_l_english.yml
  text: An [interaction|E] allowing you to [single_combat_duel|E] anyone when you
    are [stressed|E].
force_duel_criminals_interaction:
  source: game_concepts_l_english.yml
  text: $force_duel_criminals_interaction$ Interaction
force_duel_criminals_interaction_desc:
  source: game_concepts_l_english.yml
  text: An [interaction|E] allowing you to [single_combat_duel|E] criminals when you
    are [stressed|E].
foreign_affairs:
  source: game_concepts_l_english.yml
  text: $task_foreign_affairs$
foreign_affairs_desc:
  source: game_concepts_l_english.yml
  text: A [councillor_task|E] performed by the [chancellor|E].\nFor an [independent|E]
    [ruler|E], it increases the opinion other independent rulers have of them. For
    a vassal, it increases the opinion that other vassals of the same [liege|E] have
    of them.
fort_level:
  source: game_concepts_l_english.yml
  text: Fort Level
fort_level_desc:
  source: game_concepts_l_english.yml
  text: Some [holdings|E] are fortified and need to be [besieged|E] and [occupied|E]
    in order to gain control of the [county|E].\n\nThe $game_concept_fort_level$ of
    such [fortified_holdings|E] determines how long the Siege can be expected to last.\n\nA
    high $game_concept_fort_level$ will require [siege_weapons|E] in order to be $game_concept_besieged$
    efficiently, although each Siege Weapon is only effective up to a certain Fort
    Level.
fort_level_i:
  source: game_concepts_l_english.yml
  text: '@fort_icon!'
fortified_holding:
  source: game_concepts_l_english.yml
  text: Fortified Holding
fortified_holding_desc:
  source: game_concepts_l_english.yml
  text: A $game_concept_fortified_holding$ is a [holding|E] with [buildings|E] that
    increase its [fort_level|E]. [county_capitals|E] are always Fortified.\n\nIn order
    to fully [occupy|E] a [county|E], all its Fortified Holdings must be Occupied.
fortified_holdings:
  source: game_concepts_l_english.yml
  text: Fortified Holdings
friend:
  source: game_concepts_l_english.yml
  text: Friend
friend_desc:
  source: game_concepts_l_english.yml
  text: A $game_concept_friend$ is a $game_concept_relation$ indicating close friendship
    and support, and can be had by both [children|E] and [adults|E].\n\n$game_concept_friends$
    with a deep connection might become [best_friends|E].
friend_possessive:
  source: game_concepts_l_english.yml
  text: Friend's
friends:
  source: game_concepts_l_english.yml
  text: Friends
friends_possessive:
  source: game_concepts_l_english.yml
  text: Friends'
friendship:
  source: game_concepts_l_english.yml
  text: Friendship
game_over:
  source: game_concepts_l_english.yml
  text: Game Over
game_over_desc:
  source: game_concepts_l_english.yml
  text: The game ends when your current lineage dies out.\n\nHowever, even if the
    game is over for your lineage, you can still choose to play as another [ruler|E]
    anywhere in the world.\n\nThe game can end in two ways:\n$BULLET_WITH_TAB$You
    die without [player_heir|E]\n$BULLET_WITH_TAB$You reach the year 1453
garrison:
  source: game_concepts_l_english.yml
  text: Garrison
garrison_desc:
  source: game_concepts_l_english.yml
  text: The $game_concept_garrison$ of a [fortified_holding|E] protects it from being
    [besieged|E] by smaller [armies|E].\n\nThe besieging Army needs to have more [soldiers|E]
    than the Garrison in order for the Siege to progress.\n\nWhen a [siege|E] is lost,
    the $game_concept_garrison$ is set to [GetDefine('NDomain', 'HOLDING_MIN_GARRISON_COUNT')|0].
    From there, the $game_concept_garrison$ refills every month depending on the [garrison_reinforcement|E]
    until it reaches its max capacity.\n\nWhen a [siege|E] begins, the manning of
    the $game_concept_garrison$ affects the required amount of [siege_progress|E].
garrison_reinforcement:
  source: game_concepts_l_english.yml
  text: Garrison Reinforcement Rate
garrison_reinforcement_desc:
  source: game_concepts_l_english.yml
  text: The $game_concept_garrison_reinforcement$ of a [fortified_holding|E] defines
    how fast the [garrison|E] recovers after losing a [siege|E].\n\nEvery month, the
    [garrison|E] will regain a percentage of its maximal capacity equal to the current
    rate. It can be increased by upgrading the [holding|E].\n\nDuring a [siege|E]
    however, the reinforcement is frozen and the rate set to 0.
gender_doctrines:
  source: game_concepts_l_english.yml
  text: Gender Doctrines
gender_doctrines_desc:
  source: game_concepts_l_english.yml
  text: These [doctrines|E] determine which [gender_laws|E] are available to characters
    of the [faith|E].\n\nIt also determines certain additional rules, such as what
    [claims|E] can be inherited, who can be [commanders|E] and [knights|E], and to
    which of their parents' [house|E] a [bastard|E] will belong.\n\nThe Gender Doctrines
    are:\n$BULLET_WITH_TAB$Male Dominated\n$BULLET_WITH_TAB$Equal\n$BULLET_WITH_TAB$Female
    Dominated
gender_law:
  source: game_concepts_l_english.yml
  text: Gender Law
gender_law_desc:
  source: game_concepts_l_english.yml
  text: Every [ruler|E] has a main Gender Law that determines who their [titles|E]
    can pass to on [succession|E]. Gender Laws also affect who can command [armies|E]
    and the eligibility of having multiple [spouses|E] or [concubines|E].\n\nAvailable
    Gender Laws depend on the 'View on Gender' [doctrine|E] of the [faith|E].
gender_laws:
  source: game_concepts_l_english.yml
  text: Gender Laws
gift:
  source: game_concepts_l_english.yml
  text: Gift
gift_desc:
  source: game_concepts_l_english.yml
  text: Sending a Gift to another character will increase their [opinion|E] of you
    in exchange for [gold|E][gold_i].\n\nThe greedier the recipient, the more Gold
    you will have to send, and the more Opinion you will get.\n\nThe higher your [diplomacy|E],
    the more Opinion you will get.
gifts:
  source: game_concepts_l_english.yml
  text: Gifts
glory:
  source: game_concepts_l_english.yml
  text: Glory
glory_desc:
  source: game_concepts_l_english.yml
  text: An [accolade|E]'s Glory increases its [accolade_rank|E].\n\nGlory is gained
    by the [acclaimed_knight|E] winning [battles|E], defeating warriors, competing
    in [GetActivityType( 'activity_tournament' ).GetName] [contests|E], and attending
    [activities|E].\n\nHowever, the Accolade's Glory is lowered when the Acclaimed
    Knight is involved in losing battles, on [accolade_succession|e], and when the
    Accolade becomes an [inactive_accolade|E].
gold:
  source: game_concepts_l_english.yml
  text: Gold
gold_desc:
  source: game_concepts_l_english.yml
  text: '''Gold'' really represents all liquid assets of a Character; their wealth.
    It can be spent on many things, most notably constructing [buildings|E], paying
    for [regiments|E], and creating [titles|E].'
gold_i:
  source: game_concepts_l_english.yml
  text: '@gold_icon!'
government:
  source: game_concepts_l_english.yml
  text: Government
government_desc:
  source: game_concepts_l_english.yml
  text: 'A [ruler|E]''s $game_concept_government_form$ determines what kind of [laws|E]
    they have access to, as well as what [obligations|E] they have to their [liege|E]
    if they are not [independent|E].\n\nThe Government forms are: [feudal|E], [tribal|E],
    [clan|E], [theocracy|E], [republic|E], [administrative|E], [GetGovernment( ''nomad_government''
    ).GetName] and [herder|E].'
government_form:
  source: game_concepts_l_english.yml
  text: Government Form
government_forms:
  source: game_concepts_l_english.yml
  text: Government Forms
governments:
  source: game_concepts_l_english.yml
  text: Governments
grand_activities:
  source: game_concepts_l_english.yml
  text: Grand Activities
grand_activity:
  source: game_concepts_l_english.yml
  text: Grand Activity
grand_activity_desc:
  source: game_concepts_l_english.yml
  text: 'Splendid displays of wealth and magnificence, $game_concept_grand_activities$
    are by nature larger and #EMP grander#! than regular [activities|E]. They may
    have multiple [activity_phases|E] and offer more chances for customization in
    planning.\n\nTours provide the opportunity to visit multiple [vassals|E] in your
    [realm|E] while Tournaments offer a variety of [contests|E] to host.'
grand_tour:
  source: game_concepts_l_english.yml
  text: Grand Tour
grand_tours:
  source: game_concepts_l_english.yml
  text: Grand Tours
grand_wedding_promise:
  source: game_concepts_l_english.yml
  text: Grand Wedding Promise
grand_wedding_promise_desc:
  source: game_concepts_l_english.yml
  text: A [betrothal|E] with the promise attached that a [GetActivityType('activity_wedding').GetName]
    will be celebrated for the union of the two characters involved.\n\nThe Grand
    Wedding Promise will expire after 3 years. Not organizing a [GetActivityType('activity_wedding').GetName]
    in time or breaking the Betrothal will bear punishing consequences.
grand_wedding_promised:
  source: game_concepts_l_english.yml
  text: Promised
grand_wedding_promises:
  source: game_concepts_l_english.yml
  text: Grand Wedding Promises
great_holy_war:
  source: game_concepts_l_english.yml
  text: Great Holy War
great_holy_war_desc:
  source: game_concepts_l_english.yml
  text: A $game_concept_great_holy_war$ is a special type of [war|E] that only the
    [head_of_faith|E] of certain [faiths|E] can declare, with the goal of bringing
    an entire [kingdom|E] under the rule of their Faith.\n\n$game_concept_great_holy_wars$
    target all [rulers|E] of another [religion|E] within a chosen [kingdom|E], forcing
    them to defend together. If victorious, all [titles|E] within the targeted Kingdom
    will be seized and divided between the attackers.\n\nDepending on its [doctrines|E],
    a Faith might have access to [directed_great_holy_wars|E], [undirected_great_holy_wars|E]
    or no $game_concept_great_holy_wars$ at all:\n$EFFECT_LIST_BULLET$The [GetFaithDoctrine('tenet_armed_pilgrimages').GetBaseName],
    [GetFaithDoctrine('tenet_struggle_submission').GetBaseName], or [GetFaithDoctrine('tenet_warmonger').GetBaseName]
    [core_tenets|E] are required to access to Great Holy Wars in general\n$EFFECT_LIST_BULLET$Faiths
    with a [GetFaithDoctrine('doctrine_temporal_head').GetBaseName] Head only have
    access to Directed Great Holy Wars\n$EFFECT_LIST_BULLET$Faiths with a [GetFaithDoctrine('doctrine_spiritual_head').GetBaseName]
    Head only have access to Undirected Great Holy Wars\n$EFFECT_LIST_BULLET$Faiths
    without a Head of Faith cannot declare any Great Holy Wars, even if they would
    normally be eligible\n\nSome Faiths have special names for their Great Holy Wars
    such as 'Crusade' or 'Jihad'. These Great Holy Wars differ in name only, and function
    as any other Great Holy War.
great_holy_war_directed:
  source: game_concepts_l_english.yml
  text: Directed
great_holy_war_undirected:
  source: game_concepts_l_english.yml
  text: Undirected
great_holy_wars:
  source: game_concepts_l_english.yml
  text: Great Holy Wars
guardian:
  source: game_concepts_l_english.yml
  text: Guardian
guardian_desc:
  source: game_concepts_l_english.yml
  text: A $game_concept_guardian$ is a [character|E] assigned to [educate|E] a [child|E]
    (called their [ward|E]).\n\n$game_concept_guardians$ tend to pass on their [personality_traits|E]
    to their $game_concept_wards$, as well as their [culture|E] and/or [faith|E],
    if so specified in the $game_concept_education_focus$.\n\nThe $game_concept_guardian$
    can reside in a different [court|E]. Entrusting a [close_family_member|E] to the
    mercy of another [ruler|E] in this way will increase their [opinion|E] of you.
guardian_possessive:
  source: game_concepts_l_english.yml
  text: Guardian's
guardians:
  source: game_concepts_l_english.yml
  text: Guardians
guardians_possessive:
  source: game_concepts_l_english.yml
  text: Guardians'
guardianship:
  source: game_concepts_l_english.yml
  text: Guardianship
guest:
  source: game_concepts_l_english.yml
  text: Guest
guests:
  source: game_concepts_l_english.yml
  text: Guests
hajj:
  source: game_concepts_l_english.yml
  text: Hajj
hajj_desc:
  source: game_concepts_l_english.yml
  text: Characters of most Islamic [faiths|E] can choose to undertake an [activity|E]
    to go on a $game_concept_hajj$ to Mecca as part of their $game_concept_pilgrimage$
    [doctrine|E] once a year.\n\nSuch a journey may be filled with both opportunity
    and peril, but upon reaching the holy city characters will earn [piety|E] and
    may receive other rewards.
hajjes:
  source: game_concepts_l_english.yml
  text: Hajjes
head_of_faith:
  source: game_concepts_l_english.yml
  text: Head of Faith
head_of_faith_desc:
  source: game_concepts_l_english.yml
  text: 'A $game_concept_head_of_faith$ is the formal leader of a [faith|E]. The powers
    and nature of the $game_concept_head_of_faith$ depends on the [doctrines|E] of
    the Faith.\n\nSome Faiths have a [spiritual_head_of_faith|E] #weak (e.g. the Pope)#!,
    some a [temporal_head_of_faith|E] #weak (e.g. a Caliph)#!, and some do not have
    a $game_concept_head_of_faith$ at all.'
head_of_faith_spiritual:
  source: game_concepts_l_english.yml
  text: Spiritual
head_of_faith_temporal:
  source: game_concepts_l_english.yml
  text: Temporal
heads_of_faith:
  source: game_concepts_l_english.yml
  text: Heads of Faith
health:
  source: game_concepts_l_english.yml
  text: Health
health_desc:
  source: game_concepts_l_english.yml
  text: $game_concept_health$ measures how likely a Character is to die by [illnesses|E]
    and old age.\n\nOld characters have a chance to lose health every year, increasing
    the older they are.
health_trait:
  source: game_concepts_l_english.yml
  text: Health Trait
health_trait_desc:
  source: game_concepts_l_english.yml
  text: A $game_concept_health_trait$ is a [trait|E] that directly affects one's physical
    and mental [health|E], such as [diseases|E]. Temporary traits that affect one's
    bodily capabilities, such as pregnancies and wounds also falls under this category.
heavy_cavalry:
  source: game_concepts_l_english.yml
  text: Heavy Cavalry
heavy_cavalry_desc:
  source: game_concepts_l_english.yml
  text: Heavy Cavalry are mounted, heavily armored [men_at_arms|E]\n\nWhile each kind
    of Heavy Cavalry is unique, they generally [counter|E] [archers|E], and are in
    turn Countered by [spearmen|E].\n\nHeavy Cavalry are also often strong on flat
    [terrain|E].\n\nIn comparison with [light_cavalry|E], they are usually stronger
    at raw [damage|E] and [toughness|E].
heavy_infantry:
  source: game_concepts_l_english.yml
  text: Heavy Infantry
heavy_infantry_desc:
  source: game_concepts_l_english.yml
  text: Heavy Infantry are [men_at_arms|E] who fight on foot, with heavier armor and
    weapons.\n\nWhile each kind of Heavy Infantry is unique, they generally [counter|E]
    [spearmen|E], and are in turn Countered by [skirmishers|E].
heir:
  source: game_concepts_l_english.yml
  text: Heir
heir_desc:
  source: game_concepts_l_english.yml
  text: An Heir is a Character that stands to inherit one or more [titles|E].\n\nEvery
    held [title|E] has an $game_concept_heir$, determined by the [succession_laws|E]
    of its current [holder|E]. When the current Holder of the Title dies, or otherwise
    triggers a [succession|E], the Title's current $game_concept_heir$ will inherit
    it.\n\nNote that Titles held by the same [ruler|E] can have different $game_concept_heirs$.
    Most notably, the [primary_title|E] is inherited by the [primary_heir|E] and players
    will keep playing as their [player_heir|E].
heirs:
  source: game_concepts_l_english.yml
  text: Heirs
heresies:
  source: game_concepts_l_english.yml
  text: Heresies
heresy:
  source: game_concepts_l_english.yml
  text: Heresy
heresy_desc:
  source: game_concepts_l_english.yml
  text: When the [fervor|E] of a [faith|E] is low, an outbreak of Heresy might occur.
    When that happens, a [ruler|E] of the low-Fervor Faith will convert to another
    Faith, becoming a [GetTrait('heresiarch').GetName( GetNullCharacter )]. They will
    then spread their new Faith to their [counties|E] and [vassals|E].\n\nIf an outbreak
    is minor, it will stop there. If it is a major outbreak, more rulers in the same
    area will convert. If you're in that area, you also get the choice to convert,
    should you so desire.
heritage:
  source: game_concepts_l_english.yml
  text: Heritage
heritage_desc:
  source: game_concepts_l_english.yml
  text: A Heritage is a [culture_pillar|E] that represents the common ancestry of
    several [cultures|E].\n\nCultures of the same Heritage generally have high [Concept(
    'cultural_acceptance', 'Acceptance' )|E] of one another.
heterosexual:
  source: game_concepts_l_english.yml
  text: Heterosexual
heterosexual_desc:
  source: game_concepts_l_english.yml
  text: 'In #EMP Crusader Kings III#!, this character is attracted to characters of
    the opposite gender.'
high:
  source: game_concepts_l_english.yml
  text: High
high_crown_authority:
  source: game_concepts_l_english.yml
  text: High Crown Authority
high_crown_authority_desc:
  source: game_concepts_l_english.yml
  text: '$game_concept_high_crown_authority$ is the second to highest level. [vassals|E]
    have a #N -20#! [opinion|E] penalty toward their [liege|E].\n\nAt this level —
    in addition to the powers the liege gets at [limited_crown_authority|E] — vassals
    under the same liege can no longer wage war against each other, the ruler can
    change between all available [succession_laws|E], and vassals'' [titles|E] cannot
    be inherited by rulers outside the liege''s [realm|E].\n\nLastly, refusing title
    [revocation|E] or vassal [retraction|E] is considered a [crime|E] even if the
    liege lacks sufficient justification.'
high_tribal:
  source: game_concepts_l_english.yml
  text: High
high_tribal_authority:
  source: game_concepts_l_english.yml
  text: High Tribal Authority
high_tribal_authority_desc:
  source: game_concepts_l_english.yml
  text: '$game_concept_high_tribal_authority$ is the second-highest level of [tribal_authority|E].
    [vassals|E] have a #N -20#! [opinion|E] penalty toward their [liege|E].\n\nAt
    this level, as well as the ability to [imprison|E] [characters|E], the liege may
    [revoke|E] [titles|E] and [retract|E] a vassal''s vassals.'
highlighted_text:
  source: game_concepts_l_english.yml
  text: Highlighted Text
highlighted_text_desc:
  source: game_concepts_l_english.yml
  text: 'This information is here for you, whenever you are unsure about a game concept.\n\n#TUT
    You can even move your cursor into #EMP this#! tooltip for even more information!
    [highlighted_text_example|E]#!'
highlighted_text_example:
  source: game_concepts_l_english.yml
  text: Neat!
highlighted_text_example_desc:
  source: game_concepts_l_english.yml
  text: Good job!
hired_troops:
  source: game_concepts_l_english.yml
  text: Hired Soldiers
hired_troops_desc:
  source: game_concepts_l_english.yml
  text: Hired Soldiers are either [mercenaries|E] or [holy_orders|E].
hold:
  source: game_concepts_l_english.yml
  text: Hold
holder:
  source: game_concepts_l_english.yml
  text: Holder
holder_desc:
  source: game_concepts_l_english.yml
  text: A [title|E]'s $game_concept_holder$ is the character who owns the title. [barony|E]
    and [county|E] titles will always have $game_concept_holders$ once settled, whereas
    [duchy|E], [kingdom|E] and [empire|E] titles might not have been created yet.
    As a further caveat, the $game_concept_holder$ of a high-level Title might not
    actually control any territory within the Title's [de_jure|E] area.\n\nHolding
    higher-tier Titles allows you to have higher-tier [vassals|E]. For example, Dukes
    can have Counts as Vassals, and Kings can have Dukes.
holder_possessive:
  source: game_concepts_l_english.yml
  text: Holder's
holders:
  source: game_concepts_l_english.yml
  text: Holders
holders_possessive:
  source: game_concepts_l_english.yml
  text: Holders'
holding:
  source: game_concepts_l_english.yml
  text: Holding
holding_desc:
  source: game_concepts_l_english.yml
  text: A $game_concept_holding$ is the central settlement of a [barony|E] or [county_capital|E].\n\nIt
    provides [taxes|E] and [levies|E] to its [holder|E], depending on its [holding_type|E].
    The collection of Holdings personally owned by a [ruler|E] is called a [domain|E].
holding_type:
  source: game_concepts_l_english.yml
  text: Holding Type
holding_type_desc:
  source: game_concepts_l_english.yml
  text: 'There are four types of [holdings|E]: [castles|E], [cities|E], [tribes|E],
    and [temples|E]. Each type allows different types of [buildings|E]. A [ruler|E]''s
    [government_form|E] determines which types of Holding the Ruler can personally
    own without penalty. In the case of Temples, the [doctrines|E] of their [faith|E]
    may also play a role.'
holding_types:
  source: game_concepts_l_english.yml
  text: Holding Types
holdings:
  source: game_concepts_l_english.yml
  text: Holdings
holy_order:
  source: game_concepts_l_english.yml
  text: Holy Order
holy_order_desc:
  source: game_concepts_l_english.yml
  text: $game_concept_holy_orders$ are independent military organizations that work
    to defend and expand the influence of their [faith|E].\n\nRulers of their Faith
    may hire them if they are at [war|E] with a [faith_hostile|L] or [faith_evil|L]
    [faith|E], at a cost of [piety|E]. Once this War ends, they no longer fight for
    that Ruler.\n\nA $game_concept_holy_order$ may have a [holy_order_patron|E], who
    does not need to pay to engage their services.
holy_order_patron:
  source: game_concepts_l_english.yml
  text: Holy Order Patron
holy_order_patron_desc:
  source: game_concepts_l_english.yml
  text: A [holy_order|E]'s $game_concept_holy_order_patron$ is a King or Emperor who
    shares their [faith|E] and whose [realm|E] contains their Capital.\n\nThe $game_concept_holy_order_patron$
    may call upon the support of the $game_concept_holy_order$ against religious enemies
    for free, instead of paying [piety|E].\n\nNot all $game_concept_holy_orders$ have
    a $game_concept_holy_order_patron$.
holy_orders:
  source: game_concepts_l_english.yml
  text: Holy Orders
holy_site:
  source: game_concepts_l_english.yml
  text: Holy Site
holy_site_desc:
  source: game_concepts_l_english.yml
  text: A $game_concept_holy_site$ is a [county|E] which contains a place of religious
    significance to a [faith|E]. $game_concept_holy_sites$ held by a Character of
    the correct Faith will provide an effect to everyone of that Faith, and can also
    allow the creation of [special_buildings|E] or [holy_orders|E]. Each Faith has
    a different set of $game_concept_holy_sites$.
holy_sites:
  source: game_concepts_l_english.yml
  text: Holy Sites
holy_war:
  source: game_concepts_l_english.yml
  text: Holy War
holy_war_desc:
  source: game_concepts_l_english.yml
  text: A $game_concept_holy_war$ is a special type of [war|E] waged by a [ruler|E]
    of one [faith|E] against a Ruler of a different Faith.\n\n$game_concept_holy_war$
    are usually quite destructive, with the winner of a Holy War typically seizing
    all [counties|E] in the targeted area for themselves. However, if attacker's Faith
    is [GetFaithDoctrine('doctrine_pluralism_pluralistic').GetBaseName] or the defender
    has [vassals|E] of the attacker's own Faith in the targeted area, some or all
    Vassal Rulers in the targeted area may simply be transfered to the attacker instead.\n\nUnlike
    other wars, Rulers of the same Faith as the target may choose to join in their
    defense without the need of an [alliance|E].\n\nHoly Wars may be allowed or restricted
    depending on the different [religious_families|E]
holy_war_holy:
  source: game_concepts_l_english.yml
  text: Holy
holy_wars:
  source: game_concepts_l_english.yml
  text: Holy Wars
homosexual:
  source: game_concepts_l_english.yml
  text: Homosexual
homosexual_desc:
  source: game_concepts_l_english.yml
  text: 'In #EMP Crusader Kings III#!, this character is attracted to characters of
    their own gender.'
honorary_guest:
  source: game_concepts_l_english.yml
  text: Honorary Guest
honorary_guest_desc:
  source: game_concepts_l_english.yml
  text: $honorary_guest_desc$
hook:
  source: game_concepts_l_english.yml
  text: Hook
hook_desc:
  source: game_concepts_l_english.yml
  text: A $game_concept_hook$ is a general term for a relationship between characters
    where one can get the other to do their will.\n\nThere are two types, [weak_hooks|E]
    and [strong_hooks|E], which are acquired in different ways.\n\n$game_concept_hooks$
    can be used to force through many interactions, for example [marriage|E] proposals
    and [vassal_contract|E] changes.
hook_i:
  source: game_concepts_l_english.yml
  text: '@cs_weak_hook_icon!'
hooked:
  source: game_concepts_l_english.yml
  text: Hooked
hooks:
  source: game_concepts_l_english.yml
  text: Hooks
host:
  source: game_concepts_l_english.yml
  text: Host
host_a_dinner:
  source: game_concepts_l_english.yml
  text: Host a Dinner
hosted_dinner:
  source: game_concepts_l_english.yml
  text: Hosted Dinner
hosted_dinner_desc:
  source: game_concepts_l_english.yml
  text: An [activity_phase|E] during a [royal_tour|E] in which a [vassal|E] is expected
    to entertain their [liege|E], which often results in an increase in mutually forming
    [hooks|E] and [relations|E].
hosted_dinners:
  source: game_concepts_l_english.yml
  text: Hosted Dinners
hostile_army:
  source: game_concepts_l_english.yml
  text: Hostile
hostile_army_desc:
  source: game_concepts_l_english.yml
  text: 'A $game_concept_hostile_army$ [army|E] can be engaged just as if you were
    at [war|E] with the owner, though no [war_score|E] will be given.\n\nHostility
    is caused by you having conflicting interests, including:\n$BULLET_WITH_TAB$Enemies
    of your [liege|E]\n$BULLET_WITH_TAB$[vassals|E] of your enemies\n$BULLET_WITH_TAB$Rulers
    #emphasis attacking#! the same enemy'
hostile_scheme:
  source: game_concepts_l_english.yml
  text: Hostile Scheme
hostile_scheme_desc:
  source: game_concepts_l_english.yml
  text: $game_concept_hostile_schemes$ are [schemes|E] that aim to cause harm to a
    [character|E]. Most $game_concept_hostile_schemes$ make use of [secrecy|E].\n\nExamples
    of $game_concept_hostile_schemes$ are:\n$BULLET_WITH_TAB$[GetScheme('murder').GetTypeName]\n$BULLET_WITH_TAB$[GetScheme('abduct').GetTypeName]\n$BULLET_WITH_TAB$[GetScheme('claim_throne').GetTypeName]\n$BULLET_WITH_TAB$[GetScheme('fabricate_hook').GetTypeName]
hostile_scheme_resistance:
  source: game_concepts_l_english.yml
  text: Hostile Scheme Resistance
hostile_schemes:
  source: game_concepts_l_english.yml
  text: Hostile Schemes
house:
  source: game_concepts_l_english.yml
  text: House
house_arrest:
  source: game_concepts_l_english.yml
  text: House Arrest
house_arrest_desc:
  source: game_concepts_l_english.yml
  text: $game_concept_house_arrest$ is a lenient form of [prison|E] where Characters
    suffer from no ill effects except boredom. However, [rulers|E] may throw them
    into the [dungeon|E], though it lowers the [opinions|E] of the Prisoner's [close_family|E].\n\nCaptured
    [nobles|E] are automatically put in [house_arrest|E].
house_desc:
  source: game_concepts_l_english.yml
  text: A $game_concept_house$ is a branch of members on the bigger tree of a [dynasty|E].
    Houses are created by [rulers|E] who no longer wish to answer to their current
    [house_head|E] and would rather be the Head of a new House.\n\nAlthough Houses
    have their own names and Coats of Arms, they still share [dynasty_prestige|E],
    and other members of the Dynasty can still be your [player_heir|E].
house_head:
  source: game_concepts_l_english.yml
  text: House Head
house_head_head:
  source: game_concepts_l_english.yml
  text: Head
house_head_interaction:
  source: game_concepts_l_english.yml
  text: House Head Interaction
house_head_interaction_desc:
  source: game_concepts_l_english.yml
  text: Special [interactions|E] that can be made by a [house_head|E] against members
    of their [house|E].
house_heads:
  source: game_concepts_l_english.yml
  text: House Heads
houses:
  source: game_concepts_l_english.yml
  text: Houses
hungarian_invasion:
  source: game_concepts_l_english.yml
  text: $HUNGARIAN_INVASION_CB_NAME$
hungarian_invasion_casus_belli:
  source: game_concepts_l_english.yml
  text: $HUNGARIAN_INVASION_CB_NAME$ Casus Belli
hungarian_invasion_casus_belli_desc:
  source: game_concepts_l_english.yml
  text: 'A powerful [casus_belli|E] that may only be used once per campaign, total,
    to conquer all territories held by the target within Pannonia.\n\nOn victory,
    all $mogyer_collective_noun$ in the attacker''s [realm|E] will move with them
    to Pannonia, [counties|E] #EMP and#! [vassals|E], displacing $avar$ $game_concept_counties$.
    Other vassals outside of Pannonia are abandoned, while $game_concept_counties$
    formerly occupied or held by $mogyer_collective_noun$ are left to local petty
    warlords and rival steppe tribes.'
hunt_danger:
  source: game_concepts_l_english.yml
  text: Hunt Peril
hunt_danger_desc:
  source: game_concepts_l_english.yml
  text: The unpredictability of even gentle wild beasts, coupled with the frenzy of
    the chase, has undone many a mighty warrior.\n\nMore $game_concept_hunt_dangerous$
    animals will grant greater [prestige_i|E][prestige|E] to the hunter.\n\nThe remoteness
    of the wilderness and abundance of opportunity should also not be ignored when
    choosing guests...
hunt_danger_no_prefix:
  source: game_concepts_l_english.yml
  text: Peril
hunt_dangerous:
  source: game_concepts_l_english.yml
  text: Perilous
hunt_sighting:
  source: game_concepts_l_english.yml
  text: Hunt Sighting
hunt_sighting_desc:
  source: game_concepts_l_english.yml
  text: A $game_concept_hunt_sighting$ is a report of specific prestigious animals
    spotted in a [county|E], which may be pursued in a [GetActivityType('activity_hunt').GetName]
    held there.\n\n[GetCourtPositionType('master_of_hunt_court_position').GetName()]
    [court_position|E] will search for $game_concept_hunt_sightings_no_prefix$.
hunt_sighting_no_prefix:
  source: game_concepts_l_english.yml
  text: Sighting
hunt_sightings:
  source: game_concepts_l_english.yml
  text: Hunt Sightings
hunt_sightings_no_prefix:
  source: game_concepts_l_english.yml
  text: Sightings
hunt_success_chance:
  source: game_concepts_l_english.yml
  text: Hunt Success Chance
hunt_success_chance_desc:
  source: game_concepts_l_english.yml
  text: 'When setting out on a [GetActivityType(''activity_hunt'').GetName] there
    is no guarantee you will corner your quarry. The main factors are:\n$BULLET_WITH_TAB$[GetTrait(''lifestyle_hunter'').GetName(
    GetNullCharacter )] [trait_level_track_xp|E]\n$BULLET_WITH_TAB$[GetCourtPositionType(''master_of_hunt_court_position'').GetName()]
    [aptitude|E]\n$BULLET_WITH_TAB$[buildings|E], [terrain|E], and [development|E]\n$BULLET_WITH_TAB$Animal
    [hunt_sightings_no_prefix|E]\n\n$game_concept_hunt_success_chance$ can never be
    higher than #V 80#!.\n\n#weak Successful hunts end with slaying the quarry, where
    trophy [artifacts|E] may be gained and great [prestige_i|E][prestige|E] conferred
    on the hunter.#!'
hunt_success_chance_no_prefix:
  source: game_concepts_l_english.yml
  text: Success Chance
hybrid_culture:
  source: game_concepts_l_english.yml
  text: Hybrid Culture
hybrid_culture_desc:
  source: game_concepts_l_english.yml
  text: '[SelectLocalization( HasDlcFeature( ''hybridize_culture'' ), ''game_concept_hybrid_culture_desc_DLC'',
    ''game_concept_hybrid_culture_desc_NO_DLC'' )]'
hybrid_cultures:
  source: game_concepts_l_english.yml
  text: Hybrid Cultures
hybridize:
  source: game_concepts_l_english.yml
  text: Hybridize
hybridized:
  source: game_concepts_l_english.yml
  text: Hybridized
hybridizes:
  source: game_concepts_l_english.yml
  text: Hybridizes
hybridizing:
  source: game_concepts_l_english.yml
  text: Hybridizing
ill:
  source: game_concepts_l_english.yml
  text: Ill
illness:
  source: game_concepts_l_english.yml
  text: Illness
illness_desc:
  source: game_concepts_l_english.yml
  text: Illnesses are a kind of negative [traits|E] that lower a Character's [health|E].
    Illness Traits can last for varying amounts of time and differ greatly in lethality.
illnesses:
  source: game_concepts_l_english.yml
  text: Illnesses
impatient_rushing_all_schemes_decision:
  source: game_concepts_l_english.yml
  text: $impatient_rushing_all_schemes_decision$ Decision
impatient_rushing_all_schemes_decision_desc:
  source: game_concepts_l_english.yml
  text: A [decision|E] allowing you to accelerate your [scheme|E]. Grants [scheme_opportunity_opportunities|E]
    in exchange for [stress|E].
implicit_claim:
  source: game_concepts_l_english.yml
  text: Implicit Claim
implicit_claim_desc:
  source: game_concepts_l_english.yml
  text: $game_concept_implicit_claims$ are [claims|E] that are given to [eligible_children|E]
    on all [titles|E] held by their parents. If a parent loses a [title|E], the child's
    $game_concept_implicit_claim$ will be removed too.
implicit_claim_i:
  source: game_concepts_l_english.yml
  text: '@implicit_claim!'
implicit_claims:
  source: game_concepts_l_english.yml
  text: Implicit Claims
imprison:
  source: game_concepts_l_english.yml
  text: Imprison
imprisoned:
  source: game_concepts_l_english.yml
  text: Imprisoned
imprisoning:
  source: game_concepts_l_english.yml
  text: Imprisoning
imprisonment:
  source: game_concepts_l_english.yml
  text: Imprisonment
imprisonment_reason:
  source: game_concepts_l_english.yml
  text: Imprisonment Reason
imprisonment_reason_desc:
  source: game_concepts_l_english.yml
  text: A $game_concept_imprisonment_reason$ gives a [liege|E] the opportunity to
    freely [imprison|E] a subject. They are most often gained from the subject being
    a [criminal|E].
imprisonment_reasons:
  source: game_concepts_l_english.yml
  text: Imprisonment Reasons
imprisons:
  source: game_concepts_l_english.yml
  text: Imprisons
inactive_accolade:
  source: game_concepts_l_english.yml
  text: Inactive Accolade
inactive_accolade_desc:
  source: game_concepts_l_english.yml
  text: '[accolades|E] become Inactive when they are invalidated.\n\nAn Accolade becomes
    inactive if:\n$EFFECT_LIST_BULLET$The [acclaimed_knight|e] or their [ruler|E]
    no longer fulfills its [accolade_type|e] requirements\n$EFFECT_LIST_BULLET$The
    Acclaimed Knight dies or leaves their Ruler''s [court|e] without a Successor\n$EFFECT_LIST_BULLET$The
    [ruler|E] manually retires it'
inbred:
  source: game_concepts_l_english.yml
  text: Inbred
inbreeding:
  source: game_concepts_l_english.yml
  text: Inbreeding
inbreeding_desc:
  source: game_concepts_l_english.yml
  text: The [children|E] of two closely related [characters|E] risk being born with
    a [congenital|E] defect, the most serious of which is the [GetTrait('inbred').GetName(
    GetNullCharacter )] [trait|E].\n\nThis is rare in the first generation, but successive
    $game_concept_inbreeding$ increases the risk.\n\nGenerations of $game_concept_inbreeding$
    can, however, also result in the beneficial [GetTrait('pure_blooded').GetName(
    GetNullCharacter )] $game_concept_trait$, which (if both parents share it) makes
    offspring immune to birth defects due to all flaws having been [bred|E] out of
    the bloodline.
incest:
  source: game_concepts_l_english.yml
  text: Incest
incest_desc:
  source: game_concepts_l_english.yml
  text: Incest refers to sexual activity between close relatives.\nWhat relations
    are incestuous is determined by the $doctrine_consanguinity_name$ [doctrine|E]
    of a character's [faith|E].
incestuous:
  source: game_concepts_l_english.yml
  text: Incestuous
income:
  source: game_concepts_l_english.yml
  text: Income
income_desc:
  source: game_concepts_l_english.yml
  text: There are many sources of [gold|E], but the two most important ones are [taxation|E]
    of your own [holdings|E] and of your [vassals|E].
increase_control:
  source: game_concepts_l_english.yml
  text: $task_increase_control$
increase_control_desc:
  source: game_concepts_l_english.yml
  text: $game_concept_increase_control$ is a [councillor_task|E] performed by the
    [marshal|E].\n\nIt targets a [county|E], where it increases [control|E], and removes
    [county_corruption|E] over time.
independence_faction:
  source: game_concepts_l_english.yml
  text: Independence Faction
independence_faction_desc:
  source: game_concepts_l_english.yml
  text: The $game_concept_independence_faction$ seeks independence for all its members.
    If successful, they will go [independent|E] from their [liege|E].
independence_factions:
  source: game_concepts_l_english.yml
  text: Independence Factions
independent:
  source: game_concepts_l_english.yml
  text: Independent
independent_ruler:
  source: game_concepts_l_english.yml
  text: Independent Ruler
independent_ruler_desc:
  source: game_concepts_l_english.yml
  text: $game_concept_independent$ [rulers|E] have no [liege|E] and thus enjoy greater
    freedom of action (e.g. in declaring [wars|E]).\n\nHowever, unlike [vassals|E]
    they can also be directly attacked by foreign [rulers|E].
innovation:
  source: game_concepts_l_english.yml
  text: Innovation
innovation_desc:
  source: game_concepts_l_english.yml
  text: Innovations are technologies and other advances that benefit all characters
    of a certain [culture|E]. Innovations are grouped into the [eras|E] when they
    can be discovered.\n\nThrough contact with neighboring Cultures, each Culture
    is always [spread|E] to one specific Innovation which will be discovered much
    quicker.\n\nIn addition, the [culture_head|E] can set another (or the same) Innovation
    as the [cultural_fascination|E] for an additional boost.
innovations:
  source: game_concepts_l_english.yml
  text: Innovations
intent:
  source: game_concepts_l_english.yml
  text: Intent
intent_desc:
  source: game_concepts_l_english.yml
  text: An $game_concept_intent$ represents what a character personally seeks to accomplish
    at an [activity|E]; the host and guests each have their own motives and ends.
intents:
  source: game_concepts_l_english.yml
  text: Intents
interaction:
  source: game_concepts_l_english.yml
  text: Interaction
interaction_desc:
  source: game_concepts_l_english.yml
  text: Actions taken by one character towards another. They can have a wide range
    of purposes and effects.\n\nSome interactions require the target character's approval,
    while some can be performed without it.\n\nUsually they are accessed by right-clicking
    on a character to access the Interaction Menu for the target character, but sometimes
    they are available through special interfaces.
interactions:
  source: game_concepts_l_english.yml
  text: Interactions
intimidated:
  source: game_concepts_l_english.yml
  text: Intimidated
intimidated_desc:
  source: game_concepts_l_english.yml
  text: Characters who greatly fear another character are Intimidated by them. This
    is usually caused by [dread|E] and/or a cowardly personality.\n\nIntimidated characters
    are less likely to initiate hostile actions against the character they fear, including
    joining or starting [factions|E].\n\nCharacters who are even more fearful are
    marked as [cowed|E].
intimidated_i:
  source: game_concepts_l_english.yml
  text: '@intimidated_icon!'
intimidation_tour:
  source: game_concepts_l_english.yml
  text: Intimidation Tour
intimidation_tour_desc:
  source: game_concepts_l_english.yml
  text: A [tour_type|E] in which you attempt to intimidate your [vassals|E], gaining
    [dread|E] and forcing them out of [factions|E].
intrigue:
  source: game_concepts_l_english.yml
  text: Intrigue
intrigue_9_14_20_18_9_7_21_5:
  source: game_concepts_l_english.yml
  text: 9 14 20 18 9 7 21 5
intrigue_i:
  source: game_concepts_l_english.yml
  text: '@skill_intrigue_icon!'
intrigue_lifestyle:
  source: game_concepts_l_english.yml
  text: Intrigue Lifestyle
intrigue_lifestyle_desc:
  source: game_concepts_l_english.yml
  text: The $game_concept_intrigue_lifestyle$ is suitable for Characters who want
    to succeed in [schemes|E], gain [dread|E], or Seduce others with ease.
intrigue_lqwuljxh:
  source: game_concepts_l_english.yml
  text: Lqwuljxh
intrigue_rigueint:
  source: game_concepts_l_english.yml
  text: Rigueint
intrigue_skill:
  source: game_concepts_l_english.yml
  text: Intrigue Skill
intrigue_skill_desc:
  source: game_concepts_l_english.yml
  text: $game_concept_intrigue$ is a [skill|E] representing a Character's ability
    to understand and manipulate other characters, and to organize elaborate plots.\n\nIt
    is mainly used to further — and defend against — Intrigue [schemes|E].\n\nThe
    corresponding [lifestyle|E] is the [intrigue_lifestyle|E].
jailor:
  source: game_concepts_l_english.yml
  text: Jailor
jihad:
  source: game_concepts_l_english.yml
  text: Jihad
jihads:
  source: game_concepts_l_english.yml
  text: Jihads
kinslayer:
  source: game_concepts_l_english.yml
  text: Kinslayer
kinslayers:
  source: game_concepts_l_english.yml
  text: Kinslayers
kinslaying:
  source: game_concepts_l_english.yml
  text: Kinslaying
kinslaying_desc:
  source: game_concepts_l_english.yml
  text: A Kinslayer is a Character who is known to have slain a [family_member|E].
    Some [faiths|E] view kinslaying as [criminal|E].\n\nThe three Kinslaying traits
    are:\n$BULLET_WITH_TAB$[GetTrait('kinslayer_3').GetName( GetNullCharacter )] —
    Given to those who kill [close_family|E]\n$BULLET_WITH_TAB$[GetTrait('kinslayer_2').GetName(
    GetNullCharacter )] — Given to those who kill [extended_family|E]\n$BULLET_WITH_TAB$[GetTrait('kinslayer_1').GetName(
    GetNullCharacter )] — Given to those who kill a member of their [dynasty|E]
knight:
  source: game_concepts_l_english.yml
  text: Knight
knight_army_modifier:
  source: game_concepts_l_english.yml
  text: Knight Army Modifier
knight_army_modifier_desc:
  source: game_concepts_l_english.yml
  text: 'An effect applied to any [army|e] which #high contains#! the pertinent [acclaimed_knight|e].\n\nThe
    [knight|e] need #high not#! be their Army''s [commander|e] for their Knight Army
    Modifier to apply.'
knight_army_modifiers:
  source: game_concepts_l_english.yml
  text: Knight Army Modifiers
knight_desc:
  source: game_concepts_l_english.yml
  text: A $game_concept_knight$ is a [vassal|E], [courtier|E], or [follower|E] that
    fights directly in your [army|E].\n\nDuring [battles|E], $game_concept_knights$
    use their [prowess_skill|E] to fight more effectively. A high $game_concept_prowess$
    means that they will be able to inflict more damage on the enemy, and are more
    likely to survive or even emerge from $game_concept_battle$ unscathed.\n\n[SelectLocalization(
    HasDlcFeature( 'tours_and_tournaments' ), 'game_concept_knight_desc_TOTO_DLC',
    'game_concept_knight_desc_NO_TOTO_DLC' )][SelectLocalization( HasDlcFeature( 'accolades'
    ), 'game_concept_knight_desc_ACCOLADE_DLC', '' )]#weak Knights can be known by
    different names depending on [culture] or [faith]. For example, $knight_champion_no_tooltip_plural$,
    $knight_faris_no_tooltip_plural$ or $knight_baghatur_no_tooltip_plural$.\n\nKnights
    represent both the character and their retinue of troops.#!
knight_effectiveness:
  source: game_concepts_l_english.yml
  text: Knight Effectiveness
knight_effectiveness_desc:
  source: game_concepts_l_english.yml
  text: A [ruler|E]'s Knight Effectiveness determines how well their [knights|E] fight
    in [battle|E].\n\nAt 100%, Knights fight as normal, but at 200% they fight as
    if their [prowess|E] was doubled.
knight_i:
  source: game_concepts_l_english.yml
  text: '@knight_icon!'
knights:
  source: game_concepts_l_english.yml
  text: Knights
land:
  source: game_concepts_l_english.yml
  text: Land
landed:
  source: game_concepts_l_english.yml
  text: Landed
landed_desc:
  source: game_concepts_l_english.yml
  text: A $game_concept_landed$ Character is a [ruler|E] who owns [holdings|E]. Except
    in [theocracies|E] and [republics|E], [commoners|E] automatically become [nobles|E]
    when they are landed, founding a new [dynasty|E].
language:
  source: game_concepts_l_english.yml
  text: Language
language_desc:
  source: game_concepts_l_english.yml
  text: A Language is the [culture_pillar|E] that determines what language the general
    populace of a [culture|E] speaks. $game_concept_cultures$ which speak the same
    language gain a permanent bonus to their [cultural_acceptance_baseline|E].\n\nA
    [character|E] can know one or more Languages. Knowing a language cuts the [cultural_acceptance|E]
    [opinion|E] penalty in half towards Characters and [counties|E] that speak it.
    It also discourages [faction_independence|E] and [claimant_factions|E].\n\nCharacters
    can learn additional languages by using the [GetScheme('learn_language').GetTypeName]
    [scheme|E]. Characters can comfortably learn languages up to their [language_limit|E].
language_limit:
  source: game_concepts_l_english.yml
  text: Foreign Language Limit
language_limit_desc:
  source: game_concepts_l_english.yml
  text: 'You can only comfortably remember a set amount of [languages|E]. If you exceed
    this limit, you will either have to forget a Language or suffer from [stress|E].\n\nThe
    Language spoken by your [culture|E] does not count towards this limit.\n\nThe
    limit is determined by:\n$EFFECT_LIST_BULLET$Everyone has a Base of #V 1#!\n$EFFECT_LIST_BULLET$Every
    [EmptyScope.ScriptValue(''language_learning_divide_value'')|V0] points of [learning_i][learning|E]
    increases it by #V 1#!\n$EFFECT_LIST_BULLET$The [GetPerk(''open_minded_perk'').GetName(GetNullCharacter)]
    [perk|E] increases it by #V 2#!\n$EFFECT_LIST_BULLET$The [GetPerk(''smooth_operator_perk'').GetName(GetNullCharacter)]
    [perk|E] increases it by #V 1#!\n$EFFECT_LIST_BULLET$The [GetDynastyPerk(''ep1_culture_legacy_1'').GetName]
    [dynasty_perk|E] increases it by #V 1#!'
languages:
  source: game_concepts_l_english.yml
  text: Languages
law:
  source: game_concepts_l_english.yml
  text: Law
laws:
  source: game_concepts_l_english.yml
  text: Laws
learning:
  source: game_concepts_l_english.yml
  text: Learning
learning_i:
  source: game_concepts_l_english.yml
  text: '@skill_learning_icon!'
learning_lifestyle:
  source: game_concepts_l_english.yml
  text: Learning Lifestyle
learning_lifestyle_desc:
  source: game_concepts_l_english.yml
  text: The $game_concept_learning_lifestyle$ is suitable for Characters who want
    to live long and healthy lives, gain [piety|E], or gain additional bonuses from
    their [faith|E].
learning_skill:
  source: game_concepts_l_english.yml
  text: Learning Skill
learning_skill_desc:
  source: game_concepts_l_english.yml
  text: $game_concept_learning$ is a [skill|E] measuring a Character's literacy and
    wisdom. The Learning Skill of a [ruler|E] affects the cost of increasing [crown_authority|E],
    and also yields an amount of monthly [piety|E].\n\nCharacters with high Learning
    can be expected to have extensive knowledge of all common scholarly endeavors,
    including theology, philosophy, language and mathematics.\n\nThe corresponding
    [lifestyle|E] is the [learning_lifestyle|E].
lease:
  source: game_concepts_l_english.yml
  text: Lease
leased:
  source: game_concepts_l_english.yml
  text: Leased
leases:
  source: game_concepts_l_english.yml
  text: Leases
leasing:
  source: game_concepts_l_english.yml
  text: Leasing
leasing_desc:
  source: game_concepts_l_english.yml
  text: Minor [baronies|E] can be $game_concept_leased$ out to [holy_orders|E] or
    [clergy|E]. Leased baronies provide [taxes|E] and [levies|E] to the [lessee|E]
    rather than the [holder|E].\n\nA holy order can lease [castle_holdings|E], while
    clergy can lease [temple_holdings|E].\n\nLeased [holdings|E] are still considered
    part of the holder's [realm|E]. [county_capitals|E] cannot be leased.
legalism:
  source: game_concepts_l_english.yml
  text: Legalism
legalism_desc:
  source: game_concepts_l_english.yml
  text: A [core_tenet|E] emphasizing legal practice and tradition in theology and
    devoutness. It affects law costs and [vassal|E] [faction|E] membership based on
    the number of [sins|E] or [virtues|E] a [ruler|E] has.
legalistic:
  source: game_concepts_l_english.yml
  text: Legalistic
legitimate:
  source: game_concepts_l_english.yml
  text: Legitimate
legitimate_desc:
  source: game_concepts_l_english.yml
  text: Children born of [married|E] parents are considered $game_concept_legitimate$,
    as opposed to [bastards|E] who may not inherit any [titles|E]. The children of
    [concubines|E] are also considered [legitimate|E], though of slightly lower status.
legitimized:
  source: game_concepts_l_english.yml
  text: Legitimized
legitimized_bastard:
  source: game_concepts_l_english.yml
  text: Legitimized Bastard
legitimized_bastard_desc:
  source: game_concepts_l_english.yml
  text: A [bastard|E] may be Legitimized, either at birth, or as a [character_interaction|E]
    later, depending on approval from their [house_head|E].\n\nA Legitimized Bastard
    has the same right of inheritance as [legitimate|E] children, but the stain of
    bastardy will follow them throughout their life.
lessee:
  source: game_concepts_l_english.yml
  text: Lessee
levies:
  source: game_concepts_l_english.yml
  text: Levies
levies_desc:
  source: game_concepts_l_english.yml
  text: 'The bulk of most [armies|E] is made up of $game_concept_levies$.\n\nEach
    [holding|E] provides a set number of $game_concept_levies$ to their [holder|E].
    [vassals|E] in turn provide a part of their $game_concept_levies$ to their [liege|E].\n\n$game_concept_levies$
    are made up of mostly poorly-armed fighters #weak (peasant militias, ruffians,
    local sellswords, destitute nobles, minor landowners, etc.)#! and are considered
    their own unit type.\n\nA $game_concept_levy$ has [GetDefine(''NCombat'', ''LEVY_ATTACK'')|0]
    [damage|E] and [GetDefine(''NCombat'', ''LEVY_TOUGHNESS'')|0] [toughness|E]. The
    other type of [soldiers|E] in the game are [men_at_arms|E] — expensive trained
    professionals.'
levy:
  source: game_concepts_l_english.yml
  text: Levy
liberty_faction:
  source: game_concepts_l_english.yml
  text: $liberty_faction$
liberty_faction_desc:
  source: game_concepts_l_english.yml
  text: The $game_concept_liberty_faction$ seeks to lower the [crown_authority|E]
    and, if applicable, their own [vassal_contracts|E]. If successful, their [liege|E]
    will be unable to change the Crown Authority of the [realm|E] for some time.
liberty_factions:
  source: game_concepts_l_english.yml
  text: Liberty Factions
liege:
  source: game_concepts_l_english.yml
  text: Liege
liege_desc:
  source: game_concepts_l_english.yml
  text: A $game_concept_liege$ is a [ruler|E] with at least one [vassal|E]. Lieges
    may themselves be Vassals to even higher ranked Rulers, and so on.
liege_possessive:
  source: game_concepts_l_english.yml
  text: Liege's
liege_taxes:
  source: game_concepts_l_english.yml
  text: Liege Taxes
liege_taxes_desc:
  source: game_concepts_l_english.yml
  text: Your $game_concept_liege_taxes$ are the [taxes|E] that you must pay to your
    [liege|E] as part of your [obligations|E]. You do not pay any $game_concept_liege_taxes$
    if you are [independent|E].\n\nFrom your Liege's point of view, these same taxes
    are instead called [vassal_taxes|E] to distinguish them from any taxes they may
    owe to their own $game_concept_liege$.
lieges:
  source: game_concepts_l_english.yml
  text: Lieges
life_expectancy:
  source: game_concepts_l_english.yml
  text: Life Expectancy
life_expectancy_desc:
  source: game_concepts_l_english.yml
  text: $game_concept_life_expectancy$ is the number of years a character is expected
    to live before dying of natural causes.\n\nA high $game_concept_life_expectancy$
    will make characters visibly age slower and be able to produce [children|E] for
    longer.
lifestyle:
  source: game_concepts_l_english.yml
  text: Lifestyle
lifestyle_desc:
  source: game_concepts_l_english.yml
  text: '[adult|E] [rulers|E] may choose a $game_concept_lifestyle$, which will in
    turn allow them to select a [focus|E] and start gaining [perks|E].\n\nEach $game_concept_lifestyle$
    has its own type of [experience|E], which is used to purchase $game_concept_perks$.
    For example, Experience in the [intrigue_lifestyle|E] is necessary to gain $game_concept_perks$
    such as [GetPerk( ''dreadful_perk'' ).GetName( GetNullCharacter )] or [GetPerk(
    ''like_weed_in_a_garden_perk'' ).GetName( GetNullCharacter )].\n\nThe $game_concept_lifestyles$
    are:\n$BULLET_WITH_TAB$ [diplomacy_lifestyle|E]\n$BULLET_WITH_TAB$ [stewardship_lifestyle|E]\n$BULLET_WITH_TAB$
    [martial_lifestyle|E]\n$BULLET_WITH_TAB$ [intrigue_lifestyle|E]\n$BULLET_WITH_TAB$
    [learning_lifestyle|E]\n$BULLET_WITH_TAB$ [wanderer_lifestyle|E]'
lifestyle_experience:
  source: game_concepts_l_english.yml
  text: Lifestyle Experience
lifestyle_experience_desc:
  source: game_concepts_l_english.yml
  text: $game_concept_lifestyle_experience$ is accumulated passively by having a [focus|E]
    selected, or granted by events. There are different types of $game_concept_lifestyle_experience$,
    one per [lifestyle|E] category.\n\nGaining enough $game_concept_lifestyle_experience$
    within a category will award a [perk|E].
lifestyle_trait:
  source: game_concepts_l_english.yml
  text: Lifestyle Trait
lifestyle_trait_desc:
  source: game_concepts_l_english.yml
  text: A $game_concept_lifestyle_trait$ is the result from picking certain [lifestyle|E]
    perks, [decisions|E], or [interactions|E].\n\nSome Lifestyle traits are upgradeable
    as the character improves their mastery of the skill. The levels range between
    1-3, and the stars on the trait icon indicate the current level.
lifestyle_traits:
  source: game_concepts_l_english.yml
  text: Lifestyle Traits
lifestyles:
  source: game_concepts_l_english.yml
  text: Lifestyles
light_cavalry:
  source: game_concepts_l_english.yml
  text: Light Cavalry
light_cavalry_desc:
  source: game_concepts_l_english.yml
  text: Light Cavalry are mounted [men_at_arms|E] who excel at scouting and pursuing
    the enemy.\n\nWhile each kind of Light Cavalry is unique, they generally [counter|E]
    [archers|E], and are in turn Countered by [spearmen|E].\n\nLight Cavalry are also
    often strong on flat [terrain|E].\n\nIn comparison with [heavy_cavalry|E], they
    are usually better at [pursuit|E] and [screen|E].
limited:
  source: game_concepts_l_english.yml
  text: Limited
limited_crown_authority:
  source: game_concepts_l_english.yml
  text: Limited Crown Authority
limited_crown_authority_desc:
  source: game_concepts_l_english.yml
  text: '''$game_concept_limited_crown_authority$'' is the second to lowest level
    of [crown_authority|E]. [vassals|E] have a #N -10#! [opinion|E] penalty toward
    their [liege|E], and the liege may [revoke|E] [titles|E] and [retract|E] a vassal''s
    vassals. The [ruler|E] can change between available Partition [succession_laws|E].'
limited_tribal:
  source: game_concepts_l_english.yml
  text: Limited
limited_tribal_authority:
  source: game_concepts_l_english.yml
  text: Limited Tribal Authority
limited_tribal_authority_desc:
  source: game_concepts_l_english.yml
  text: '$game_concept_limited_tribal_authority$ is the second-lowest level of [tribal_authority|E].
    [vassals|E] have a #N -10#! [opinion|E] penalty towards their [liege|E], and the
    liege may now [imprison|E] [characters|E] in their [realm|E].'
line:
  source: game_concepts_l_english.yml
  text: Line
line_of_succession:
  source: game_concepts_l_english.yml
  text: Line of Succession
line_of_succession_desc:
  source: game_concepts_l_english.yml
  text: The Line of Succession is the order in which certain characters stand to inherit
    certain [titles|E], determined by the [succession_law|E].
local_arbitration:
  source: game_concepts_l_english.yml
  text: $local_arbitration_decision$
local_arbitration_decision:
  source: game_concepts_l_english.yml
  text: $local_arbitration_decision$ Decision
local_arbitration_desc:
  source: game_concepts_l_english.yml
  text: A [decision|E] that lets a character improve a [county|E] in their current
    location.
locale:
  source: game_concepts_l_english.yml
  text: Locales
locale_desc:
  source: game_concepts_l_english.yml
  text: You may choose how you explore the [GetActivityType( 'activity_tournament').GetName]
    while the [contests|E] are being prepared.\n\nEach Locale offers opportunities
    to socialize with guests, improve [progress_to_victory|E], or sabotage [contestants|E].\n\nIf
    a Locale is not selected, you will visit one at random after a short period of
    time.
locales:
  source: game_concepts_l_english.yml
  text: Locales
location:
  source: game_concepts_l_english.yml
  text: Location
location_desc:
  source: game_concepts_l_english.yml
  text: Every [character|E] has a location indicating where they currently are in
    the world. To get from one location to another, you must [travel|E].
locations:
  source: game_concepts_l_english.yml
  text: Locations
long_reign:
  source: game_concepts_l_english.yml
  text: Long Reign
long_reign_desc:
  source: game_concepts_l_english.yml
  text: '''Long Reign'' is an increasing [opinion|E] bonus that all characters in
    a [realm|E] get with a [liege|E] who has ruled over them for a long time.\n\nSimilarly,
    subjects have a decaying [short_reign|E] Opinion penalty with new Lieges.'
lover:
  source: game_concepts_l_english.yml
  text: Lover
lover_desc:
  source: game_concepts_l_english.yml
  text: A $game_concept_lover$ is a $game_concept_relation$ indicating an ongoing
    amorous and sexual association between two [characters|E].\n\nAs they often take
    place outside the bonds of [marriage|E] or [concubinage|E], most $game_concept_lover$
    $game_concept_relations$ begin as [secrets|E].\n\nIf a man and a woman are $game_concept_lovers$,
    the woman may become pregnant with the man's child. If they are not $game_concept_married$
    (and one is not the $game_concept_concubine$ of the other), the child will be
    a [bastard|E], secret or otherwise.\n\n$game_concept_lovers$ who are deeply loyal
    and affectionate might become [soulmates|E].
lover_possessive:
  source: game_concepts_l_english.yml
  text: Lover's
lovers:
  source: game_concepts_l_english.yml
  text: Lovers
lovers_possessive:
  source: game_concepts_l_english.yml
  text: Lovers'
lowborn:
  source: game_concepts_l_english.yml
  text: Lowborn
main_phase:
  source: game_concepts_l_english.yml
  text: Main Phase
main_phase_desc:
  source: game_concepts_l_english.yml
  text: In the Main Phase of a [battle|E], [soldiers|E] and [knights|E] from the two
    sides fight each other.\n\nThe Main Phase ends when all troops of one side have
    become [casualties|E] or one side has decided to [retreat|E].\n\nAfter the Main
    Phase the combat enters the [aftermath|E].
majesty_tour:
  source: game_concepts_l_english.yml
  text: Majesty Tour
majesty_tour_desc:
  source: game_concepts_l_english.yml
  text: A [tour_type|E] in which you attempt to sway your [vassals|E] by increasing
    their [opinion|E].
manage_guards:
  source: game_concepts_l_english.yml
  text: $task_manage_guards$
manage_guards_desc:
  source: game_concepts_l_english.yml
  text: $game_concept_increase_control$ is a [councillor_task|E] performed by the
    [marshal|E].\n\nIt increases [knight_effectiveness|E] and lowers [hostile_scheme|E]
    [success_chance|E] against the councillor's [liege|E].
mandate:
  source: game_concepts_l_english.yml
  text: Mandate
mandate_desc:
  source: game_concepts_l_english.yml
  text: '$game_concept_mandates$ are useful tasks a [liege|E] can set for their [diarch|E]
    when [sharing_power|E].\n\nSimilarly to [councillor_tasks|E], the $game_concept_liege$
    selects a $game_concept_mandate$ and then slowly receives benefits from it.\n\nWhen
    a $game_concept_diarch$ does their job well, they both swing the [scales_of_power|E]
    towards themselves #EMP and#! generate [strife|E] with their fellow [vassals|E].\n\nHow
    much benefit the $game_concept_liege$ receives depends on their $game_concept_diarch_possessive$
    [diarch_aptitude|E] and [diarch_loyalty|E].'
mandate_possessive:
  source: game_concepts_l_english.yml
  text: Mandate's
mandates:
  source: game_concepts_l_english.yml
  text: Mandates
mandates_possessive:
  source: game_concepts_l_english.yml
  text: Mandates'
maneuver:
  source: game_concepts_l_english.yml
  text: Maneuver
maneuver_desc:
  source: game_concepts_l_english.yml
  text: The $game_concept_maneuver$ phase occurs at the start of a [battle|E] and
    indicates the time it takes before the [main_phase|E] begins, and [armies|E] engage
    each other in combat.
manipulation:
  source: game_concepts_l_english.yml
  text: Manipulation
manipulation_desc:
  source: game_concepts_l_english.yml
  text: $game_concept_manipulation$ is a form of [hook|E] where you have managed to
    manipulate the mind of another character in some way in order to get them to do
    your will.
marriage:
  source: game_concepts_l_english.yml
  text: Marriage
marriage_desc:
  source: game_concepts_l_english.yml
  text: $game_concept_marriages$ are a union between two [spouses|E], and are (alongside
    [betrothals|E]) the main way to forge an [alliance|E] with another [ruler|E].\n\n$game_concept_spouses$
    may also produce [legitimate|E] children, who can be [bred|E] and raised as suitable
    [heirs|E].\n\n$game_concept_marriages$ only end when one $game_concept_spouse$
    dies or [divorces|E] the other.[SelectLocalization( HasDlcFeature( 'tours_and_tournaments'
    ), 'game_concept_marriage_desc_TOTO_DLC', '' )]
marriages:
  source: game_concepts_l_english.yml
  text: Marriages
married:
  source: game_concepts_l_english.yml
  text: Married
marries:
  source: game_concepts_l_english.yml
  text: Marries
marry:
  source: game_concepts_l_english.yml
  text: Marry
marrying:
  source: game_concepts_l_english.yml
  text: Marrying
marshal:
  source: game_concepts_l_english.yml
  text: Marshal
marshal_desc:
  source: game_concepts_l_english.yml
  text: The $game_concept_marshal$ is your chief [commander|E] and the [councillor|E]
    in charge of military matters in general.
marshals:
  source: game_concepts_l_english.yml
  text: Marshals
martial:
  source: game_concepts_l_english.yml
  text: Martial
martial_custom:
  source: game_concepts_l_english.yml
  text: Martial Custom
martial_custom_desc:
  source: game_concepts_l_english.yml
  text: Martial Custom is the [culture_pillar|E] that determines what genders can
    act as [commanders|E] or [knights|E].\n\nSome [traditions|E] and [doctrines|E]
    can modify these rules for certain [characters|E].
martial_i:
  source: game_concepts_l_english.yml
  text: '@skill_martial_icon!'
martial_lifestyle:
  source: game_concepts_l_english.yml
  text: Martial Lifestyle
martial_lifestyle_desc:
  source: game_concepts_l_english.yml
  text: The $game_concept_martial_lifestyle$ is suitable for Characters who want to
    improve their [men_at_arms|E] and [knights|E], boost [control|E] in their [domain|E],
    or increase their chances to win [wars|E].
martial_skill:
  source: game_concepts_l_english.yml
  text: Martial Skill
martial_skill_desc:
  source: game_concepts_l_english.yml
  text: $game_concept_martial$ [skill|E] indicates how good a Character is at waging
    [war|E] and leading [armies|E] in [battle|E].\n\nA high Martial Skill is important
    for [army_commanders|E], since it improves their [advantage|E] in [battle|E].\n\nThe
    corresponding [lifestyle|E] is the [martial_lifestyle|E].
matrilineal:
  source: game_concepts_l_english.yml
  text: Matrilineal
matrilineal_desc:
  source: game_concepts_l_english.yml
  text: In a $game_concept_matrilineal$ [marriage|E], children will be born into their
    mother's [house|E] instead of their father's.
matrilineally:
  source: game_concepts_l_english.yml
  text: Matrilineally
medical_treatments:
  source: game_concepts_l_english.yml
  text: Medical Treatments
medical_treatments_desc:
  source: game_concepts_l_english.yml
  text: When a character becomes [ill|E] or [GetTrait('wounded_1').GetName( GetNullCharacter
    )] a Medical Treatment can help them recover faster.\n\nThe one responsible for
    treating you and your [courtiers|E] is the [GetCourtPositionType('court_physician_court_position').GetName()].
    Try to always have one employed if you can afford their salary.\n\nThe more treatments
    a $court_physician_court_position$ performs, the more their skill will grow, granting
    them [GetTrait('lifestyle_physician').GetName( GetNullCharacter )] [traits|E].
megaduke_penalty:
  source: game_concepts_l_english.yml
  text: Overextension
megaduke_penalty_desc:
  source: game_concepts_l_english.yml
  text: When you have more than [GetDefine('NCharacter', 'MAX_COUNTIES_IN_REALM_AS_DUKE')]
    [counties|E] in your [realm|E] as a [duke|E], you suffer an $game_concept_megaduke_penalty$
    Penalty, reducing your [tax|E] income.\n\nBecoming [king|E] or [emperor|E] [rank|E]
    removes this penalty.
men_at_arms:
  source: game_concepts_l_english.yml
  text: Men-at-Arms
men_at_arms_counter:
  source: game_concepts_l_english.yml
  text: Men-at-Arms Counter
men_at_arms_counter_desc:
  source: game_concepts_l_english.yml
  text: Most [men_at_arms|E] are able to $game_concept_counter$ another type of $game_concept_men_at_arms$.\n\nWhen
    a [regiment|E] is Countered, its effectiveness during a [battle|E] is decreased.
    The more a $game_concept_regiment$ is outnumbered by its $game_concept_counter$,
    the higher the penalty.
men_at_arms_desc:
  source: game_concepts_l_english.yml
  text: $game_concept_men_at_arms$ are professional [soldiers|E] superior to [levies|E].\n\nThe
    player has direct control over the composition and size of their Men-at-Arms [regiments|E].\n\nDifferent
    types of Men-at-Arms are good or bad in different types of [terrain|E]. Each type
    also [counters|E] another type.\n\nMen-at-Arms can be [stationed|E] in [holdings|E]
    to increase their effectiveness.
mental_break:
  source: game_concepts_l_english.yml
  text: Mental Break
mental_break_desc:
  source: game_concepts_l_english.yml
  text: When [stress|e] overwhelms a character they will experience a Mental Break
    — a personal crisis in which they feel that they must do something to lower their
    Stress, no matter the cost.\n\nCharacters suffering from a Mental Break will have
    several ways that they can deal with the situation, though many of them will have
    negative consequences.\n\nAt low [stress_levels|E] these consequences are minor
    and easily managed. As Stress Level increases however, so do these consequences,
    eventually leading to insanity and even death.
mental_breaks:
  source: game_concepts_l_english.yml
  text: Mental Breaks
mentor:
  source: game_concepts_l_english.yml
  text: Mentor
mentor_desc:
  source: game_concepts_l_english.yml
  text: $game_concept_mentors$ are [characters|E] that help to improve the [skills|E]
    of their [student|E]. They can be gained through events when your [lifestyle|E]
    [focus|E] is set to a particular $game_concept_skill$.
mentor_possessive:
  source: game_concepts_l_english.yml
  text: Mentor's
mentors:
  source: game_concepts_l_english.yml
  text: Mentors
mentors_possessive:
  source: game_concepts_l_english.yml
  text: Mentors'
mercenaries:
  source: game_concepts_l_english.yml
  text: Mercenaries
mercenary:
  source: game_concepts_l_english.yml
  text: Mercenary
mercenary_company:
  source: game_concepts_l_english.yml
  text: Mercenary Company
mercenary_company_desc:
  source: game_concepts_l_english.yml
  text: '[mercenaries|E] are [soldiers|E] for hire who fight in exchange for [gold|E].
    Mercenary [armies|E] come in various sizes, with different types of [men_at_arms|E]
    and a number of [knights|E].\n\nMercenaries sign up for #V [GetDefine(''NMercenary'',
    ''BASE_HIRE_MONTHS'')] month#! contracts that can be extended for another #V [GetDefine(''NMercenary'',
    ''BASE_HIRE_MONTHS'')] months#! if you are still at [war|E]. Mercenary contracts
    persist even if their Regiments are dismissed — they can be raised again without
    further cost.\n\nYou are allowed to go into [debt|E] in order to hire Mercenaries
    #weak (up to [GetDefine(''NMercenary'', ''ALLOWED_DEBT_MONTHS'')] months)#!.'
mercenary_contract:
  source: game_concepts_l_english.yml
  text: Mercenary Contract
mercenary_contract_desc:
  source: game_concepts_l_english.yml
  text: 'Establishing a [mercenary|E] Contract incurs a one-time cost which allows
    the use of their troops for #V [GetDefine(''NMercenary'', ''BASE_HIRE_MONTHS'')]
    months#!.'
military_power:
  source: game_concepts_l_english.yml
  text: Military Power
modifier:
  source: game_concepts_l_english.yml
  text: Modifier
modifier_base_contributes:
  source: game_concepts_l_english.yml
  text: Base Contributes
modifier_base_contribution:
  source: game_concepts_l_english.yml
  text: Base Contribution
modifier_base_contribution_desc:
  source: game_concepts_l_english.yml
  text: 'A [modifier|E] may change the $game_concept_modifier_base_contribution$ of
    your [vassals|E] [obligations|E]. This is not the same as [modifier_contribution|E].\n\nIf
    you have a [vassal] that has a total [income|E] of #V 10#! [gold|E] and pays you
    #V 1#! [gold] per month, and you gain a [modifier] that increases $game_concept_modifier_base_contribution$
    by #V 10%#!, then the [vassal] instead pays you #V 2#! [gold].'
modifier_base_contributions:
  source: game_concepts_l_english.yml
  text: Base Contributions
modifier_contributes:
  source: game_concepts_l_english.yml
  text: Contributes
modifier_contribution:
  source: game_concepts_l_english.yml
  text: Contribution
modifier_contribution_desc:
  source: game_concepts_l_english.yml
  text: 'A [modifier|E] may change the $game_concept_modifier_contribution$ of your
    [vassals|E] [obligations|E]. This is not the same as [modifier_base_contribution|E].\n\nIf
    you have a [vassal] that pays you #V 1#! [gold|E] per month, and you gain a [modifier]
    that increases $game_concept_modifier_contribution$ by #V 10%#!, then the [vassal]
    instead pays you #V 1.1#! [gold].'
modifier_contributions:
  source: game_concepts_l_english.yml
  text: Contributions
modifier_desc:
  source: game_concepts_l_english.yml
  text: A $game_concept_modifier$ is an effect that changes a value over a longer
    period of time. It may for example change the value of a character's [skills|E],
    or the [success_chance|E] of a [scheme|E].\n\nModifiers typically appear for Characters,
    Schemes or [counties|E].
modifiers:
  source: game_concepts_l_english.yml
  text: Modifiers
mongol_empire:
  source: game_concepts_l_english.yml
  text: Mongol Empire
mongol_empire_desc:
  source: game_concepts_l_english.yml
  text: 'An [empire|E] [title|E] that can be created by a powerful tribal ruler on
    the Steppes. It enables the [mongol_invasion_casus_belli|E].\n\nThe title is created
    by taking the #EMP $become_greatest_of_khans_decision$#! [decision|E].'
mongol_invasion_casus_belli:
  source: game_concepts_l_english.yml
  text: Mongol Invasion Casus Belli
mongol_invasion_casus_belli_desc:
  source: game_concepts_l_english.yml
  text: A powerful [casus_belli|E] available only to the [ruler|E] of the [mongol_empire|E].\n\nIt
    can target an entire [kingdom|E] [title|E] at once, and allows for rapid expansion
    across large swathes of land.
movement_lock:
  source: game_concepts_l_english.yml
  text: Movement Lock
movement_locked:
  source: game_concepts_l_english.yml
  text: Movement Locked
movement_locked_desc:
  source: game_concepts_l_english.yml
  text: After an [army|E] has completed more than half of a given move order, it will
    not be possible to change it until they arrive at their destination.
natural_prowess:
  source: game_concepts_l_english.yml
  text: Natural Prowess
nemeses:
  source: game_concepts_l_english.yml
  text: Nemeses
nemeses_possessive:
  source: game_concepts_l_english.yml
  text: Nemeses'
nemesis:
  source: game_concepts_l_english.yml
  text: Nemesis
nemesis_desc:
  source: game_concepts_l_english.yml
  text: A $game_concept_nemesis$ is a $game_concept_relation$ indicating utter (and
    mutual) contempt and hatred. It is a stronger $game_concept_relation$ than a [rival|E].
    A character can only have one $game_concept_nemesis$.
nemesis_possessive:
  source: game_concepts_l_english.yml
  text: Nemesis'
nickname:
  source: game_concepts_l_english.yml
  text: Nickname
nickname_desc:
  source: game_concepts_l_english.yml
  text: $game_concept_nicknames$, $game_concept_epithets$, and $game_concept_cognomens$
    are all secondary names either taken by or attributed to [characters|E] (e.g.
    Charles 'the Bald'). $game_concept_nicknames$ are purely aesthetic, though the
    circumstances surrounding their acquisition are often dramatic or noteworthy affairs.\n\nBad
    $game_concept_nicknames$ will sometimes be overridden by good ones (such as William
    'the Bastard' becoming William 'the Conqueror').
nicknames:
  source: game_concepts_l_english.yml
  text: Nicknames
nobility:
  source: game_concepts_l_english.yml
  text: Nobility
noble:
  source: game_concepts_l_english.yml
  text: Noble
noble_desc:
  source: game_concepts_l_english.yml
  text: $game_concept_nobles$ are characters who are members of a [dynasty|E]. Characters
    without a Dynasty are considered lowborn [commoners|E].
nobleman:
  source: game_concepts_l_english.yml
  text: Nobleman
noblemen:
  source: game_concepts_l_english.yml
  text: Noblemen
nobles:
  source: game_concepts_l_english.yml
  text: Nobles
noblewoman:
  source: game_concepts_l_english.yml
  text: Noblewoman
noblewomen:
  source: game_concepts_l_english.yml
  text: Noblewomen
nominate:
  source: game_concepts_l_english.yml
  text: Nominate
nominate_desc:
  source: game_concepts_l_english.yml
  text: Under Elective [succession_laws|E], each [elector|E] can Nominate their preferred
    [title_heir|E]. Valid candidates and Elector voting preferences differ depending
    on the specific Law.
nominate_heir:
  source: game_concepts_l_english.yml
  text: Nominate Heir
nomination:
  source: game_concepts_l_english.yml
  text: Nomination
nominations:
  source: game_concepts_l_english.yml
  text: Nominations
objectives:
  source: game_concepts_l_english.yml
  text: Objectives
objectives_desc:
  source: game_concepts_l_english.yml
  text: Certain parts of an enemy [realm|E] (usually the [realm_capital|E] and the
    [holdings|E] in the [war_target|E] region of a [war|E]) are considered $game_concept_objectives$.
    By [occupying|E] $game_concept_objectives$, you start gaining 'ticking' [war_score|E].\n\nFor
    the Defender, [war_score|E] starts to tick up (after an initial period of time)
    if the Attacking side can be prevented from Occupying any $game_concept_objectives$.
obligation:
  source: game_concepts_l_english.yml
  text: Obligation
obligations:
  source: game_concepts_l_english.yml
  text: Obligations
occupation:
  source: game_concepts_l_english.yml
  text: Occupation
occupation_desc:
  source: game_concepts_l_english.yml
  text: Occupied [holdings|E] are temporarily under the control of a hostile [ruler|E]
    during a [war|E]. An [army|E] standing in a [barony|E] with a hostile [fortified_holding|E]
    will start to [besiege|E] it if the number of [soldiers|E] in the army outnumbers
    the [garrison|E].\n\nIf the Siege is successful, the Holding is Occupied, which
    will give [war_score|E] to the Occupying side in the [war|E].\n\nOccupying a Holding
    does not mean it is now yours! Only territory specified by the [war_target|E]
    can actually change hands, and only if the Attacker [wins|E].
occupations:
  source: game_concepts_l_english.yml
  text: Occupations
occupied:
  source: game_concepts_l_english.yml
  text: Occupied
occupy:
  source: game_concepts_l_english.yml
  text: Occupy
occupying:
  source: game_concepts_l_english.yml
  text: Occupying
offensive_war_opinion:
  source: game_concepts_l_english.yml
  text: Offensive War Opinion
offensive_war_opinion_desc:
  source: game_concepts_l_english.yml
  text: Being the main attacker in a war will gradually cause your [vassals|E] to
    dislike you after [GetDefine('NCharacterOpinion', 'OFFENSIVE_WAR_PENALTY_GRACE_PERIOD')]
    months. [civil_wars|E] and [great_holy_wars|E] are excluded from this. Once no
    longer in such a war, the penalty will slowly decay.
offensive_war_opinion_short:
  source: game_concepts_l_english.yml
  text: Offensive War
offer_vassalization:
  source: game_concepts_l_english.yml
  text: Offer Vassalization
offer_vassalization_desc:
  source: game_concepts_l_english.yml
  text: An interaction offering [vassalage|E] to an [independent|E] [ruler|E] of lower
    [title_rank|E], peacefully adding them to the realm.
offer_vassalization_interaction:
  source: game_concepts_l_english.yml
  text: Offer Vassalization Interaction
opinion:
  source: game_concepts_l_english.yml
  text: Opinion
opinion_desc:
  source: game_concepts_l_english.yml
  text: 'Every Character has a one-way $game_concept_opinion$ of every other Character,
    represented by a value ranging from #N -100#! to #P +100#!.\n\nThe Opinion that
    another character has of you is of crucial importance, for it will drive their
    behavior!\n\nYou should be especially wary of the Opinions of your [powerful_vassals|E],
    [spymaster|E] and [spouse|E].'
opinion_i:
  source: game_concepts_l_english.yml
  text: '@opinion_icon!'
opinions:
  source: game_concepts_l_english.yml
  text: Opinions
organized:
  source: game_concepts_l_english.yml
  text: Organized
organized_desc:
  source: game_concepts_l_english.yml
  text: An Organized [faith|E] has a religious hierarchy. Worship and practices are
    more organized and scriptures are formalized.\n\n[GetFaithDoctrine('unreformed_faith_doctrine').GetBaseName]
    [GetReligionFamily('rf_pagan').GetName] Faiths can become Organized by reforming,
    while other Faiths are always considered Organized.
papal_recipient:
  source: game_concepts_l_english.yml
  text: Favored Candidate
papal_recipient_desc:
  source: game_concepts_l_english.yml
  text: If the main target of the [great_holy_war|E] is already held or claimed by
    a member of the aggressor faith, they will be considered the rightful recipient
    of the title being fought over, unless the main [Concept( 'war_contribution',
    'Contributor' )|E] decides to give precedence to their [beneficiary|E].
paper_zoom:
  source: game_concepts_l_english.yml
  text: $ZOOM_LEVEL_PAPER_MAP$
paper_zoom_desc:
  source: game_concepts_l_english.yml
  text: $ZOOM_LEVEL_PAPER_MAP_TOOLTIP$
partition_share:
  source: game_concepts_l_english.yml
  text: Partition Share
partition_share_desc:
  source: game_concepts_l_english.yml
  text: Under any [succession_law|E] with multiple [realm_heirs|E], a [character_possessive|E]
    $game_concept_partition_share$ is which [titles|E] that particular $game_concept_heir$
    will inherit upon [succession|E]. Usually, this means dividing between the children
    of a [ruler|E], or, rarely, their siblings.\n\nTypically, depending on what type
    of $game_concept_succession$ is in place, $game_concept_titles$ may be divided
    evenly between separate [realms|E], evenly within the same $game_concept_realm$,
    or given mostly to the main $game_concept_heir$ while dividing the remainder evenly
    between any other $game_concept_heirs$.
patrilineal:
  source: game_concepts_l_english.yml
  text: Patrilineal
patrilineal_desc:
  source: game_concepts_l_english.yml
  text: In a $game_concept_patrilineal$ [marriage|E], children will be born into their
    father's [house|E].
peace:
  source: game_concepts_l_english.yml
  text: Peace
peace_desc:
  source: game_concepts_l_english.yml
  text: '[wars|E] can end in three types of $game_concept_peace$: [victory|E], [defeat|E],
    or [white_peace|E].\n\nAt #V 100%#! [war_score|E], the other side cannot refuse
    a Peace Offer and must accept [defeat|E].\n\nThe effects of $game_concept_victory$
    or $game_concept_defeat$ depend entirely on the type of [casus_belli|E] that was
    used to declare the war and its associated [war_target|E].'
peace_offer:
  source: game_concepts_l_english.yml
  text: Peace Offer
peace_offers:
  source: game_concepts_l_english.yml
  text: Peace Offers
peasant_faction:
  source: game_concepts_l_english.yml
  text: $peasant_faction$
peasant_faction_desc:
  source: game_concepts_l_english.yml
  text: The $game_concept_peasant_faction$ is populated by [counties|E] with low [county_opinion|E].
    Unlike other [factions|E], this one will always revolt even if [faction_military_power|E]
    is low, as peasants are generally both optimistic and illiterate... Successful
    Peasant Revolts will significantly lower Control in your [realm|E].
peasant_factions:
  source: game_concepts_l_english.yml
  text: Peasant Factions
perk:
  source: game_concepts_l_english.yml
  text: Perk
perk_desc:
  source: game_concepts_l_english.yml
  text: 'Perks are unlockable boons that provide many useful and interesting effects.
    They are unlocked by selecting a [focus|E] within a [lifestyle|E] and spending
    the associated form of [experience|E] #weak (e.g. Intrigue $game_concept_experience$
    if you wish to unlock an $game_concept_intrigue_lifestyle$ $game_concept_perk$.)#!'
perks:
  source: game_concepts_l_english.yml
  text: Perks
personal:
  source: game_concepts_l_english.yml
  text: Personal
personal_scheme:
  source: game_concepts_l_english.yml
  text: Personal Scheme
personal_schemes:
  source: game_concepts_l_english.yml
  text: Personal Schemes
personalities:
  source: game_concepts_l_english.yml
  text: Personalities
personality:
  source: game_concepts_l_english.yml
  text: Personality
personality_desc:
  source: game_concepts_l_english.yml
  text: Characters will act towards you and others according to their Personality,
    which is primarily determined by their [personality_traits|E].
personality_i:
  source: game_concepts_l_english.yml
  text: '@personality_icon!'
personality_trait:
  source: game_concepts_l_english.yml
  text: Personality Trait
personality_trait_desc:
  source: game_concepts_l_english.yml
  text: A $game_concept_personality_trait$ is a [trait|E] that determine a person's
    world-view and what actions they are most likely to take. They also affect the
    [opinion|E] others. One might both lose and gain new traits during one's lifetime.
    Acting against your own Personality causes [stress|E].
personality_traits:
  source: game_concepts_l_english.yml
  text: Personality Traits
physical_trait:
  source: game_concepts_l_english.yml
  text: Physical Trait
physical_trait_desc:
  source: game_concepts_l_english.yml
  text: A $game_concept_physical_trait$ is a descriptor of a physical [trait|E] tied
    to their appearance or behavior, and the level of intellect a character has. Many
    physical features affect how [attracted|E] others are to them.\n\nThey are often
    [congenital|E], thus gained at birth and permanent.
physical_traits:
  source: game_concepts_l_english.yml
  text: Physical Traits
piety:
  source: game_concepts_l_english.yml
  text: Piety
piety_desc:
  source: game_concepts_l_english.yml
  text: $game_concept_piety$ represents the virtue of a Character.\n\nActing piously
    (according to the [doctrines|E] of their [faith|E]) will increase a Character's
    Piety, such as going on a [GetActivityType('activity_pilgrimage').GetName].\n\nPiety
    can be spent on various religious matters depending on [government_form|E], Doctrines,
    etc.\n\nEach time a Character gains $game_concept_piety$, they also progress towards
    the next [piety_level|E].
piety_experience:
  source: game_concepts_l_english.yml
  text: Devotion
piety_experience_desc:
  source: game_concepts_l_english.yml
  text: Each point of Devotion a character gets increases their progress towards the
    next [piety_level|E]. When a character gains [piety|E] they also gain an equal
    amount of Devotion.
piety_i:
  source: game_concepts_l_english.yml
  text: '[GetLocalPlayerPietyTextIcon]'
piety_level_impact:
  source: game_concepts_l_english.yml
  text: Level of Devotion Impact
piety_level_impact_desc:
  source: game_concepts_l_english.yml
  text: Level of Devotion Impact increases or decreases the [modifiers|E] gained from
    your current [piety_level|E].
pilgrimage:
  source: game_concepts_l_english.yml
  text: Pilgrimage
pilgrimage_desc:
  source: game_concepts_l_english.yml
  text: Characters of most [faiths|E] can choose to undertake an [activity|E] to go
    on a $game_concept_pilgrimage$ to a [holy_site|E]. Each [holy_site|E] has an individual
    grace period before you can revisit. \n\nSuch a journey may be filled with both
    opportunity and peril, but upon reaching their destination characters will earn
    [piety|E] and may receive other rewards.
pilgrimages:
  source: game_concepts_l_english.yml
  text: Pilgrimages
pious:
  source: game_concepts_l_english.yml
  text: Pious
playdate:
  source: game_concepts_l_english.yml
  text: $activity_playdate$
playdate_desc:
  source: game_concepts_l_english.yml
  text: An [activity|E] where rulers and courtiers below the age of [EmptyScope.ScriptValue('less_than_two_years_to_adulthood_value')|0V]
    gather to play and forget the dreariness of the day.\n\nParticipants will lose
    [stress|E] and increase their [opinion|E] of the host. There may also be any number
    of other consequences from bringing that many children together.\n\nA [ruler|E]
    will invite their [liege|E] and their [vassals|E] (along with various [courtiers|E])
    to a $activity_playdate$.
player_heir:
  source: game_concepts_l_english.yml
  text: Player Heir
player_heir_desc:
  source: game_concepts_l_english.yml
  text: The $game_concept_player_heir$ is the [heir|E] that a player will keep playing
    as on [succession|E].\n\nThe $game_concept_player_heir$ is usually the same as
    the [primary_heir|E], but if the [succession_law|E] of your [primary_title|E]
    dictates that it should go to a character outside of your [dynasty|E], you will
    instead keep playing as the dynastic heir to your second highest-tier title (or
    third, fourth, etc.).\n\nThis situation is common when your $game_concept_player_heir$
    is voted out under an elective succession law.
point_of_interest:
  source: game_concepts_l_english.yml
  text: Point of Interest
point_of_interest_desc:
  source: game_concepts_l_english.yml
  text: A $game_concept_point_of_interest$ is a location in the world that is worth
    visiting. When you visit that location for the first time, you will gain the benefits
    associated with it.
political_zoom:
  source: game_concepts_l_english.yml
  text: $ZOOM_LEVEL_POLITICAL$
political_zoom_desc:
  source: game_concepts_l_english.yml
  text: $ZOOM_LEVEL_POLITICAL_TOOLTIP$
popular_faction:
  source: game_concepts_l_english.yml
  text: $populist_faction$
popular_faction_desc:
  source: game_concepts_l_english.yml
  text: The $game_concept_popular_faction$ is populated by [counties|E] with low [county_opinion|E]
    that share a common element, such as [culture|E] or [faith|E]. They seek to break
    free, and choose a new [ruler|E] based on their Culture or Faith. This type of
    uprising is typically very dangerous.
popular_factions:
  source: game_concepts_l_english.yml
  text: Populist Factions
power_sharing:
  source: game_concepts_l_english.yml
  text: Power Sharing
powerful_vassal:
  source: game_concepts_l_english.yml
  text: Powerful Vassal
powerful_vassal_desc:
  source: game_concepts_l_english.yml
  text: '''$game_concept_powerful_vassals$'' are the handful of [vassals|E] with the
    most [soldiers|E] and highest [income|E]. You need to pay careful attention to
    these vassals, because they expect to hold a seat on your [council|E] and will
    have significantly lower [opinion|E] of you if they do not.\n\nChanging a [succession_law|E]
    requires all $game_concept_powerful_vassals$ to either have a positive [opinion|E]
    of you, be [cowed|E] by you, or be [imprisoned|E].'
powerful_vassal_possessive:
  source: game_concepts_l_english.yml
  text: Powerful Vassal's
powerful_vassal_powerful:
  source: game_concepts_l_english.yml
  text: Powerful
powerful_vassals:
  source: game_concepts_l_english.yml
  text: Powerful Vassals
preferred_heir:
  source: game_concepts_l_english.yml
  text: Preferred Heir
preferred_heirs:
  source: game_concepts_l_english.yml
  text: Preferred Heirs
preparation_phase:
  source: game_concepts_l_english.yml
  text: Preparation Phase
preparation_phase_desc:
  source: game_concepts_l_english.yml
  text: The $game_concept_preparation_phase$ is the time before an [undirected_great_holy_war|E]
    is declared.\n\nDuring this time, [rulers|E] of attacking [faith|E] can choose
    to pledge military support to the war and/or donate to the [war_chest|E].\n\nA
    timer will count down until the $game_concept_preparation_phase$ ends, whereupon
    the war will be declared.\n\nRulers of the defending [religions|E] can choose
    to counter-pledge their military support during this time, giving an overview
    of the strength of the two sides.
pressed:
  source: game_concepts_l_english.yml
  text: Pressed
pressed_claim:
  source: game_concepts_l_english.yml
  text: Pressed Claim
pressed_claim_desc:
  source: game_concepts_l_english.yml
  text: $game_concept_pressed$ [claims|E] are considered legally strong, and are inherited
    as [unpressed_claims|E] by the children of the [claimant|E].
pressed_claim_i:
  source: game_concepts_l_english.yml
  text: '@pressed_claim!'
pressed_claims:
  source: game_concepts_l_english.yml
  text: Pressed Claims
prestige:
  source: game_concepts_l_english.yml
  text: Prestige
prestige_desc:
  source: game_concepts_l_english.yml
  text: $game_concept_prestige$ represents a Character's fame and social standing.\n\nPrestige
    can be spent on various worldly matters depending on [government_form|E], [doctrines|E],
    et cetera.\n\nEvery time a Character gains Prestige, they also progress toward
    the next [prestige_level|E].
prestige_experience:
  source: game_concepts_l_english.yml
  text: Fame
prestige_experience_desc:
  source: game_concepts_l_english.yml
  text: Each point of Fame a character gets increases their progress towards the next
    [prestige_level|E]. When a character gains [prestige|E] they also gain an equal
    amount of Fame.
prestige_i:
  source: game_concepts_l_english.yml
  text: '@prestige_icon!'
prestige_level:
  source: game_concepts_l_english.yml
  text: Level of Fame
prestige_level_desc:
  source: game_concepts_l_english.yml
  text: A Character's $game_concept_prestige_level$ measures their general reputation,
    and how well perceived they are by everyone.\n\nEach time a Character gains [prestige|E],
    they also progress towards the next $game_concept_prestige_level$.\n\nThe Levels
    are:\n$EFFECT_LIST_BULLET$[GetModifier( 'prestige_level_0' ).GetNameWithTooltip|L]\n$EFFECT_LIST_BULLET$[GetModifier(
    'prestige_level_1' ).GetNameWithTooltip|L]\n$EFFECT_LIST_BULLET$[GetModifier(
    'prestige_level_2' ).GetNameWithTooltip|L]\n$EFFECT_LIST_BULLET$[GetModifier(
    'prestige_level_3' ).GetNameWithTooltip|L]\n$EFFECT_LIST_BULLET$[GetModifier(
    'prestige_level_4' ).GetNameWithTooltip|L]\n$EFFECT_LIST_BULLET$[GetModifier(
    'prestige_level_5' ).GetNameWithTooltip|L]
prestige_level_impact:
  source: game_concepts_l_english.yml
  text: Level of Fame Impact
prestige_level_impact_desc:
  source: game_concepts_l_english.yml
  text: Level of Fame Impact increases or decreases the [modifiers|E] gained from
    your current [prestige_level|E].
prestige_levels:
  source: game_concepts_l_english.yml
  text: Levels of Fame
prestigious:
  source: game_concepts_l_english.yml
  text: Prestigious
prevented_murder:
  source: game_concepts_l_english.yml
  text: Prevented Murder
prevented_murder_desc:
  source: game_concepts_l_english.yml
  text: Rarely, certain situations in the life of the [scheme_target_target|E] of
    a [GetScheme('murder').GetTypeName] may cause the [scheme|E] to fail in the final
    stages of its execution.\n\nThis overrides [success_chance|E].\n\n#WEAK Examples
    include intervention by a bodyguard, a foodtaster, a shieldmaiden, or a loyal
    pet.#!
prevented_murder_prevent:
  source: game_concepts_l_english.yml
  text: Prevent
primary_heir:
  source: game_concepts_l_english.yml
  text: Primary Heir
primary_heir_desc:
  source: game_concepts_l_english.yml
  text: The $game_concept_primary_heir$ is the character who will inherit the [primary_title|E]
    of a [ruler|E] on [succession|E]. This is usually — but not always — the same
    character as the [player_heir|E].
primary_heirs:
  source: game_concepts_l_english.yml
  text: Primary Heirs
primary_spouse:
  source: game_concepts_l_english.yml
  text: Primary Spouse
primary_spouse_desc:
  source: game_concepts_l_english.yml
  text: In [GetFaithDoctrine('doctrine_polygamy').GetBaseName] [faiths|E], [rulers|E]
    must choose one of their [spouses|E] to be their $game_concept_primary_spouse$.
    A ruler's $game_concept_primary_spouse$ gains increased [fertility|E] with them,
    increased [opinion|E] of them, and may serve on their [council|E].
primary_title:
  source: game_concepts_l_english.yml
  text: Primary Title
primary_title_desc:
  source: game_concepts_l_english.yml
  text: A [rulerpossessive|E] $game_concept_primary_title$ is their highest-ranked
    [title|E] that they identify most closely with, determining their Coat of Arms
    and the name of their [realm|E].\n\nIf you control multiple titles of the same
    tier, you can choose which one should be your $game_concept_primary_title$.
primary_titles:
  source: game_concepts_l_english.yml
  text: Primary Titles
prison:
  source: game_concepts_l_english.yml
  text: Prison
prisoner:
  source: game_concepts_l_english.yml
  text: Prisoner
prisoner_of_war:
  source: game_concepts_l_english.yml
  text: Prisoner of War
prisoner_of_war_desc:
  source: game_concepts_l_english.yml
  text: A $game_concept_prisoner_of_war$ is a [prisoner|E] who's captured during a
    [war|E], but not of importance to provide the captors with [war_score|E].\n\n[valuable_prisoners|E]
    are released when the war ends, unlike prisoners of war, but can still be ransomed
    for release.
prisoners:
  source: game_concepts_l_english.yml
  text: Prisoners
prisoners_of_war:
  source: game_concepts_l_english.yml
  text: Prisoners of War
prisons:
  source: game_concepts_l_english.yml
  text: Prisons
prize:
  source: game_concepts_l_english.yml
  text: Prize
prize_desc:
  source: game_concepts_l_english.yml
  text: $game_concept_prizes$ are [artifacts|E] awarded to the victors of [GetActivityType(
    'activity_tournament' ).GetName] [contests|E] with a single winner.\n\nThe quality
    of the $game_concept_prize$ depends on the options chosen by the [activity_host|E]
    and the [era|E].
prizes:
  source: game_concepts_l_english.yml
  text: Prizes
progress_to_victory:
  source: game_concepts_l_english.yml
  text: Progress to Victory
progress_to_victory_desc:
  source: game_concepts_l_english.yml
  text: 'An abstraction of your likelihood to win a given [contest|E] relative to
    the other contestants, based on your [skills|E], [health|E], and [traits|E]. For
    example, a [GetTrait(''giant'').GetName( GetNullCharacter )] with high [prowess|E]
    has an advantage in physical contests fought on foot, such as Wrestling.\n\nA
    minimum $game_concept_progress_to_victory$ is required to guarantee [contest_qualification|E]
    for a [contest|E]. Visit [locales|E] for opportunities to improve your chances
    and sabotage your opponents.\n\nThe Tournament #V Leaderboard#! displays all contestant''s
    current $game_concept_progress_to_victory$.'
progress_to_victory_locale_tt:
  source: game_concepts_l_english.yml
  text: Visit [locales|E] for opportunities to improve your chances or sabotage your
    opponents'.
promote_culture:
  source: game_concepts_l_english.yml
  text: $task_promote_culture$
promote_culture_desc:
  source: game_concepts_l_english.yml
  text: $game_concept_promote_culture$ is a [councillor_task|E] performed by the [steward|E].\n\nIt
    changes the [culture|E] of a [county|E] to match its ruler's $game_concept_culture$.
promote_other_culture_development_decision:
  source: game_concepts_l_english.yml
  text: $promote_other_culture_development_decision_name$ Decision
promote_other_culture_development_decision_desc:
  source: game_concepts_l_english.yml
  text: 'A [decision|E] that enables you to improve [development|E], [control|E],
    [building|E] costs, and defensive [advantage|E] in [counties|E] from different
    [cultures|E] with a [cultural_acceptance|E] of #V 75%#! or more.\n\nTaking the
    Decision will also increase your [prestige|E] [prestige_i] and [levies|E].\n\nAll
    Counties in the [realm|E] are affected. The [gold|E] cost scales with the number
    of affected Counties.'
promoting_cultural_acceptance:
  source: game_concepts_l_english.yml
  text: Promoting Acceptance
prowess:
  source: game_concepts_l_english.yml
  text: Prowess
prowess_i:
  source: game_concepts_l_english.yml
  text: '@skill_prowess_icon!'
prowess_skill:
  source: game_concepts_l_english.yml
  text: Prowess Skill
prowess_skill_desc:
  source: game_concepts_l_english.yml
  text: '$game_concept_prowess$ is a [skill|E] that reflects the Character''s aptitude
    in personal combat.\n\nA high Prowess Skill means they are more likely to survive
    and perform well both as [knights|E] in [battles|E] and in [single_combat_duel_plural|E].\n\nEach
    point of Prowess gives a Knight:\n$BULLET_WITH_TAB$[damage|E]: #V [GetDefine(''NCombat'',
    ''KNIGHT_DAMAGE_PER_PROWESS'')]#!\n$BULLET_WITH_TAB$[toughness|E]: #V [GetDefine(''NCombat'',
    ''KNIGHT_TOUGHNESS_PER_PROWESS'')]#!\n\n$PROWESS_MUSCLE_INFO$'
pursuit:
  source: game_concepts_l_english.yml
  text: Pursuit
pursuit_desc:
  source: game_concepts_l_english.yml
  text: A victorious [army|E] increases the amount of [casualties|E] they inflict
    in the [aftermath|E] of a [battle|E] by their $game_concept_army$'s combined $game_concept_pursuit$
    value, converting [routed_soldiers|E] into [dead_soldiers|E].
raid:
  source: game_concepts_l_english.yml
  text: Raid
raid_desc:
  source: game_concepts_l_english.yml
  text: '[armies|E] can be raised as $game_concept_raiders$ from [rally_points|E].
    $game_concept_raiders$ can move into neighboring lands and pillage them for [gold|E].\n\nIn
    order to $game_concept_raid$, a Raiding Army must stop in a [holding|E] owned
    by a foreign [ruler|E] and choose to start Raiding — upon doing so they will be
    stuck Raiding for a some time, after which they will get Gold and pillage the
    Holding.\n\nGold will be stored on the Army, and only added to the treasury when
    they arrive home. If you defeat a Raiding Army carrying Gold you will take it,
    and they will be unable to Raid you for some time.\n\nOnly some Rulers are allowed
    to $game_concept_raid$, most notably [tribal|E] and [GetGovernment( ''nomad_government''
    ).GetName] Rulers.\n\nSpecific [raid_intents|E] can be set to obtain different
    rewards.'
raided:
  source: game_concepts_l_english.yml
  text: Raided
raider:
  source: game_concepts_l_english.yml
  text: Raider
raiders:
  source: game_concepts_l_english.yml
  text: Raiders
raiding:
  source: game_concepts_l_english.yml
  text: Raiding
raids:
  source: game_concepts_l_english.yml
  text: Raids
rally_point:
  source: game_concepts_l_english.yml
  text: Rally Point
rally_point_desc:
  source: game_concepts_l_english.yml
  text: A $game_concept_rally_point$ is a mustering ground for the [levies|E] and
    [men_at_arms|E] under your command.\n\nIn times of [war|E], you can call up your
    [soldiers|E] at a Rally Point to gather an [army|E].\n\nThe Levies assigned to
    a Rally Point must come from either your own [domain|E] or your [vassals|E]. Rally
    Points can be reorganized, split and merged as you see fit.
rally_points:
  source: game_concepts_l_english.yml
  text: Rally Points
range:
  source: game_concepts_l_english.yml
  text: Range
rank:
  source: game_concepts_l_english.yml
  text: Rank
ranks:
  source: game_concepts_l_english.yml
  text: Ranks
rarity:
  source: game_concepts_l_english.yml
  text: Rarity
real_father:
  source: game_concepts_l_english.yml
  text: Real Father
real_father_desc:
  source: game_concepts_l_english.yml
  text: A character's real father. For most characters, this is the character widely
    acknowledged as their father, but for secret bastards, it is someone else.
realm:
  source: game_concepts_l_english.yml
  text: Realm
realm_capital:
  source: game_concepts_l_english.yml
  text: Realm Capital
realm_capital_desc:
  source: game_concepts_l_english.yml
  text: The $game_concept_realm_capital$ is the [holding|E] where a [ruler|E] and
    their [court|E] resides. This Holding has a [tax|E] bonus, and is always inherited
    by the [primary_heir|E].\n\n[occupying|E] the Realm Capital of an enemy in a war
    gives a significant amount of [war_score|E] and sometimes lets you [imprison|E]
    members of the enemy's family.
realm_capitals:
  source: game_concepts_l_english.yml
  text: Realm Capitals
realm_desc:
  source: game_concepts_l_english.yml
  text: A $game_concept_realm$ is all the land that a [ruler|E] controls either directly
    or through [vassals|E] (in contrast to a [domain|E], which is only the [holdings|E]
    personally owned by a Ruler).
realm_heir:
  source: game_concepts_l_english.yml
  text: Realm Heir
realm_heir_desc:
  source: game_concepts_l_english.yml
  text: A Realm Heir is one of the [heirs|E] of a [realm|E], and will receive either
    all or some of the [titles|E] held by the [ruler|E] of that Realm when that Ruler
    dies.\n\nA Realm may have one or more Realm Heirs depending on its [succession_law|E].
realm_heirs:
  source: game_concepts_l_english.yml
  text: Realm Heirs
realm_law:
  source: game_concepts_l_english.yml
  text: Realm Law
realm_law_desc:
  source: game_concepts_l_english.yml
  text: Laws that are applied to this character's realm, such as the level of [crown_authority|E]
    or [tribal_authority|E].
realm_priest:
  source: game_concepts_l_english.yml
  text: Realm Priest
realm_priest_desc:
  source: game_concepts_l_english.yml
  text: A $game_concept_realm_priest$ is a [councillor|E] in charge of religious and
    spiritual affairs in [faiths|E] with the [GetFaithDoctrine('doctrine_theocracy_temporal').GetBaseName]
    [doctrine|E].\n\nUnlike their [GetFaithDoctrine('doctrine_theocracy_lay_clergy').GetBaseName]
    equivalent ([court_chaplains|E]), $game_concept_realm_priests$ automatically [lease|E]
    all [temple_holdings|E] in a [ruler|E]'s [domain|E], and also receive a portion
    of [taxes|E] and [levies|E] from [vassal|E] $game_concept_realm_priests$.\n\n$game_concept_realm_priests$
    provide their [liege|E] with Levies and Taxes if they have a positive Opinion
    of them. The higher the [opinion|E] of their [liege|E], the more they will provide.\n\n$game_concept_realm_priests$
    with a low Opinion of their Liege will not provide them with any Taxes or Levies,
    and might cause problems.
realm_priest_possessive:
  source: game_concepts_l_english.yml
  text: Realm Priest's
realm_priests:
  source: game_concepts_l_english.yml
  text: Realm Priests
realm_size:
  source: game_concepts_l_english.yml
  text: Realm Size
realm_size_desc:
  source: game_concepts_l_english.yml
  text: A character's $game_concept_realm_size$ is the number of [counties|E] owned
    by them and their [vassals|E].
realms:
  source: game_concepts_l_english.yml
  text: Realms
recently_acquired_holding:
  source: game_concepts_l_english.yml
  text: Recently Acquired Holding
recently_acquired_holding_desc:
  source: game_concepts_l_english.yml
  text: '[holdings|E] acquired in the last year that put a ruler above their [domain_limit|E]
    do not cause penalties to their other holdings, but also provide no [taxes|E]
    or [levies|E].'
recently_acquired_holdings:
  source: game_concepts_l_english.yml
  text: Recently Acquired Holdings
recently_disembarked:
  source: game_concepts_l_english.yml
  text: Recently Disembarked
recently_disembarked_desc:
  source: game_concepts_l_english.yml
  text: An [army|E] will become '$game_concept_recently_disembarked$' whenever it
    disembarks after having been at sea. This will cause the $game_concept_army$ to
    suffer from an [advantage|E] penalty in [battles|E] for a certain duration.
reform:
  source: game_concepts_l_english.yml
  text: Reform
reformation:
  source: game_concepts_l_english.yml
  text: Reformation
reformation_desc:
  source: game_concepts_l_english.yml
  text: The [culture_head|E] is able to change certain parts of their [culture|E]
    through $game_concept_reformation$. This is a process that takes a long time and
    can't be stopped once initiated. \n\nThe reformable parts are:\n$BULLET_WITH_TAB$[traditions|E]\n$BULLET_WITH_TAB$[ethos|E]\n$BULLET_WITH_TAB$[martial_custom|E]
refuse_conversion_crime:
  source: game_concepts_l_english.yml
  text: Refuse Conversion
refuse_conversion_crime_desc:
  source: game_concepts_l_english.yml
  text: Refusing to convert will be considered a [crime|E] if:\n$EFFECT_LIST_BULLET$The
    refusing [character|E] is of the same [religion|E] as the $game_concept_character$
    making the demand\n$EFFECT_LIST_BULLET$The $game_concept_religion$ has [heresies|E]\n$EFFECT_LIST_BULLET$The
    [faith|E] of the $game_concept_character$ making the demand is [faith_hostile|E]
    or more towards the refusing $game_concept_character$'s $game_concept_faith$
refused_conversion_crime:
  source: game_concepts_l_english.yml
  text: Refused Conversion
refusing_conversion_crime:
  source: game_concepts_l_english.yml
  text: Refusing Conversion
regencies:
  source: game_concepts_l_english.yml
  text: Regencies
regencies_possessive:
  source: game_concepts_l_english.yml
  text: Regencies'
regency:
  source: game_concepts_l_english.yml
  text: Regency
regency_desc:
  source: game_concepts_l_english.yml
  text: A Regency is a special form of [diarchy|E] for when the [ruler|E] is not able
    to rule their [realm|E] on their own.\n\nIt generally occurs if the Ruler is a
    [child|E], [imprisoned|E], [GetTrait('incapable').GetName( GetNullCharacter )],
    or attending an [activity|E] outside their Realm.\n\nA $game_concept_regency$
    that persists too long may become an [entrenched_regency|E].
regency_possessive:
  source: game_concepts_l_english.yml
  text: Regency's
regency_veto:
  source: game_concepts_l_english.yml
  text: Diarchy Veto
regency_veto_desc:
  source: game_concepts_l_english.yml
  text: When a [diarch|E] uses their [diarch_powers|E], their [liege|E] may use their
    Diarchy Veto to stop them, at the cost of [prestige|E]
regent:
  source: game_concepts_l_english.yml
  text: Regent
regent_desc:
  source: game_concepts_l_english.yml
  text: A Regent is the name for a [diarch|E] during a [regency|E].\n\nA [ruler|E]
    can designate a Regent before a Regency occurs. Otherwise, the candidate with
    the highest [regent_succession_score|E] is automatically chosen.
regent_possessive:
  source: game_concepts_l_english.yml
  text: Regent's
regent_succession_score:
  source: game_concepts_l_english.yml
  text: Regency Succession Score
regent_succession_score_desc:
  source: game_concepts_l_english.yml
  text: In a [regency|E], the next [regent|E] is picked based on which candidate has
    the highest $game_concept_regent_succession_score$.\n\nIf the [ruler|E] of the
    [realm|E] designates a Regent, they will override the succession order and be
    chosen instead.\n\n#WEAK This favors [characters|E] related to the $game_concept_ruler$,
    especially landless [family|E] at their [court|E] and the politically savvy.#!
regents:
  source: game_concepts_l_english.yml
  text: Regents
regents_possessive:
  source: game_concepts_l_english.yml
  text: Regents'
regiment:
  source: game_concepts_l_english.yml
  text: Regiment
regiment_desc:
  source: game_concepts_l_english.yml
  text: A $game_concept_regiment$ is a group of [soldiers|E] of a single type (e.g.,
    archers, footmen, or [levies|E]). Although $game_concept_levies$ are organized
    into $game_concept_regiments$, the ones of real interest are the [men_at_arms|E].
regiments:
  source: game_concepts_l_english.yml
  text: Regiments
region:
  source: game_concepts_l_english.yml
  text: Region
region_desc:
  source: game_concepts_l_english.yml
  text: A region constitutes a specific geographical area on the map. Unlike [de_jure|E],
    regions are never subject to change.
regions:
  source: game_concepts_l_english.yml
  text: Region
relation:
  source: game_concepts_l_english.yml
  text: Special Relation
relation_desc:
  source: game_concepts_l_english.yml
  text: $game_concept_relations$ are relationships a character has which are not bound
    by family or [vassalage|E]. These $game_concept_relations$ fall into several different
    categories, may carry [character_modifiers|E] for the character involved, and
    determine what things can happen between them.\n\nStandard Relations:\n$EFFECT_LIST_BULLET$
    [friend|E]\n$EFFECT_LIST_BULLET$ [lover|E]\n$EFFECT_LIST_BULLET$ [rival|E]\n$EFFECT_LIST_BULLET$
    [guardian|E]\n$EFFECT_LIST_BULLET$ [ward|E]\n$EFFECT_LIST_BULLET$ [mentor|E]\n$EFFECT_LIST_BULLET$
    [student|E]\n$EFFECT_LIST_BULLET$ [elder|E]\n$EFFECT_LIST_BULLET$ [disciple|E]\n\nUpgraded
    Relations:\n$EFFECT_LIST_BULLET$ [best_friend|E]\n$EFFECT_LIST_BULLET$ [soulmate|E]\n$EFFECT_LIST_BULLET$
    [nemesis|E]\n\nChildhood Relations:\n$EFFECT_LIST_BULLET$ [bully|E]\n$EFFECT_LIST_BULLET$
    [victim|E]\n$EFFECT_LIST_BULLET$ [crush|E]
relations:
  source: game_concepts_l_english.yml
  text: Special Relations
relationship:
  source: game_concepts_l_english.yml
  text: Special Relationship
religion:
  source: game_concepts_l_english.yml
  text: Religion
religions:
  source: game_concepts_l_english.yml
  text: Religions
religious_families:
  source: game_concepts_l_english.yml
  text: Religious Families
religious_family:
  source: game_concepts_l_english.yml
  text: Religious Family
religious_family_desc:
  source: game_concepts_l_english.yml
  text: 'A $game_concept_religious_family$ is a group of [religions|E]. The $game_concept_religious_family$
    affects how the various Religions, and [faiths|E] therein, view each other.\n\nThe
    [GetReligionFamily(''rf_abrahamic'').GetName] Family condones [holy_wars|E] against
    everyone #weak (including other Abrahamics)#!. Religions are susceptible to [heresy|E].\n\nThe
    [GetReligionFamily(''rf_eastern'').GetName] Family only condones Holy Wars against
    other Religious Families.\n\nThe [GetReligionFamily(''rf_pagan'').GetName] Family
    condones Holy Wars against everyone, but Faiths within the Religions must be reformed
    to access them.'
religious_head_succession_law:
  source: game_concepts_l_english.yml
  text: Head of Faith Succession Law
religious_head_succession_law_desc:
  source: game_concepts_l_english.yml
  text: '[rulers|E] who are also [heads_of_faith|E] have an additional realm [succession|E]
    law, requiring that their [heir|E] be of the same [faith|E] as them. This can
    never be changed, and $game_concept_head_of_faith$ [titles|E] cannot have separate
    [title_succession|E]. The only way to remove this type of realm law is for an
    external force to destroy the [head_of_faith|E] $game_concept_title$.'
religious_head_succession_law_short:
  source: game_concepts_l_english.yml
  text: Head of Faith Law
religious_head_succession_laws:
  source: game_concepts_l_english.yml
  text: Head of Faith Succession Law
religious_head_succession_laws_short:
  source: game_concepts_l_english.yml
  text: Head of Faith Laws
religious_relations:
  source: game_concepts_l_english.yml
  text: $task_religious_relations$
religious_relations_desc:
  source: game_concepts_l_english.yml
  text: A [councillor_task|E] performed by the [court_chaplain|E].\nIncreases same-[faith|E]
    [theocratic|E] rulers' opinion of the character, and increases monthly [piety|E]
    gain.
renounce:
  source: game_concepts_l_english.yml
  text: Renounce
renounce_desc:
  source: game_concepts_l_english.yml
  text: '[prisoners|E] can be released in return for Renouncing all [claims|E] on
    [titles|E] within your [realm|E].\n\nHowever, children of the current [holder|E]
    can never lose their Claims as long as the Holder is still alive.'
renounced:
  source: game_concepts_l_english.yml
  text: Renounced
republic:
  source: game_concepts_l_english.yml
  text: Republic
republic_desc:
  source: game_concepts_l_english.yml
  text: $game_concept_republic_government$ is an unplayable [government_form|E] where
    an elected citizen rules for life — the $game_concept_government_form$ of burghers
    and merchants.\n\n$game_concept_republican$ [vassals|E] have static [obligations|E]
    that cannot be changed, and thus always provide a dependable and predictable amount
    of [levies|E] and [taxes|E].
republic_government:
  source: game_concepts_l_english.yml
  text: Republican Government
republican:
  source: game_concepts_l_english.yml
  text: Republican
republics:
  source: game_concepts_l_english.yml
  text: Republics
retinue_maa:
  source: game_concepts_l_english.yml
  text: Retinue Men-at-Arms
retinue_maa_desc:
  source: game_concepts_l_english.yml
  text: Some [accolade_types|E] give access to special [men_at_arms|E]. They are unlocked
    by having an [acclaimed_knight|E] with progress in relevant [GetTrait('tourney_participant').GetName(
    GetNullCharacter )] [trait_level_track|E] or a relevant [commander_trait|E].\n\nRetinue
    $game_concept_men_at_arms$ are restricted to one [regiment|E] and have a limited
    troop count. They are twice as effective at countering other $game_concept_men_at_arms$
    and get increasingly better every era.
retract:
  source: game_concepts_l_english.yml
  text: Retract
retract_desc:
  source: game_concepts_l_english.yml
  text: At [limited_crown_authority|E] or higher, [rulers|E] can $game_concept_retract$
    the [vassal|E] of a Vassal, but unless the latter is [imprisoned|E] this is risky,
    for the Vassal may refuse and rise up in rebellion.\n\nVassal Retraction is considered
    [tyrannical|E] unless the target is guilty of a fairly severe [crime|E].
retracted:
  source: game_concepts_l_english.yml
  text: Retracted
retracting:
  source: game_concepts_l_english.yml
  text: Retracting
retraction:
  source: game_concepts_l_english.yml
  text: Retraction
retractions:
  source: game_concepts_l_english.yml
  text: Retractions
retreat:
  source: game_concepts_l_english.yml
  text: Retreat
retreat_desc:
  source: game_concepts_l_english.yml
  text: An [army|E] will $game_concept_retreat$ if it loses a [battle|E]. Armies can
    also be ordered to $game_concept_retreat$ during $game_concept_battles$. While
    Retreating, the $game_concept_army$ cannot disband or be given new movement orders.
retreats:
  source: game_concepts_l_english.yml
  text: Retreats
revocation:
  source: game_concepts_l_english.yml
  text: Revocation
revocations:
  source: game_concepts_l_english.yml
  text: Revocations
revoke:
  source: game_concepts_l_english.yml
  text: Revoke
revoke_desc:
  source: game_concepts_l_english.yml
  text: At [limited_crown_authority|E] or higher, [rulers|E] can $game_concept_revoke$
    the [titles|E] of their [vassals|E], but unless the Vassal is [imprisoned|E] this
    is a risky proposition, for the Vassal may refuse and rise up in rebellion.\n\nTitle
    Revocation is considered [tyrannical|E] unless the Vassal is guilty of a fairly
    severe [crime|E].
revoke_title_reason:
  source: game_concepts_l_english.yml
  text: Title Revocation Reason
revoke_title_reason_desc:
  source: game_concepts_l_english.yml
  text: A $game_concept_revoke_title_reason$ gives a [liege|E] the opportunity to
    freely [revoke|E] a [title|E] from a subject. They are most often gained from
    the subject being a [criminal|E].
revoke_title_reasons:
  source: game_concepts_l_english.yml
  text: Title Revocation Reasons
revoked:
  source: game_concepts_l_english.yml
  text: Revoked
revoking:
  source: game_concepts_l_english.yml
  text: Revoking
revolt:
  source: game_concepts_l_english.yml
  text: Revolt
revolting:
  source: game_concepts_l_english.yml
  text: Revolting
revolts:
  source: game_concepts_l_english.yml
  text: Revolts
rightful_liege:
  source: game_concepts_l_english.yml
  text: Rightful Liege
rightful_liege_desc:
  source: game_concepts_l_english.yml
  text: $game_concept_rightful_liege_desc_part1$\n\n$game_concept_rightful_liege_desc_part2$
rightful_liege_desc_part1:
  source: game_concepts_l_english.yml
  text: The $game_concept_rightful_liege$ of a [vassal|E] is the [ruler|E] who holds
    the direct [de_jure|E] [liege|E] [title|E] of the $game_concept_vassal$'s [primary_title|E].
    If a $game_concept_vassal$ is not under their $game_concept_rightful_liege$, they
    will contribute less [taxes|E] and [levies|E] as well as suffer an [opinion|E]
    penalty towards their $game_concept_liege$. Holding a higher-[title_tier|E] $game_concept_title$
    of the same $game_concept_de_jure$ results in lessened penalties.\n\nAn exception
    to this is [dukes|E] that are part of an [empire|E]'s $game_concept_de_jure$ hierarchy
    and directly vassalized to their $game_concept_emperor$, which still contribute
    fully, exactly as if the $game_concept_emperor$ held their $game_concept_de_jure$
    [kingdom|E] $game_concept_title$.
rightful_liege_desc_part2:
  source: game_concepts_l_english.yml
  text: '#weak Example: The Count of $c_dunbar$ is a direct vassal of the King of
    $k_england$. Since the King is neither Duke of $d_lothian$, King of $k_scotland$,
    nor Emperor of $e_britannia$, the Count of $c_dunbar$ only contributes a tiny
    amount of their taxes and levies.\n\nThe Count of $c_norfolk$ is also a direct
    vassal of the King of $k_england$. The King does not hold the Duchy of $d_norfolk$,
    so the Count also contributes reduced taxes and levies. However, because the $k_england$
    is the De Jure Kingdom of $c_norfolk$, the Count of $c_norfolk$ still contributes
    significantly more tax and levies to the King than the Count of $c_dunbar$ does.#!'
rival:
  source: game_concepts_l_english.yml
  text: Rival
rival_desc:
  source: game_concepts_l_english.yml
  text: A $game_concept_rival$ is a $game_concept_relation$ indicating life-long resentment,
    if not hatred.\n\n$game_concept_rivals$ who truly despise each other might become
    [nemeses|E].
rival_possessive:
  source: game_concepts_l_english.yml
  text: Rival's
rivalries:
  source: game_concepts_l_english.yml
  text: Rivalries
rivalry:
  source: game_concepts_l_english.yml
  text: Rivalry
rivals:
  source: game_concepts_l_english.yml
  text: Rivals
rivals_possessive:
  source: game_concepts_l_english.yml
  text: Rivals'
roll:
  source: game_concepts_l_english.yml
  text: Roll
rolls:
  source: game_concepts_l_english.yml
  text: Rolls
routed_soldiers:
  source: game_concepts_l_english.yml
  text: Routed Casualties
routed_soldiers_desc:
  source: game_concepts_l_english.yml
  text: In [battle|E], most [casualties|E] are actually $game_concept_routed_soldiers$
    and not dead or badly wounded. Unlike [dead_soldiers|E], these [soldiers|E] will
    live to fight another day and return to the [army|E] after the $game_concept_battle$
    is concluded. They can still be ridden down by the winning side during the [aftermath|E]
    of a $game_concept_battle$, including if the $game_concept_army$ voluntarily [retreats|E].
royal_tour:
  source: game_concepts_l_english.yml
  text: Royal Tour
royal_tours:
  source: game_concepts_l_english.yml
  text: Royal Tours
ruler:
  source: game_concepts_l_english.yml
  text: Ruler
ruler_desc:
  source: game_concepts_l_english.yml
  text: A $game_concept_ruler$ is a [character|E] who holds at least one [title|E].
rulerpossessive:
  source: game_concepts_l_english.yml
  text: Ruler's
rulers:
  source: game_concepts_l_english.yml
  text: Rulers
scales_of_power:
  source: game_concepts_l_english.yml
  text: Scales of Power
scales_of_power_desc:
  source: game_concepts_l_english.yml
  text: During [power_sharing|E], the balance of power between the [liege|E] and their
    [diarch|E] is measured on the $game_concept_scales_of_power$.\n\nAs the $game_concept_scales_of_power_scales$
    tip towards the $game_concept_diarch$, they unlock [diarch_powers|E] and may add
    costs to the Liege's [diarch_affected_actions|E].\n\nAs they tip towards the $game_concept_liege$,
    it instead makes it easier for the Liege to end the [diarchy|E].\n\nThe $game_concept_scales_of_power_scales$
    can be swung by:\n$EFFECT_LIST_BULLET$Using the $swing_scales_currency_interaction$
    [character_interaction|E] against the opposing party\n$EFFECT_LIST_BULLET$As the
    $game_concept_diarch$, serving your $game_concept_liege$ well (however cynically)
    in [mandate|E] events
scales_of_power_scales:
  source: game_concepts_l_english.yml
  text: Scales
scheme:
  source: game_concepts_l_english.yml
  text: Scheme
scheme_desc:
  source: game_concepts_l_english.yml
  text: 'A $game_concept_scheme$ is a long-term attempt to affect the world around
    you. $game_concept_schemes$ can target [characters|e], [titles|e], [cultures|e]
    and [faiths|e], and come in four types: [personal|e], [scheme_hostile|e], [political|e],
    and [contract_schemes|e].\n\nYour $game_concept_scheme$''s [success_chance|e]
    grows over time depending on how proficient you are in the associated [skill|e],
    and can also be impacted by the [agents|e] you plot your $game_concept_scheme$
    with.\n\n#WEAK [secret_schemes|e] are hidden from their target but can be discovered
    if their [secrecy|e] is low. #!'
scheme_discovery_chance:
  source: game_concepts_l_english.yml
  text: Scheme Discovery Chance
scheme_discovery_chance_desc:
  source: game_concepts_l_english.yml
  text: This number is directly deducted from the [secrecy|E] score of any [secret_scheme|E]
    against you or your [courtiers|E].\n\n#WEAK $game_concept_secrecy$ is checked
    when a $game_concept_scheme$ is executed, and at a reduced rate once per month.#!
scheme_hostile:
  source: game_concepts_l_english.yml
  text: Hostile
scheme_owner:
  source: game_concepts_l_english.yml
  text: Scheme Owner
scheme_owner_desc:
  source: game_concepts_l_english.yml
  text: A $game_concept_scheme$'s $game_concept_scheme_owner_owner$ is the [character|E]
    scheming against the [scheme_target|E].\n\n#WEAK For example, the would-be killer
    in a [GetScheme('murder').GetTypeName] $game_concept_scheme$.#!
scheme_owners:
  source: game_concepts_l_english.yml
  text: Scheme Owners
scheme_resistance:
  source: game_concepts_l_english.yml
  text: Scheme Resistance
scheme_resistance_desc:
  source: game_concepts_l_english.yml
  text: The $game_concept_scheme_resistance$ of a [character|E] slows down $game_concept_schemes$
    against them.\n\nThe [scheme_speed|E] of the [scheme_owner|E] is reduced by this
    value, increasing the time it takes for the $game_concept_scheme$ to gain [scheme_opportunity_opportunities|E].\n\n#WEAK
    $game_concept_scheme_resistance$ is increased by the corresponding [skill|E] of
    the [scheme_target|E] and their [spymaster|E], as well as by the '$task_disrupt_schemes$'
    [councillor_task|E] (if the Scheme is [scheme_hostile|E]).#!
scheme_resistance_single:
  source: game_concepts_l_english.yml
  text: Resistance
scheme_success_chance:
  source: game_concepts_l_english.yml
  text: Scheme Success Chance
scheme_success_chance_desc:
  source: game_concepts_l_english.yml
  text: 'The $game_concept_success_chance$ of a [scheme|e] determines how likely it
    is for it to succeed when executed.\n\nA $game_concept_scheme$''s $game_concept_success_chance$
    will [scheme_growth_grow|E] over time, and is based on the assigned [agents|e]
    as well as an associated [skill|e]. $game_concept_success_chance$ is limited by
    [scheme_potential|e]. No $game_concept_scheme$ can ever exceed a 95% $game_concept_success_chance$,
    except for [contract_schemes|e].\n\n#WEAK [secret_schemes|e] have a risk of being
    discovered by target. If that happens your $game_concept_success_chance$ will
    be heavily reduced. #!'
scheme_target:
  source: game_concepts_l_english.yml
  text: Scheme Target
scheme_target_desc:
  source: game_concepts_l_english.yml
  text: A $game_concept_scheme$'s $game_concept_scheme_target_target$ is the [character|E]
    being schemed against by the [scheme_owner|E].\n\n#WEAK For example, the potential
    victim in a [GetScheme('murder').GetTypeName] $game_concept_scheme$.#!
scheme_target_target:
  source: game_concepts_l_english.yml
  text: Target
scheme_targets:
  source: game_concepts_l_english.yml
  text: Scheme Target's
schemer:
  source: game_concepts_l_english.yml
  text: Schemer
schemes:
  source: game_concepts_l_english.yml
  text: Schemes
scheming:
  source: game_concepts_l_english.yml
  text: Scheming
screen:
  source: game_concepts_l_english.yml
  text: Screen
screen_desc:
  source: game_concepts_l_english.yml
  text: A defeated [army|E] reduces the amount of [casualties|E] they take in the
    [aftermath|E] of a [battle|E] by their Army's combined Screen value.
secrecy:
  source: game_concepts_l_english.yml
  text: Secrecy
secrecy_desc:
  source: game_concepts_l_english.yml
  text: The $game_concept_secrecy$ of a [hostile_scheme|e] determines how likely it
    is for it to remain undetected from the [scheme|e] target.\n\nThe $game_concept_secrecy$
    of a $game_concept_scheme$ will have an initial immunity period where it is unable
    to be discovered. After this period, the $game_concept_scheme$ will be at risk
    of being discovered every month through a [scheme_breach_short|e]. Your [agents|e]
    can greatly impact how well you are able to keep your $game_concept_scheme$ secret.\n\n#WEAK
    A $game_concept_scheme$ with a $game_concept_secrecy$ of 80% has a 20% chance
    to be discovered on execution, and a 2% chance to be discovered each month it
    continues.#!
secret:
  source: game_concepts_l_english.yml
  text: Secret
secret_desc:
  source: game_concepts_l_english.yml
  text: $game_concept_secrets$ are things that characters do not wish others to know
    because they are embarrassing, immoral or outright [criminal|E].\n\nSecrets can
    be discovered through the '$task_find_secrets$' [councillor_task|E] for the [spymaster|E].
    Once you know someone's $game_concept_secret$, you can [blackmail|E] the character
    to gain a [hook|E].
secret_scheme:
  source: game_concepts_l_english.yml
  text: Secret Scheme
secret_scheme_desc:
  source: game_concepts_l_english.yml
  text: A $game_concept_secret_scheme$ is a [scheme|E] that progresses unbeknownst
    to the [scheme_target|E].\n\nHowever, it can be discovered, causing a reduction
    in [success_chance|E], and increasing the likelihood that the [scheme_owner|E]
    is discovered when the Scheme executes.\n\n[agents|E] that are recruited to a
    $game_concept_secret_scheme$ have a chance of being [agent_discovery_discovered|E].
secret_scheme_single:
  source: game_concepts_l_english.yml
  text: Secret
secret_schemes:
  source: game_concepts_l_english.yml
  text: Secret Schemes
secrets:
  source: game_concepts_l_english.yml
  text: Secrets
secular_opinion:
  source: game_concepts_l_english.yml
  text: Secular Opinion
secular_opinion_desc:
  source: game_concepts_l_english.yml
  text: 'This type of [opinion|E] affects all characters that are #emphasis not#!
    [clergy|E].'
sell_titles:
  source: game_concepts_l_english.yml
  text: Sell Titles
sell_titles_decision:
  source: game_concepts_l_english.yml
  text: Sell Titles Decision
sell_titles_decision_desc:
  source: game_concepts_l_english.yml
  text: A [decision|E] allowing for the sale of trivial titles — titles of a purely
    symbolic importance. Grants [gold|E] in exchange for [prestige|E].
send_gift:
  source: game_concepts_l_english.yml
  text: Send Gift
sexuality:
  source: game_concepts_l_english.yml
  text: Sexual Orientation
sexuality_desc:
  source: game_concepts_l_english.yml
  text: 'A character''s sexual orientation determines which other characters they
    are potentially [attracted|E] to.\n\nSexual orientation has no impact on who they
    can [marry|E], but may reduce the [fertility|E] of a wedded couple if either spouse
    fails to match the other''s preference.\n\nThe limited sexual orientations modeled
    in #EMP Crusader Kings III#! include:\n$EFFECT_LIST_BULLET$[heterosexual|E]\n$EFFECT_LIST_BULLET$[homosexual|E]\n$EFFECT_LIST_BULLET$[bisexual|E]\n$EFFECT_LIST_BULLET$[asexual|E]'
sharing_power:
  source: game_concepts_l_english.yml
  text: Sharing Power
short_reign:
  source: game_concepts_l_english.yml
  text: Short Reign
short_reign_desc:
  source: game_concepts_l_english.yml
  text: '''Short Reign'' is a decaying [opinion|E] penalty that all characters in
    a [realm|E] get with a new [liege|E].\n\nIn a similar way, subjects get an increasing
    [long_reign|E] Opinion bonus with Lieges who have ruled over them for a long time.'
shunned:
  source: game_concepts_l_english.yml
  text: Shunned
shunned_desc:
  source: game_concepts_l_english.yml
  text: Many [faiths|E] have [doctrines|E] which designate certain behaviors as Shunned.
    Depending on the specific Doctrine, these behaviors may also be considered [criminal|E].\n\nCharacters
    who are caught practicing behaviors that are Shunned by their Faith lose a [piety_level|E]
    and gain a corresponding [fame_trait|E]; this Trait will be disliked by everyone
    whose Faith considers that behavior to be either Shunned or Criminal.\n\nExamples
    of Shunned behaviors include:\n$EFFECT_LIST_BULLET$[GetTrait('fornicator').GetName(
    GetNullCharacter )]\n$EFFECT_LIST_BULLET$[GetTrait('adulterer').GetName( GetNullCharacter
    )]\n$EFFECT_LIST_BULLET$[GetTrait('deviant').GetName( GetNullCharacter )]\n$EFFECT_LIST_BULLET$[GetTrait('sodomite').GetName(
    GetNullCharacter )]\n$EFFECT_LIST_BULLET$[GetTrait('kinslayer_3').GetName( GetNullCharacter
    )]\n$EFFECT_LIST_BULLET$[GetTrait('witch').GetName( GetNullCharacter )]
sick:
  source: game_concepts_l_english.yml
  text: Sick
sickness:
  source: game_concepts_l_english.yml
  text: Sickness
siege:
  source: game_concepts_l_english.yml
  text: Siege
siege_desc:
  source: game_concepts_l_english.yml
  text: Siege is when an [army|E] surrounds a [fortified_holding|E] in order to starve
    the citizens into submission so that it can be [occupied|E]. A Siege starts automatically
    once an Army enters the location of a hostile Fortified Holding and stands still
    — if the Army outnumbers the [garrison|E].\n\nThe besieging Army can [assault|E]
    the Holding if its walls are Breached.
siege_progress:
  source: game_concepts_l_english.yml
  text: Siege Progress
siege_progress_desc:
  source: game_concepts_l_english.yml
  text: The $game_concept_siege_progress$ indicates how close a [siege|E] is to being
    completed and how long the $game_concept_siege$ is expected to last. When Progress
    is full, the [holding|E] will become [occupied|E].\n\nThe amount of $game_concept_siege_progress$
    required is affected by [fort_level|E] and the manning of the [garrison|E].\n\nProgress
    is gained daily and is affected by Siege Events. It can also be increased by having
    [siege_weapons|E], or an [army|E] that vastly outnumbers the [garrison|E].
siege_weapon:
  source: game_concepts_l_english.yml
  text: Siege Weapon
siege_weapon_desc:
  source: game_concepts_l_english.yml
  text: $game_concept_siege_weapons$ are [men_at_arms|E] that focus entirely on [sieges|E].\n\nThey
    do not have an impact on [battles|E], but will make a $game_concept_siege$ complete
    much faster by increasing the [siege_progress|E].\n\nHowever, $game_concept_siege_weapons$
    are only effective at besieging [holdings|E] up to a certain [fort_level|E].
siege_weapons:
  source: game_concepts_l_english.yml
  text: Siege Weapons
sieges:
  source: game_concepts_l_english.yml
  text: Sieges
sin:
  source: game_concepts_l_english.yml
  text: Sin
sin_desc:
  source: game_concepts_l_english.yml
  text: Every [faith|E] considers certain [traits|E] to be Sinful. Characters with
    these Traits incur [opinion|E] penalties from all characters who consider those
    traits Sinful, even if they do not share the same Faith. In addition, Characters
    who have Traits that their own Faith considers Sinful will lose [piety|E] every
    month.\n\nExactly what traits are considered to be Sins varies from Faith to Faith,
    but is typically determined by a combination of that Faith's [core_tenets|E] and
    the [religion|E] the Faith belongs to.
sinful:
  source: game_concepts_l_english.yml
  text: Sinful
single_combat_duel:
  source: game_concepts_l_english.yml
  text: Duel
single_combat_duel_plural:
  source: game_concepts_l_english.yml
  text: Duels
single_combat_fight:
  source: game_concepts_l_english.yml
  text: Single Combat
single_combat_fight_desc:
  source: game_concepts_l_english.yml
  text: In a $game_concept_single_combat_fight$, two [characters|E] fight, either
    to the [character_death_death|E] or to first blood. Each round, both $game_concept_characters$
    select one randomly rolled option from a list, trading blows until one $game_concept_character$
    gets a solid strike in, with the options available depending on your [prowess|E]
    and [traits|E].\n\nSome options may give special effects, and most will increase
    your [single_combat_success_chance|E] and [single_combat_injury_chance|E]. As
    $game_concept_single_combat_duel_plural$ go on, they grow more dangerous and uncertain,
    and it becomes easier to win or hurt yourself. After several rounds, $game_concept_single_combat_duel_plural$
    enter sudden death, ending immediately with the higher $game_concept_prowess$
    combatant winning.\n\nWhen fighting $game_concept_single_combat_duel_plural$,
    you may gain temporary [single_combat_prowess_bonus|E] or [single_combat_prowess_malus|E]
    [character_modifiers|E], increasing or reducing your $game_concept_prowess$ until
    the $game_concept_single_combat_duel$ ends.
single_combat_fight_plural:
  source: game_concepts_l_english.yml
  text: Single Combats
single_combat_fight_sudden_death:
  source: game_concepts_l_english.yml
  text: Sudden Death
single_combat_injury_chance:
  source: game_concepts_l_english.yml
  text: Risk of Injury
single_combat_injury_chance_desc:
  source: game_concepts_l_english.yml
  text: '[characters|E] in $game_concept_single_combat_fight_plural$ run the risk
    of hurting themselves, either by accidentally opening their guard to their opponent,
    or simply injuring themselves with their own weapon. As they fight, they also
    build $game_concept_single_combat_injury_chance$.\n\n$game_concept_single_combat_duel_plural$
    that go on longer make it easier to hurt yourself.\n\nThe counterpart to $game_concept_single_combat_injury_chance$
    is [single_combat_success_chance|E].'
single_combat_injury_chance_injure:
  source: game_concepts_l_english.yml
  text: Injure
single_combat_injury_chance_injury_risk:
  source: game_concepts_l_english.yml
  text: Injury Risk
single_combat_prowess_bonus:
  source: game_concepts_l_english.yml
  text: Duel Edge Bonus
single_combat_prowess_bonus_desc:
  source: game_concepts_l_english.yml
  text: As [characters|E] $game_concept_single_combat_duel$, they may gain temporary
    advantage, such as by leveraging [terrain|E] or special [traits|E]. This increases
    their [prowess|E] for the duration of the current bout, and is lost immediately
    after.\n\nThe opposite of $game_concept_single_combat_prowess_bonus$ is [single_combat_prowess_malus|E].
single_combat_prowess_malus:
  source: game_concepts_l_english.yml
  text: Duel Edge Penalty
single_combat_prowess_malus_desc:
  source: game_concepts_l_english.yml
  text: As [characters|E] $game_concept_single_combat_duel$, they may be afflicted
    with temporary disadvantage, often due to their opponent severely hurting or intimidating
    them. This decreases their [prowess|E] for the duration of the current bout, but
    is regained immediately after.\n\nThe opposite of $game_concept_single_combat_prowess_malus$
    is [single_combat_prowess_bonus|E].
single_combat_success_chance:
  source: game_concepts_l_english.yml
  text: Likelihood of Success
single_combat_success_chance_desc:
  source: game_concepts_l_english.yml
  text: When fighting a $game_concept_single_combat_fight$, your $game_concept_single_combat_success_chance$
    is how well you are doing in the $game_concept_single_combat_duel$. To win, you
    must get your $game_concept_single_combat_success_chance$ far above your opponent's.\n\nAs
    rounds go on, it becomes easier to win, meaning you need less lead over your opponent.\n\nThe
    counterpart to $game_concept_single_combat_success_chance$ is [single_combat_injury_chance|E].
single_combat_success_chance_skill:
  source: game_concepts_l_english.yml
  text: Duel Success
sins:
  source: game_concepts_l_english.yml
  text: Sins
skill:
  source: game_concepts_l_english.yml
  text: Skill
skills:
  source: game_concepts_l_english.yml
  text: Skills
skills_desc:
  source: game_concepts_l_english.yml
  text: 'The Skills of a Character measure how good they are at various things.\n\nThe
    five main skills are: [diplomacy|E], [martial|E], [stewardship|E], [intrigue|E],
    [learning|E].'
skirmisher:
  source: game_concepts_l_english.yml
  text: Skirmisher
skirmishers:
  source: game_concepts_l_english.yml
  text: Skirmishers
skirmishers_desc:
  source: game_concepts_l_english.yml
  text: Skirmishers are [men_at_arms|E] who are lightly armed and skilled in harassing
    the enemy.\n\nWhile each kind of Skirmisher is unique, they generally [counter|E]
    [heavy_infantry|E], and are in turn Countered by [archers|E].
soldier:
  source: game_concepts_l_english.yml
  text: Soldier
soldier_i:
  source: game_concepts_l_english.yml
  text: '@soldier_icon!'
soldiers:
  source: game_concepts_l_english.yml
  text: Soldiers
soldiers_desc:
  source: game_concepts_l_english.yml
  text: $game_concept_soldiers$ is a collective term for the troops in a [regiment|E]
    or an [army|E], whether they are [levies|E], [men_at_arms|E], or [knights|E].\n\nHaving
    the most $game_concept_soldiers$ helps win [battles|E] and [sieges|E].
soulmate:
  source: game_concepts_l_english.yml
  text: Soulmate
soulmate_desc:
  source: game_concepts_l_english.yml
  text: A $game_concept_soulmate$ is a $game_concept_relation$ indicating a deep,
    profound, romantic love. It is a stronger $game_concept_relation$ than a [lover|E].
    A $game_concept_character$ can only have one $game_concept_soulmate$.
soulmate_possessive:
  source: game_concepts_l_english.yml
  text: Soulmate's
soulmates:
  source: game_concepts_l_english.yml
  text: Soulmates
soulmates_possessive:
  source: game_concepts_l_english.yml
  text: Soulmates'
spearmen:
  source: game_concepts_l_english.yml
  text: Spearmen
spearmen_desc:
  source: game_concepts_l_english.yml
  text: Spearmen are [men_at_arms|E] who fight on foot with various polearms.\n\nWhile
    each kind of Spearman is unique, they generally [counter|E] [heavy_cavalry|E]
    and [light_cavalry|E], and are in turn Countered by [heavy_infantry|E].\n\nSpearmen
    are also often strong on hilly and mountainous [terrain|E].
special_guest:
  source: game_concepts_l_english.yml
  text: Special Guest
special_guest_desc:
  source: game_concepts_l_english.yml
  text: Special Guests hold a special place of honor at [grand_activities|E]. Honor
    someone at your [GetActivityType( 'activity_feast' ).GetName] or select a $special_guest_champion$
    to represent you at your [GetActivityType( 'activity_tournament' ).GetName]!\n\nThey
    are more likely to accept your invitation and any activity to which they are invited
    will not begin until they arrive.
special_guests:
  source: game_concepts_l_english.yml
  text: Special Guests
special_troops:
  source: game_concepts_l_english.yml
  text: Special Soldiers
special_troops_desc:
  source: game_concepts_l_english.yml
  text: $game_concept_special_troops$ are not like regular [armies|E], as they are
    not raised from a [holding|E]. $game_concept_special_troops$ can be gained through
    Events, and represent various things such as retinues, ravenous hordes and ambitious
    peasantry.\n\nNormally they do not cost maintenance, and do not reinforce. Use
    them wisely if you have them.\n\nSeveral historical [rulers|E] start with $game_concept_special_troops$.
spectate:
  source: game_concepts_l_english.yml
  text: Spectate
spectating:
  source: game_concepts_l_english.yml
  text: Spectating
spectator:
  source: game_concepts_l_english.yml
  text: Spectator
spectator_desc:
  source: game_concepts_l_english.yml
  text: Any character who is not permitted to compete in a [contest|E] will [spectate|E]
    instead.\n\nIt is also possible to potential [contestants|E] to opt-out instead
    of competing.
spectators:
  source: game_concepts_l_english.yml
  text: Spectators
spiritual_head_of_faith:
  source: game_concepts_l_english.yml
  text: Spiritual Head of Faith
spiritual_head_of_faith_desc:
  source: game_concepts_l_english.yml
  text: 'A [GetFaithDoctrine(''doctrine_spiritual_head'').GetBaseName] [head_of_faith|E]
    is [theocratic|E] and does not have to be [landed|E] #weak (although they can
    be)#!.\n\n$game_concept_head_of_faith_spiritual$ $game_concept_heads_of_faith$
    usually have access to interactions such as being able to grant [claims|E] or
    [gold|E].\n\nShould the [doctrines|E] of the [faith|E] allow for [great_holy_wars|E]
    then they will be [great_holy_war_undirected|E] #weak (e.g. Crusades)#!.'
spouse:
  source: game_concepts_l_english.yml
  text: Spouse
spouse_desc:
  source: game_concepts_l_english.yml
  text: A $game_concept_spouse$ is a Character's husband or wife; the result of a
    [marriage|E].\n\nIn order to have legitimate offspring and produce [heirs|E],
    you should have a Spouse or [concubine|E] (though [bastards|E] can be legitimized).\n\nThe
    only way of forging an [alliance|E] is through marriage or [betrothal|E]; your
    own or that of a close relative.\n\nYour (main) Spouse is also a member of your
    [council|E] and can perform many useful [councillor_tasks|E].\n\n[faith|E] [doctrines|E]
    determine how many $game_concept_spouses$ you can have and how they can be [divorced|E].
spouses:
  source: game_concepts_l_english.yml
  text: Spouses
spymaster:
  source: game_concepts_l_english.yml
  text: Spymaster
spymaster_desc:
  source: game_concepts_l_english.yml
  text: The $game_concept_spymaster$ is your [councillor|E] in charge of matters of
    intrigue and intelligence. Beware of having a disloyal Spymaster, for they can
    easily conceal and participate in a [GetScheme('murder').GetTypeName] against
    you and your close family!
station:
  source: game_concepts_l_english.yml
  text: Station
station_regiment:
  source: game_concepts_l_english.yml
  text: Station Regiment
stationed:
  source: game_concepts_l_english.yml
  text: Stationed
stationed_holding:
  source: game_concepts_l_english.yml
  text: Stationed Holding
stationed_regiment:
  source: game_concepts_l_english.yml
  text: Stationed Regiment
stationed_regiment_desc:
  source: game_concepts_l_english.yml
  text: A [men_at_arms|E] [regiment|E] receives bonuses to its effectiveness by being
    Stationed in a [holding|E].\n\n[buildings|E] can further increase these bonuses
    — sometimes for any type of Men-at-Arms, but most commonly for one or two. For
    example, [GetBuilding('stables_01').GetName] provides a bonus to Stationed [light_cavalry|E]
    and [heavy_cavalry|E].\n\nYou can Station at any time except during [war|E], or
    if the Holding is [occupied|E]. If a Holding is lost, any Stationed Men-at-Arms
    will be unstationed.
steward:
  source: game_concepts_l_english.yml
  text: Steward
steward_desc:
  source: game_concepts_l_english.yml
  text: The $game_concept_steward$ is the [councillor|E] in charge of [domain|E] administration,
    for example matters of [taxation|E], [culture|E] and [development|E].
stewards:
  source: game_concepts_l_english.yml
  text: Stewards
stewardship:
  source: game_concepts_l_english.yml
  text: Stewardship
stewardship_i:
  source: game_concepts_l_english.yml
  text: '@skill_stewardship_icon!'
stewardship_lifestyle:
  source: game_concepts_l_english.yml
  text: Stewardship Lifestyle
stewardship_lifestyle_desc:
  source: game_concepts_l_english.yml
  text: The $game_concept_stewardship_lifestyle$ is suitable for Characters who want
    to improve their [domain|E], appease their [liege|E] and [vassals|E], or gain
    a lot of [gold|E].
stewardship_skill:
  source: game_concepts_l_english.yml
  text: Stewardship Skill
stewardship_skill_desc:
  source: game_concepts_l_english.yml
  text: $game_concept_stewardship$ is a [skill|E] that helps [rulers|E] manage their
    [domains|E]. It directly increases [taxation|E], making it a very useful Skill
    for all rulers.\n\nThe corresponding [lifestyle|E] is the [stewardship_lifestyle|E].
    Every [GetDefine('NDomain', 'STEWARDSHIP_SKILL_FOR_DOMAIN_LIMIT_INCREASE')] points
    of Stewardship increases the [domain_limit|E] by 1.
stop:
  source: game_concepts_l_english.yml
  text: Stop
stops:
  source: game_concepts_l_english.yml
  text: Stops
stress:
  source: game_concepts_l_english.yml
  text: Stress
stress_critical_i:
  source: game_concepts_l_english.yml
  text: '@stress_critical_icon!'
stress_desc:
  source: game_concepts_l_english.yml
  text: Characters gain Stress when taking actions that conflict with their [personality_traits|E].\n\nCharacters
    who gain enough Stress will also gain a [stress_level|E], causing various negative
    effects on their mental health that persist until they manage to reduce their
    Stress.\n\nA straight-forward way to relieve Stress is to partake in [activities|E]
    such as a [GetActivityType( 'activity_hunt' ).GetName].
stress_gain_i:
  source: game_concepts_l_english.yml
  text: '@stress_gain_icon!'
stress_i:
  source: game_concepts_l_english.yml
  text: '@stress_icon!'
stress_level:
  source: game_concepts_l_english.yml
  text: Stress Level
stress_level_desc:
  source: game_concepts_l_english.yml
  text: Every 100 [stress|E] a character accumulates also causes them to gain a Stress
    Level. Stress Levels range from 0 to 3, with each level imposing increasing penalties
    to a character's [fertility|E] and [health|E].\n\nIn addition, as long as a character
    has at least 1 Stress Level, they are vulnerable to [mental_breaks|E].
stress_levels:
  source: game_concepts_l_english.yml
  text: Stress Levels
stress_loss_i:
  source: game_concepts_l_english.yml
  text: '@stress_loss_icon!'
stressed:
  source: game_concepts_l_english.yml
  text: Stressed
strife:
  source: game_concepts_l_english.yml
  text: Strife
strife_desc:
  source: game_concepts_l_english.yml
  text: $game_concept_strife$ is an [opinion|E] penalty for fellow [vassals|E].\n\nStrife
    occurs when a subject of the [liege|E] takes an action against another [vassal|E].
    For example, $game_concept_diarch$ uses their [diarch_powers|E], or in [mandate|E]
    events, as the $game_concept_diarch$ does not have the same authority as their
    [liege|E]
strife_opinion:
  source: game_concepts_l_english.yml
  text: Strife Opinion
strong_hook:
  source: game_concepts_l_english.yml
  text: Strong Hook
strong_hook_desc:
  source: game_concepts_l_english.yml
  text: 'A $game_concept_strong_hook$ is a very powerful [hook|E] that you might have
    on a character who you have [blackmailed|E].\n\n$game_concept_strong_hooks$ are
    much more powerful than [weak_hooks|E], and can force someone to do terrible deeds
    for you — such as to become your [agent|E] in a [GetScheme(''murder'').GetTypeName]
    #weak (in addition to everything a $game_concept_weak_hook$ can do!)#!\n\nA $game_concept_strong_hook$
    also prevents the target from taking any hostile actions towards the holder.\n\n$game_concept_strong_hooks$
    are not spent when used, but instead go on a cooldown before they can be used
    again. The passive effect is not lost when the Hook is used.'
strong_hooks:
  source: game_concepts_l_english.yml
  text: Strong Hooks
strong_vassal:
  source: game_concepts_l_english.yml
  text: Strong Vassal
strong_vassal_desc:
  source: game_concepts_l_english.yml
  text: 'A $game_concept_strong_vassal$ is a [vassal|E] who approaches or exceeds
    their [liege|E] in power, incurring an [opinion|E] penalty. #weak They see their
    liege as weak and ill-suited to rule the realm.#!'
strong_vassals:
  source: game_concepts_l_english.yml
  text: Strong Vassals
struct:
  source: tooltip_structs_l_english.yml
  text: '#TOOLTIP:GAME_CONCEPT,$DESC_KEY$ $KEY_LOC$#!'
student:
  source: game_concepts_l_english.yml
  text: Student
student_desc:
  source: game_concepts_l_english.yml
  text: $game_concept_students$ are [characters|E] benefiting from the advice of a
    [mentor|E], who is helping them to advance one of their [skills|E]. $game_concept_mentors$
    are gained through events when your [lifestyle|E] [focus|E] is set to a $game_concept_skill$
    they excel at.
student_possessive:
  source: game_concepts_l_english.yml
  text: Student's
students:
  source: game_concepts_l_english.yml
  text: Students
students_possessive:
  source: game_concepts_l_english.yml
  text: Students'
success_chance:
  source: game_concepts_l_english.yml
  text: Success Chance
succession:
  source: game_concepts_l_english.yml
  text: Succession
succession_desc:
  source: game_concepts_l_english.yml
  text: $game_concept_succession$ occurs when a [ruler|E] dies, dividing their [gold|E]
    and [titles|E] among their [heirs|E] according to the [succession_laws|E].\n\nPlayers
    will keep playing as their [player_heir|E] even if some titles are lost to other
    characters.\n\nIf there is no player heir, the game will end.\n\n#weak Some rare
    circumstances can force a Succession to occur even before a ruler dies, such as
    losing an [excommunication_war|E]. Legally speaking, however, Rulers may not choose
    to abdicate on their own.#!
succession_law:
  source: game_concepts_l_english.yml
  text: Succession Law
succession_law_desc:
  source: game_concepts_l_english.yml
  text: Every [ruler|E] has a main Succession Law that determines what happens to
    their [titles|E] on [succession|E].\n\nIn addition, an individual Title can sometimes
    have its own [title_succession|E] Law that takes precedence over the default one.
    For example, the Holy Roman Empire might be Elective even though the emperor has
    Partition as main Succession Law.\n\nYou can only change Succession Law when at
    the appropriate level of [crown_authority|E].
succession_laws:
  source: game_concepts_l_english.yml
  text: Succession Laws
supplied:
  source: game_concepts_l_english.yml
  text: Supplied
supplies:
  source: game_concepts_l_english.yml
  text: Supplies
supply:
  source: game_concepts_l_english.yml
  text: Supply
supply_desc:
  source: game_concepts_l_english.yml
  text: $game_concept_supply$ is the amount of food and equipment an [army|E] carries.
    Armies will begin losing $game_concept_supply$ when their size goes above the
    [supply_limit|E] of their current location.\n\nArmies that are running low on
    $game_concept_supplies$ will suffer an [advantage|E] penalty in [battle|E], and
    when they run out completely they will begin suffering from [attrition|E].\n\nSupply
    increases over time as long as the Army remains below the $game_concept_supply_limit$
    in friendly territory.
supply_limit:
  source: game_concepts_l_english.yml
  text: Supply Limit
supply_limit_desc:
  source: game_concepts_l_english.yml
  text: The $game_concept_supply_limit$ dictates the amount of [soldiers|E] you may
    have in a [barony|E], as determined by the Barony's [terrain|E] and [development|E].\n\nShould
    your total [army|E] size go above the $game_concept_supply_limit$, your $game_concept_armies$
    will lose [supply|E] and eventually suffer from [attrition|E].
supply_limit_mult:
  source: game_concepts_l_english.yml
  text: Supply Limit Multiplier
supply_state:
  source: game_concepts_l_english.yml
  text: Supply State
tax:
  source: game_concepts_l_english.yml
  text: Tax
taxation:
  source: game_concepts_l_english.yml
  text: Taxation
taxation_tour:
  source: game_concepts_l_english.yml
  text: Taxation Tour
taxation_tour_desc:
  source: game_concepts_l_english.yml
  text: A [tour_type|E] in which you attempt to extract wealth from your [vassals|E],
    gaining [gold|E].
taxes:
  source: game_concepts_l_english.yml
  text: Taxes
taxes_desc:
  source: game_concepts_l_english.yml
  text: $game_concept_taxes$ are the most important monthly source of [gold|E] [income|E]
    for [rulers|E].\n\nEvery [holding|E] a ruler has provides them with some [domain_taxes|E]
    every month. In addition, most [vassals|E] have an [obligation|E] to pay a portion
    of their own collected Taxes to their [liege|E] in the form of [liege_taxes|E].
temple:
  source: game_concepts_l_english.yml
  text: Temple
temple_holding:
  source: game_concepts_l_english.yml
  text: Temple Holding
temple_holding_desc:
  source: game_concepts_l_english.yml
  text: Temples are a [holding_type|E] that can be held by members of the [clergy|E]
    as [church_property|E] (the [theocratic|E] [government_form|E]). However, in [faiths|E]
    with the [GetFaithDoctrine('doctrine_theocracy_lay_clergy').GetBaseName] [doctrine|E],
    anyone can hold Temples without penalty.\n\nTemples provide a fairly even mix
    of [levies|E] and [taxes|E].
temple_holdings:
  source: game_concepts_l_english.yml
  text: Temple Holdings
temples:
  source: game_concepts_l_english.yml
  text: Temples
temporal_head_of_faith:
  source: game_concepts_l_english.yml
  text: Temporal Head of Faith
temporal_head_of_faith_desc:
  source: game_concepts_l_english.yml
  text: 'A [GetFaithDoctrine(''doctrine_temporal_head'').GetBaseName] [head_of_faith|E]
    acts much like a normal [ruler|E], with the $game_concept_head_of_faith$ [title|E]
    being destroyed should they lose all their land.\n\nShould the [doctrines|E] of
    the [faith|E] allow for [great_holy_wars|E] they will be [great_holy_war_directed|E]
    #weak (e.g. Jihads)#!.'
terrain:
  source: game_concepts_l_english.yml
  text: Terrain
terrain_desc:
  source: game_concepts_l_english.yml
  text: Each [barony|E] has a specific dominant Terrain which can affect things like
    [supply|E], movement speed of [armies|E], the efficacy of the various types of
    [men_at_arms|E] [regiments|E] in [battle|E] and the [buildings|E] that can be
    constructed there.\n\nMany [commander_traits|E] also deal with Terrain.
terrified_i:
  source: game_concepts_l_english.yml
  text: '@terrified_icon!'
theocracies:
  source: game_concepts_l_english.yml
  text: Theocracies
theocracy:
  source: game_concepts_l_english.yml
  text: Theocracy
theocracy_desc:
  source: game_concepts_l_english.yml
  text: $game_concept_theocracy$ is an unplayable [government_form|E] available for
    some [faiths|E] depending on [doctrines|E]. They are usually lead by a [head_of_faith|E]
    or a [landed|E] [realm_priest|E]. A Bishop might also become an [independent|E]
    Theocratic ruler in their own right.
theocracy_government:
  source: game_concepts_l_english.yml
  text: Theocratic Government
theocratic:
  source: game_concepts_l_english.yml
  text: Theocratic
theocratic_government:
  source: game_concepts_l_english.yml
  text: Theocratic Government
theocratic_vassal:
  source: game_concepts_l_english.yml
  text: Theocratic Vassal
theocratic_vassal_desc:
  source: game_concepts_l_english.yml
  text: Vassals who have the [theocratic_government|E] form.\n\nHow they function
    is determined by a [faithpossessive|E] [doctrines|E].
theocratic_vassals:
  source: game_concepts_l_english.yml
  text: Theocratic Vassals
title:
  source: game_concepts_l_english.yml
  text: Title
title_allegiance:
  source: game_concepts_l_english.yml
  text: Title Allegiance
title_allegiance_desc:
  source: game_concepts_l_english.yml
  text: '[vassals|E] can owe Allegiance to a specific [title|E] rather than the person
    of their [liege|E]. This can only happen if the Title has its own [succession_law|E].
    On [succession|E], such Vassals will become vassals of the new Title [holder|E].'
title_claim:
  source: game_concepts_l_english.yml
  text: Title Claim
title_claim_desc:
  source: game_concepts_l_english.yml
  text: A $game_concept_claim$ on a [title|E] represents a legal right to own it and
    provides a [casus_belli|E] to conquer it through [war|E]. Claims also provide
    a valid reason to [revoke|E] [titles|E] off [vassal|E] [holders|E].\n\nClaims
    are usually given to [rulers|E] whenever they lose control of Titles to someone
    else, but can also be created through the [fabricate_claim_short|E] Task.\n\nFurthermore,
    each child (even [bastards|E]) of a ruler has an [implicit_claim|E] on all of
    that ruler's [titles|E]. If they do not inherit that title from the [ruler] when
    they die, those [implicit_claims] will convert to [pressed_claims|E], which can
    then be inherited by their own children as [unpressed_claims|E].
title_claims:
  source: game_concepts_l_english.yml
  text: Title Claims
title_creation:
  source: game_concepts_l_english.yml
  text: Title Creation
title_creation_desc:
  source: game_concepts_l_english.yml
  text: A [ruler|E] who controls the majority of a not-yet-created [titlepossessive|E]
    [de_jure|E] land will be able to create its associated Title. Creating a Title
    costs [gold|E], but gives [prestige|E].\n\nOnly [duchy|E], [kingdom|E] or [empire|E]
    tier Titles can be created.\n\nThe Issues widget contains a list of all Titles
    which you can currently create.
title_desc:
  source: game_concepts_l_english.yml
  text: A $game_concept_title$ is essentially a certificate of land ownership.\n\nThe
    smallest unit of land on the map is the [barony|E]. Baronies are organized into
    larger areas called [counties|E]. Counties [de_jure|E] belong to a [duchy|E],
    duchies to a [kingdom|E], and Kingdoms to an [empire|E].\n\nDuchies, Kingdoms
    and Empires do not always have a [holder|E], but are Titles that can be [created|E]
    by a ruler who controls enough of the corresponding territory.
title_heir:
  source: game_concepts_l_english.yml
  text: Title Heir
title_heir_desc:
  source: game_concepts_l_english.yml
  text: The Title Heir is the [heir|E] to a specific [title|E] with its own [title_succession|E].
    They will receive that Title when the current [holder|E] dies.
title_heirs:
  source: game_concepts_l_english.yml
  text: Title Heirs
title_law:
  source: game_concepts_l_english.yml
  text: Title Law
title_law_desc:
  source: game_concepts_l_english.yml
  text: '[titles|E] can be given a [title_specific_succession|E] Law that is specific
    to that Title. This Law will dictate different rules for succession than other
    titles held by the same character.'
title_laws:
  source: game_concepts_l_english.yml
  text: Title Laws
title_rank:
  source: game_concepts_l_english.yml
  text: Rank
title_rank_desc:
  source: game_concepts_l_english.yml
  text: The personal equivalent of Title [title_tier|E], $game_concept_title_rank$
    determines the position of a [ruler|E] within the hierarchy of the game.\n\nAll
    Title Tiers have an associated Rank, which determines the highest possible Rank
    of [vassals|E] that the [holder|E] can have.\n\n[hegemon|E] > [emperor|E] > [king|E]
    > [duke|E] > [count|E] > [baron|E].
title_ranks:
  source: game_concepts_l_english.yml
  text: Ranks
title_tier:
  source: game_concepts_l_english.yml
  text: Tier
title_tiers:
  source: game_concepts_l_english.yml
  text: Tiers
titlepossessive:
  source: game_concepts_l_english.yml
  text: Title's
titles:
  source: game_concepts_l_english.yml
  text: Titles
titular_title:
  source: game_concepts_l_english.yml
  text: Titular Title
titular_title_desc:
  source: game_concepts_l_english.yml
  text: A $game_concept_titular_title$ is a [title|E] that has no [de_jure|E] land
    on the map. Non-Titular Titles can become Titular through [de_jure_drift|E].\n\n[mercenary|E],
    [head_of_faith|E] and [holy_order|E] Titles are often Titular.
tolerance:
  source: game_concepts_l_english.yml
  text: Tolerance
tolerate:
  source: game_concepts_l_english.yml
  text: Tolerate
tolerates:
  source: game_concepts_l_english.yml
  text: Tolerates
top_liege:
  source: game_concepts_l_english.yml
  text: Top Liege
top_liege_desc:
  source: game_concepts_l_english.yml
  text: The '$game_concept_top_liege$' is the [liege|E] at the top of the [vassal|E]
    hierarchy.\n\nThey are fully [independent|E] [rulers|E] and answer to no mortal.
top_realm:
  source: game_concepts_l_english.yml
  text: Top Realm
top_realm_desc:
  source: game_concepts_l_english.yml
  text: The '$game_concept_top_realm$' is the [realm|E] of the [top_liege|E].
torture:
  source: game_concepts_l_english.yml
  text: Torture
torture_desc:
  source: game_concepts_l_english.yml
  text: '[imprisoned|E] Characters can be $game_concept_tortured$, damaging their
    [health|E] or even maiming them in different ways.\n\nTorture can relieve [stress|E]
    for [GetTrait(''callous'').GetName( GetNullCharacter )] and [GetTrait(''sadistic'').GetName(
    GetNullCharacter )] Characters, but causes Stress for those of a kind nature.\n\nTorturing
    [rulers|E] can also increase your [dread|E].'
tortured:
  source: game_concepts_l_english.yml
  text: Tortured
torturing:
  source: game_concepts_l_english.yml
  text: Torturing
toughness:
  source: game_concepts_l_english.yml
  text: Toughness
toughness_desc:
  source: game_concepts_l_english.yml
  text: A [soldier|E]'s Toughness determines how much [damage|E] they can take in
    [battle|E] before they become a [casualty|E].\n\nA [levy|E] Soldier has [GetDefine('NCombat',
    'LEVY_TOUGHNESS')|0] Toughness.
tour:
  source: game_concepts_l_english.yml
  text: Tour
tour_desc:
  source: game_concepts_l_english.yml
  text: A [grand_activity|E] in which a [liege|E] pays a royal visit to a collection
    of their [vassals|E] to reap rewards such as [gold|E], [dread|E], [opinion|E],
    [control|E], and [cultural_acceptance|E].
tour_grounds:
  source: game_concepts_l_english.yml
  text: Tour Grounds
tour_of_the_grounds:
  source: game_concepts_l_english.yml
  text: Tour of the Grounds
tour_stop:
  source: game_concepts_l_english.yml
  text: Tour Stop
tour_stop_desc:
  source: game_concepts_l_english.yml
  text: 'An [activity_phase|E] during a [royal_tour|E] in which a liege can either:
    attend a [hosted_dinner|E], [tour_the_grounds|E] of their [vassal|E], or enjoy
    a [cultural_festival|E].'
tour_stops:
  source: game_concepts_l_english.yml
  text: Tour Stops
tour_success:
  source: game_concepts_l_english.yml
  text: Tour Success
tour_success_desc:
  source: game_concepts_l_english.yml
  text: A value which determines which rewards you will get at the end of your [grand_tour|E].
    You can gain and lose points by selecting certain options at the start of your
    tour and making decisions which align with your [tour_type|E].
tour_success_point:
  source: game_concepts_l_english.yml
  text: Tour Success Point
tour_success_points:
  source: game_concepts_l_english.yml
  text: Tour Success Points
tour_the_grounds:
  source: game_concepts_l_english.yml
  text: Tour the Grounds
tour_the_grounds_desc:
  source: game_concepts_l_english.yml
  text: An [activity_phase|E] during a [royal_tour|E] in which a [vassal|E] is visited
    by their [liege|E], which often results in an increase in [control|E] in their
    [counties|E].
tour_type:
  source: game_concepts_l_english.yml
  text: Tour Type
tour_type_desc:
  source: game_concepts_l_english.yml
  text: An option which determines what kind of [tour|E] you're having and which rewards
    you gain. Tour types include [majesty_tour|E], [intimidation_tour|E], and [taxation_tour|E].
touring_the_grounds:
  source: game_concepts_l_english.yml
  text: Touring the Grounds
tours:
  source: game_concepts_l_english.yml
  text: Tours
tradition:
  source: game_concepts_l_english.yml
  text: Tradition
traditions:
  source: game_concepts_l_english.yml
  text: Traditions
trait:
  source: game_concepts_l_english.yml
  text: Trait
trait_desc:
  source: game_concepts_l_english.yml
  text: A Character's $game_concept_traits$ describe their personality, quirks, deeds
    and state of being.\n\nTraits can have many effects, but many affect the [skills|E]
    of a Character.\n\nPersonality traits also greatly affect how characters can be
    expected to behave. Acting against your own Personality causes [stress|E].\n\nSome
    Traits are [congenital|E] and can be inherited by offspring.
trait_level_track:
  source: game_concepts_l_english.yml
  text: Trait Path
trait_level_track_desc:
  source: game_concepts_l_english.yml
  text: Some [traits|E] offer several paths, each of which will improve the Trait
    in different ways.\n\nEarning [trait_level_track_xp|E] is required to move further
    down a path.
trait_level_track_xp:
  source: game_concepts_l_english.yml
  text: Trait Experience
trait_level_track_xp_desc:
  source: game_concepts_l_english.yml
  text: 'Experience is required in order to move further down a [trait_level_track|E]
    and improve the bonuses the [trait|E] provides. '
traits:
  source: game_concepts_l_english.yml
  text: Traits
transfer:
  source: game_concepts_l_english.yml
  text: Transfer
transfer_desc:
  source: game_concepts_l_english.yml
  text: '[rulers|E] can $game_concept_transfer$ one of their [vassals|E] to another
    Vassal, as long as the former is of lower rank than the latter. This is a good
    way of raising a Vassal''s [opinion|E], particularly if the Transferred vassal
    is [de_jure|E] part of their [realm|E].'
transferred:
  source: game_concepts_l_english.yml
  text: Transferred
transferring:
  source: game_concepts_l_english.yml
  text: Transferring
travel:
  source: game_concepts_l_english.yml
  text: Travel
travel_danger:
  source: game_concepts_l_english.yml
  text: Danger
travel_danger_desc:
  source: game_concepts_l_english.yml
  text: On your [travels|E] you might pass through dangerous lands, for example deserts
    or swamps, that might impede your journey.\n\nYou can mitigate the risks of Danger
    by improving your [travel_safety|E]. You do this by investing in [travel_options|E]
    or by hiring a [GetCourtPositionType('travel_leader_court_position').GetName()].\n\nSeveral
    [culture_traditions|E] reduce or remove the risks of certain types of Danger.
travel_desc:
  source: game_concepts_l_english.yml
  text: $game_concept_travel$ is the means by which a [character|E] gets from one
    [location|E] to another, primarily to attend [activities|E].\n\nThere are numerous
    ways to plan your journey like choosing a [GetCourtPositionType('travel_leader_court_position').GetName()]
    to hire, selecting [travel_options|E], and customizing your route. You will meet
    many interesting characters along your path, but be wary of [travel_danger|E]
    that may lay in wait.
travel_option:
  source: game_concepts_l_english.yml
  text: Travel Option
travel_option_desc:
  source: game_concepts_l_english.yml
  text: An option you pick when planning your [travel|E] to enhance or modify the
    journey you are about to set out on.
travel_options:
  source: game_concepts_l_english.yml
  text: Travel Options
travel_safety:
  source: game_concepts_l_english.yml
  text: Safety
travel_safety_desc:
  source: game_concepts_l_english.yml
  text: Having a high Safety value will help you avoid [travel_danger|E] during your
    [travels|E]. Your Safety is affected by your [skills|E] as well as those of your
    [GetCourtPositionType('travel_leader_court_position').GetName()].\n\n$min_travel_contribution$
travel_speed:
  source: game_concepts_l_english.yml
  text: Speed
travel_speed_desc:
  source: game_concepts_l_english.yml
  text: Having a high Speed while [traveling|E] will enable you to get to your destination
    faster. Your Speed is affected by your [skills|E] as well as those of your [GetCourtPositionType('travel_leader_court_position').GetName()].\n\n$min_travel_contribution$
traveling:
  source: game_concepts_l_english.yml
  text: Traveling
travels:
  source: game_concepts_l_english.yml
  text: Travels
tribal:
  source: game_concepts_l_english.yml
  text: Tribal
tribal_authority:
  source: game_concepts_l_english.yml
  text: Tribal Authority
tribal_authority_desc:
  source: game_concepts_l_english.yml
  text: '$game_concept_tribal_authority$ represents the general influence that a [tribal|E]
    [ruler|E] wields over their [vassals|E]. Compared to [crown_authority|E], it offers
    fewer powers and at later levels.\n\nThere are four levels of $game_concept_tribal_authority$:
    [disparate_tribes|E], [limited_tribal|E], [high_tribal|E], and [absolute_tribal|E].
    Increasing $game_concept_tribal_authority$ costs an amount of [prestige|E] depending
    on the level and the ruler''s [learning_skill|E], but is generally more expensive
    than increasing crown authority.\n\n#weak Vassals dislike higher levels of $game_concept_tribal_authority$,
    and lowering it is the primary goal of any [liberty_faction|E].#!'
tribal_desc:
  source: game_concepts_l_english.yml
  text: Tribal realms have stunted county [development|E], cannot advance past Tribal
    Era [innovations|E], cannot construct new [holdings|E], and are usually unable
    to change their [succession_law|E].\n\nHowever, they can make use of [prestige|E]
    rather than [gold|E] to build their realms and hire [men_at_arms|E], and have
    access to more [casus_belli|E] compared to [feudal|E] Realms. Non-Tribal armies
    suffer a [supply_limit|E] penalty in hostile Tribal territory.
tribal_government:
  source: game_concepts_l_english.yml
  text: Tribal Government
tribal_holding:
  source: game_concepts_l_english.yml
  text: Tribal Holding
tribal_holding_desc:
  source: game_concepts_l_english.yml
  text: Tribes are poor in [taxes|E] but rich in [levies|E], [prestige|E], and [men_at_arms|E]
    upgrades. They have limited upgrade potential and, while strong early, quickly
    dwindle in power the longer time progresses. Only [tribal|E] characters can hold
    them without penalties.\n\nIf a Tribe exists in a [county|E], no other [holdings|E]
    can be built. [feudal|E] rulers will have to spend [gold|E] to transform Tribes
    into [castles|E].
tribal_holdings:
  source: game_concepts_l_english.yml
  text: Tribal Holdings
tribe:
  source: game_concepts_l_english.yml
  text: Tribe
tribes:
  source: game_concepts_l_english.yml
  text: Tribes
troop_quality:
  source: game_concepts_l_english.yml
  text: Quality
troop_quality_desc:
  source: game_concepts_l_english.yml
  text: '$game_concept_troop_quality$ gauges the power of an [army|E] relative to
    its number of [soldiers|E].\n\nAn $game_concept_army$ that only contains [knights|E]
    and [men_at_arms|E] will be of high $game_concept_troop_quality$ while an $game_concept_army$
    containing a large number of [levies|E] will be of lower $game_concept_troop_quality$.\n\nThis
    means that a smaller $game_concept_army$ with a high $game_concept_troop_quality$
    will punch well above their weight — carefully consider both the amount of Soldiers
    #Emphasis and#! $game_concept_troop_quality$ before engaging the enemy!'
truce:
  source: game_concepts_l_english.yml
  text: Truce
truce_desc:
  source: game_concepts_l_english.yml
  text: Every [war|E] ends with a $game_concept_truce$; a period when the Attacker
    may not declare War again on that same [ruler|E] (the Defender is not bound by
    the Truce).\n\nTruces can be broken, but there is a severe penalty.
truces:
  source: game_concepts_l_english.yml
  text: Truces
tutorial_education_trait:
  source: game_concepts_l_english.yml
  text: Education Trait
tutorial_education_trait_desc:
  source: game_concepts_l_english.yml
  text: Petty King Murchad (your [character|E]) followed a [martial|E] [education|E].
    Upon reaching adulthood, he received the trait Skilled Tactician.
tutorial_education_trait_i:
  source: game_concepts_l_english.yml
  text: '@tutorial_education_trait_icon!'
tyrannical:
  source: game_concepts_l_english.yml
  text: Tyrannical
tyranny:
  source: game_concepts_l_english.yml
  text: Tyranny
tyranny_desc:
  source: game_concepts_l_english.yml
  text: Many actions of a [ruler|E] are considered $game_concept_tyrannical$ — against
    the law or religious [doctrine|E]. For example, [imprisoning|E] or [revoking|E]
    [titles|E] off someone who has committed no [crime|E] is considered Tyrannical.\n\nTyranny
    acts as a blanket [opinion|E] modifier for all characters in the [realm|E].
tyrant:
  source: game_concepts_l_english.yml
  text: Tyrant
uncreated_title:
  source: game_concepts_l_english.yml
  text: Uncreated Title
undirected_great_holy_war:
  source: game_concepts_l_english.yml
  text: Undirected Great Holy War
undirected_great_holy_war_desc:
  source: game_concepts_l_english.yml
  text: An $game_concept_undirected_great_holy_war$ is declared by a $doctrine_spiritual_head_name$
    [head_of_faith|E] with the intention of bringing a [kingdom|E] under the rule
    of their [faith|E].\n\n$game_concept_undirected_great_holy_wars$ are not started
    immediately, instead they enter a [preparation_phase|E].\n\nBefore and during
    the war, rulers of the attacking Faith can choose to donate [gold|E] to the [war_chest|E].\n\nIf
    victorious, the targeted Kingdom will be taken and given to a character of the
    attacking Faith. Rewards for the attackers include [piety|E] and potentially having
    their [dynasty|E] become [landed|E] within the conquered Kingdom.
undirected_great_holy_wars:
  source: game_concepts_l_english.yml
  text: Undirected Great Holy Wars
unlanded:
  source: game_concepts_l_english.yml
  text: Unlanded
unlanded_desc:
  source: game_concepts_l_english.yml
  text: $game_concept_unlanded$ Characters have no [holdings|E] in their [domain|E],
    but can theoretically still be [rulers|E] of a sort. For example, this can be
    the case for [heads_of_faith|E] and the Grand Masters of [holy_orders|E].
unpredictable_i:
  source: game_concepts_l_english.yml
  text: '@unpredictable_icon!'
unpreferred_heir:
  source: game_concepts_l_english.yml
  text: Unpreferred Heir
unpreferred_heirs:
  source: game_concepts_l_english.yml
  text: Unpreferred Heirs
unpressed:
  source: game_concepts_l_english.yml
  text: Unpressed
unpressed_claim:
  source: game_concepts_l_english.yml
  text: Unpressed Claim
unpressed_claim_desc:
  source: game_concepts_l_english.yml
  text: $game_concept_unpressed$ [claims|E] are legally tenuous, and are not inherited
    by the children of the [claimant|E].\n\nHowever, Unpressed Claims become [pressed|E]
    if they are used in a [casus_belli|E] to declare [war|E] — even if the war ends
    in a [white_peace|E].
unpressed_claim_i:
  source: game_concepts_l_english.yml
  text: '@unpressed_claim!'
unpressed_claims:
  source: game_concepts_l_english.yml
  text: Unpressed Claims
unreformed_pagan_combat_bonus:
  source: game_concepts_l_english.yml
  text: Unreformed Pagan Combat Advantage
unreformed_pagan_combat_bonus_desc:
  source: game_concepts_l_english.yml
  text: '[GetFaithDoctrine(''unreformed_faith_doctrine'').GetBaseName] [GetReligionFamily(''rf_pagan'').GetName]
    [faiths|E] get a [battle|E] [advantage|E] in [counties|E] of their faith.'
usurp:
  source: game_concepts_l_english.yml
  text: Usurp
usurp_title:
  source: game_concepts_l_english.yml
  text: Usurp Title
usurp_title_desc:
  source: game_concepts_l_english.yml
  text: 'A [title|E] held by a foreign [ruler|E] can usually be Usurped if more than
    #V 50%#! of its [de_jure|E] [counties|E] are within your [realm|E]. This process
    gives the [title|E] to you, which is particularly important for ensuring you are
    the [rightful_liege|E] of your [vassals|E].\n\nUsurpation is more difficult if
    the current holder''s [faith|E] is hostile to yours; in this case usurpation is
    only possible if the holder no longer possesses any of its [de_jure|E] [counties|E]
    inside his Realm.'
usurpation:
  source: game_concepts_l_english.yml
  text: Usurpation
usurped:
  source: game_concepts_l_english.yml
  text: Usurped
valuable_prisoner_desc:
  source: game_concepts_l_english.yml
  text: A $game_concept_valuable_prisoner$ is a [prisoner|E] who provides [war_score|E]
    when captured during a [war|E].\n\nFor a person to be deemed a $game_concept_valuable_prisoner$,
    they have to be third in line or higher to inherit their war leader's primary
    title.\n\n$game_concept_valuable_prisoners$ are released when the war ends, unlike
    [prisoners_of_war|E].
vassal:
  source: game_concepts_l_english.yml
  text: Vassal
vassal_contract:
  source: game_concepts_l_english.yml
  text: Vassal Contract
vassal_contract_desc:
  source: game_concepts_l_english.yml
  text: '$game_concept_vassal_contracts$ dictate the [obligations|E] between a [vassal|E]
    and their [liege|E].\n\nVassals of the [feudal|E], [clan|E], [administrative|E]
    and [nomadic|E] $game_concept_government_forms$ have access to different [obligations|E],
    negotiated individually for each Vassal.\n\nAll Vassals pay a percentage of their
    total [taxes|E] and [levies|E] to their Liege, based on their [obligations|E].
    #EMP These [modifier_contributions|E] can in turn be modified by ''fine print''
    options such as [GetSubjectContractType( ''fortification_rights'' ).GetObligationName(
    ''fortification_rights_granted'' )].#!\n\nSome Special Contracts are limited to
    certain Ranks:\n$EFFECT_LIST_BULLET$[GetSubjectContractType( ''special_contract''
    ).GetObligationName( ''special_contract_march'' )|V] and [GetSubjectContractType(
    ''special_contract'' ).GetObligationName( ''special_contract_scutage'' )|V]: [duke|E]
    and above\n$EFFECT_LIST_BULLET$[GetSubjectContractType( ''special_contract'' ).GetObligationName(
    ''special_contract_palatinate'' )|V]: [count|E] and above\n$EFFECT_LIST_BULLET$[GetSubjectContractType(
    ''special_contract'' ).GetObligationName( ''special_contract_castellan'' )|V]:
    [count|E] only\n\n#weak Note, [governor|E] [obligations|E] are also known as [province_administrations|E].#!'
vassal_contracts:
  source: game_concepts_l_english.yml
  text: Vassal Contracts
vassal_desc:
  source: game_concepts_l_english.yml
  text: A $game_concept_vassal$ is a [ruler|E] who has sworn fealty to another ruler
    — their [liege|E].\n\nThe $game_concept_vassal$ provides their liege with [levies|E]
    and [taxes|E] — their [obligations|E] — in exchange for protection.\n\nIf a $game_concept_vassal$'s
    [opinion|E] of their liege is low, they may join [factions|E], or [scheme|E] to
    replace their liege with someone else.
vassal_limit:
  source: game_concepts_l_english.yml
  text: Vassal Limit
vassal_limit_desc:
  source: game_concepts_l_english.yml
  text: The $game_concept_vassal_limit$ determines how many [direct_vassals|E] you
    can legally have (excluding [barony|E]-tier vassals).\n\nAlthough you can go above
    your $game_concept_vassal_limit$, doing so will lower the [taxes|E] and [levies|E]
    your vassals provide, and you may be better off [transferring|E] some vassals
    to stay below the limit.
vassal_obligations:
  source: game_concepts_l_english.yml
  text: Vassal Obligations
vassal_obligations_desc:
  source: game_concepts_l_english.yml
  text: $game_concept_vassal_obligations$ define how much [tax|E] and how many [levies|E]
    a [vassal|E] provides to their [liege|E]. A Vassal's [government_form|E] determines
    how their $game_concept_obligations$ are modified.\n\n#weak For example, [GetGovernment('feudal_government').GetName]
    and [GetGovernment('clan_government').GetName] [vassals|E] $game_concept_obligations$
    depend on their [vassal_contract|E], while [GetGovernment('administrative_government').GetName]
    Vassal's depend on their [province_administration|E].
vassal_possessive:
  source: game_concepts_l_english.yml
  text: Vassal's
vassal_stance:
  source: game_concepts_l_english.yml
  text: Vassal Stance
vassal_stance_desc:
  source: game_concepts_l_english.yml
  text: Every [vassal|E] has a Vassal Stance which affects the [opinion|E] they have
    with you as their [liege|E], and which [heir|E] they prefer as successor to the
    [realm|E].\n\nVassals in the same stance will like and dislike the same things.
    For example; all [GetVassalStance( 'glory_hound' ).GetTextIcon][GetVassalStance(
    'glory_hound' ).GetName] Vassals dislike when you lose [wars|E].\n\nEvery Vassal
    Stance prefers one specific Heir. Upon succession, each preferred Heir will have
    lower [legitimacy_expectations|E] with the Vassals of that stance.\n\n#low The
    Vassal Stances are:#!\n$EFFECT_LIST_BULLET$[GetVassalStance( 'courtly' ).GetTextIcon][GetVassalStance(
    'courtly' ).GetName]\n$EFFECT_LIST_BULLET$[GetVassalStance( 'parochial' ).GetTextIcon][GetVassalStance(
    'parochial' ).GetName]\n$EFFECT_LIST_BULLET$[GetVassalStance( 'glory_hound' ).GetTextIcon][GetVassalStance(
    'glory_hound' ).GetName]\n$EFFECT_LIST_BULLET$[GetVassalStance( 'zealot' ).GetTextIcon][GetVassalStance(
    'zealot' ).GetName]\n$EFFECT_LIST_BULLET$[GetVassalStance( 'minority' ).GetTextIcon][GetVassalStance(
    'minority' ).GetName]\n$EFFECT_LIST_BULLET$[GetVassalStance( 'barons_and_minor_landholders'
    ).GetTextIcon][GetVassalStance( 'barons_and_minor_landholders' ).GetName]\n$EFFECT_LIST_BULLET$[GetVassalStance(
    'belligerent' ).GetTextIcon][GetVassalStance( 'belligerent' ).GetName]
vassal_stances:
  source: game_concepts_l_english.yml
  text: Vassal Stances
vassal_taxes:
  source: game_concepts_l_english.yml
  text: Vassal Taxes
vassal_taxes_desc:
  source: game_concepts_l_english.yml
  text: Your $game_concept_vassal_taxes$ consist of the [taxes|E] that you receive
    from you [vassals|E]. The amount depends on the each Vassal's [obligations|E].\n\nFrom
    your Vassals' point of view, these same taxes are called [liege_taxes|E] to distinguish
    them from any $game_concept_vassal_taxes$ they collect from their own $game_concept_vassals$.
vassalage:
  source: game_concepts_l_english.yml
  text: Vassalage
vassalization:
  source: game_concepts_l_english.yml
  text: Vassalization
vassalization_casus_belli:
  source: game_concepts_l_english.yml
  text: Forced Vassalization
vassalize:
  source: game_concepts_l_english.yml
  text: Vassalize
vassalize_casus_belli:
  source: game_concepts_l_english.yml
  text: Forced Vassalization Casus Belli
vassalize_casus_belli_desc:
  source: game_concepts_l_english.yml
  text: 'A [casus_belli|E] allowing for the forceful [vassalization|E] of a neighboring
    independent [ruler|E] of lower rank. Unlocked by the [GetPerk( ''forced_vassalage_perk''
    ).GetName( GetNullCharacter )] [perk|E].\n\nYou can Vassalize any Ruler that does
    not have more than #V [EmptyScope.ScriptValue(''vassalize_default_size'')|0]#!
    [counties|E] in their [realm|E].\n\nThis limit is increased by #P +[EmptyScope.ScriptValue(''vassalize_growth_per_innovation'')|0]#!
    for each of the following innovations:\n$EFFECT_LIST_BULLET$#V $innovation_casus_belli$#!\n$EFFECT_LIST_BULLET$#V
    $innovation_chronicle_writing$#!\n$EFFECT_LIST_BULLET$#V $innovation_divine_right$#!\n$EFFECT_LIST_BULLET$#V
    $innovation_rightful_ownership$#!'
vassalized_casus_belli:
  source: game_concepts_l_english.yml
  text: Forcefully Vassalized
vassals:
  source: game_concepts_l_english.yml
  text: Vassals
vassals_possessive:
  source: game_concepts_l_english.yml
  text: Vassals'
veto:
  source: game_concepts_l_english.yml
  text: Veto
victim:
  source: game_concepts_l_english.yml
  text: Victim
victim_desc:
  source: game_concepts_l_english.yml
  text: A $game_concept_victim$ is a [child|E] who is currently being harassed by
    another $game_concept_child$, often for reasons unclear to anyone but their [bully|E].
    Upon reaching [adulthood|E], they may become [rivals|E] with their $game_concept_bully$,
    or learn to put the struggles of youth behind them.
victim_possessive:
  source: game_concepts_l_english.yml
  text: Victim's
victims:
  source: game_concepts_l_english.yml
  text: Victims
victims_possessive:
  source: game_concepts_l_english.yml
  text: Victims'
victory:
  source: game_concepts_l_english.yml
  text: Victory
victory_desc:
  source: game_concepts_l_english.yml
  text: $game_concept_victory$ is one of three possible [peace_offers|E]. The exact
    outcome of Victory in a [war|E] depends on the [casus_belli|E].\n\nFor the Attacker,
    it typically involves the seizure of [titles|E] within the [war_target|E] region.\n\nFor
    the Defender, Victory usually means the attacker has to pay a large sum of gold
    as war reparations.
virtue:
  source: game_concepts_l_english.yml
  text: Virtue
virtue_desc:
  source: game_concepts_l_english.yml
  text: Every [faith|E] considers certain [traits|E] to be Virtuous. Characters with
    these Traits gain [opinion|E] bonuses from all characters who consider those traits
    Virtuous, even if they do not share the same Faith. In addition, Characters who
    have Traits that their own Faith considers Virtuous will gain bonus [piety|E]
    every month.\n\nExactly what traits are considered to be Virtues varies from Faith
    to Faith, but is typically determined by a combination of that Faith's [core_tenets|E]
    and the [religion|E] the Faith belongs to.
virtues:
  source: game_concepts_l_english.yml
  text: Virtues
virtuous:
  source: game_concepts_l_english.yml
  text: Virtuous
vote_strength:
  source: game_concepts_l_english.yml
  text: Vote Strength
voter_strength:
  source: game_concepts_l_english.yml
  text: Voter Strength
voter_strength_desc:
  source: game_concepts_l_english.yml
  text: Voter Strength represents the amount of influence that an Elector carries
    when voting in an elective [succession_law|E]. This value usually increases depending
    on a ruler's [rank|E], but other factors may come into play depending on the [titlepossessive|E]
    law.
voting_power:
  source: game_concepts_l_english.yml
  text: Voting Power
voting_strength:
  source: game_concepts_l_english.yml
  text: Voting Strength
wanderer:
  source: game_concepts_l_english.yml
  text: Wanderer
wanderer_desc:
  source: game_concepts_l_english.yml
  text: Characters who do not belong to a [court|E] or hold any [titles|e] are called
    Wanderers. They travel the world, visiting Courts as [guests|E] along the way.
    Wanderers might become [mercenary|E] Captains, leaders of [holy_orders|E], [clergy|E]
    members, or [city|E] holders.
wanderers:
  source: game_concepts_l_english.yml
  text: Wanderers
war:
  source: game_concepts_l_english.yml
  text: War
war_chest:
  source: game_concepts_l_english.yml
  text: War Chest
war_chest_desc:
  source: game_concepts_l_english.yml
  text: 'The $game_concept_war_chest$ is a collection of [gold|E], [piety|E] and [prestige|E].
    The contents are primarily used as rewards for successfully winning [undirected_great_holy_wars|E],
    where they are divided between the attackers based upon their participation in
    the [war|E].\n\nA certain portion of what''s in the $game_concept_war_chest$ is
    also divided between the attackers as the War is declared.\n\nIf an [undirected_great_holy_war|E]
    is defeated, the defenders will divide the Piety and Prestige portion of the $game_concept_war_chest$
    between them #weak (the Gold is lost.)#!'
war_contribution:
  source: game_concepts_l_english.yml
  text: War Contribution
war_contribution_desc:
  source: game_concepts_l_english.yml
  text: '[rulers|E] who are helping their [allies|E] in a [war|E] gain $game_concept_war_contribution$
    depending on the number and size of [battles|E] they fight in, as well as the
    number of [holdings|E] they manage to [occupy|E].\n\nAfter a war ends, each Contributor
    is rewarded in relation to their Contribution. The exact spoils depend on the
    war''s [casus_belli|E], but is typically [gold|E], [prestige|E] or [piety|E].\n\nNote
    that Contribution increases even from losing Battles.'
war_desc:
  source: game_concepts_l_english.yml
  text: Armed conflict is the most straightforward way to expand your [realm|E]. However,
    declaring $game_concept_war$ requires a justification for doing so, called a [casus_belli|E].
    You cannot achieve more with a $game_concept_war$ than the selected casus belli
    permits.\n\nWars are won by defeating enemy [armies|E] in [battle|E] and [occupying|E]
    enemy [holdings|E]. Doing so will accrue [war_score|E], eventually forcing the
    enemy to accept [defeat|E] in the [peace_offer|E].\n\nRegardless of the outcome
    of a $game_concept_war$, the attacker gains a [truce|E] toward the defender for
    a time, but the defender is free to declare a new war immediately.
war_leader:
  source: game_concepts_l_english.yml
  text: War Leader
war_leaders:
  source: game_concepts_l_english.yml
  text: War Leaders
war_leaders_desc:
  source: game_concepts_l_english.yml
  text: The primary attacker and the primary defender of a [war|E]. Usually this is
    the character who instigated the war, and the [top_liege|E] of the character who
    holds the [war_target|E].\n\nThere are a variety of [casus_belli|E] for many different
    kinds of war, some with different characters as the $game_concept_war_leaders$.
war_score:
  source: game_concepts_l_english.yml
  text: War Score
war_score_desc:
  source: game_concepts_l_english.yml
  text: 'A measure of which side is winning in a [war|E]. It goes from #N -100#! to
    #P 100#!, with e.g. #N -25#! for one side being #P 25#! for the other. At #P 100#!
    War Score, you can force the other side to accept your [peace_offer|E].\n\nWar
    Score can be gained by:\n$EFFECT_LIST_BULLET$ Defeating [armies|E] in [battle|E]\n$EFFECT_LIST_BULLET$
    [imprisoning|E] the enemy [ruler|E] or their [heirs|E] (not including their [allies|E])\n$EFFECT_LIST_BULLET$
    [occupying|E] enemy [holdings|E] (especially within the [war_target|E])\n$EFFECT_LIST_BULLET$
    Occupying the enemy''s [realm_capital|E]\n$EFFECT_LIST_BULLET$ Controlling all
    [objectives|E] for an extended period of time'
war_target:
  source: game_concepts_l_english.yml
  text: War Target
war_target_desc:
  source: game_concepts_l_english.yml
  text: A region on the map targeted by a [casus_belli|E] in a [war|E]. If the casus
    belli does not target a specific region, the [realm_capital|E] of the defender
    is the $game_concept_war_target$.\n\nThe attacking side gains more [war_score|E]
    by [occupying|E] [holdings|E] within the $game_concept_war_target$. Conversely,
    the defender will — after an initial grace period — start accruing war score for
    holding on to all [counties|E] in the $game_concept_war_target$ region.
war_targets:
  source: game_concepts_l_english.yml
  text: War Targets
ward:
  source: game_concepts_l_english.yml
  text: Ward
ward_desc:
  source: game_concepts_l_english.yml
  text: A $game_concept_ward$ is a [child|E] being [educated|E] by a [guardian|E].
    Each $game_concept_guardian$ can handle up to two $game_concept_wards$.
ward_possessive:
  source: game_concepts_l_english.yml
  text: Ward's
wards:
  source: game_concepts_l_english.yml
  text: Wards
wards_possessive:
  source: game_concepts_l_english.yml
  text: Wards'
warlike_i:
  source: game_concepts_l_english.yml
  text: '@warlike_icon!'
wars:
  source: game_concepts_l_english.yml
  text: Wars
weak_hook:
  source: game_concepts_l_english.yml
  text: Weak Hook
weak_hook_desc:
  source: game_concepts_l_english.yml
  text: 'A $game_concept_weak_hook$ is a fairly common [hook|E] that you might have
    on a character who owes you a favor, or that you have manipulated to do your will.\n\nWhile
    there are many interactions where a $game_concept_weak_hook$ can be used, for
    example in [marriage|E] proposals, they cannot be used to force someone to become
    your [agent|E] in a [GetScheme(''murder'').GetTypeName] and do not provide a passive
    benefit #weak (for that, a [strong_hook|E] is necessary.)#!\n\nEvery child born
    to a [noble|E] [house|E] also owes the [house_head|E] an initial $game_concept_weak_hook$.\n\nOnce
    a $game_concept_weak_hook$ is used, it is #emphasis spent.#!'
weak_hooks:
  source: game_concepts_l_english.yml
  text: Weak Hooks
wedding_banquet:
  source: game_concepts_l_english.yml
  text: Banquet
wedding_banquet_desc:
  source: game_concepts_l_english.yml
  text: The [activity_phase|E] in a [GetActivityType('activity_wedding').GetName]
    in which food and drinks are offered, and the guests enjoy the entertainment and
    mingle.
wedding_ceremony:
  source: game_concepts_l_english.yml
  text: Ceremony
wedding_ceremony_desc:
  source: game_concepts_l_english.yml
  text: The [activity_phase|E] in a [GetActivityType('activity_wedding').GetName]
    in which the [spouses|E] exchange vows and get [married|E].
wedding_night:
  source: game_concepts_l_english.yml
  text: Wedding Night
wedding_night_desc:
  source: game_concepts_l_english.yml
  text: The [activity_phase|E] in a [GetActivityType('activity_wedding').GetName]
    in which the [spouses|E] consummate the wedding, and the guests continue their
    celebration.
white_peace:
  source: game_concepts_l_english.yml
  text: White Peace
white_peace_desc:
  source: game_concepts_l_english.yml
  text: A $game_concept_white_peace$ is one of three possible [peace_offers|E]. Sometimes,
    both sides will agree that the [war|E] is no longer worth pursuing.\n\nWith a
    White Peace, the Attacker typically still loses some [piety|E] or [prestige|E],
    but far less than with a humiliating [defeat|E].
win:
  source: game_concepts_l_english.yml
  text: Win
winning:
  source: game_concepts_l_english.yml
  text: Winning
wins:
  source: game_concepts_l_english.yml
  text: Wins
winter:
  source: game_concepts_l_english.yml
  text: Winter Severity
winter_desc:
  source: game_concepts_l_english.yml
  text: Winter steadily drains [supply|E] over time, making armies lose Supply while
    standing in a barony affected by Winter. The Supply penalty increases with each
    severity. Winter has three different severities; [Concept( 'winter_severity_mild',
    'Mild' )|E], [Concept( 'winter_severity_normal', 'Normal' )|E], and [Concept(
    'winter_severity_harsh', 'Harsh' )|E].
winter_severity_harsh:
  source: game_concepts_l_english.yml
  text: Harsh Winter
winter_severity_harsh_desc:
  source: game_concepts_l_english.yml
  text: '[GetModifier( ''winter_harsh_modifier'' ).GetDescWithEffects]'
winter_severity_mild:
  source: game_concepts_l_english.yml
  text: Mild Winter
winter_severity_mild_desc:
  source: game_concepts_l_english.yml
  text: '[GetModifier( ''winter_mild_modifier'' ).GetDescWithEffects]'
winter_severity_normal:
  source: game_concepts_l_english.yml
  text: Normal Winter
winter_severity_normal_desc:
  source: game_concepts_l_english.yml
  text: '[GetModifier( ''winter_normal_modifier'' ).GetDescWithEffects]'
