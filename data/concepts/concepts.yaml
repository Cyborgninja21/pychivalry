  source: game_concepts_l_english.yml
  text: $game_concept_board_game_type_desc_guts$\n\nIn $game_concept_board_game_type_go$:\n$EFFECT_LIST_BULLET$
    [learning|E] $game_concept_board_game_type_counters$ [martial|E]\n$EFFECT_LIST_BULLET$
    [martial|E] $game_concept_board_game_type_counters$ [intrigue|E]\n$EFFECT_LIST_BULLET$
    [intrigue|E] $game_concept_board_game_type_counters$ [learning|E]
board_game_type_hnefatafl:
  source: game_concepts_l_english.yml
