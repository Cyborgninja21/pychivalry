# CK3 Game Concepts
# Auto-generated from CK3 localization files
# Total concepts: 1870
# Format: concept_name -> {text: 'Display text', source: 'source_file.yml'}
#
# Usage in localization: [concept_name|E]
# Example: [vassal|E] links to game_concept_vassal

abandon_celibacy:
  source: game_concepts_l_english.yml
  text: Abandon Celibacy
abandon_celibacy_decision:
  source: game_concepts_l_english.yml
  text: Abandon Celibacy Decision
abandon_celibacy_desc:
  source: game_concepts_l_english.yml
  text: A [decision|E] that allows a character to lose the [GetTrait('celibate').GetName(
    GetNullCharacter )] [trait|E] at will.
abandon_hook_interaction:
  source: game_concepts_l_english.yml
  text: $abandon_hook_interaction$ Interaction
abandon_hook_interaction_desc:
  source: game_concepts_l_english.yml
  text: An [interaction|E] allowing you to abandon a [hook|E] you have in exchange
    for losing [stress_loss_i][stress|E].
absolute:
  source: game_concepts_l_english.yml
  text: Absolute
absolute_control:
  source: game_concepts_l_english.yml
  text: Absolute Control
absolute_control_desc:
  source: game_concepts_l_english.yml
  text: '$game_concept_absolute_control$ is a special state of [control|E] enabled
    by the $absolute_control_perk_name$ [perk|E], denoting that the ruler has an iron
    grip over the population.\n\nWhenever $game_concept_control$ is at #V 100#!, it
    will instead display as ''$ABSOLUTE_COUNTY_CONTROL$'' and give additional bonuses
    to [taxes|E] and [levies|E].'
absolute_crown_authority:
  source: game_concepts_l_english.yml
  text: Absolute Crown Authority
absolute_crown_authority_desc:
  source: game_concepts_l_english.yml
  text: '$game_concept_absolute_crown_authority$ is the highest level of [crown_authority|E].
    [vassals|E] have a #N -30#! [opinion|E] penalty toward their [liege|E].\n\nAt
    this level — in addition to the effects of [high|E] and [limited|E] Crown Authority
    — the ruler can pick a [designated_heir|E] at a [prestige|E] cost.\n\nFurthermore,
    vassals cannot declare war even against foreign rulers.'
absolute_tribal:
  source: game_concepts_l_english.yml
  text: Absolute
absolute_tribal_authority:
  source: game_concepts_l_english.yml
  text: Absolute Tribal Authority
absolute_tribal_authority_desc:
  source: game_concepts_l_english.yml
  text: '$game_concept_absolute_tribal_authority$ is the highest level of [tribal_authority|E].
    [vassals|E] have a #N -30#! [opinion|E] penalty towards their [liege|E].\n\nAt
    this level, in addition to the effects of [limited_tribal|E] and [high_tribal_authority|E],
    rulers can now settle and become [feudal|E].\n\nUnreformed [tribal|E] [GetReligionFamily(''rf_pagan'').GetName]
    rulers require this law to reform their [faith|E].'
accept_culture:
  source: game_concepts_l_english.yml
  text: $task_accept_culture$
accept_culture_desc:
  source: game_concepts_l_english.yml
  text: $game_concept_accept_culture$ is a [councillor_task|E] performed by the [steward|E].\n\nIt
    increases the [cultural_acceptance|E] between the target [culture|E] and the [rulerpossessive|E]
    $game_concept_culture$.
acclaimed_knight:
  source: game_concepts_l_english.yml
  text: Acclaimed Knight
acclaimed_knight_desc:
  source: game_concepts_l_english.yml
  text: The [knight|E] holding an [accolade|E].\n\nTo be an Acclaimed Knight, a Knight
    must be [unlanded|E] or a [baron|E], with at least [EmptyScope.ScriptValue('accolade_prowess_requirement_value')|0V]
    or more [prowess|E].\n\nAn Acclaimed Knight must be eligible for two [accolade_types|E];
    neither can already belong to another of their [liege|e]'s Acclaimed Knights.
acclaimed_knights:
  source: game_concepts_l_english.yml
  text: Acclaimed Knights
accolade:
  source: game_concepts_l_english.yml
  text: Accolade
accolade_desc:
  source: game_concepts_l_english.yml
  text: Accolades are honors given to [knights|E] by their [liege|E].\n\nThe Knight
    who holds an Accolade becomes an [acclaimed_knight|E].\n\nAs the Acclaimed Knight
    gains [glory|E], the [accolade_rank|E] of their [accolade_types|E] increases,
    offering stronger bonuses to their Liege.\n\nWhen Acclaimed Knights die, they
    are replaced via [accolade_succession|E].\n\n[innovations|e] and higher [title_tiers|e]
    allow [rulers|E] to have more Accolades simultaneously.
accolade_rank:
  source: game_concepts_l_english.yml
  text: Accolade Rank
accolade_rank_desc:
  source: game_concepts_l_english.yml
  text: 'An [accolade|e] has #value 6#! progressive Ranks which unlock bonuses specific
    to its [accolade_types|e], such as [knight_army_modifiers|e].\n\nGaining [glory|E]
    unlocks each Rank, while losing Glory can cause them to be lost.\n\nOdd-numbered
    Ranks are provided by the Accolade''s Primary Attribute, and even-numbered Ranks
    by the Secondary.'
accolade_rank_short:
  source: game_concepts_l_english.yml
  text: Rank
accolade_ranks:
  source: game_concepts_l_english.yml
  text: Accolade Ranks
accolade_succession:
  source: game_concepts_l_english.yml
  text: Accolade Succession
accolade_succession_desc:
  source: game_concepts_l_english.yml
  text: 'Accolade Succession happens when an [accolade|E]''s [acclaimed_knight|e]
    dies or becomes invalid for the role.\n\nThe Acclaimed Knight is replaced by their
    Successor, who must be eligible for the Primary [accolade_type|E]. The secondary
    Attribute can be changed, at the loss of [glory|E].\n\nIf there are no worthy
    Successors in the court, the #high $call_for_acclaimed_knight_candidates_decision$#!
    decision can be used to invite suitable candidates.'
accolade_type:
  source: game_concepts_l_english.yml
  text: Accolade Attribute
accolade_type_desc:
  source: game_concepts_l_english.yml
  text: 'An [accolade|E] has a primary and a secondary Attribute, giving bonuses as
    the [accolade_rank|E] increases.\n\nEach potential [acclaimed_knight|E] is only
    eligible for certain Attributes, mostly based on their [traits|E]. On [accolade_succession|E],
    the new Knight must fulfill the Primary Attribute, but the Secondary can be changed,
    at the loss of [glory|E]. In addition, if an Attribute gives access to [retinue_maa|E],
    it will only do so if it is the Primary Attribute. \n\nEvery Accolade must have
    two unique Attributes. A Liege #high cannot#! duplicate Attributes between Accolades.'
accolade_types:
  source: game_concepts_l_english.yml
  text: Accolade Attributes
accolades:
  source: game_concepts_l_english.yml
  text: Accolades
activities:
  source: game_concepts_l_english.yml
  text: Activities
activity:
  source: game_concepts_l_english.yml
  text: Activity
activity_attending:
  source: game_concepts_l_english.yml
  text: Attending
activity_desc:
  source: game_concepts_l_english.yml
  text: An $game_concept_activity$ is a special occasion hosted for a specific purpose,
    such as going on a [GetActivityType( 'activity_hunt' ).GetName] to relieve [stress|E].\n\nThe
    [activity_host_short|E] holds the Activity in a specific [location|E], which affects
    it in various ways, and everyone who attends must [travel|E] there.\n\nEvery attending
    Character interacts with each other by setting an [intent|E], which they try to
    pursue during the Activity.[SelectLocalization( HasDlcFeature( 'advanced_activities'
    ), 'game_concept_activity_desc_GRAND_ACTIVITY_DLC', '' )]
activity_guest:
  source: game_concepts_l_english.yml
  text: Activity Guest
activity_guest_desc:
  source: game_concepts_l_english.yml
  text: A Guest at an [activity|E] is any [character|E] invited by the [activity_host|E].\n\nWhile
    they usually cannot affect the Activity as much as their Host, they can still
    pursue their [intent|E].
activity_guest_short:
  source: game_concepts_l_english.yml
  text: Guest
activity_guests:
  source: game_concepts_l_english.yml
  text: Activity Guests
activity_guests_short:
  source: game_concepts_l_english.yml
  text: Guests
activity_host:
  source: game_concepts_l_english.yml
  text: Activity Host
activity_host_desc:
  source: game_concepts_l_english.yml
  text: The Host of an [activity|E] is the [ruler|E] that started it.\n\nThey choose
    the [activity_type|E], [location|E], [activity_options|E] and which [activity_guests_short|E]
    to invite.
activity_host_short:
  source: game_concepts_l_english.yml
  text: Host
activity_option:
  source: game_concepts_l_english.yml
  text: Activity Option
activity_option_desc:
  source: game_concepts_l_english.yml
  text: All [activities|E] have Options that allow you to customize the planning of
    your activity. Options have various costs and requirements.
activity_options:
  source: game_concepts_l_english.yml
  text: Activity Options
activity_phase:
  source: game_concepts_l_english.yml
  text: Activity Phase
activity_phase_action:
  source: game_concepts_l_english.yml
  text: Activity Phase Action
activity_phase_action_desc:
  source: game_concepts_l_english.yml
  text: 'Every #V 7#! days while in an [activity|E] there is a chance of #EMP something#!
    happening outside of regular events. These happenings are shown in the top-right
    corner of the Activity window.\n\nWhat can happen depends on the [activity_type|E],
    for example: the [activity_host|E] can gain [prestige|E] or [activity_guest|E]
    [opinion|E] in a [GetActivityType(''activity_feast'').GetName].\n\nThere is always
    a chance of nothing happening, this is especially likely before the current [activity_phase|E]
    is [activity_state_active|E].'
activity_phase_desc:
  source: game_concepts_l_english.yml
  text: An action phase of an activity such as a [contest|E] in a [GetActivityType(
    'activity_tournament' ).GetName], [stop|E] on a [tour|E], or destination of a
    [pilgrimage|E] during which events occur.
activity_phases:
  source: game_concepts_l_english.yml
  text: Activity Phases
activity_state_active:
  source: game_concepts_l_english.yml
  text: Active
activity_state_active_desc:
  source: game_concepts_l_english.yml
  text: When the host and guests have arrived and are engaged in an [activity|E] it
    is considered to be active.
activity_state_passive:
  source: game_concepts_l_english.yml
  text: Passive
activity_state_passive_desc:
  source: game_concepts_l_english.yml
  text: An [activity|E] is in a passive phase when the host or the guests have all
    not yet arrived, or when they are between one [stop|E] and the next on a [tour|E].
activity_type:
  source: game_concepts_l_english.yml
  text: Activity Type
activity_type_desc:
  source: game_concepts_l_english.yml
  text: Some [activities|E] and [grand_activities|E] have different types corresponding
    to special variants of the activity.\n\nFor example, when planning a Hunt, you
    may choose between Standard, Falconry, and Legendary if you fulfill the requirements
    for that type.
activity_types:
  source: game_concepts_l_english.yml
  text: Activity Types
adult:
  source: game_concepts_l_english.yml
  text: Adult
adult_desc:
  source: game_concepts_l_english.yml
  text: 'An $game_concept_adult$ is a character of at least #V 16#! years of age.'
adulthood:
  source: game_concepts_l_english.yml
  text: Adulthood
adults:
  source: game_concepts_l_english.yml
  text: Adults
advantage:
  source: game_concepts_l_english.yml
  text: Advantage
advantage_roll:
  source: game_concepts_l_english.yml
  text: Advantage Roll
advantage_rolls:
  source: game_concepts_l_english.yml
  text: Advantage Rolls
aftermath:
  source: game_concepts_l_english.yml
  text: Aftermath
aftermath_desc:
  source: game_concepts_l_english.yml
  text: The $game_concept_aftermath$ phase of a [battle|E] occurs whenever one side
    has won. The victor will attempt to run down as many [Concept( 'retreat', 'Retreating'
    )|E] [soldiers|E] as possible.\n\n[men_at_arms|E] with high [pursuit|E] are able
    to kill more $game_concept_soldiers$ during the $game_concept_aftermath$, while
    $game_concept_men_at_arms$ with high [screen|E] will protect friendly [soldiers|E].
agent:
  source: game_concepts_l_english.yml
  text: Agent
agent_discovery:
  source: game_concepts_l_english.yml
  text: Agent Discovery
agent_discovery_desc:
  source: game_concepts_l_english.yml
  text: Discovered [secret_scheme|E] [agents|E] may be seen as [criminals|E] by their
    [liege|E], and are likely to be [imprisoned|E] if so.
agent_discovery_discovered:
  source: game_concepts_l_english.yml
  text: Discovered
agent_i:
  source: game_concepts_l_english.yml
  text: '@scheme_agent_icon!'
agents:
  source: game_concepts_l_english.yml
  text: Agents
agents_desc:
  source: game_concepts_l_english.yml
  text: An $game_concept_agent$ is a participant in a [scheme|E], who can provide
    one of three benefits. They can increase [success_chance|e], reduce [scheme_speed_single|e],
    or improve [secrecy|e]. Only the target's [courtiers|E], [guests|E], and [direct_vassals|E]
    can be recruited as Agents.\n\nFor [scheme_hostile|E] Schemes, having agents close
    to the target is very important. For example [councillors|E] or [close_family|E]
    of the Scheme Target contribute more to $game_concept_scheme_speed_single$ and
    $game_concept_success_chance$.\n\nBeing an $game_concept_agent$ in a [hostile_scheme|e]
    is a [crime|E], and $game_concept_agent$ risk being [agent_discovery_discovered|E].
ai_cautious_personality:
  source: game_concepts_l_english.yml
  text: Cautious
ai_economical_boom_personality:
  source: game_concepts_l_english.yml
  text: Builder
ai_economical_unpredictable_personality:
  source: game_concepts_l_english.yml
  text: Unpredictable
ai_warlike_personality:
  source: game_concepts_l_english.yml
  text: Warlike
alliance:
  source: game_concepts_l_english.yml
  text: Alliance
alliance_desc:
  source: game_concepts_l_english.yml
  text: An $game_concept_alliance$ is a diplomatic relation between two [rulers|E].
    [independent|E] Rulers can call on $game_concept_allies$ to join each others [wars|E].\n\nAlliances
    are created and maintained through a [marriage|E] or [betrothal|E], as long as
    the two characters that are wed are closely enough related to the two Rulers.
    For example, if a [king|E] marries off his daughter to another King's son, the
    two Kings become $game_concept_allies$.\n\n[lieges|E] can also create $game_concept_alliances$
    with their [vassals|E]. The Liege cannot call the Vassal to War, but it prevents
    them from joining [factions|E].
alliances:
  source: game_concepts_l_english.yml
  text: Alliances
allied:
  source: game_concepts_l_english.yml
  text: Allied
allies:
  source: game_concepts_l_english.yml
  text: Allies
ally:
  source: game_concepts_l_english.yml
  text: Ally
ally_i:
  source: game_concepts_l_english.yml
  text: '@alliance_icon!'
archer:
  source: game_concepts_l_english.yml
  text: Archer
archer_cavalry:
  source: game_concepts_l_english.yml
  text: Archer Cavalry
archer_cavalry_desc:
  source: game_concepts_l_english.yml
  text: $game_concept_archer_cavalry$ are mounted [men_at_arms|E] equipped with ranged
    weapons.\n\nWhile each kind of $game_concept_archer_cavalry$ is unique, they generally
    [counter|E] [heavy_infantry|E], and are in turn Countered by [archers|E] equipped
    with crossbows.\n\n$game_concept_archer_cavalry$ are also often strong on flat
    [terrain|E], particularly Steppe.
archers:
  source: game_concepts_l_english.yml
  text: Archers
archers_desc:
  source: game_concepts_l_english.yml
  text: Archers are [men_at_arms|E] who fight on foot with ranged weapons.\n\nWhile
    each kind of Archer is unique, they generally [counter|E] [skirmishers|E], and
    are in turn Countered by [heavy_cavalry|E] and [light_cavalry|E].
armies:
  source: game_concepts_l_english.yml
  text: Armies
army:
  source: game_concepts_l_english.yml
  text: Army
army_commander:
  source: game_concepts_l_english.yml
  text: Army Commander
army_commander_desc:
  source: game_concepts_l_english.yml
  text: An $game_concept_army_commander$ is a Character in command of an [army|E].
    Any of your [courtiers|E] or direct [vassals|E] can potentially be assigned as
    a Commander (subject to age, [health|E], and [doctrines|E]).\n\nIn [battle|E],
    the [martial_skill|E] of the Commander heavily influences the [advantage|E]. As
    long as there is a Commander present, additional [rolls|E] will be made in attempt
    to increase the $game_concept_advantage$.\n\nIn addition, [commander_traits|E]
    can provide an Army with many different perks, both in and out of Battle.
army_commanders:
  source: game_concepts_l_english.yml
  text: Army Commanders
army_desc:
  source: game_concepts_l_english.yml
  text: Armies are used to win [wars|E] by engaging in [battle|E] with other armies,
    and to [besiege|E] and [occupy|E] enemy [fortified_holdings|E]. Armies are raised
    in [rally_points|E] and primarily consist of [levies|E] and [men_at_arms|E], but
    can also be bolstered by [mercenaries|E] and [holy_orders|E].\n\nArmies can move
    across water by spending an amount of [gold|E] to secure transport. They can suffer
    losses from [attrition|E] if the local [barony|E] is unable to adequately [supply|E]
    them.
artifact_rarity:
  source: game_concepts_l_english.yml
  text: Artifact Rarity
artifact_rarity_desc:
  source: game_concepts_l_english.yml
  text: Some [artifacts|E] are rarer than others, which is reflected in their Rarity.\n\nThe
    levels are, from lowest to highest:\n$BULLET_WITH_TAB$Common (never shown since
    it is the default)\n$BULLET_WITH_TAB$$masterwork$\n$BULLET_WITH_TAB$$famed$\n$BULLET_WITH_TAB$$illustrious$
asexual:
  source: game_concepts_l_english.yml
  text: Asexual
asexual_desc:
  source: game_concepts_l_english.yml
  text: 'In #EMP Crusader Kings III#!, this character experiences little or no attraction
    to other characters regardless of gender.'
assault:
  source: game_concepts_l_english.yml
  text: Assault
assault_desc:
  source: game_concepts_l_english.yml
  text: An Assault is when a [besieging|E] [army|E] attempts to storm a [fortified_holding|E]
    at the risk of losing a lot of [soldiers|E]. Assaults can only be attempted if
    the walls of the Holding have been Breached, which requires that the Army contains
    [siege_weapons|E].
assaulted:
  source: game_concepts_l_english.yml
  text: Assaulted
assaulting:
  source: game_concepts_l_english.yml
  text: Assaulting
assaults:
  source: game_concepts_l_english.yml
  text: Assaults
at_peace_opinion:
  source: game_concepts_l_english.yml
  text: At Peace Opinion
at_peace_opinion_desc:
  source: game_concepts_l_english.yml
  text: 'Characters who have the [GetFaithDoctrine(''tenet_warmonger'').GetBaseName]
    [core_tenet|E] as part of their [faith|E] will have the ''$game_concept_at_peace_opinion$''
    instead of the [offensive_war_opinion|E] penalty.\n\nIf you are at peace for too
    long, your [vassals|E] will think less of you #weak (if they share your Faith).#!'
at_peace_opinion_short:
  source: game_concepts_l_english.yml
  text: At Peace
attracted:
  source: game_concepts_l_english.yml
  text: Attracted
attraction:
  source: game_concepts_l_english.yml
  text: Attraction
attraction_desc:
  source: game_concepts_l_english.yml
  text: Attraction is a type of [opinion|E] that only affects characters whose [sexuality|E]
    matches your gender.\n\nFor example, a [homosexual|E] man would experience this
    Opinion towards other men, an [asexual|E] character would not experience it towards
    anyone, and a [heterosexual|E] woman would experience it towards men.\n\nThis
    type of Opinion stops having an effect for women above [GetDefine('NCharacter',
    'FEMALE_ATTRACTION_CUTOFF_AGE')] years of age, and for men above [GetDefine('NCharacter',
    'MALE_ATTRACTION_CUTOFF_AGE')] years of age.
attrition:
  source: game_concepts_l_english.yml
  text: Attrition
attrition_desc:
  source: game_concepts_l_english.yml
  text: '[armies|E] can suffer from $game_concept_attrition$, which is when [soldiers|E]
    are lost due to desertion, disease or starvation.\n\n$game_concept_attrition$
    occurs when an Army is out of [supplies|E], besieging a [fortified_holding|E],
    or moving from one hostile [county|E] into another if the target location doesn''t
    border a $game_concept_county$ already under control.'
autonomous_vassals:
  source: game_concepts_l_english.yml
  text: Autonomous Vassals
autonomous_vassals_crown_authority:
  source: game_concepts_l_english.yml
  text: Autonomous Vassals Crown Authority
autonomous_vassals_crown_authority_desc:
  source: game_concepts_l_english.yml
  text: '''$game_concept_autonomous_vassals$'' is the lowest level of [crown_authority|E].
    At this level, [vassals|E] have no [opinion|E] penalty toward their [liege|E],
    and the liege only has basic power over them.'
available_spouse:
  source: game_concepts_l_english.yml
  text: Available Spouse
available_spouse_desc:
  source: game_concepts_l_english.yml
  text: In order to serve on a ruler's [council|E], a [spouse|E] must be available
    to carry out the responsibilities of that role.\n\nVarious circumstances can prevent
    a $game_concept_spouse$ from fulfilling these responsibilities, but several of
    the most common ones include:\n$BULLET_WITH_TAB$Being the [ruler|E] of their own
    [realm|E]\n$BULLET_WITH_TAB$Residing in another Ruler's [court|E]\n$BULLET_WITH_TAB$Being
    [imprisoned|E], either at home or abroad\n$BULLET_WITH_TAB$Having the [GetTrait('incapable').GetName(
    GetNullCharacter )] [trait|E]\n\nIf an unavailable Spouse becomes available again,
    they will automatically resume their duties on the Council.\n\nSpouses who are
    Rulers in their own right can still serve on the Council if they are your [direct_vassals|E],
    but otherwise will never be considered available.
banish:
  source: game_concepts_l_english.yml
  text: Banish
banish_reason:
  source: game_concepts_l_english.yml
  text: Banishment Reason
banish_reason_desc:
  source: game_concepts_l_english.yml
  text: A $game_concept_banish_reason$ gives a [liege|E] the opportunity to freely
    [banish|E] any subject they have in their [dungeon|E]. They are most often gained
    from the subject being a [criminal|E].
banish_reasons:
  source: game_concepts_l_english.yml
  text: Banishment Reasons
banished:
  source: game_concepts_l_english.yml
  text: Banished
banishment:
  source: game_concepts_l_english.yml
  text: Banishment
banishment_desc:
  source: game_concepts_l_english.yml
  text: '[imprisoned|E] Characters can be $game_concept_banished$ from the [realm|E],
    which is arguably the harshest form of punishment. $game_concept_banished$ [landed|E]
    Rulers are deposed, while $game_concept_banished$ [courtiers|E] have their assets
    seized.\n\nBanishment without a reason (e.g. some severe [crime|E]) is considered
    extremely [tyrannical|E].'
bastard:
  source: game_concepts_l_english.yml
  text: Bastard
bastard_desc:
  source: game_concepts_l_english.yml
  text: $game_concept_bastards$ are illegitimate children born out of wedlock. As
    such, they are barred from inheriting [titles|E]. However, their parents can [Concept(
    'legitimized', 'legitimize' )|E] their child with the approval of their [house_head|E].\n\nWhich
    [house|E] a bastard belongs to is determined by the [doctrines|E] of their parents'
    [faiths|E] when they are born.\n\nIf Bastards are granted Titles or have children
    of their own, they will found a new [dynasty|E].
bastards:
  source: game_concepts_l_english.yml
  text: Bastards
battle:
  source: game_concepts_l_english.yml
  text: Battle
battle_advantage:
  source: game_concepts_l_english.yml
  text: Battle Advantage
battle_advantage_desc:
  source: game_concepts_l_english.yml
  text: $game_concept_battle_advantage$ makes one side in [battle|E] do more damage.
    The higher the $game_concept_advantage$, the more damage the [soldiers|E] will
    do.\n\nBattles often start with one side having a higher Advantage based on [terrain|E]
    and the [martial_skill|E] and [commander_traits|E] of the [commander|E]. Either
    side may then gain additional $game_concept_advantage$ from $game_concept_commander$
    [rolls|E].
battle_desc:
  source: game_concepts_l_english.yml
  text: $game_concept_battles$ start when two opposing [armies|E] enter the same [barony|E].\n\nAt
    the start of a $game_concept_battle$, one side usually starts with [advantage|E]
    dependent on factors like [terrain|E], [commander|E] and [commander_traits|E].\n\nArmies
    take [casualties|E] based on the amount of [damage|E] sustained. The $game_concept_battle$
    enters its [aftermath|E] when no [soldiers|E] remain for one side.\n\nThe winner
    of a $game_concept_battle$ is awarded [war_score|E] dependent on the magnitude
    of the victory.
battles:
  source: game_concepts_l_english.yml
  text: Battles
beneficiaries:
  source: game_concepts_l_english.yml
  text: Beneficiaries
beneficiary:
  source: game_concepts_l_english.yml
  text: Beneficiary
beneficiary_desc:
  source: game_concepts_l_english.yml
  text: Every participant in a [great_holy_war|E] can select a $game_concept_beneficiary$
    from their [dynasty|E]. Upon victory, the $game_concept_beneficiary$ will receive
    lands in the targeted realm proportional to the [war_contribution|E] of their
    patron ruler.\n\nThe largest contributor can force their Beneficiary to receive
    the main title being fought over.
besiege:
  source: game_concepts_l_english.yml
  text: Besiege
besieged:
  source: game_concepts_l_english.yml
  text: Besieged
besieging:
  source: game_concepts_l_english.yml
  text: Besieging
best_friend:
  source: game_concepts_l_english.yml
  text: Best Friend
best_friend_desc:
  source: game_concepts_l_english.yml
  text: A $game_concept_best_friend$ is a $game_concept_relation$ indicating lifelong
    dedication and support. It is a stronger $game_concept_relation$ than a [friend|E].
    A [character|E] can only have one $game_concept_best_friend$.
best_friend_possessive:
  source: game_concepts_l_english.yml
  text: Best Friend's
best_friends:
  source: game_concepts_l_english.yml
  text: Best Friends
best_friends_possessive:
  source: game_concepts_l_english.yml
  text: Best Friends'
bestow_royal_favor:
  source: game_concepts_l_english.yml
  text: $task_bestow_royal_favor$
bestow_royal_favor_desc:
  source: game_concepts_l_english.yml
  text: A [councillor_task|E] performed by the [chancellor|E], which increases the
    opinion a chosen [vassals|E] in the [realm|E] has towards their [liege|E].
betrothal:
  source: game_concepts_l_english.yml
  text: Betrothal
betrothal_desc:
  source: game_concepts_l_english.yml
  text: '[SelectLocalization( HasDlcFeature( ''tours_and_tournaments'' ), ''game_concept_betrothal_desc_TOTO_DLC'',
    ''game_concept_betrothal_desc_NO_TOTO_DLC'' )]'
betrothals:
  source: game_concepts_l_english.yml
  text: Betrothals
betrothed:
  source: game_concepts_l_english.yml
  text: Betrothed
bisexual:
  source: game_concepts_l_english.yml
  text: Bisexual
bisexual_desc:
  source: game_concepts_l_english.yml
  text: 'In #EMP Crusader Kings III#!, this character is attracted to characters of
    either the same or opposite gender.'
blackmail:
  source: game_concepts_l_english.yml
  text: Blackmail
blackmail_desc:
  source: game_concepts_l_english.yml
  text: If you know another Character's [criminal|E] [secret|E], you may use a $game_concept_blackmail$
    [character_interaction|E] to potentially gain a [hook|E] on them.\n\nThe strength
    of this Hook varies with the severity of the Secret, which in turn is often determined
    by [doctrines|E].
blackmailed:
  source: game_concepts_l_english.yml
  text: Blackmailed
blackmailing:
  source: game_concepts_l_english.yml
  text: Blackmailing
board_game:
  source: game_concepts_l_english.yml
  text: Board Game
board_game_game:
  source: game_concepts_l_english.yml
  text: Game
board_game_match:
  source: game_concepts_l_english.yml
  text: Match
board_game_match_desc:
  source: game_concepts_l_english.yml
  text: A board game consists of two players trying their luck and skill against one
    another in a game of wits and chance. They may be played as friendly matches,
    or with a wager of some kind.\n\n#weak There are many different [board_game_types|E],
    though the ways to [board_game_win|E] and play each remain the same. Only the
    skills used differ.#!
board_game_type:
  source: game_concepts_l_english.yml
  text: Board Game Type
board_game_type_chess:
  source: game_concepts_l_english.yml
  text: Chess
board_game_type_chess_desc:
  source: game_concepts_l_english.yml
  text: $game_concept_board_game_type_desc_guts$\n\nIn $game_concept_board_game_type_chess$:\n$EFFECT_LIST_BULLET$
    [martial|E] $game_concept_board_game_type_counters$ [learning|E]\n$EFFECT_LIST_BULLET$
    [learning|E] $game_concept_board_game_type_counters$ [intrigue|E]\n$EFFECT_LIST_BULLET$
    [intrigue|E] $game_concept_board_game_type_counters$ [martial|E]
board_game_type_counter:
  source: game_concepts_l_english.yml
  text: counter
board_game_type_counters:
  source: game_concepts_l_english.yml
  text: counters
board_game_type_desc:
  source: game_concepts_l_english.yml
  text: $game_concept_board_game_type_desc_guts$\n\nAvailable games are:\n$EFFECT_LIST_BULLET$
    [board_game_type_chess|E]\n$EFFECT_LIST_BULLET$ [board_game_type_pachisi|E]\n$EFFECT_LIST_BULLET$
    [board_game_type_hnefatafl|E]\n$EFFECT_LIST_BULLET$ [board_game_type_tabula|E]\n$EFFECT_LIST_BULLET$
    [board_game_type_go|E]\n$EFFECT_LIST_BULLET$ [board_game_type_fidchell|E]
board_game_type_desc_guts:
  source: game_concepts_l_english.yml
  text: 'When playing a $game_concept_board_game$, different play styles $game_concept_board_game_type_counter$
    your opponent. Countering their moves severely reduces the points they gain from
    them, even if successful. Skilled opponents may note your own skills and deliberately
    attempt to $game_concept_board_game_type_counter$ #EMP you#!.'
board_game_type_fidchell:
  source: game_concepts_l_english.yml
  text: Fidchell
board_game_type_fidchell_desc:
  source: game_concepts_l_english.yml
