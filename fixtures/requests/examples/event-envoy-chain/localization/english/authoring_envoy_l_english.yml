l_english:
 authoring_envoy.0001.t:0 "An Envoy at Court"
 authoring_envoy.0001.desc:0 "An envoy from a distant court arrives, and must be given a host."
 authoring_envoy.0001.a:0 "Let one of my courtiers look after the envoy."
 authoring_envoy.0002.t:0 "The Envoy Departs"
 authoring_envoy.0002.desc:0 "The envoy's business is done, and it is time to send them home."
 authoring_envoy.0002.a:0 "Send them home with a gift."
 authoring_envoy.0002.b:0 "Send them home with a blessing."
