l_english:
 authoring_envoy.0001.t:0 "A Foreign Envoy"
 authoring_envoy.0001.desc:0 "A foreign envoy rides through the gates, bearing letters and expecting hospitality."
 authoring_envoy.0001.a:0 "A courtier will see to the envoy."
 authoring_envoy.0002.t:0 "Farewell to the Envoy"
 authoring_envoy.0002.desc:0 "After many days at court, the envoy asks leave to go home."
 authoring_envoy.0002.a:0 "Give the envoy a generous parting gift."
 authoring_envoy.0002.b:0 "Pray for the envoy's safe road."
