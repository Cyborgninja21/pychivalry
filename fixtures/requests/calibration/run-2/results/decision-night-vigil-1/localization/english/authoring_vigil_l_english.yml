l_english:
 authoring_vigil_decision: "Keep a Night Vigil"
 authoring_vigil_decision_desc: "I shall spend a night alone in prayer, keeping watch until the sun rises."
 authoring_vigil.0001.t: "The Vigil Ends"
 authoring_vigil.0001.desc: "Through the long hours of the night I knelt in silent prayer. Now the first light of dawn breaks over the horizon, and my vigil is at an end. I rise weary, but my spirit feels renewed."
 authoring_vigil.0001.a: "My faith is stronger for it."
