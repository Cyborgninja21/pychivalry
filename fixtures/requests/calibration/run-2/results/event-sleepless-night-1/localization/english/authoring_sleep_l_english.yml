l_english:
 authoring_sleep.0001.t:0 "A Sleepless Night"
 authoring_sleep.0001.desc:0 "The candles have long burned down, yet sleep will not come. My thoughts churn with every worry of the day, and the hours crawl toward dawn."
 authoring_sleep.0001.a:0 "Send for a physician's sleeping draught, whatever the cost."
 authoring_sleep.0001.b:0 "Rise and pray until the restlessness passes."
 authoring_sleep.0001.c:0 "Summon the court musicians, propriety be damned."
