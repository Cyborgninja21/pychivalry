l_english:
 authoring_merchant.0001.t: "An Old Debt Repaid"
 authoring_merchant.0001.desc: "A merchant I once lent money to, years ago, has returned to my court. Bowing low, he declares that he has prospered since, and has come at last to repay his debt to me in full."
 authoring_merchant.0001.a: "I will take the gold."
 authoring_merchant.0001.b: "Keep the coin, and tell everyone of my generosity."
