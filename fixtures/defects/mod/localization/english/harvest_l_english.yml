l_english:
 harvest.0001.t:0 "The Harvest Is In"
 harvest.0001.desc:0 "[ROOT.Char.GetFirstName brings in the harvest, and [ROOT.Char.GetHerHis] granaries are full."
 harvest.0001.a:0 "Hold a feast!"
 harvest.0001.b:0 "Give #P 10#! gold to the poor."
 harvest.0001.c:0 "Thank the gods for it."
 harvest.0002.t:0 "A Letter from Home"
 harvest.0002.desc:0 "Your spouse writes to congratulate you on the harvest."
 harvest.0002.a:0 "How kind."
 harvest.0002.b:0 "I can rest at last."
 harvest.0003.t:0 "The Guests Arrive"
 harvest.0003.desc:0 "[ROOT.Char.GetFirstName] opens the granaries to the guests."
 harvest.0003.a:0 "Let them feast."
 harvest.0003.b:0 "Take the tithe first."
 harvest.0004.t:0 "The Court Gathers"
 harvest.0004.desc:0 "The court gathers in the hall for the festival."
 harvest.0004.a:0 "Reward the hosts."
 harvest.0004.b:0 "Pay for the music."
 harvest.0010.t:0 "Blessed Fields"
 harvest.0010.desc:0 "The faithful give thanks for the harvest."
 harvest.0010.a:0 "Praise be."
 harvest.0011.t:0 "A Thanksgiving"
 harvest.0011.desc:0 "The priests lead the thanksgiving."
 harvest.0011.a:0 "Join the prayers."
 harvest.0011.b:0 "Watch from the hall."
 harvest.0012.t:0 "A Feast for the Court"
 harvest.0012.desc:0 "The court gathers to celebrate."
 harvest.0012.a:0 "Let them eat."
 harvest.0013.t:0 "The Steward's Report"
 harvest.0013.a:0 "Send the grain to the villages."
 harvest.0013.b:0 "Sell the grain."
 harvest_market.0001.t:0 "The Harvest Market"
 harvest_market.0001.desc:0 "Merchants come from far away to buy the grain."
 harvest_market.0001.a:0 "Buy their wares."
 harvest_market.0001.b:0 "Let them be."
 harvest_festival_decision:0 "Hold a Harvest Festival"
 harvest_festival_decision_desc:0 "Celebrate the harvest with your court."
 harvest_open_granaries_decision:0 "Open the Granaries"
 harvest_open_granaries_decision_desc:0 "Give the poor of the capital grain from your stores."
 decision_group_type_harvest_group:0 "Harvest"
 interaction_category_harvest:0 "Harvest"
 interaction_category_harvest_market:0 "Market"
 tradition_harvest_feasts_name:0 "Harvest Feasts"
 tradition_harvest_feasts_desc:0 "This culture celebrates every harvest."
 tradition_harvest_markets_name:0 "Harvest Markets"
 tradition_harvest_markets_desc:0 "This culture trades its grain at the markets."
 harvest_bounty_modifier:0 "Bountiful Harvest"
 harvest_bounty_modifier_desc:0 "The granaries are full."
 harvest_granary_modifier:0 "Full Granaries"
 harvest_granary_modifier_desc:0 "This county stores grain for the winter."
